// **WHAT A BODY ITSELF SOUNDS LIKE (m62).** Three events that `HITSND` has nothing to say
// about, because that table is the sound of the CONTACT and these are the sound of the MAN.
// ============================================================================================
// A CREATURE'S VOICE -- PLUTOPIA'S `snd.beast`, PORTED (m82, corrected)
//
// **THE SEVEN FILES ARE UNLABELLED ON PURPOSE, AND THAT IS THE WHOLE DESIGN.** Plutopia's own
// note: *"Naming one of them 'angry' would spend it on one feeling; kept as one voice they are
// the ISLAND'S voice, and which feeling it is comes out of pitch and weight instead."* So there
// is no calm subset to pick and no angry one -- **all seven are every mood**, and the table
// below is what tells them apart. One pool doing six jobs, which is the metal clangs' rule
// (three car tiers by PITCH, not three recordings) stated from the other side.
//
// **`mood` IS PLUTOPIA'S TABLE UNCHANGED**, [rate, gain]: alarm goes up and gets shorter, anger
// goes down and gets louder, contentment sits low and quiet, and a hurt one is a bark at the top
// of its range.
//
// **BUT THE SIZE CURVE HAD TO BE REFITTED, AND THAT IS THE ONE THING THAT DOES NOT PORT.**
// Over there it is `pow(1.05 / clamp(rad, .5, 2.6), .45)` -- half an octave over a 5.2x range of
// creature. **Every body in THIS game is between .28 and .46 of radius**, so that clamp puts all
// of them on its floor and returns the identical pitch for a knee-high sidekick and a 1.85 m
// orc. A ported number is only as good as the shape of the world it was tuned in, which this
// file has now paid for four times.
//
// **AND THE MEASURE IS `K.h`, NOT `K.r` (m84).** m83 fitted this to the collider RADIUS, and
// that was two measures of one thing waiting to drift -- the footsteps needed "how big is this
// body" as well, and a game with two answers to that has two answers to everything downstream.
// Height is the better of the two on its own merits: it is the number he actually sets per
// character (*"he should be small"* is `h: .62`), it spans **3x** across the roster where the
// radii span 1.6, and those radii are collider tuning that only correlates with size.
//     on RADIUS   Clancy 1.21   skater 1.03   officer 0.97   warrior 0.93
//     on HEIGHT   Clancy 1.21   skater 1.01   officer 1.00   warrior 0.99
// **`k` IS SOLVED SO CLANCY LANDS EXACTLY WHERE m83 PUT HIM**, so changing the measure moves the
// voice by nothing and only the feet are new -- each toggle has to move one variable or neither
// can be judged. What it also does is collapse the adults onto 1.0, which is the honest answer:
// they ARE all the same size, and the old spread was reading a collider number as a body.
// **AND THE JITTER IS ITS OWN TERM, NOT WIDTH ON THE MOOD.** "Which feeling" and "not the same
// twice" are two different things, and rolling them together means widening one blurs the other.
const CVOX = {
  mood: { alarm: [1.24, .60], angry: [.82, .78], hurt: [1.34, .70],
          fond: [.94, .34], calm: [.90, .24], daze: [.70, .52] },
  ref: 1.75, lo: .55, hi: 2.0, k: .182,
  jit: [.94, 1.07],
  every: [3.4, 8.5],        // Plutopia's own interval, re-rolled every time
  fond: 2.6,                // nearer than this to you and a calm noise becomes a fond one
};
// HOW BIG HE IS, AS A PITCH -- **the one answer in this file to that question**, read by the
// voice, the hit grunt and the footsteps alike, so a body added tomorrow sounds its own size in
// all three with nothing typed.
function voxSize(K) { return Math.pow(CVOX.ref / clamp(K.h, CVOX.lo, CVOX.hi), CVOX.k); }
// AND AS A WEIGHT. A small body lands lighter as well as higher, and those are two different
// curves on one ratio -- `sizeG` is how hard the gain follows it.
// (`STEP` is declared below this -- read at CALL time, from `bodyFeet`, so it is not a TDZ.)
function voxWeight(K) { return Math.pow(clamp(K.h, CVOX.lo, CVOX.hi) / CVOX.ref, STEP.sizeG); }

// `sp * duration / ts` metres -- and with `ts` unclamped that is `duration * ref` exactly, so
// this is m64's answer generalised rather than replaced.

      let rr = r, gg = g, bb = b;
      if (SKY.sun) {
        const lon = (i / W - .5) * Math.PI * 2;
        const dx = Math.cos(lon) * ce, dz = Math.sin(lon) * ce;
        // the angle to the sun, through the dot -- cheap, and exact
        const d = Math.max(-1, Math.min(1, dx * sx + y * sy + dz * sz));
        const ang = Math.acos(d);
        const core = ang < SKY.sunSize ? 1 : 0;
        const halo = Math.pow(Math.max(0, 1 - ang / Math.max(1e-4, SKY.sunGlow)), SKY.sunPow);
        const k = (core + halo) * SKY.sunK;
        rr += sc[0] * k; gg += sc[1] * k; bb += sc[2] * k;
      }
      const o = (j * W + i) * 4;
      data[o] = half(rr); data[o + 1] = half(gg); data[o + 2] = half(bb); data[o + 3] = half(1);
      const L = rr * .2126 + gg * .7152 + bb * .0722;
      if (!isFinite(L) || L < 0) bad++;
      if (L > bl) { bl = L; bx = Math.cos((i / W - .5) * Math.PI * 2) * ce; by = y;
                    bz = Math.sin((i / W - .5) * Math.PI * 2) * ce; }
      if (j === 0) lumBot += L / W;
      if (j === H - 1) lumTop += L / W;
    }
  }
  if (skyTex) skyTex.dispose();
  skyTex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat, THREE.HalfFloatType);
  skyTex.mapping = THREE.EquirectangularReflectionMapping;
  skyTex.minFilter = THREE.LinearFilter; skyTex.magFilter = THREE.LinearFilter;
  skyTex.wrapS = THREE.RepeatWrapping;   // longitude wraps; latitude must NOT, or the poles bleed
  skyTex.wrapT = THREE.ClampToEdgeWrapping;
  skyTex.needsUpdate = true;
  skyApply(skyTex, 1, skyLin(SKY.hor));
  // WHAT IT ACTUALLY BAKED. **`sun dot` IS THE FLIP CHECK AND THE LUMINANCES ARE NOT** -- the
  // brightest texel is the disc, so its direction against the light's own has to be 1.00, and a
  // `v` upside down would put it at roughly the negative of that. The two row luminances are
  // printed because they are worth seeing, NOT as an assertion: the default ground is a pale
  // warm grey and the zenith a mid blue, so nadir legitimately reads BRIGHTER (0.43 against
  // 0.37) and a check written on that ordering would fire on a sky that is perfectly correct.
  const dot = SKY.sun ? (bx * sx + by * sy + bz * sz) : 1;
  console.log('[melee] sky ' + W + 'x' + H + ' | nadir ' + lumBot.toFixed(3) +
    ' zenith ' + lumTop.toFixed(3) + ' | sun dot ' + dot.toFixed(3) +
    ' | ibl ' + (SKY.env ? 'on x' + SKY.envInt : 'off') + (bad ? ' | ' + bad + ' BAD TEXELS' : ''));
  if (bad) note('SKY NAN');
  if (SKY.sun && dot < .98) note('SKY SUN OFF');
  return 1;
}
// ONCE, HERE, so the backdrop exists before anything is loaded -- and the prefilter is a

skyBake();

skyLoad();

// ---- the world: a white floor and some boxes to run at, jump on and hide the camera behind ----
// BOXES ARE AABBs and they are the whole collider. Their tops are floors, which is how you
// stand on one; the camera boom probes the same list, so there is one description of the world
// and not two to keep in step.
const BOXES = [];
const world = new THREE.Group();
scene.add(world);

// **THE TEST SITE IS A WORLD, NOT THE WORLD (m124).** Its white floor, its two grids, its ten
// boxes and its ledge stack are all at coordinates chosen against each other, so building them
// inside Weirdport would be a grid hovering over a street and a stack of cubes inside a tower.
// One condition round the block it already was; nothing inside it moved.
if (!inWP())
{
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ color: 0xe6eaf0, roughness: .96, metalness: 0 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  world.add(ground);

  // TWO GRIDS, NOT ONE. A single spacing gives you either a fine mesh that turns to moire in
  // the distance or a coarse one that says nothing underfoot. A faint 1 m mesh for the ground
  // right around him and a stronger 10 m mesh that survives to the horizon read as depth
  // together in a way neither does alone -- which is the whole complaint about a white floor.
  const fine = new THREE.GridHelper(200, 200, 0x9aa8bb, 0x9aa8bb);
  fine.position.y = .004;
  fine.material.transparent = true; fine.material.opacity = .28; fine.material.depthWrite = false;
  world.add(fine);
  const coarse = new THREE.GridHelper(200, 20, 0x5f7089, 0x6f8098);
  coarse.position.y = .008;
  coarse.material.transparent = true; coarse.material.opacity = .5; coarse.material.depthWrite = false;
  world.add(coarse);

  const mats = [0xff4d6d, 0xffc247, 0x46e0ff, 0x8a7bff, 0xa8b4c4].map(c =>
    new THREE.MeshStandardMaterial({ color: c, roughness: .8, metalness: .02 }));
  const box = new THREE.BoxGeometry(1, 1, 1);
  const put = (x, y, z, w, h, d, m) => {
    const o = new THREE.Mesh(box, mats[m % mats.length]);
    o.position.set(x, y + h / 2, z); o.scale.set(w, h, d);
    o.castShadow = true; o.receiveShadow = true;
    world.add(o);
    BOXES.push({ minx: x - w / 2, maxx: x + w / 2, miny: y, maxy: y + h, minz: z - d / 2, maxz: z + d / 2 });
  };
  // a few things at jumpable heights, and a couple far too tall to get on
  // **THIS ONE STOPPED BEING WALKABLE WHEN HE SHRANK, AND THE COMMENT DID NOT NOTICE (m74).**
  // `MOVE.step` is `.5 * SZ`, so at `RIG.height` 1.75 it was 0.50 m and this 0.40 box really was
  // walked onto; m52 and m57 took him to 1.25 and the step came down to **0.357 m** with him. It
  // has been a WALL ever since -- to the player and to everybody -- which is exactly the "really
  // short little cube he just got stuck on". The box is left alone (a low obstacle is a fair
  // thing for a test site to have); what is corrected is the claim.
  put(  6, 0,  -3, 3, .40, 3, 0);   // 0.40 > MOVE.step 0.357: a WALL. The 0.35 platform below is not.
  put( 9.5, 0, -6, 3, 1.15, 3, 1);
  put( 13, 0,  -9, 3, 1.85, 3, 2);
  put( -7, 0,   4, 4, 2.6, 4, 3);
  put(-12, 0,  -6, 2.2, 5.0, 2.2, 4);
  put(  2, 0,  12, 9, .35, 3, 4);
  put( -4, 0, -11, 3, 1.0, 7, 1);
  put( 16, 0,   6, 2.4, 3.4, 2.4, 0);
  put(  0, 0, -18, 14, 4.2, 1.2, 4);
  put(-16, 0,  12, 5, 1.5, 5, 2);

  // shape he described -- four levels three metres apart, spiralling round a 12 x 12 m block.
  // **THREE METRES IS NOT A TASTE NUMBER, IT IS WHAT ONE PLAIN JUMP REACHES.** His hands sweep

  //     from  6.0 -> lip  9.0                7.08.. 9.89             8.45.. 9.55   CATCH

// ---- the streets (m110) ----
// A PLOT IS A ROAD GRID'S ONLY REAL OBJECT. The slab drawn for each one is the plot INFLATED
// by the pavement, so the carriageway is simply the gap between slabs and a junction needs no
// case of its own -- the corners fall out of the arithmetic rather than being built.
// **THE Z-RUNNING ROADS RUN THE WHOLE LENGTH AND THE X-RUNNING ONES ARE CUT AT EACH JUNCTION.**
// Drawing both full length would put two quads at the same height on the same square metre at
// every crossing, which is a z-fight; cutting one family is one loop bound and nothing else.
const streets = new THREE.Group();
world.add(streets);

function buildStreets() {
  for (const o of streets.children.slice()) {
    streets.remove(o); o.geometry.dispose(); o.material.dispose();
  }
  const S = STREET;
  if (!S.on) return 0;
  const xs = S.xs, zs = S.zs, h = S.road / 2, walk = S.walk, half = h + walk;
  const X0 = xs[0] - half, X1 = xs[xs.length - 1] + half;
  const Z0 = zs[0] - half, Z1 = zs[zs.length - 1] + half;
  const G = { road: [], walk: [], plot: [], line: [] };
  const quad = (k, x0, z0, x1, z1, y) => {
    if (x1 - x0 < .01 || z1 - z0 < .01) return;
    const g = new THREE.PlaneGeometry(x1 - x0, z1 - z0);
    g.rotateX(-Math.PI / 2);
    g.translate((x0 + x1) / 2, y, (z0 + z1) / 2);
    G[k].push(g);
  };
  // the kerb line is the OUTLINE of a slab, and only on the edges that actually face a road --
  // the border strips have three edges facing nothing and the plaza rim has one facing the
  // test site, and a kerb painted round those reads as a box rather than as a pavement.
  const edge = (x0, z0, x1, z1, m) => {
    const k = S.kerb;
    if (m & 1) quad('line', x0, z0, x0 + k, z1, S.y.line);
    if (m & 2) quad('line', x1 - k, z0, x1, z1, S.y.line);
    if (m & 4) quad('line', x0, z0, x1, z0 + k, S.y.line);
    if (m & 8) quad('line', x0, z1 - k, x1, z1, S.y.line);
  };

  for (const X of xs) quad('road', X - h, zs[0] - h, X + h, zs[zs.length - 1] + h, S.y.road);
  for (const Z of zs) for (let i = 0; i < xs.length - 1; i++)
    quad('road', xs[i] + h, Z - h, xs[i + 1] - h, Z + h, S.y.road);

  let plots = 0;
  for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < zs.length - 1; j++) {
    if (i === S.skip[0] && j === S.skip[1]) continue;
    const x0 = xs[i] + h, z0 = zs[j] + h, x1 = xs[i + 1] - h, z1 = zs[j + 1] - h;
    quad('walk', x0, z0, x1, z1, S.y.walk);
    quad('plot', x0 + walk, z0 + walk, x1 - walk, z1 - walk, S.y.plot);
    edge(x0, z0, x1, z1, 15);
    plots++;
  }
  // the four border strips, so the outermost roads have a kerb on their outer side as well
  quad('walk', X0, Z0, xs[0] - h, Z1, S.y.walk);                            edge(X0, Z0, xs[0] - h, Z1, 2);
  quad('walk', xs[xs.length - 1] + h, Z0, X1, Z1, S.y.walk);                edge(xs[xs.length - 1] + h, Z0, X1, Z1, 1);
  quad('walk', xs[0] - h, Z0, xs[xs.length - 1] + h, zs[0] - h, S.y.walk);  edge(xs[0] - h, Z0, xs[xs.length - 1] + h, zs[0] - h, 8);
  quad('walk', xs[0] - h, zs[zs.length - 1] + h, xs[xs.length - 1] + h, Z1, S.y.walk);
  edge(xs[0] - h, zs[zs.length - 1] + h, xs[xs.length - 1] + h, Z1, 4);

  // THE PLAZA GETS A RIM AND NOT A SLAB. Painting the skipped plot would bury the white floor,
  // the two grid helpers and the ten boxes under a pavement; a 2.5 m rim gives the four roads
  // round it a kerb to stop against and leaves the test site exactly as it was.
  const px0 = xs[S.skip[0]] + h, pz0 = zs[S.skip[1]] + h;
  const px1 = xs[S.skip[0] + 1] - h, pz1 = zs[S.skip[1] + 1] - h;
  quad('walk', px0, pz0, px0 + walk, pz1, S.y.walk);          edge(px0, pz0, px0 + walk, pz1, 1);
  quad('walk', px1 - walk, pz0, px1, pz1, S.y.walk);          edge(px1 - walk, pz0, px1, pz1, 2);
  quad('walk', px0 + walk, pz0, px1 - walk, pz0 + walk, S.y.walk);   edge(px0 + walk, pz0, px1 - walk, pz0 + walk, 4);
  quad('walk', px0 + walk, pz1 - walk, px1 - walk, pz1, S.y.walk);   edge(px0 + walk, pz1 - walk, px1 - walk, pz1, 8);

  // the centre line, broken at every junction -- a dash painted across a crossing is a dash
  // nobody would paint, and it is the one thing that says which way a road runs from above.
  const [dl, dg, dw] = S.dash, pitch = dl + dg;
  const dashes = (a0, a1, cross, alongZ, c) => {
    for (let a = a0 + dg; a + dl < a1; a += pitch) {
      const mid = a + dl / 2;
      let clear = 1;
      for (const q of cross) if (Math.abs(mid - q) < h + dl / 2) { clear = 0; break; }
      if (!clear) continue;
      if (alongZ) quad('line', c - dw / 2, a, c + dw / 2, a + dl, S.y.line);
      else quad('line', a, c - dw / 2, a + dl, c + dw / 2, S.y.line);
    }
  };
  for (const X of xs) dashes(zs[0] - h, zs[zs.length - 1] + h, zs, 1, X);
  for (const Z of zs) dashes(xs[0] + h, xs[xs.length - 1] - h, xs, 0, Z);

  let tris = 0;
  for (const k of ['road', 'walk', 'plot', 'line']) {
    if (!G[k].length) continue;
    const g = mergeGeometries(G[k]);
    for (const q of G[k]) q.dispose();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
      color: STREET.col[k], roughness: k === 'road' ? .95 : .9, metalness: 0 }));
    m.receiveShadow = true;
    streets.add(m);
    tris += (g.index ? g.index.count : g.getAttribute('position').count) / 3;
  }
  console.log('STREET ' + plots + ' plots, ' + streets.children.length + ' draw calls, ' + Math.round(tris) + ' tris');
  return plots;
}
// the painted road grid is the TEST SITE's own layout (m110); Weirdport brings its own.
if (!inWP()) buildStreets();


// ============================================================================================
// A GROUND THAT IS NOT FLAT (m124, `TRI`)
//
// A box top is FLAT, so a box collider cannot express a ramp, a hill or a stepped plaza -- and
// Weirdport has five DIY banks at 34 degrees, terrain that climbs to 17 m and a freeway deck at
// 9.2. So its walkable surfaces go in as TRIANGLES, in world space, in a uniform XZ grid, and
// `groundAt` asks both. The test site adds none and every line below is skipped there.
//
// **A RAMP IS A FLOOR, NOT A SOLID, AND THAT IS ON PURPOSE.** Anything steeper than `TRI.up` is
// thrown away, so a ramp's SIDE WALLS are not in the collider: meet one side-on and you pass
// through it, roll at it up the slope and you ride it. The alternative is a box you stop dead
// against, which is worse -- and it is the same rule that drops every UNDERSIDE for free, since
// these meshes are closed solids and 3,132 of their 13,762 triangles face down.
// Measured on this slice: 3,684 walkable of 13,762.
//
// **AND IT RETURNS TWO ANSWERS BY CONSTRUCTION, WHICH IS WHY A DECK WORKS.** The highest
// surface at or a step above his feet: standing under the freeway that is the road at 0.16,
// standing on it that is the deck at 11. One rule, no case for a bridge.
// TRICOL:START
const TRI = { on: 0, cell: 4, up: .5, x0: 0, z0: 0, nx: 0, nz: 0, grid: null, v: null, n: 0 };
const _triRaw = [];
// REJECT AND REPORT: a steep face, a downward face and a sliver are all "not a floor".
function triAdd(ax, ay, az, bx, by, bz, cx, cy, cz) {
  const ux = bx - ax, uy = by - ay, uz = bz - az, vx = cx - ax, vy = cy - ay, vz = cz - az;
  const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const L = Math.hypot(nx, ny, nz);
  if (L < 1e-9 || ny / L <= TRI.up) return 0;
  _triRaw.push(ax, ay, az, bx, by, bz, cx, cy, cz);
  return 1;
}
function triBuild() {
  const n = _triRaw.length / 9;
  if (!n) return 0;
  let x0 = 1e30, x1 = -1e30, z0 = 1e30, z1 = -1e30;
  for (let i = 0; i < _triRaw.length; i += 3) {
    const x = _triRaw[i], z = _triRaw[i + 2];
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (z < z0) z0 = z; if (z > z1) z1 = z;
  }
  const c = TRI.cell;
  TRI.x0 = x0; TRI.z0 = z0;
  TRI.nx = Math.max(1, Math.ceil((x1 - x0) / c) + 1);
  TRI.nz = Math.max(1, Math.ceil((z1 - z0) / c) + 1);
  const g = TRI.grid = new Array(TRI.nx * TRI.nz);
  const v = TRI.v = new Float32Array(_triRaw);
  for (let t = 0; t < n; t++) {
    const o = t * 9;
    const i0 = Math.max(0, Math.floor((Math.min(v[o], v[o + 3], v[o + 6]) - x0) / c));
    const i1 = Math.min(TRI.nx - 1, Math.floor((Math.max(v[o], v[o + 3], v[o + 6]) - x0) / c));
    const k0 = Math.max(0, Math.floor((Math.min(v[o + 2], v[o + 5], v[o + 8]) - z0) / c));
    const k1 = Math.min(TRI.nz - 1, Math.floor((Math.max(v[o + 2], v[o + 5], v[o + 8]) - z0) / c));
    for (let i = i0; i <= i1; i++) for (let k = k0; k <= k1; k++) {
      const q = i * TRI.nz + k; (g[q] || (g[q] = [])).push(o);
    }
  }
  TRI.n = n; TRI.on = 1;
  _triRaw.length = 0;
  return n;
}
// POINT IN TRIANGLE IN XZ, then the height off its own plane. -1e30 for "no ground here", which
// is a different answer from "the ground is at zero" and is what lets `groundAt` keep its floor.
function triGround(x, z, y, step) {
  const i = Math.floor((x - TRI.x0) / TRI.cell), k = Math.floor((z - TRI.z0) / TRI.cell);
  if (i < 0 || k < 0 || i >= TRI.nx || k >= TRI.nz) return -1e30;
  const L = TRI.grid[i * TRI.nz + k];
  if (!L) return -1e30;
  const v = TRI.v, lim = y + step;
  let best = -1e30;
  for (let q = 0; q < L.length; q++) {
    const o = L[q];
    const ax = v[o], ay = v[o + 1], az = v[o + 2];
    const bx = v[o + 3], by = v[o + 4], bz = v[o + 5];
    const cx = v[o + 6], cy = v[o + 7], cz = v[o + 8];
    const d = (bz - cz) * (ax - cx) + (cx - bx) * (az - cz);
    if (d < 1e-12 && d > -1e-12) continue;
    const l1 = ((bz - cz) * (x - cx) + (cx - bx) * (z - cz)) / d;
    if (l1 < -1e-6 || l1 > 1.000001) continue;
    const l2 = ((cz - az) * (x - cx) + (ax - cx) * (z - cz)) / d;
    if (l2 < -1e-6) continue;
    const l3 = 1 - l1 - l2;
    if (l3 < -1e-6) continue;
    const h = l1 * ay + l2 * by + l3 * cy;
    if (h > best && h <= lim) best = h;
  }
  return best;
}
// TRICOL:END

// ============================================================================================
// THE BROAD PHASE (m124, `BGRID`, `boxesNear`)
//
// `BOXES` is scanned LINEARLY by five functions -- `groundAt`, `resolveBoxes`, `wallFind`,
// `ledgeFind` and `camHit` -- which is right for a test site with a dozen of them and is not
// right for Weirdport's **4,086**. So they scan a grid BUCKET instead, and the loop bodies are
// untouched: this is a broad phase and nothing else, the way a car's AABB is the broad phase
// for its oriented box one repo over.
// **IT IS OFF UNDER `min`, so the test site is byte-for-byte what it was** -- a grid over ten
// boxes is slower than scanning ten boxes, and the world that already works must not change.
//
// **EACH CALL SITE OWNS ITS OWN BUFFER, AND THAT IS NOT TIDINESS.** `ledgeFind` calls `camHit`
// INSIDE its own loop over the boxes, so one shared scratch array would be emptied under it
// half way through and the ledge search would silently stop after its first candidate. A pool
// sized by counting the nesting is a thing to get wrong later; five named arrays cannot alias.
// BGRID:START
const BGRID = { on: 0, cell: 8, min: 400, pad: 2, x0: 0, z0: 0, nx: 0, nz: 0, grid: null, mark: null, tick: 0 };
function boxGrid() {
  BGRID.on = 0; BGRID.grid = null; BGRID.mark = null;
  if (BOXES.length < BGRID.min) return 0;
  let x0 = 1e30, x1 = -1e30, z0 = 1e30, z1 = -1e30;
  for (const b of BOXES) {
    if (b.minx < x0) x0 = b.minx; if (b.maxx > x1) x1 = b.maxx;
    if (b.minz < z0) z0 = b.minz; if (b.maxz > z1) z1 = b.maxz;
  }
  const c = BGRID.cell;
  BGRID.x0 = x0; BGRID.z0 = z0;
  BGRID.nx = Math.max(1, Math.ceil((x1 - x0) / c) + 1);
  BGRID.nz = Math.max(1, Math.ceil((z1 - z0) / c) + 1);
  const g = BGRID.grid = new Array(BGRID.nx * BGRID.nz);
  for (let n = 0; n < BOXES.length; n++) {
    const b = BOXES[n];
    const i0 = Math.max(0, Math.floor((b.minx - x0) / c)), i1 = Math.min(BGRID.nx - 1, Math.floor((b.maxx - x0) / c));
    const k0 = Math.max(0, Math.floor((b.minz - z0) / c)), k1 = Math.min(BGRID.nz - 1, Math.floor((b.maxz - z0) / c));
    for (let i = i0; i <= i1; i++) for (let k = k0; k <= k1; k++) {
      const q = i * BGRID.nz + k; (g[q] || (g[q] = [])).push(n);
    }
  }
  BGRID.mark = new Int32Array(BOXES.length);
  BGRID.tick = 0; BGRID.on = 1;

    const M = flipMarks(c);
    if (!M) { note('NO HIPS IN ' + c.name); continue; }
    FLIP[c.name] = M;
    console.log('[melee] ' + c.name + '  dur ' + c.duration.toFixed(3) + 's  crouch ' +
                M.from.toFixed(3) + '  push +' + M.off.toFixed(3) + '  apex +' + M.peak.toFixed(3) +
                '  air ' + M.air.toFixed(3) + 's');
  }
  {
    const c = out.find(c => c.name === CLIPS.flipBack), M = FLIP[CLIPS.flipBack];
    const pose = c && M ? poseAt(c, M.from, CLIPS.backPose) : null;
    if (pose) out.push(pose); else note('NO ' + CLIPS.backPose);
  }

  // ---- and the two half-body families ----
  // `KeyframeTrack.clone()` slices its own times AND values, so these are new arrays and the
  // shared-buffer landmine cannot follow them here.
  const half = (clip, wantUpper, suffix) => {
    const keep = clip.tracks.filter(t => isUpper(t.name) === wantUpper);
    if (!keep.length) return null;
    return new THREE.AnimationClip(clip.name + suffix, clip.duration, keep.map(t => t.clone()));
  };
  const byName = {};
  for (const c of out) byName[c.name] = c;
  let made = 0;
  for (const [suffix, wantUpper, keys] of [[UP, true, SPLIT.up], [LEGS, false, SPLIT.legs]]) {
    for (const k of keys) {
      const src = byName[CLIPS[k]];
      if (!src) { note('NO CLIP ' + CLIPS[k]); continue; }
      const c = half(src, wantUpper, suffix);
      if (c) { out.push(c); made++; } else note('NO ' + suffix + ' IN ' + src.name);
    }
  }
  console.log('[melee] ' + made + ' half-body clones (' + SPLIT.up.length + ' upper, ' +
              SPLIT.legs.length + ' lower)');
  return out;
}

// --------------------------------------------------------------------------------------------
// WHICH WAY DOES THE EXPORT FACE? MEASURED, NEVER GUESSED.
// A glTF conventionally points -Z and this rig points +Z, which is the difference between
// running away from the camera and running at it -- and because the camera swings round behind
// him as he moves, getting it wrong reads as INVERTED CONTROLS rather than as a backwards
// model, which is why the stick maths gets blamed for it.
//
// THE TOES ARE THE PRIMARY MEASUREMENT: a foot points forwards, which is a geometric fact
// about a body, and averaging the pair cancels the splay. The shoulder span is the obvious
// alternative and is strictly weaker -- it needs the rig's left/right naming to be honest AND
// the up-cross-forward to come out the right way round, and those two can be wrong at once and
// hide each other. Both are measured here and they cross-check; on this file they agree to
// 1.0000 and the answer is +Z.
// --------------------------------------------------------------------------------------------
function measureFacing(bones) {
  const nx = (a, b) => {
    const x = a.x - b.x, z = a.z - b.z, d = Math.hypot(x, z) || 1;
    return { x: x / d, z: z / d };
  };
  const need = n => bones[n] && bones[n].getWorldPosition(new THREE.Vector3());
  const lf = need('mixamorig_LeftFoot'), lt = need('mixamorig_LeftToe_End');
  const rf = need('mixamorig_RightFoot'), rt = need('mixamorig_RightToe_End');
  let fx = 0, fz = 1, how = 'default';
  if (lf && lt && rf && rt) {
    const a = nx(lt, lf), b = nx(rt, rf);
    const sx = a.x + b.x, sz = a.z + b.z, d = Math.hypot(sx, sz);
    if (d > .2) { fx = sx / d; fz = sz / d; how = 'toes'; }
  }
  // the cross-check: his LEFT is up x forward = (fz, -fx), and the shoulder span should agree
  const ls = need('mixamorig_LeftShoulder'), rs = need('mixamorig_RightShoulder');
  let agree = null;
  if (ls && rs) {
    const s = nx(ls, rs);
    agree = s.x * fz + s.z * -fx;
    if (agree < .4) note('FACING: toes and shoulders DISAGREE (' + agree.toFixed(2) + ')');
  }
  const yaw = Math.atan2(fx, fz);
  console.log('[melee] facing measured from ' + how + ': (' + fx.toFixed(3) + ', ' + fz.toFixed(3) +
              ') = ' + (yaw * 180 / Math.PI).toFixed(1) + ' deg' +
              (agree != null ? '   shoulder cross-check ' + agree.toFixed(4) : ''));
  return yaw;
}

// --------------------------------------------------------------------------------------------
// MEASURE HIM WITH GEOMETRY BOUNDS, NEVER `Box3.setFromObject`. A skinned mesh ignores its node
// transform but setFromObject applies it anyway -- and this armature is scaled 0.01, so the box
// comes back a hundredth of his size. GLTFLoader binds every skin with the IDENTITY matrix, so
// at rest a vertex's geometry position IS its world position and these bounds are already
// metres: 0.9087 m for today's file, which wants x1.926 to stand 1.75 m tall.
// --------------------------------------------------------------------------------------------
function measureHeight(scene) {
  let lo = Infinity, hi = -Infinity;
  scene.traverse(o => {
    if (!o.isSkinnedMesh || !o.geometry) return;
    o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox;
    lo = Math.min(lo, b.min.y); hi = Math.max(hi, b.max.y);
  });
  return isFinite(lo) ? hi - lo : 0;
}

// --------------------------------------------------------------------------------------------
// MOUNTING A WEAPON. Both files are built round `weapon_root_right` with the tip at exactly
// (-14.3102, 0, 0) -- which is the character's own right-hand mount to four decimal places. So
// the answer is to parent with IDENTITY and apply no scale, no offset and no rotation at all.
//
// THE TRAP IS THE ARMATURE SCALE, AND IT IS APPLIED TWICE IF YOU CLONE THE WHOLE SCENE. The
// weapon file is `Armature(0.01) > weapon_root_right > mesh`, and the character's mount is
// ALREADY inside his own Armature(0.01) -- so a naive clone of the file's scene onto the joint
// comes out at a hundredth of its size, which from a phone is indistinguishable from the file
// never having loaded. What is taken is only what sits BELOW the file's own mount: the mesh,
// with its local transform relative to that mount preserved. That carries the authored
// placement and nothing else.
//
// AND THE MOUNT IS FOUND BY NAME ON THE WEARER, so a weapon exported onto the LEFT hand lands
// in the left hand with no code change here.
// --------------------------------------------------------------------------------------------
// WHAT A WEAPON FILE ACTUALLY CONTAINS: the name of its own mount, and every mesh under it
// with the transform RELATIVE TO THAT MOUNT -- which IS the authored placement, and the only
// thing that has to survive being cloned onto somebody's hand.
// **THE ARMATURE SCALE IS APPLIED TWICE IF YOU CLONE THE WHOLE SCENE.** A weapon file is
// `Armature(0.01) > weapon_root > mesh` and the host joint is already inside the wearer's own
// `Armature(0.01)`, so a naive clone comes out at a hundredth of its size -- which from a phone
// is indistinguishable from the file never having loaded.
function weaponParts(src) {
  let fileRoot = null;
  src.traverse(o => { if (!fileRoot && /^weapon_root/.test(o.name)) fileRoot = o; });
  if (!fileRoot) return null;
  src.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(fileRoot.matrixWorld).invert();
  const parts = [];
  fileRoot.traverse(o => {
    if (!o.isMesh) return;
    parts.push({ geometry: o.geometry, material: o.material,
                 matrix: new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld) });
  });
  return parts.length ? { root: fileRoot.name, parts } : null;
}

function mountWeapon(slot, g) {
  const got = weaponParts(g.scene);
  if (!got) { note('NO weapon_root OR MESH IN ' + slot.key); return null; }
  const host = rig.mounts[got.root];
  if (!host) { note('NO MOUNT "' + got.root + '" ON THE RIG for ' + slot.key); return null; }

  const group = new THREE.Group();
  group.name = 'weapon:' + slot.key;
  for (const q of got.parts) {
    const o = new THREE.Mesh(q.geometry, q.material);
    o.matrixAutoUpdate = false;
    o.matrix.copy(q.matrix);
    o.castShadow = true;
    o.frustumCulled = false;   // it rides a bone; its own bounds say nothing about where it is
    group.add(o);
  }
  host.add(group);
  group.visible = false;

  // WHAT SIZE DID IT ACTUALLY COME OUT? "It doesn't show up" is three bugs wearing one face
  // from a phone -- it never loaded, it loaded at a hundredth scale, or it is the right size in
  // the wrong place -- and only a number tells them apart.
  const bb = new THREE.Box3();
  for (const o of group.children) { o.updateMatrixWorld(true); bb.expandByObject(o); }
  const size = bb.getSize(new THREE.Vector3());
  const cm = Math.max(size.x, size.y, size.z) * 100;
  console.log('[melee] ' + slot.key + ' mounted on ' + got.root + ' -- ' + cm.toFixed(0) + ' cm');
  if (cm < 5) note(slot.key.toUpperCase() + ' ' + cm.toFixed(0) + 'CM');

  // THE BARREL AXIS COMES OFF THE RIG'S OWN TIP MARKER, which is what that marker is FOR --
  // it says which way the mount points, and nothing about it is typed here.
  let axis = new THREE.Vector3(-1, 0, 0);
  for (const c of host.children) if (/tip/.test(c.name) && c.position.lengthSq() > 1e-9) axis = c.position.clone().normalize();
  const muzzle = measureMuzzle(group, axis);
  console.log('[melee] ' + slot.key + ' muzzle at ' + muzzle.toArray().map(v => v.toFixed(2)).join(', ') +
              ' in mount space, along ' + axis.toArray().map(v => v.toFixed(2)).join(', '));

  // **THE HAMMER TAKES THE GLOW TOO (m51).** It was gated on `slot.aim`, which is "does this
  // weapon shoot" -- and what the hook actually answers is "does this weapon light up when the
  // hold fills", which the hammer now does as well. `GUNU` is one shared uniform set and only
  // one weapon is ever mounted, so there is nothing to keep in step: `mountWeapon` re-measures
  // the hue per slot and whichever is in his hand is the one being drawn.
  if (slot.aim || slot.charge) for (const o of group.children) if (o.material) {
    // MEASURED OFF THIS GUN'S OWN MAP. On a grey body with blue trim the grey has no chroma and
    // does not vote, so the histogram finds the trim -- which is the part that should glow.
    const m = measureHue(o.material.map, slot.key);
    if (m) { GUNU.hue.value = m.hue; GUNU.rgb.value.setHSL(m.hue, 1, .6); WEAP.hue = m.hue; }
    hueGlow(o.material, GUNU, 'gun');
  }
  // **AND WHICH MOUNT IT WENT ON (m122).** `mountWeapon` runs ONCE at load and parents the
  // group to a bone permanently -- zap's -- so a disguise left both weapons hanging off a
  // skeleton no longer in the scene. `mphWear` re-hosts them by this name.
  return { group, cm, muzzle, host, axis, root: got.root };
}

// ============================================================================================
// THE BLASTER: a charged ball, a reticle that converges, and a gun that lights up
// ============================================================================================

// One soft radial dot, built once. Every glowing thing in here is a stack of these at one
// point -- core, body, haze -- which is what makes a ball read as a ball wrapped in light
// rather than as a flat disc.
const DOT = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(.35, 'rgba(255,255,255,.55)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
// NOT ADDITIVE ON ITS OWN ACCOUNT -- additive IS right for plasma, but it has to be
// tone-mapped off or it saturates to white the moment two of them overlap.
function glowSprite(colour, size) {
  const m = new THREE.SpriteMaterial({ map: DOT, color: colour, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
  const sp = new THREE.Sprite(m);
  sp.scale.setScalar(size);
  return sp;
}
// ============================================================================================
// SPARKS -- ONE DRAW CALL FOR EVERY PARTICLE IN THE GAME (m39)
//
// *"It's so primitive that when you shoot it just looks like a flash, and when it hits them
// there's barely anything. I want it to feel like it really hits them -- maybe some little
// particles that go around their mesh, maybe their mesh flashes."*
//
// **A POOL AND A `Points`, NOT A SPRITE EACH.** A sprite carries its own material, so sixty of
// them is sixty draw calls on the one part of a mobile GPU that is actually scarce. One
// `Points` with per-point size, colour and alpha in attributes is ONE call for the lot, and the
// pool means a burst allocates nothing at all -- which matters when the burst happens on the
// frame something is already being hit.
//
// **`gl_PointSize` IS DERIVED, NOT TUNED.** Half the framebuffer height over the tangent of
// half the vertical lens, so `aSize` is a size in WORLD METRES and a point is the same physical
// size wherever it is. A tuned constant would change size whenever the fov does.
//
// **AND A SPARK CAN FOLLOW A BODY.** *"Particles that go around their mesh."* A burst thrown in
// world space on a man who is being knocked backwards is left behind by him; one that carries
// his root and orbits it stays ON him, which is the thing being asked for. `follow` is the
// body, `ox/oy/oz` is where the spark sits relative to him.
const SPK = {
  // **560, BECAUSE THE MORPH'S THREE POPULATIONS ARE THE BIGGEST DRAW ON IT (m118).** At
  // m115's rates about 92 were alive round him at once, which is a drift and not a swarm; at
  // m118's they are nearer 190, and a pool that recycles out from under every other effect on
  // screen during a one-second transform is worse than a slightly bigger buffer.
  on: 1, n: 560,
  g: 9.5,            // m/s^2 -- sparks fall, which is most of what says they are debris
  drag: 1.9,
};
const spark = { i: 0, live: 0, pts: null, pos: null, col: null, siz: null, alp: null,
                v: [], life: [], age: [], follow: [], off: [], spin: [], rad: [], rv: [] };
// **THE PLUMBING IS A FACTORY, BECAUSE THERE IS MORE THAN ONE KIND OF PARTICLE (m41).** What
// every pool here shares is a `Points` whose points are sized in WORLD METRES -- which is the
// one part worth having exactly once, since `gl_PointSize` derived wrongly is a size that
// changes whenever the fov does. What they do NOT share is physics or blending, and those are
// where sparks and smoke disagree in every line: debris FALLS and is additive, vapour RISES,
// GROWS and is alpha-blended. A material is a draw call either way, so a second pool costs one
// call and buys a whole vocabulary.
function puffPool(n, blending) {
  const geo = new THREE.BufferGeometry();
  const P = { pos: new Float32Array(n * 3), col: new Float32Array(n * 3),
              siz: new Float32Array(n), alp: new Float32Array(n), i: 0, live: 0 };
  geo.setAttribute('position', new THREE.BufferAttribute(P.pos, 3));
  geo.setAttribute('aCol', new THREE.BufferAttribute(P.col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(P.siz, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(P.alp, 1));
  P.mat = new THREE.ShaderMaterial({
    uniforms: { uMap: { value: DOT }, uPx: { value: 300 } },
    vertexShader: `
      attribute vec3 aCol; attribute float aSize; attribute float aAlpha;
      varying vec3 vCol; varying float vA;
      uniform float uPx;
      void main() {
        vCol = aCol; vA = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPx / max(0.05, -mv.z);
      }`,
    fragmentShader: `
      uniform sampler2D uMap; varying vec3 vCol; varying float vA;
      void main() {
        vec4 t = texture2D(uMap, gl_PointCoord);
        gl_FragColor = vec4(vCol * t.a * vA, t.a * vA);
      }`,
    transparent: true, depthWrite: false, blending, toneMapped: false,
  });
  P.pts = new THREE.Points(geo, P.mat);
  // THE BUFFER HOLDS WORLD POSITIONS, so its own origin means nothing and its bounds say
  // nothing about where anything is -- the same reason every effect in this file opts out.
  P.pts.frustumCulled = false;
  P.pts.renderOrder = 3;
  P.geo = geo;
  scene.add(P.pts);
  return P;
}
// AND THE UPLOAD IS THE SAME FOR BOTH, including `uPx` -- half the framebuffer height over
// tan(fov/2), so `aSize` is metres at any lens. A tuned constant would change size whenever
// the fov does, and this game's fov moves.
function puffFlush(P, live) {
  P.live = live;
  P.pts.visible = live > 0;
  if (!live) return;
  P.geo.attributes.position.needsUpdate = true;
  P.geo.attributes.aAlpha.needsUpdate = true;
  P.geo.attributes.aCol.needsUpdate = true;
  P.geo.attributes.aSize.needsUpdate = true;
  P.mat.uniforms.uPx.value =
    renderer.domElement.height * .5 / Math.tan(camera.fov * Math.PI / 360);
}
{
  const n = SPK.n, P = puffPool(n, THREE.AdditiveBlending);
  spark.pos = P.pos; spark.col = P.col; spark.siz = P.siz; spark.alp = P.alp;
  spark.pts = P.pts; spark.mat = P.mat; spark.P = P;
  for (let i = 0; i < n; i++) { spark.v.push(new THREE.Vector3()); spark.off.push(new THREE.Vector3());
    spark.life.push(0); spark.age.push(0); spark.follow.push(null); spark.spin.push(0);
    spark.rad.push(0); spark.rv.push(0); }
}
const _sk = new THREE.Vector3();
// ONE spark. Everything else is a loop over this.
function spk(x, y, z, vx, vy, vz, size, life, col, follow, spin, rv) {
  if (!SPK.on) return;
  const i = spark.i; spark.i = (spark.i + 1) % SPK.n;
  spark.pos[i * 3] = x; spark.pos[i * 3 + 1] = y; spark.pos[i * 3 + 2] = z;
  spark.v[i].set(vx, vy, vz);
  spark.siz[i] = size; spark.life[i] = life; spark.age[i] = 0;
  spark.col[i * 3] = col[0]; spark.col[i * 3 + 1] = col[1]; spark.col[i * 3 + 2] = col[2];
  spark.alp[i] = 1;
  spark.follow[i] = follow || null;
  if (follow) {
    spark.off[i].set(x - follow.root.position.x, y - follow.root.position.y, z - follow.root.position.z);
    // A SIGN PER SPARK IS A SCRAMBLE, NOT A SWIRL, so a caller that wants a coherent one says
    // which way. Absent, it is the random tumble every impact has always had.
    spark.spin[i] = spin === undefined ? (Math.random() * 2 - 1) * 5.0 : spin;
    // **AND A FOLLOWER CAN CLOSE OR OPEN (m115).** A swarm that only ever orbits and rises
    // drifts; one rushing INWARD is a thing being gathered, and one blowing out is a thing
    // coming apart. `rv` is m/s on the offset's own radius, and 0 -- every caller before this
    // one -- is the orbit it always had.
    spark.rv[i] = rv || 0;
    spark.rad[i] = Math.hypot(spark.off[i].x, spark.off[i].z);
  }
}
// A RADIAL BURST. `spread` is m/s outward, `up` is what is added to it -- debris that only ever
// goes sideways reads as a ring rather than as something breaking.
function spkBurst(x, y, z, n, o) {
  o = o || {};
  const col = o.col || [.35, .85, 1], sp = o.spread || 6, up = o.up || 2.5;
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, e = Math.acos(2 * Math.random() - 1);
    const dx = Math.sin(e) * Math.cos(a), dy = Math.cos(e), dz = Math.sin(e) * Math.sin(a);
    const v = sp * (.35 + Math.random() * .65);
    spk(x + dx * (o.r || .1), y + dy * (o.r || .1), z + dz * (o.r || .1),
        dx * v, dy * v + up * Math.random(), dz * v,
        (o.size || .18) * (.55 + Math.random() * .9), (o.life || .55) * (.6 + Math.random() * .8),
        col, o.follow);
  }
}
// **AND A SWARM THAT CLINGS TO A BODY.** Spawned round his own height and radius and carrying
// his root, so being knocked across the street takes the sparks with him -- which is the whole
// difference between "particles happened near him" and "something is happening TO him".
function spkCling(d, n, o) {
  o = o || {};
  const P = d.root.position, h = d.K.h, r = d.K.r;
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, rr = r * (.7 + Math.random() * .9);
    const y = h * (.15 + Math.random() * .8);
    spk(P.x + Math.sin(a) * rr, P.y + y, P.z + Math.cos(a) * rr,
        0, (o.rise || 1.1) * (.4 + Math.random()), 0,
        (o.size || .15) * (.5 + Math.random()), (o.life || .8) * (.6 + Math.random() * .8),
        o.col || [.55, .9, 1], d);
  }
}
function stepSparks(dt) {
  const P = spark.pos, A = spark.alp;
  let live = 0;
  for (let i = 0; i < SPK.n; i++) {
    if (spark.life[i] <= 0) { A[i] = 0; continue; }
    spark.age[i] += dt;
    const u = spark.age[i] / spark.life[i];
    if (u >= 1) { spark.life[i] = 0; A[i] = 0; spark.follow[i] = null; continue; }
    live++;
    const f = spark.follow[i];
    if (f) {
      // ORBIT HIM. The offset turns about his own axis and rises, so the swarm crawls over the
      // body rather than hanging beside it.
      const o = spark.off[i], th = spark.spin[i] * dt;
      const c = Math.cos(th), sn = Math.sin(th);
      let nx = o.x * c - o.z * sn, nz = o.x * sn + o.z * c;
      const rv = spark.rv[i];
      if (rv) {
        // IT CONVERGES ON A FLOOR RATHER THAN THROUGH ZERO, or a spark rushing in turns round
        // and comes back out the far side, which reads as a bug and not as a gather.
        const r0 = Math.hypot(nx, nz), r1 = Math.max(.05, r0 + rv * dt), k = r1 / (r0 || 1);
        nx *= k; nz *= k;
      }
      o.set(nx, o.y + spark.v[i].y * dt, nz);
      P[i * 3] = f.root.position.x + o.x;
      P[i * 3 + 1] = f.root.position.y + o.y;
      P[i * 3 + 2] = f.root.position.z + o.z;
    } else {
      const v = spark.v[i], k = Math.exp(-SPK.drag * dt);
      v.y -= SPK.g * dt; v.x *= k; v.z *= k;
      P[i * 3] += v.x * dt; P[i * 3 + 1] += v.y * dt; P[i * 3 + 2] += v.z * dt;
      if (P[i * 3 + 1] < .02) { P[i * 3 + 1] = .02; v.y = 0; v.x *= .5; v.z *= .5; }
    }
    // BRIGHT THEN GONE, not a linear fade -- a spark that dims evenly reads as a fog
    A[i] = (1 - u) * (1 - u);
  }
  puffFlush(spark.P, live);
  spark.live = live;
}

// ============================================================================================
// SMOKE OFF A CIGARETTE (m41, `SMOKE`, `smokeAt`, `stepSmoke`)
//
// *"I added a joint in the hick for the tip of his cigarette, so we can make some fun smoke."*
// So the placement is his and nothing about it is typed here: `cigarette_tip` is a child of
// `mixamorig_Head`, so it rides every clip for free -- he can look about, stumble and be
// knocked over and the smoke still comes off the end of the cigarette.
//
// **IT IS NOT THE SPARK POOL, AND THAT IS THE WHOLE DESIGN.** A spark is additive, falls and
// holds its size; smoke is alpha-blended, RISES and GROWS, and grey additive over a white floor
// is a glow rather than a wisp. All three differ, so what the two share is the plumbing above
// and not a line of the step.
//
// **AND A PUFF LEAVES THE MAN.** It is emitted AT the tip's world position and then lives in the
// world -- smoke that follows him is a man with a cloud stuck to his face. The spark swarm's
// `follow` is the opposite case and is right for what it does.
const SMOKE = {
  on: 1, n: 80,
  every: [.30, .75],   // seconds between puffs, rolled per puff so the column is not a metronome
  rise: .30,           // m/s up, and it does not slow -- vapour has no gravity worth modelling

// WHICH HUE SHOULD GLOW? MEASURED OFF THE TEXTURE, NOT PICKED BY EYE.
// "Grab a colour ramp of the blaster and make the blueish colour glow, and see if there's a hue
// or tone on the alien to ramp the emission on as well" -- so the texture is asked rather than
// guessed at. It is a SATURATION-WEIGHTED hue histogram, and the weighting is the part that
// matters: a character map is mostly midtones and skin, so counting every pixel equally reports
// the BACKGROUND rather than the accent. What an artist means by "the colour of this thing" are
// the texels carrying chroma, so those are the ones that get a vote -- which is exactly why
// this finds the blue trim on a grey blaster instead of finding grey.

  // across the seam at zero would otherwise average to the middle of the wheel -- and red is
  // exactly the family that sits there.

  // the blaster -- both of them the ORANGE, because orange is most of both maps. That is a
  // correct answer to the wrong question: *"make the blueish colour glow"* is asking for the

  // side of it is knocked out, and the strongest thing LEFT is the accent -- which is the blue.

  // back to its BIND value, which is the T-pose exactly. One missing clip is enough.
