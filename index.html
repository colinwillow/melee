  // hysteresis that stops a thumb rolling inward as it lifts from cancelling the swing you
  // meant. The pad already knows how to tell a deliberate push from a look, and a second answer
  // to that question is a second thing to keep in step -- which is exactly what m37 said when
  // the guard went on the same pad pointing the other way.
  // **AND IT DOES NOT WAIT FOR `tapT` ANY MORE.** That was the old gate's whole substance and
  // it is redundant here for the trigger's own reason: a push past `fireAt` .78 is already far
  // beyond the tap's `far < .42`, so the jump and the wind-up cannot collide, and the wind-up
  // can now be entered as fast as the thumb moves.
  if (s.charge && padUp(p.charge) && p.grounded && !p.melee && !p.roll && !p.knock && !p.chargeGo) {
    // REWOUND ON THE RISING EDGE. `weapon_melee_charge` is a ONCE clip so it holds its last
    // frame -- a man straining rather than winding up over and over -- and a clip that holds
    // has to be rewound BY THE STATE that starts it or the second charge never winds up.
    // BOTH HALVES ARE STARTED. Which one is DRAWN depends on whether he happens to be moving,
    // and that can change mid-clip -- so the one that is not being drawn still has to be at the
    // right place in its own timeline for the moment it is.
    // **AND THE POSE WAITS `armT`, THE WAY THE TRIGGER DOES.** The charge itself starts at once
    // -- a hold must not be shortened by its own gate -- but a stab at the top of the pad that
    // comes straight back is not a wind-up, and without this it swooshes every time. A stab
    // could never SWING (`chargeRelease` wants half a charge), so this is only the sound and
    // the clip, which are the parts a stab would make a liar of.
    p.charge = 1;
    const was = p.chargeT;
    p.chargeT = Math.min(MELEE.charge, p.chargeT + dt);
    if (was < WEAP.armT && p.chargeT >= WEAP.armT) {
      playPair(CLIPS.chargeUp, clipLen(CLIPS.chargeUp) / MELEE.chargeBeat);
      snd('swoosh', { g: .55, r: .5 });
    }
    // **AND THE HAMMER HAS TO SAY IT IS LOADED (m51, `HCHG`).** *"We need to make it really
    // obvious when the hammer is charging. I'm not sure how to do this, but maybe the hammer
    // starts to glow and pulse, maybe his stance gets more violent, maybe it smokes -- something
    // to know when you're fully charged."*
    // **SPARKS OFF THE HEAD, NOT A BAR.** A bar is a number you have to look away to read; the
    // weapon lighting up is something you see while you are still watching the fight -- and it
    // is already one draw call, because `spk` is a pool. `muzzleWorld()` is the far end of the
    // geometry along the mount's own axis, which on a hammer IS the head, so nothing about
    // where they come from is typed.
    // **AND FULL IS AN EVENT, NOT A BRIGHTER VERSION OF NEARLY-FULL.** The reticle's own rule:
    // "how loaded is this" has to be legible at a glance rather than by comparison against a
    // memory of what it looked like a second ago. So the rate climbs while it fills, and the
    // moment it tops out there is ONE ring thrown off the head, a clang, and the ring under
    // the target goes hot -- three things on the same frame, so it cannot be missed.
    const cf = clamp(p.chargeT / MELEE.charge, 0, 1);
    if (HCHG.on && p.chargeT >= WEAP.armT) {
      const m = muzzleWorld();
      p._hcT = (p._hcT || 0) - dt;
      if (p._hcT <= 0) {
        p._hcT = lerp(HCHG.every0, HCHG.every1, cf);
        spkBurst(m.x, m.y, m.z, cf >= .995 ? 2 : 1,
                 { col: cf >= .995 ? HCHG.hot : HCHG.cool, spread: 1.1 + cf * 2.2, up: .7,
                   r: .10, size: .09 + cf * .11, life: .34 + cf * .3 });
      }
      // THE TOP-OUT, ONCE. `was` is the value before this frame's `dt`, so the crossing is an
      // edge rather than "it is full", which would fire every frame for as long as it is held.
      if (was < MELEE.charge && p.chargeT >= MELEE.charge) {
        spkBurst(m.x, m.y, m.z, HCHG.pop, { col: HCHG.hot, spread: 5.5, up: 1.4, r: .12,
                                            size: .22, life: .5 });
        snd(HCHG.snd, HCHG.play);
      }
    }
  } else if (p.charge) chargeRelease();

  if (p.fireT > 0) p.fireT = Math.max(0, p.fireT - dt / (WEAP.shootBeat + WEAP.shootHold));
  // THE RING IS "THIS PAD IS IN A MODE", whichever mode it is. Squaring up has no weapon and
  // no charge to show, so without it the one thing that says the hold TOOK is the character
  // turning -- which is also what he looks like when the camera happens to swing.
  padR.classList.toggle('arm', !!(p.aim || p.center || (p.charge && p.chargeT > MELEE.charge * .5)));
}

// ============================================================================================
// LOCOMOTION. Three separate ideas, and the moonwalk comes from missing the third.
//   1. the GATHER lives in `push` -- how much of his acceleration he HAS, climbing from `push0`
//      over `pushT`, with `accFall` thinning it again near the top speed. Not in the target
//      speed and not in a momentum term.
//   2. `heading` is the thumb, taken instantly. `faceH` is the BODY, coming round at `face0` on
//      the spot and `face1` at a run. He is DRAWN at `faceH`.
//   3. `plant`: at a walk the legs push where the thumb says, at a run they push along `faceH`.
//      WITHOUT THIS the velocity keeps answering the stick while the body has already turned,
//      which *is* the moonwalk. `turnBrake` costs him speed through a hard turn, which is what
//      plants the feet rather than just pointing them.
// ============================================================================================
function integrate(dt, wantX, wantZ, wantSp, ctl) {
  const p = player;

  if (ctl) {
    const sp0 = Math.hypot(p.vel.x, p.vel.z);
    // the gather, and `accFall` measures against the speed he is ACTUALLY being asked for.
    // Against a fixed ceiling it pins the acceleration at its floor the moment he passes that
    // ceiling, so a raised target can never be reached and raising it reads as doing nothing.
    const ramp = 1 - MOVE.accFall * smooth(0, 1, sp0 / Math.max(.5, wantSp || MOVE.max));
    const push = lerp(MOVE.push0, 1, clamp(p.goT / MOVE.pushT, 0, 1));
    const acc = (p.grounded ? MOVE.acc : MOVE.airAcc) * push * Math.max(.08, ramp);
    if (wantSp > 0) {
      const tx = wantX * wantSp, tz = wantZ * wantSp;
      const ex = tx - p.vel.x, ez = tz - p.vel.z, e = Math.hypot(ex, ez);
      if (e > 1e-4) {
        // SPEEDING UP IS RAMPED, SLOWING DOWN IS NOT. `accFall` is about how fast he can pick
        // speed UP, and slowing down is not accelerating -- one sign test. Without it a body
        // carrying speed out of a lunge takes twenty seconds to come back to a walk, which
        // reads as ice.
        const along = (ex * p.vel.x + ez * p.vel.z) / (sp0 || 1);
        const rate = (along >= 0 ? acc : MOVE.acc) * dt;
        const k = Math.min(1, rate / e);
        p.vel.x += ex * k; p.vel.z += ez * k;
      }
    } else {
      // A BODY ON THE FLOOR SCRUBS LIKE A BODY, NOT LIKE A MAN BRAKING (m90) -- `MOVE.drag`'s
      // time constant is 2.1 s, which left 13.9 m of slide still to come on his back.
      const dk = p.knock ? (p.grounded ? HURT.skid : MOVE.airDrag * .25)
                         : (p.grounded ? MOVE.drag : MOVE.airDrag) * .25;
      const k = Math.exp(-dk * dt);
      p.vel.x *= k; p.vel.z *= k;
    }
  }

  p.vel.y -= MOVE.g * dt;
  const px = p.pos.x, pz = p.pos.z;
  // A COLLIDER SAMPLED AT A POINT ONLY KNOWS WHERE IT WAS ASKED, so how far he moves between
  // samples is how far he can get INTO something before anything notices. At the charged dash's
  // 66 m/s a 60 Hz frame is over a metre and a 30 Hz one is two, which is wide enough to pass
  // clean through a box. **Split by DISTANCE, never by time** -- that is what makes a slow phone
  // play the same game as a fast one, and at walking pace it is one step and costs nothing.
  const move = Math.hypot(p.vel.x, p.vel.y, p.vel.z) * dt;
  const sub = Math.min(MOVE.subMax, Math.max(1, Math.ceil(move / MOVE.sub)));
  let solid = 0;
  for (let k = 0, h = dt / sub; k < sub; k++) {
    p.pos.x += p.vel.x * h; p.pos.z += p.vel.z * h; p.pos.y += p.vel.y * h;
    solid |= resolveBoxes(p.pos, p.r, p.hh) | pushBodies(p.pos, p.r);
  }
  if (solid) {
    // only the component going INTO the surface is removed, so a slide along a wall keeps its
    // speed by itself and needs no extra scrub
    const mx = p.pos.x - px, mz = p.pos.z - pz;
    if (Math.abs(mx) < 1e-6) p.vel.x = 0;
    if (Math.abs(mz) < 1e-6) p.vel.z = 0;
  }

  const gy = groundAt(p.pos.x, p.pos.z, p.pos.y, MOVE.step);
  let landed = 0;
  if (p.grounded) {
    if (p.pos.y - gy > MOVE.step) { p.grounded = false; p.airT = 0; p.coyote = MOVE.coyote; }
    else { p.pos.y = gy; p.vel.y = 0; }
  } else {
    p.airT += dt;
    if (p.coyote > 0) p.coyote -= dt;
    if (p.vel.y <= 0 && p.pos.y <= gy + .04) {
      p.fallV = -p.vel.y;
      // **AND HIS OWN LANDING IS AN ARRIVAL TOO (m66).** m64 left this as a stated gap -- the
      // bank was sitting there and he had not asked. He has: it is the same `bumpSnd` a body
      // gets, off the same two recordings and the same impact-speed curve, so a man hitting the
      // ground sounds like a man hitting the ground whichever man it is. `MOVE.landSoft` and
      // `landHard` pick the CLIP by the same speed; this is the sound of the same event.
      bumpSnd(p.fallV * BODYSND.drop.me, p.pos.x, p.pos.z);
      p.pos.y = gy; p.vel.y = 0; p.grounded = true; p.jumps = 0; p.slamUsed = 0; p.airKick = 0; p.flip = ''; landed = 1;
    }
  }
  p.speed = Math.hypot(p.vel.x, p.vel.z);
  return landed;
}

function stepPlayer(dt) {
  const p = player;
  stepFeet(dt);
  const hadLock = p.lock;
  p.lock = findLock();
  if (p.lock && p.lock !== hadLock) snd('lock', { g: .3, r: 1.5 });
  const s = p.lock ? stickLocked(p.lock) : stickWorld();

  // **THE SLAM ENDS WHEN HE MEETS THE GROUND (m81)**, which is the opposite of every other
  // strike here -- they all end when he leaves it. That is why this is its own branch and not a
  // clause on the one below: sharing that condition would have it cancel itself on the frame it
  // began. It owns the body the way they do (its own drive, its own gravity, the real collider)
  // and it is not cancellable, because a blow the next input truncates never reads as landing.
  if (p.wallCool > 0) p.wallCool = Math.max(0, p.wallCool - dt);
  // COVER OWNS THE BODY, so it sits with the other states that do -- above the gait, below the
  // slam, and it returns.
  if (p.wall) { stepWall(dt); return; }
  // AND THE LEDGE OWNS THE BODY THE SAME WAY, so it sits with the states that do and it
  // returns. Above the gait, below the slam, beside cover -- one place, one order.
  if (p.ledgeCool > 0) p.ledgeCool = Math.max(0, p.ledgeCool - dt);
  if (p.ledgeAway > 0) p.ledgeAway = Math.max(0, p.ledgeAway - dt);
  if (p.ledge) { stepLedge(dt); return; }
  // THE PUSH. He is on the floor, extending, and the launch is at the end of it -- the clip is
  // already running and `rigAnim` draws it, because the flip branch sits above the air test.
  if (p.bkHang > 0) {
    p.bkHang -= dt;
    p.vel.set(0, 0, 0); p.speed = 0; p.grounded = true; p.airT = 0;
    p.pos.y = groundAt(p.pos.x, p.pos.z, p.pos.y, MOVE.step);
    if (p.bkHang <= 0) {
      p.bkHang = 0;
      flipAirRate();                      // the legs are done; the rest of the clip is the flip
      p.vel.y = p.bkVy; p.grounded = false; p.coyote = 0; p.airT = 0;
      snd('swoosh', { r: 1.05, g: .44 });
    }
    return;
  }
  if (p.slam) {
    p.slamT += dt;
    if (p.slamT < SLAM.hang) { p.vel.y = 0; }      // the wind-up: he hangs
    else p.vel.y = Math.min(p.vel.y, -SLAM.down);  // and then he is driven, not dropped
    p.vel.x *= Math.exp(-4 * dt); p.vel.z *= Math.exp(-4 * dt);
    // **AND THE SLAM DRAWS ITS SLASH (m99).** *"We needs to put in the slashes for all the melees
    // stuff."* `strikeSweep` is called from exactly ONE site -- inside the `p.roll || p.melee ||
    // p.chargeGo` branch -- and a slam is none of those, so the one strike in the game with a
    // whole hammer arc in it was the one with no trail on it. `slamGo` already seeded the sweep
    // (`p.swPrev = null`), which says this was always meant to run.
    // **`live` IS FALSE, WHICH IS THE WHOLE OF WHY THIS IS SAFE.** The slam's damage is RADIAL
    // and `slamLand` deals it -- a swept limb counting a second blow on the way down would be
    // two descriptions of one event. The sweep with the window shut tracks the limbs and draws
    // the fastest one, which is all that is wanted here.
    strikeSweep(dt, 0, false, 0, false);
    const landed = integrate(dt, 0, 0, 0, false);
    if (landed || p.grounded || p.slamT > SLAM.max) slamLand();
    return;
  }
  // ---- the states that OWN the body. Each bleeds its own speed off and still runs gravity
  //      and the ground collider, so the ground hands him straight back to the air code.
  if (p.roll || p.melee || p.chargeGo) {
    const which = p.roll ? 'roll' : p.melee ? 'melee' : 'charge';
    const dur = p.roll ? MELEE.rollDur : p.melee ? p.meleeDur : (p.goDur || MELEE.finishBeat);
    const tRef = p.roll ? (p.rollT += dt) : p.melee ? (p.meleeT += dt) : (p.chargeGoT += dt);
    const u = clamp(tRef / dur, 0, 1);
    // full speed for `carry` of the move, then linear to zero. A flat linear bleed averages
    // half the launch speed, so every metre of travel has to be bought with a speed spike at
    // the front -- which reads as a rocket rather than a lunge.
    // **AND A DASH SPENDS ITS TRAVEL BY `dashLand` (m51).** The same bleed on a shorter clock:
    // `uu` is how far through the TRAVEL he is rather than how far through the state, so he is
    // stationary from `dashLand` on and the hammer lands on a body that has already arrived.
    // For every other move `arr` is 1 and `uu` is `u`, so this is the old line exactly.
    const arr = (p.chargeGo && MELEE.dash) ? MELEE.dashLand : 1;
    const uu = arr >= 1 ? u : clamp(u / arr, 0, 1);
    const k = uu >= 1 ? 0 : uu < MELEE.carry ? 1 : 1 - (uu - MELEE.carry) / (1 - MELEE.carry);
    // THE BLOW LANDS WHEN THE LIMB REACHES HIM, AND NOT BEFORE. `at` no longer FIRES the hit --
    // it opens the window the sweep is allowed to count in, so a swing that misses misses.
    if (!p.roll) {
      const CL = p.melee ? clipOf(p.meleeName) : null;
      const at = p.melee ? ((CL && CL.at) || MELEE.at[Math.min(p.meleeIx, MELEE.at.length - 1)])
                         : MELEE.finishAt;
      // **THE TWO OPENERS ARE BODY MOVES (m93)** -- the blow is him arriving rather than a limb
      // swinging, so the sweep's gate, its radius and its window all branch on this one fact.
      // `p.meleeBody` is latched where the move STARTS (`meleeGo`'s tackle branch and `kickGo`),
      // never re-derived from the clip name here: two places deciding what a move IS is two
      // places for them to disagree.
      const body = !!(p.melee && p.meleeBody);
      const pw = p.melee ? (body ? (p.meleeAir ? MELEE.airPow : MELEE.slidePow)
                                 : melPower(p.meleeIx, p.meleeLinks || MELEE.links))
                         : 1.0 * (p.chargeGoK || 1);
      // THE SWEEP RUNS EVERY FRAME even while the window is shut, because the previous
      // positions it measures against have to stay one frame old -- a sweep seeded three
      // frames back is a segment through half the room.
      const dm = p.chargeGo ? FOE.dmg.finish
               : body ? (p.meleeAir ? MELEE.airDmg : MELEE.slideDmg)
               : slotNow().charge ? FOE.dmg.weap : FOE.dmg.fist;
      // A DASH IS OPEN FROM THE FIRST FRAME -- see `STRIKE.dashFrom`. At dash speed the whole
      // move is over in a few frames and the ordinary wind-up fraction puts the window behind
      // anybody standing close.
      const from = p.chargeGo && MELEE.dash ? STRIKE.dashFrom : STRIKE.from;
      // A BODY MOVE'S WINDOW IS A FRACTION OF THE STATE, not of the authored contact frame --
      // there is no single contact frame on a six-metre slide, the contact IS the travel -- and
      // it stays live rather than closing on the first man, which is what lets him take a line
      // of them one at a time as he reaches each.
      const open = body ? u >= STRIKE.bodyFrom : !p.melFired && u >= at * from;
      const hitB = strikeSweep(dt, pw, open && u <= STRIKE.to, dm, body);
      if (hitB) {
        // WHEN, as a fraction of the clip. "It connects at the wrong part of the animation" is a
        // measurement, and this is the only place that can take it -- `MELEE.at` says where the
        // window OPENS and the sweep says where the limb actually arrived.
        if (!p.melFired) p.melU = u;
        p.melFired = 1;
        // a hammer rings and a fist thuds -- the weapon decides, not the strike
        // **A BLOW ON A BODY RINGS (m55).** *"The sound effect for when he melees and hits
        // the warriors is like a box break, and I want it to be more like the clang noise."*
        // It was literally that -- `thud` is `box_break_01.mp3`, which is a crate coming apart
        // and not a man being hit. The hammer already rang; the FIST got the box.
        // **THE TWO ARE STILL TOLD APART, by weight rather than by file.** A hammer is heavier
        // and lower, a fist is lighter and higher -- which is the same distinction the metal
        // clangs one repo over are drawn with, three files standing in for three tiers by
        // PITCH rather than by three recordings.
        // **AND WHAT IT HITS IS THE BETTER KEY, WHICH IS WHERE IT LIVES NOW (m57).** m55 left
        // this as a stated gap and he closed it from the other side: *"it shouldn't make the
        // clang or the clink, cause that's for people with armour."* A ringing blow is a fact
        // about the MAN -- armour rings, a drunk in a coat does not -- so the key is a field on
        // the KIND table and a body with no `snd` keeps the old ring rather than going silent.
        // **The WEIGHT split stays here**, because that is a fact about the WEAPON: a hammer is
        // heavier and lower, a fist lighter and higher, on whichever sound the body calls for.
        {
          const K = (hitB && hitB.K) || null;
          const S = HITSND[(K && K.snd) || 'hard'] || HITSND.hard;
          // heavier and lower for a weapon, lighter and higher for a fist -- ON whichever
          // sound the body called for, so one table says what it is and the other how hard.
          const w = slotNow().charge ? 1 : 0;
          const P = hitB.root.position;
          snd(S.key, { g: w ? S.g : S.g * .69,
                       r: (w ? S.r : S.r * 1.52) * (1 + (Math.random() - .5) * .14),
                       dur: S.dur, x: P.x, z: P.z });
          hitRing(K, w ? 1 : .72, P.x, P.z);
        }
      }
    }
    const h = p.roll ? p.rollH : p.faceH;
    const v0 = p.roll ? MELEE.rollV : (p.melV || MELEE.finishV * (p.chargeGoK || 1));
    // A LEAP IN THE AIR KEEPS ITS SPEED -- that is what ballistic MEANS, and the whole reason
    // the arc lands where it was solved to. The `carry` bleed is for a grounded lunge, so the
    // charged swing only takes it once his feet are back down and it becomes a skid.
    // **A FLYING KICK KEEPS ITS DRIVE TOO.** `carry`'s bleed is for a lunge scrubbing against
    // the ground and there is no ground up here; a kick that bleeds to nothing mid-flight drops
    // straight down, which is the opposite of what it is.
    const kk = ((p.chargeGo || p.meleeAir) && !p.grounded) ? 1 : k;
    p.vel.x = Math.sin(h) * v0 * kk; p.vel.z = Math.cos(h) * v0 * kk;
    p.faceH = h; p.heading = h;
    integrate(dt, 0, 0, 0, false);
    // THE TAIL IS CANCELLABLE. Holding the whole clip makes a three-punch chain feel like three
    // seconds of watching; past `hold`, a stick on the pad takes him out of the recovery, which
    // is what makes each link in the chain a decision rather than a wait.
    // A STRIKE IS NEVER CUT SHORT. Only the ROLL can be run out of early -- a roll is a move
    // you spend to go somewhere and its tail is yours; a strike is a blow, and a blow that the
    // next input truncates never reads as having landed. The whole reason the beats came down
    // is that this rule is only bearable when each one is over quickly.
    // AND THE FLYING KICK ENDS THE MOMENT HE MEETS THE GROUND, which is the opposite test from
    // every other strike -- they all end when he LEAVES it. `p.meleeT > .1` is what stops it
    // cancelling on the frame it began, because he can be one frame off the floor when it fires.
    const out = p.roll ? (u >= 1 || (u > MELEE.rollFree && s.mag > .3))
      : p.meleeAir ? (u >= 1 || (p.grounded && p.meleeT > .1)) : u >= 1;
    if (out) {
      if (p.roll) p.roll = 0;
      else if (p.melee) {
        p.melee = 0; p.meleeAir = 0; p.meleeChain = MELEE.window;
        // and the flick that arrived mid-strike is taken NOW, so a chain thrown as fast as the
        // thumb can move still lands every link
        if (p.melQ != null) { const q = p.melQ; p.melQ = null; meleeGo(q); }
      } else {
        p.chargeGo = 0;
        if (p.melQ != null) { const q = p.melQ; p.melQ = null; meleeGo(q); }
      }
    }
    return;
  }
  if (p.meleeChain > 0) { p.meleeChain -= dt; if (p.meleeChain <= 0) p.melQ = null; }

  // ---- the landing states: he can move out of them, but not instantly ----
  // the reaction clip runs on its own clock and gives way out of `rest` -- see `rigAnim`
  if (p.hurtNm) { p.hurtClipT += dt; if (p.hurtClipT >= HURT.stagger) p.hurtNm = ''; }
  if (p.parryT > 0) p.parryT = Math.max(0, p.parryT - dt);
  // THE REACH, and the weapon arrives PART-WAY THROUGH IT -- `SWAP.at`, fired on the crossing
  // rather than every frame past it, which is `p.gotUp`'s own rule one state over.
  if (p.swap) {
    p.swapT += dt;
    const su = p.swapT / SWAP.dur;
    // HIS HANDS ARE EMPTY WHILE THEY ARE IN THE BAG. Both are crossings rather than tests on
    // "is it past", which is `p.gotUp`'s own rule one state over.
    if (!p.swapHid && !p.swapDone && su >= p.swapHideAt) { p.swapHid = 1; paintKit(); }
    if (!p.swapDone && su >= p.swapAt) { p.swapDone = 1; p.swapHid = 0; applySlot(p.swapTo); }
    if (p.swapT >= SWAP.dur) p.swap = 0;
  }
  // HOW LONG HE HAS ACTUALLY BEEN RUNNING, which is what the tackle opener is gated on. It is
  // last frame's speed, which is the right one: what is being asked is whether he ARRIVED at
  // this flick running, not whether the thumb is pointed somewhere.
  // **AND SPEED A MOVE GAVE HIM IS NOT RUNNING (m105).** `stepMelee` rewrites the velocity from
  // `melV` every frame, so a strike's own lunge counted here: the finisher launches at 9.0 m/s
  // and stays over `slideAt` 4.2 for **0.61 s** against a `slideT` of .45, so throwing it was by
  // itself enough to arm the tackle. Swipe, let the chain lapse, swipe again -- and the next
  // flick is a six-metre slide out of a fight he was standing still in. It is HELD rather than
  // cleared, so a man genuinely sprinting who throws one punch on the way in still has it.
  const own = !p.melee && !p.chargeGo && !p.roll;
  if (own) { if (p.grounded && p.speed > MELEE.slideAt) p.runT += dt; else p.runT = 0; }

  // ---- THE KNOCK-DOWN RUNS ON ITS OWN CLOCK, FROM THE BLOW (m90). Not on `p.land`: the fall
  //      begins in the air, so a clock that starts at the landing is a clock that starts after
  //      most of what it is timing. **THE GET-UP IS FIRED ON THE CROSSING** (`p.gotUp`), or
  //      `playOnce` rewinds it on every frame past it and he never stands.
  if (p.knock) {
    p.knockT += dt;
    // **AND THE STATE READS THE SAME LENGTH THE CLIP WAS SCALED BY (m96)**, which is the m8
    // landmine and is exactly what a per-launch rate walks into: `p.knockDur` is set where the
    // rate is, so the fall cannot end with a third of its clip still to run.
    const kd = p.knockDur || HURT.beat;
    if (!p.gotUp && p.knockT >= kd && rig.actions[HURT.up]) {
      p.gotUp = 1; playOnce(HURT.up, clipLen(HURT.up) / HURT.upBeat);
    }
    // **AND IT IS NOT CANCELLABLE.** A get-up you can nudge out of is a get-up nobody ever sees,
    // which is m8's lesson about a state that cuts its own clip short.
    if (p.knockT >= kd + HURT.upBeat) { p.knock = 0; p.goT = 0; }
  }
  if (p.land) {
    p.landT += dt;
    if (p.landT >= p.land || (p.landT > p.land * MOVE.landFree && s.mag > .3)) p.land = 0;
  }

  // ---- the flip runs out on its own clock, and the flight usually outlasts it ----
  // **AND IT MAY NOT BE CLEARED BY `grounded` WHILE HE IS STILL PUSHING** -- during the hang he
  // is deliberately on the floor with the flip clip running, which is the whole point of it.
  if (p.flip) { p.flipT += dt; if (p.flipT >= p.flipDur || (p.grounded && p.bkHang <= 0)) p.flip = ''; }

  // ---- the jump ----
  if (p.jump) {
    p.jump = 0;
    // **THE SECOND TAP IS THE SECOND JUMP, AND IT IS THE FLIP (m87).** The gate is `p.jumps > 0`,
    // so walking off a box grants nothing: the double exists only if he actually took the first,
    // which is what stops a ledge being a free extra jump. `coyote` still covers the first .12 s.
    if (!p.grounded && p.coyote <= 0 && p.jumps === 1 && !p.knock && !p.slam && !p.roll && !p.melee) {
      p.jumps = 2;
      p.vel.y = MOVE.jump * AIR.second;       // SET, never added -- see `AIR.second`
      flipGo(CLIPS.flipAir, (p.vel.y + Math.sqrt(p.vel.y * p.vel.y +
        2 * MOVE.g * Math.max(0, p.pos.y - groundAt(p.pos.x, p.pos.z, p.pos.y, MOVE.step)))) / MOVE.g);
      snd('swoosh', { r: 1.30, g: .40 });
    }
    else if ((p.grounded || p.coyote > 0) && !p.land) {
      p.vel.y = MOVE.jump; p.grounded = false; p.coyote = 0; p.airT = 0; p.jumps = 1;
      // the same swoosh the strikes use, pitched UP and quiet -- a body leaving the ground is
      // a smaller version of the same event, and a second sample for it would be a second
      // thing to keep in step with the first
      snd('swoosh', { r: 1.45, g: .34 });
    }
  }

  // ---- HOLD THE LOCOMOTION STICK INTO A WALL AND HE TAKES COVER (m89) ----
  //      *"When you become close to a wall, if you're just pressing and holding the locomotion
  //      stick toward the wall, he'll naturally go into cover."* No button and no second
  //      gesture: the thumb that walks him at it is the thumb that latches him to it, which is
  //      why `into` is a DOT rather than a distance -- brushing past a wall while running along
  //      it does not stick to it, and walking at it does.
  {
    const busy = p.melee || p.roll || p.chargeGo || p.slam || p.knock || p.land || p.block ||
                 p.center || p.aim || p.charge || p.bkOn;
    if (!busy && p.grounded && p.wallCool <= 0 && s.mag > .45) {
      const W = wallFind(p.pos.x, p.pos.y, p.pos.z, p.r + WALL.reach);
      if (W && -(s.x * W.nx + s.z * W.nz) > WALL.into && rig.actions[WALL.clips.in]) {
        wallGo(W); return;
      }
    }
  }

  // ---- AND A LIP CATCHES HIM IN THE AIR (m102) ----
  //      *"Jump, hang, climb up, jump, hang, climb up to get up to higher levels."* There is no
  //      gesture here at all: he is airborne, his hands are level with an edge, and he takes it.
  //      **THIS IS THE ONE PLACE IT IS CALLED, WHICH IS THE THING TO CHECK FIRST IF IT EVER DOES
  //      NOTHING.** Shredworld spent a whole build on a ledge grab that was correct and reachable
  //      only by being hit by a car, because `ledgeGrab` was called from the knock-down
  //      integrator and from nowhere else -- so this sits in the ordinary air path, above the
  //      gait, where a man who has jumped actually passes through.
  if (LEDGE.on && !p.grounded && p.ledgeCool <= 0 && !p.knock && !p.melee && !p.slam &&
      !p.roll && !p.chargeGo && rig.actions[LEDGE.clips.hang]) {
    const L = ledgeFind(p.pos.x, p.pos.y, p.pos.z, p.r + LEDGE.reach);
    // **AND IF HE IS GOING TO CLEAR IT, HE LANDS ON IT.** A lip is always at least half a metre
    // above his feet (the band is centred on his HANDS), so nothing stops the catch firing at
    // the bottom of a jump onto a 1.15 m box -- which would turn a step-up that has always
    // worked into a hang, the 40 cm cube's lesson (m74) pointed the other way. Whether this jump
    // clears it is knowable rather than a threshold: the apex from here against the lip.
    const apex = p.pos.y + (p.vel.y > 0 ? p.vel.y * p.vel.y / (2 * MOVE.g) : 0);
    if (L && apex <= L.y + LEDGE.clears) { ledgeGo(L); return; }
  }

  // ---- ordinary locomotion ----
  // AIMED, HE FACES THE SHOT AND TRAVELS WHEREVER THE THUMB SAYS -- which is a STRAFE, and it
  // is why `plant` has to go to zero here. `plant` swings the velocity onto his facing as he
  // speeds up, which is right for running and exactly wrong while aiming, since it would drag
  // every step round to point down the barrel.
  const aiming = committed() || p.block || p.center || !!p.lock;
  let wantSp = MOVE.max * s.mag;
  if (aiming) wantSp = Math.min(wantSp, GAIT.aimRunRef);
  if (p.land && !p.knock) wantSp *= .35;
  // **A BLOW TAKES THE CONTROLS AWAY FOR A MOMENT, WHICH IS WHAT MAKES IT A BLOW.** Without it
  // a mace landing is a small push you steer straight out of, and getting hit reads as nothing.
  // It is short on purpose -- being unable to move is the least fun state in any game, and the
  // knockback is doing most of the work.
  // **THE GUARD IS A STANCE, AND A STANCE FACES FORWARD AND MOVES SIDEWAYS (m39).** *"He goes
  // into strafe mode left and right -- that's like his block, it'll be his guard."* It is
  // exactly what `aiming` already does: face where the lens is pointed, and let `plant` go to
  // zero so the legs carry him wherever the thumb says instead of dragging his body round to
  // point that way. So it joins that branch rather than growing a second one, and `rigAnim`'s
  // strafe blend picks the clip off the sign of his travel with nothing new written.
  if (p.block) wantSp = Math.min(wantSp, MOVE.blockSp);
  if (p.bkOn) wantSp = Math.min(wantSp, AIR.duckSp);   // a duck shuffles; it does not run
  if (p.hurtT > 0) { p.hurtT = Math.max(0, p.hurtT - dt); wantSp = 0; }
  if (p.knockCool > 0) p.knockCool = Math.max(0, p.knockCool - dt);
  // FLYING OR GETTING UP, THE STICK IS NOT HIS. One flag covers both halves, because a
  // knock-down is one move: `p.knock` is set at the launch and cleared where the landing
  // ends, so there is no second state to keep in step with the first.
  if (p.knock) wantSp = 0;
  // AND IT COMES BACK ON ITS OWN, after a pause long enough that a fight is not free. There is
  // no death yet, so what running out of health costs you is nothing -- stated, not hidden.
  if (p.hurtWait > 0) p.hurtWait = Math.max(0, p.hurtWait - dt);
  else if (p.hp < HEALTH.max) p.hp = Math.min(HEALTH.max, p.hp + HEALTH.regen * dt);

  if (s.mag > 0) {
    p.goT += dt;
    const tgt = Math.atan2(s.x, s.z);
    if (!aiming) {
      const rate = (p.grounded ? MOVE.turn : MOVE.airTurn) * dt;
      p.heading += clamp(wrapAngle(tgt - p.heading), -rate, rate);
    }
  } else p.goT = 0;

  // aiming, he faces where the camera looks; otherwise he faces where he is going
  // LOCKED, HE FACES THE TARGET -- not the lens. That is what makes the strafes read.
  const faceTgt = p.lock ? lockH(p.lock) : aiming ? cam.az : p.heading;
  const fRate = (p.lock ? LOCK.face : aiming ? MOVE.face0 : lerp(MOVE.face0, MOVE.face1, clamp(p.speed / MOVE.max, 0, 1))) * dt;
  const turned = clamp(wrapAngle(faceTgt - p.faceH), -fRate, fRate);
  p.faceH += turned;
  // **AND WHERE HE ENDS UP IS WHERE HE IS (m53).** *"When you release, he goes back to his
  // original position, which is not ideal -- that should just be his new position."* Exactly
  // what it did: `p.heading` is only written from the THUMB, and the `!aiming` gate above
  // freezes it for the whole hold -- so on release `faceTgt` fell back to whatever he was
  // facing before it started and he eased all the way round again.
  // **IT FOLLOWS `faceH` WHILE AIMING RATHER THAN BEING ADOPTED ON AN EDGE.** An edge is a
  // thing to remember in three places (the trigger, the guard and the square-up all freeze it
  // the same way) and a thing to get wrong once; following it means there is nothing to hand
  // over, because on the release frame `faceTgt` is already `faceH` and he simply stops.
  // Released mid-turn he holds where he GOT to, which is the predictable answer -- carrying on
  // to finish a turn nobody is asking for any more is the same surprise pointed the other way.
  // **IT COSTS NOTHING WHILE THE LEFT STICK IS HELD**, because `heading` is rewritten from the
  // thumb the moment `aiming` ends. This only ever shows standing still, which is exactly when
  // he is turning to look at something.
  if (aiming) p.heading = p.faceH;
  // HOW FAST THE BODY IS COMING ROUND, for the turn-on-the-spot clips. Damped, because one
  // frame of jitter must not flicker a clip in and out, and it is a RATE rather than the angle
  // still to go -- the residual says how far he has left, not whether he is moving.
  p.turnRate = damp(p.turnRate || 0, dt > 1e-6 ? turned / dt : 0, .06, dt);

  // PLANT. At a walk the legs push where the thumb says; at a run, along `faceH`.
  let wx = s.x, wz = s.z;
  if (s.mag > 0 && !aiming) {
    const plant = smooth(MOVE.plantAt, MOVE.plantFull, p.speed);
    const fx = Math.sin(p.faceH), fz = Math.cos(p.faceH);
    wx = lerp(s.x, fx, plant); wz = lerp(s.z, fz, plant);
    const d = Math.hypot(wx, wz) || 1; wx /= d; wz /= d;
    // a hard turn costs him speed -- this is what plants the feet rather than just pointing them
    const off = Math.abs(wrapAngle(Math.atan2(s.x, s.z) - p.faceH));
    wantSp *= 1 - MOVE.turnBrake * smooth(.6, Math.PI, off);
  }

  const landed = integrate(dt, wx, wz, wantSp, true);
  if (landed) {
    // SOFT OR HARD IS THE IMPACT SPEED, not how long he was in the air: a long float onto a
    // box top is a soft landing and a short drop off a ledge at pace is not.
    // **A KNOCK-DOWN ALWAYS LANDS HARD**, rather than hoping the arc clears `hardLand`. Those
    // are two unrelated numbers -- the apex is chosen for how it READS and the threshold is
    // about falls -- and coupling them means retuning one silently changes the other.
    // **A KNOCK-DOWN DOES NOT ENTER A LANDING STATE AT ALL (m90).** The fall clip has been
    // running since the blow and it is what draws the arrival; a `landing_hard` on top of it, or
    // a pose switched to here, is the second event that made the old one read as a blend. The
    // ground simply ends the flight, which is `bodyFly`'s own rule one body over.
    if (!p.knock) {
      const hard = p.fallV > MOVE.hardLand;
      p.landHard = hard ? 1 : 0;
      p.landT = 0;
      const nm = hard ? CLIPS.landHard : CLIPS.landSoft;
      p.land = hard ? MOVE.landHard : MOVE.landSoft;
      // the clip is compressed to the beat the STATE lasts, so the two cannot disagree
      playOnce(nm, clipLen(nm) / p.land);
    }
  }
}

// ============================================================================================
// THE WEIGHT TABLE
// ============================================================================================
function rigAnim(dt) {
  const p = player, sp = p.speed, t = {};

  // **WEARING SOMEBODY ELSE, EVERY NAME BELOW IS A CLIP THIS SKIN HAS NEVER HEARD OF (m112)** --
  // and a table that names none of them leaves every bone at zero total weight, which is the
  // T-pose exactly. One early return, and `morphAnim` builds its table out of the KIND's own.
  // **AND WITH ZAP'S POOL ON HIM IT IS THE ORDINARY PATH (m119).** `morphAnim` is the three
  // clips a kind carries of its own; once `mphBorrow` has put zap's 50-odd on the skin, every
  // name below resolves and there is nothing left for a second animation path to do.
  if (p.mphK && !rig.borrowed) { morphAnim(dt); return; }

  if (p.roll) { t[CLIPS.roll] = 1; setWeights(t, dt); return; }
  if (p.melee) { t[p.meleeName] = 1; setWeights(t, dt); return; }
  if (p.chargeGo || p.slam) { t[CLIPS.chargeGo] = 1; setWeights(t, dt); return; }
  // WALL COVER. The entry clip's LAST FRAME is the cover idle -- `clampWhenFinished` holds it,
  // so a pose nobody drew comes for free and the shimmy simply blends over it and back.
  // THE LEDGE, ABOVE THE AIR TEST -- he is deliberately NOT grounded through all of it, so
  // below the air branch `in_air` would take the hang, the mantle and the hop together.
  if (p.ledge) {
    // **WHICH HOP, AND THE SIGN IS DERIVED RATHER THAN GUESSED.** The tangent the move is taken
    // along is `(-nz, nx)`; his forward is `-n`, so his right is `(-fz, fx)` = `(nz, -nx)` --
    // and that tangent is therefore his **LEFT**. It comes out the OPPOSITE way round from the
    // wall cover (m99) and for a reason that is in the clips: `idle_to_wall_cover_right` carries
    // its own half turn and `ledge_hang_idle` does not, which the hand measurement is what says
    // (hands at local +Z rather than -Z). Two surfaces, two answers, one derivation each.
    const nm = p.ledgeSt === 'up' ? LEDGE.clips.up
             : p.ledgeSt === 'hop' ? (p.ledgeSide > 0 ? LEDGE.clips.L : LEDGE.clips.R)
             : LEDGE.clips.hang;
    t[rig.actions[nm] ? nm : LEDGE.clips.hang] = 1;
    setWeights(t, dt); return;
  }
  // AND THE PUSH-OFF READS FOR A MOMENT AFTER HE IS ALREADY IN THE AIR, which is what makes it
  // a shove rather than a release. `wallDrop` has no clip for its own jump and falls straight
  // to `in_air`; this one was drawn, so it is played.
  if (p.ledgeAway > 0 && !p.grounded && !p.melee && !p.roll && rig.actions[LEDGE.clips.away]) {
    t[LEDGE.clips.away] = 1; setWeights(t, dt); return;
  }
  if (p.wall) {
    if (p.wallSt === 'out') { t[WALL.clips.out] = 1; setWeights(t, dt); return; }
    const sh = p.wallSt === 'hold' && p.wallSide ? wallShimmy(p.wallSide) : null;
    if (sh) {
      const r = clamp(Math.abs(p.wallSide) * WALL.speed / WALL.ref, .4, WALL.rateHi);
      setScale(sh.nm, sh.rev ? -r : r);
      t[sh.nm] = 1;
    } else t[WALL.clips.in] = 1;
    setWeights(t, dt); return;
  }
  // **THE GUARD IS NOT HERE, AND THIS IS WHERE IT WOULD HAVE GONE WRONG (m95).** A line sat here
  // that played `CLIPS.block` WHOLE at full weight and RETURNED -- written when the name was empty
  // and it could never fire, so it cost nothing and looked right. The moment the clip landed it
  // would have short-circuited the committed branch six dozen lines down, which is the one built
  // for exactly this: a `SPLIT.up` pose over strafing `__legs`. What that gets you is a statue
  // sliding sideways, with the good path sitting right there unreachable -- m19's shape, two
  // places answering one question, and the one that runs is the worse one.
  // **A BRANCH THAT CANNOT FIRE YET IS NOT A BRANCH THAT WORKS**, and naming a clip is exactly
  // when it stops being free.
  // THE DUCK. One key held at full weight, so the release continues from the frame it is sitting
  // on -- and `setWeights` damps it in, so a hold that ends up being a camera drag reads as a
  // small lean rather than as a twitch.
  if (p.bkOn && rig.actions[CLIPS.backPose]) { t[CLIPS.backPose] = 1; setWeights(t, dt); return; }
  // **THE KNOCK-DOWN OWNS THE BODY THROUGH THE AIR AS WELL (m90).** It has to sit ABOVE the air
  // branch, or `in_air` takes the whole flight and the fall only starts once he has landed --
  // which is the shape that made this read as a blend into a pose. The warriors have always had
  // it this way round: `bodyAnim` only reaches for a body's `clips.air` if the kind names one,
  // and `FOE.clips` does not.
  if (p.knock) {
    const nm = p.gotUp ? HURT.up : HURT.down;
    if (rig.actions[nm]) { t[nm] = 1; setWeights(t, dt); return; }
  }
  // A FLIP IF ONE IS RUNNING -- **and it sits ABOVE the air test (m92)**, because the backflip's
  // first third of a second is spent ON THE FLOOR pushing off. Below it, the gait would take that
  // half and the flip would only appear once he had already left the ground.
  // The rotation is fitted to `AIR.fill` of the flight on purpose, so the last of the air is
  // spent in the ordinary pose aiming the landing rather than still coming round.
  if (p.flip && rig.actions[p.flip]) { t[p.flip] = 1; setWeights(t, dt); return; }
  if (!p.grounded) {
    // `in_air` is 2.83 s of a subtle float and loops, so it reads at any airtime; a jump here
    // is about 0.84 s, so what is seen is its opening third.
    t[CLIPS.air] = 1; setWeights(t, dt); return;
  }
  if (p.land) {
    // FULL WEIGHT UNTIL `landFree`, THEN IT GIVES WAY. Ramping it down from the first frame
    // put the gait at 0.55 through the whole second half, which dilutes exactly the part of a
    // hard landing worth watching -- he comes out of the roll with a run blended over it.
    const nm = p.landHard ? CLIPS.landHard : CLIPS.landSoft;
    const u = clamp(p.landT / p.land, 0, 1), f = MOVE.landFree;
    t[nm] = u < f ? 1 : 1 - (u - f) / (1 - f);
  }
  // THE REACTION TO A BLOW HE STAYED ON HIS FEET FOR. Same shape as the landing and out of the
  // same budget, so the table still sums to exactly 1 -- under it bleeds the BIND pose in.
  // **AND NOT WHILE A LANDING IS ALSO CLAIMING WEIGHT.** Two one-shot layers at full weight sum
  // to 2 and the gait's budget goes negative, which over-applies rather than bleeding the bind
  // pose in -- but it is the same class of fault and it is one clause to close. A landing and a
  // stagger on the same frame is a real overlap, and the landing wins.
  if (p.hurtNm && !p.land && rig.actions[p.hurtNm]) {
    const u = clamp(p.hurtClipT / HURT.stagger, 0, 1), f = MOVE.landFree;
    t[p.hurtNm] = u < f ? 1 : 1 - (u - f) / (1 - f);
  }

  const add = (nm, w, ref) => {
    if (w <= 0) return;
    t[nm] = (t[nm] || 0) + w;
    // `rig.gaitK` is 1 on his own body and the height ratio on a borrowed one -- a reference
    // speed is authored travel TIMES the scale the model is drawn at (m119).
    if (ref) setScale(nm, clamp(sp / (ref * (rig.gaitK || 1)), GAIT.tsLo, GAIT.tsHi));
  };
  // whatever the two one-shot layers above claimed comes out of the budget the gait gets, so
  // the table sums to exactly 1 however many of them are live
  let rest = 1; for (const k in t) rest -= t[k];
  rest = clamp(rest, 0, 1);

  // ---- TURNING ON THE SPOT (m53). *"He just rotates, not moving his feet at all."*
  // **IT TAKES WEIGHT RATHER THAN ADDING IT**, which is the only safe way to put a clip on top
  // of the gait here: the four-clip chain below sums to exactly 1 BY CONSTRUCTION, and a table
  // that goes over or under 1 bleeds the BIND pose in -- the T-pose exactly. So the turn is
  // paid for out of `rest`, the same budget the landing already comes out of, and every branch
  // downstream keeps summing to what it was handed.
  // **IT SITS ABOVE THE BRANCHES ON PURPOSE.** Turning on the spot happens in the ordinary
  // gait AND in the committed one -- squaring up to the camera and pivoting is the case he
  // reported it from -- so computing it once here is what stops it being two copies.
  // **AND IT IS ZERO UNTIL A CLIP IS NAMED**, so today this changes nothing at all.
  {
    const tn = p.turnRate > 0 ? CLIPS.turnL : CLIPS.turnR;   // +X IS HIS LEFT
    const tw = (tn && rig.actions[tn])
      ? GAIT.turnMax * smooth(GAIT.turnAt, GAIT.turnFull, Math.abs(p.turnRate || 0)) *
        (1 - smooth(0, GAIT.turnUpTo, sp))
      : 0;
    if (tw > 0) { add(tn, rest * tw, 0); rest *= 1 - tw; }
  }

  // ---- COMMITTED: the legs strafe, the arms hold the weapon, and neither knows about the
  //      other. Every bone is claimed exactly once, so they compose rather than average.
  if (committed() || p.block || p.center) {
    // **THE GUARD BORROWS THE COMMITTED BRANCH, WHICH IS WHAT IT ALREADY IS**: a body facing
    // forward with its legs answering the thumb sideways. The only difference is which pose the
    // top half holds -- and as of m95 the guard has one, so it IS an override like every other
    // and the `bare` path below is now only ever the empty-handed square-up.
    // BARE MEANS THERE IS NO UPPER POSE TO PUT ON, so the WHOLE strafe clips play rather than
    // their `__legs` halves. Empty-handed there is nothing to hold up by construction.
    const bare = (p.center && !committed()) || (p.block && !(CLIPS.block && rig.actions[CLIPS.block]));
    const up = p.block ? CLIPS.block
             : p.fireT > 0 ? CLIPS.shoot : p.charge ? CLIPS.chargeUp : CLIPS.aimPose;
    const moving = sp > .25;
    // STANDING STILL IS THE WHOLE CLIP, NOT THE HYBRID. The split exists to put a weapon pose
    // on STRAFING legs; standing there are no strafing legs to put it on, and half a running
    // stride held under a pose reads as a man caught mid-step -- which is exactly what it was.
    // The hybrid is for moving left and right and nothing else.
    if (!moving) { add(bare ? CLIPS.idle : up, rest, 0); setWeights(t, dt); return; }
    // the UPPER half: what he is doing with the weapon
    if (!bare) add(rig.actions[up + UP] ? up + UP : up, rest, 0);
    // the LOWER half: which way he is travelling RELATIVE TO HIS NOSE, because he is facing
    // the target and "how fast" no longer picks the clip -- "which way" does.
    const L = n => (!bare && rig.actions[n + LEGS] ? n + LEGS : n);
    {
      const rel = wrapAngle(Math.atan2(p.vel.x, p.vel.z) - p.faceH);
      const c = Math.cos(rel), sn = Math.sin(rel);
      const fwd = Math.abs(c), lat = Math.abs(sn), tot = fwd + lat || 1;
      if (c >= 0) add(L(bare ? CLIPS.run : CLIPS.aimRun), rest * fwd / tot, bare ? GAIT.runRef : GAIT.aimRunRef);
      else add(L(CLIPS.back), rest * fwd / tot, GAIT.backRef);
      // +X IS HIS LEFT. Heading grows from +Z toward +X and his right is (-fz, fx), so a
      // POSITIVE sine is a strafe to the LEFT. Written down because that argument comes out
      // backwards half the time, and the strafe clips are picked by its sign.
      add(L(sn >= 0 ? CLIPS.strafeL : CLIPS.strafeR), rest * lat / tot, GAIT.strafeRef);
    }
    setWeights(t, dt); return;
  }

  // ---- carrying it, but not committed: the ordinary armed gait, whole body ----
  if (gunOut()) {
    // CARRYING IT: the rifle idle standing, the rifle run moving. There is no rifle WALK in
    // the set, so the run takes the whole moving range and `tsLo` holds it down at the bottom.
    const wMove = smooth(0, GAIT.walkAt * 2.2, sp);
    add(CLIPS.aimIdle, rest * (1 - wMove), 0);
    add(p.fireT > 0 ? CLIPS.aimRunShoot : CLIPS.aimRun, rest * wMove, GAIT.aimRunRef);
    setWeights(t, dt); return;
  }

  // ---- the ordinary gait: four clips weighted by MEASURED speed, never a run flag ----
  // A CHAIN, SO THE FOUR ALWAYS SUM TO EXACTLY 1. `idleAt` is its own edge now rather than
  // sharing `walkAt`, which is what lets the walk own a real stretch of the pad while the idle
  // still lets go promptly -- and a table that dips below 1 mid-crossfade bleeds the BIND pose
  // in, which is the T-pose exactly.
  const A = smooth(0, GAIT.idleAt, sp);                 // moving at all
  const B = smooth(GAIT.walkAt, GAIT.runAt, sp);        // walk -> run
  const C = smooth(GAIT.runAt, GAIT.sprintAt, sp);      // run -> sprint
  const wIdle = 1 - A, wWalk = A * (1 - B), wRun = A * B * (1 - C), wSpr = A * B * C;
  // **AND THE REACH IS AN UPPER-BODY OVERRIDE OVER EXACTLY THIS (m91).** `weapon_swap__up` is
  // spine-up ONLY and the four gait clips drop to their `__legs` halves, so between them every
  // bone is claimed exactly once and they COMPOSE -- he walks with his legs and reaches with his
  // arms. **The two at full `rest` summing to 2 is correct here and only here**: they are
  // disjoint. Averaging two clips that both key an arm is what m19 paid a build for.
  // **AND THE CARRY AND THE THROW ARE THE SAME SLOT (m96).** Three things now want the top half
  // over a walking pair of legs -- the reach, the hold and the throw -- and they are mutually
  // exclusive by construction (you cannot throw what you are not carrying, and a swap is refused
  // while carrying). One override with a priority, rather than three branches that would each
  // have to know about the other two.
  const upNm = p.swap ? CLIPS.swap : '';
  const sw = upNm && rig.actions[upNm + UP];
  if (sw) add(upNm + UP, rest, 0);
  const L = n => (sw && rig.actions[n + LEGS] ? n + LEGS : n);
  add(L(CLIPS.idle), wIdle * rest, 0);
  add(L(CLIPS.walk), wWalk * rest, GAIT.walkRef);
  add(L(CLIPS.run), wRun * rest, GAIT.runRef);
  add(L(CLIPS.sprint), wSpr * rest, GAIT.sprintRef);
  setWeights(t, dt);
}

// ============================================================================================
// POINTING THE GUN STRAIGHT AHEAD
//
// *"He's supposed to be always pointing straight ahead... when it charges it doesn't need to
// move at all, but when he releases it's supposed to kick up and he's supposed to move back."*
//
// THREE SPINE TWISTS WENT INTO THIS AND ALL THREE MADE IT WORSE, SO THE MECHANISM IS GONE.
// m16 read the parent frame off a SCALED `matrixWorld`, which returns a non-unit quaternion, so
// the conjugation was a shear and it hunched him. m17 fixed that -- and the correction promptly
// wound up to its own clamp and parked there, because `aimUntwist` + `mixer.update` wipe the
// edit before `barrelH` measures again, so the integrator never once saw its own output. m18
// closed that in closed form and it STILL swung, because three's world matrices are a frame
// stale at that point, so the reading carried the previous frame's correction after all --
// which is exactly *"his gun starts out pointing to the right and he moves it across his chest
// all the way to the left"*. Each fix was real and each one uncovered the next: **a per-bone
// edit whose own effect feeds the thing that measures it has no version that is simply right.**
//
// **SO THE BODY TURNS, NOT THE SPINE.** How far the pose holds the weapon off his nose is a
// RIGID property of that pose, so undoing it is a rigid yaw on the ROOT: one number, no
// conjugation, no bone to unravel, nothing to take off again before the mixer writes -- and it
// cannot shear anything, because a root yaw is the same turn every bone was already getting.
//
// AND IT IS MEASURED WITH NO LOOP IN IT. `barrelH` returns a WORLD bearing and the comp is part
// of the root yaw that produced it, so subtracting the yaw THAT FRAME WAS ACTUALLY DRAWN AT
// removes the comp exactly. `bias` is therefore invariant to the comp -- it is the pose's own
// offset and nothing else, which is the one thing an integrator on the spine could never be
// told. `rig.drawnYaw` is stored where it is written rather than recomputed here, because a
// frame-stale reading against a freshly written yaw is the whole bug this note is about.
// ============================================================================================
const POSE = {
  // A CEILING, not a number it lives at. Measured off the real clips, `shoot` holds the weapon
  // 18 deg off his nose and `rifle_run` holds it dead straight, so this can only ever stop
  // something going wrong.
  max: .70,
  // a half-life, not a gain: the target is exact, so all this decides is how fast he gets there
  half: .07,
  on: 1,
};
const _wa = new THREE.Vector3(), _wb = new THREE.Vector3();
// THE BARREL'S OWN WORLD BEARING. The two mount markers are exactly two points on it, so
// nothing about where the gun points is typed here -- and `weapon_tip` being the mount's AXIS
// marker rather than the muzzle is all this needs it to be.
function barrelH() {
  const w = WEAP.worn[slotNow().key];
  const host = w && w.host; if (!host) return null;
  let tip = null;
  for (const c of host.children) if (/tip/.test(c.name)) tip = c;
  if (!tip) return null;
  host.getWorldPosition(_wa); tip.getWorldPosition(_wb);
  const dx = _wb.x - _wa.x, dz = _wb.z - _wa.z;
  if (dx * dx + dz * dz < 1e-8) return null;
  return Math.atan2(dx, dz);
}
// How far the POSE holds the weapon off his nose, in his own frame -- read fresh every frame so
// it tracks the recoil and survives a re-export, and free of the comp by construction.
function poseBias() {
  if (rig.drawnYaw == null) return null;
  const bh = barrelH();
  return bh == null ? null : wrapAngle(bh - rig.drawnYaw);
}
// The rigid yaw that puts the barrel down his nose. RETURNED rather than applied, so there is
// exactly one place in the file the root's rotation is written.
function aimComp(dt) {
  const p = player;
  let tgt = 0;
  // GUN ONLY. `committed()` also covers the hammer being wound, and the melee wind-up is a
  // deliberately BLADED stance -- *"he's kind of in a sideways ninja stance and that's all
  // good"* -- so pointing the hammer down his nose would straighten out the one pose he likes.
  if (POSE.on && gunOut() && committed()) {
    // AND IT HOLDS THROUGH THE RECOIL. The bolt has already left on the bearing it left on, and
    // re-aiming underneath the follow-through swings the gun during the one beat that is meant
    // to be held still.
    if (p.fireT > 0) tgt = p.compHold || 0;
    else {
      const b = poseBias();
      p.bias = b;
      if (b != null) tgt = clamp(-b, -POSE.max, POSE.max);
      p.compHold = tgt;
    }
  } else p.bias = null;
  p.comp = damp(p.comp || 0, tgt, POSE.half, dt);
  return p.comp;
}

// ============================================================================================
// THE CHAIN SOLVER
// ============================================================================================
// FIND THEM. An unbranched run of bones that no clip meaningfully moves. Returns chain roots
// with their bone lists; the CALLER decides what to do with the tracks.
function findChains(root, clips) {
  const move = {};                       // worst rotation any clip puts on each bone, radians
  for (const c of clips) for (const t of c.tracks) {
    if (!/\.quaternion$/.test(t.name)) continue;
    const nm = t.name.slice(0, t.name.lastIndexOf('.')), v = t.values, n = v.length / 4;
    let w = 0;
    for (let i = 1; i < n; i++) {
      let d = 0; for (let k = 0; k < 4; k++) d += v[k] * v[i * 4 + k];
      // **2*acos(|dot|), NOT A COMPONENT DELTA.** q and -q are the same rotation, so a
      // component swinging -1 to +1 reads as a delta of 2 and is a sign flip.
      w = Math.max(w, 2 * Math.acos(Math.min(1, Math.abs(d))));
    }
    move[nm] = Math.max(move[nm] || 0, w);
  }
  const inert = b => (move[b.name] || 0) < CHAIN.inert;
  const out = [];
  root.traverse(b => {
    if (!b.isBone || !inert(b)) return;
    // a chain ROOT is an inert bone whose parent is not an inert single-child bone
    const p = b.parent;
    if (p && p.isBone && inert(p) && p.children.filter(c => c.isBone).length === 1) return;
    const bones = [];
    let c = b;
    while (c && c.isBone && inert(c)) {
      bones.push(c);
      const kids = c.children.filter(k => k.isBone);
      c = kids.length === 1 ? kids[0] : null;
    }
    if (bones.length >= CHAIN.minBones) out.push(bones);
  });
  return out;
}

const _cv = new THREE.Vector3(), _cw = new THREE.Vector3(), _cq = new THREE.Quaternion();
const _cp = new THREE.Quaternion(), _cd = new THREE.Vector3(), _ch = new THREE.Vector3();
const _ci = new THREE.Quaternion(), _cpv = new THREE.Vector3();
// BUILD the particle state. World-space points at each bone's head, plus one virtual TIP so the
// last bone has a direction of its own -- without it the final bone is dead weight.
function chainInit(skin, clips) {
  const model = skin.model;
  model.updateMatrixWorld(true);
  const sets = findChains(model, clips);
  skin.chains = [];
  for (const bones of sets) {
    const kind = CHAIN.kinds.find(k => k.test.test(bones[0].name)) || CHAIN.def;
    const pts = [], prev = [], rest = [];
    for (const b of bones) { const v = new THREE.Vector3(); b.getWorldPosition(v); pts.push(v); prev.push(v.clone()); }
    // the tip: carry the last segment on by its own length
    const n = bones.length;
    const tip = pts[n - 1].clone().add(_cv.copy(pts[n - 1]).sub(pts[n - 2]));
    pts.push(tip); prev.push(tip.clone());
    for (let i = 0; i < n; i++) rest.push(pts[i].distanceTo(pts[i + 1]));
    // each bone's rest direction IN ITS OWN LOCAL SPACE -- where the chain runs before anything
    // touches it, which is what the solve rotates FROM. Never typed, never an assumed axis.
    const axis = [];
    for (let i = 0; i < n; i++) {
      const child = i + 1 < n ? bones[i + 1] : null;
      const v = child ? child.position.clone() : new THREE.Vector3(0, rest[i] / (bones[i].getWorldScale(_cv).x || 1), 0);
      if (v.lengthSq() < 1e-12) v.set(0, 1, 0);
      axis.push(v.normalize());
    }
    skin.chains.push({ bones, pts, prev, rest, axis, kind,
                       // where every particle sat BEFORE the constraint pass, so the velocity a
                       // correction is allowed to create can be metered -- see `CHAIN.snap`
                       pre: pts.map(v => v.clone()),
                       home: bones.map(b => b.quaternion.clone()) });
  }
  // the body hulls, resolved to real bones once
  skin.hulls = [];
  // the radii are FRACTIONS OF HER HEIGHT, so a re-export at any size still fits. `skin.tall`
  // is the world height the caller measured; nothing here is in the file's own units.
  const H = skin.tall || 1.75;
  for (const h of CHAIN.hulls) {
    let b = null; model.traverse(o => { if (!b && o.isBone && h.bone.test(o.name)) b = o; });
    if (b) skin.hulls.push({ b, r: h.r * H, up: h.up * H });
  }
  skin.chainT = 0;
  console.log('[melee] chains: ' + skin.chains.length + ' (' +
              skin.chains.map(c => c.bones[0].name + ':' + c.bones.length).join(' ') + ')');
  return skin.chains.length;
}

// ONE SUBSTEP of Verlet + constraints, then the bones are written from the points.
function chainStep(skin, dt) {
  if (!CHAIN.on || !skin.chains || !skin.chains.length) return;
  // **A FIXED SUBSTEP.** Verlet is unstable under a varying dt, and without this a 120 Hz phone
  // plays different hair from a 30 Hz one.
  const h = 1 / CHAIN.hz;
  skin.chainT = Math.min(skin.chainT + dt, h * CHAIN.maxSub);
  let subs = 0;
  while (skin.chainT >= h && subs < CHAIN.maxSub) { skin.chainT -= h; subs++; }
  if (!subs) { chainWrite(skin); return; }

  // where the hulls are THIS frame
  for (const H of skin.hulls) { H.b.getWorldPosition(_cv); H.x = _cv.x; H.y = _cv.y + H.up; H.z = _cv.z; }

  for (let sub = 0; sub < subs; sub++) {
    for (const C of skin.chains) {
      const { bones, pts, prev, rest, kind, pre } = C, n = bones.length;
      // **PARTICLE 0 IS PINNED TO THE SKELETON**, which is the whole mechanism: it goes exactly
      // where her head goes, and everything behind it arrives late.
      _cpv.copy(pts[0]);
      bones[0].getWorldPosition(pts[0]); prev[0].copy(pts[0]);
      // how far the pin itself moved this substep. The speed cap below is measured against it,
      // so running never clamps a strand and only hair moving fast through HER frame is held.
      _cpv.subVectors(pts[0], _cpv);
      const cap = CHAIN.maxV * h;
      // per SECOND, converted to this substep -- see the note on `CHAIN.kinds`. The drag is
      // `2*sqrt(stiff) * damping`, which is critical damping scaled, so the two can never
      // drift apart when one of them is tuned.
      for (let i = 1; i <= n; i++) {
        const u = (i - 1) / Math.max(1, n - 1);
        const k = lerp(kind.stiff, kind.tipStiff, u);
        // **THE DAMPING IS AGAINST THE SPRING THIS ACTUALLY IS, AND `2*sqrt(k)` WAS NOT IT.**
        // `k` is a per-second RELAXATION RATE for the pull below, not a spring constant in
        // 1/s^2 -- and in Verlet a positional pull of fraction `a` IS an acceleration of
        // `a/h^2`, so the natural frequency is `sqrt(a)/h` and not `sqrt(k)`. At 90 Hz that is
        // 21 rad/s on a hair root rather than 2.2, so every particle was running at about
        // TWELVE PER CENT of critical damping -- a spring that rings for eight cycles, which
        // is the wiggle exactly. `c*h` then cancels the h: `2*sqrt(a)*ratio`.
        const a = 1 - Math.exp(-k * h);
        const damp = Math.exp(-2 * Math.sqrt(a) * kind.damping);
        const p = pts[i], q = prev[i];
        let vx = (p.x - q.x) * damp, vy = (p.y - q.y) * damp, vz = (p.z - q.z) * damp;
        // clamp the part that is NOT the body's own travel
        let rx = vx - _cpv.x, ry = vy - _cpv.y, rz = vz - _cpv.z;
        const rl = Math.sqrt(rx * rx + ry * ry + rz * rz);
        if (rl > cap) { const f = cap / rl; rx *= f; ry *= f; rz *= f; }
        vx = rx + _cpv.x; vy = ry + _cpv.y; vz = rz + _cpv.z;
        q.copy(p);
        p.set(p.x + vx, p.y + vy + kind.g * h * h, p.z + vz);
      }
      // **THE SPRING PULLS TOWARD THE *POSE*, AND THE POSE HAS TO BE RE-DERIVED.** Reading the
      // bones' current world positions would be springing toward the solver's OWN last output,
      // which is a no-op dressed up as stiffness -- the bones are carrying what this function
      // wrote last frame, not the authored rest. So the home chain is walked forward from the
      // pin with the HOME locals: the parent's world rotation, then each bone's rest quaternion
      // and rest length in turn. That is what the chain would look like with no dynamics, and
      // it is the only honest thing to pull back to.
      bones[0].parent.getWorldQuaternion(_cq);
      _ch.copy(pts[0]);
      for (let i = 0; i < n; i++) {
        _cq.multiply(C.home[i]);
        _cd.copy(C.axis[i]).applyQuaternion(_cq).normalize().multiplyScalar(rest[i]);
        _ch.add(_cd);
        const k = lerp(kind.stiff, kind.tipStiff, i / Math.max(1, n - 1));
        // this fraction IS the `a` the drag above derives its frequency from -- same k, same
        // particle, same expression -- so retuning a stiffness moves both halves together
        pts[i + 1].lerp(_ch, 1 - Math.exp(-k * h));
      }
      for (let i = 1; i <= n; i++) pre[i].copy(pts[i]);
      for (let it = 0; it < CHAIN.iters; it++) {
        for (let i = 0; i < n; i++) {
          const a = pts[i], b = pts[i + 1];
          _cd.copy(b).sub(a);
          const d = _cd.length() || 1e-6;
          // the head of each segment is already settled, so the whole correction goes on the
          // tail -- walking root to tip means one pass is nearly enough
          b.addScaledVector(_cd, (rest[i] - d) / d);
        }
        // and out of the body
        for (const H of skin.hulls) {
          for (let i = 1; i <= n; i++) {
            const p = pts[i], dx = p.x - H.x, dy = p.y - H.y, dz = p.z - H.z;
            const l2 = dx * dx + dy * dy + dz * dz;
            if (l2 >= H.r * H.r || l2 < 1e-9) continue;
            const l = Math.sqrt(l2), k = H.r / l;
            p.set(H.x + dx * k, H.y + dy * k, H.z + dz * k);
          }
        }
      }
      // **METER THE CORRECTION.** `prev` is what the next substep reads its velocity from, so
      // moving `prev` with the particle is how a projection is stopped from being banked as
      // speed. At `snap` 1 nothing moves and every correction rings on; at 0 the constraints
      // are pure position and add no energy whatever.
      const keep = 1 - CHAIN.snap;
      if (keep > 0) for (let i = 1; i <= n; i++) {
        const p = pts[i], q = prev[i], b = pre[i];
        q.set(q.x + (p.x - b.x) * keep, q.y + (p.y - b.y) * keep, q.z + (p.z - b.z) * keep);
      }
    }
  }
  chainWrite(skin);
}

// TURN THE POINTS BACK INTO BONE ROTATIONS. Root to tip, updating each matrix as we go, or the
// next bone reads a parent frame that is one bone stale.
function chainWrite(skin) {
  for (const C of skin.chains) {
    const { bones, pts, axis, kind } = C, n = bones.length;
    for (let i = 0; i < n; i++) {
      const b = bones[i];
      // **`getWorldQuaternion`, NEVER `setFromRotationMatrix(matrixWorld)`.** Her armature is
      // scaled, and three's own source says the trace formula assumes an UNSCALED matrix -- fed
      // a scaled one it returns a non-unit quaternion and the result is a shear, which is the
      // m17 bug that hunched the alien over.
      b.parent.getWorldQuaternion(_cp);
      _cd.copy(pts[i + 1]).sub(pts[i]);
      if (_cd.lengthSq() < 1e-10) continue;
      _cd.normalize();
      // the world direction this bone's own axis currently points, from the PARENT's frame and
      // the bone's home rotation -- so the solve is relative to the pose, not to the world
      _cw.copy(axis[i]).applyQuaternion(C.home[i]).applyQuaternion(_cp).normalize();
      _cq.setFromUnitVectors(_cw, _cd);
      // **A CONE, so a chain cannot fold back through itself.** Verlet has no notion of a joint
      // limit and a segment that inverts reads as a broken bone rather than as hair.
      // **AND IT HAS TO BE CANONICALISED FIRST.** q and -q are the same rotation, so on the far
      // side of w = 0 the stored axis is flipped too -- clamping to `-cone` about an already
      // flipped axis negates twice and the joint SNAPS the wrong way. That is the "glitchy"
      // half of his report, and it is the same q/-q trap this file already has a note about one
      // measurement over. Flip all four components, then the angle is always in [0, pi].
      if (_cq.w < 0) { _cq.x = -_cq.x; _cq.y = -_cq.y; _cq.z = -_cq.z; _cq.w = -_cq.w; }
      const ang = 2 * Math.acos(Math.min(1, _cq.w));
      if (ang > kind.cone) {
        _cv.set(_cq.x, _cq.y, _cq.z);
        if (_cv.lengthSq() < 1e-12) _cv.set(0, 1, 0);
        _cq.setFromAxisAngle(_cv.normalize(), kind.cone);
      }
      // q_local = inv(parentWorld) * delta * parentWorld * home.  The bone's world rotation at
      // HOME is `P * home`, `delta` turns its axis onto the solved direction in world space, so
      // the new world rotation is `delta * P * home` and the local is that with P taken off.
      // A SCRATCH, not a clone: 138 bones x 60 Hz is 8,000 quaternions a second to collect.
      _ci.copy(_cp).invert();
      b.quaternion.copy(_cp).premultiply(_cq).premultiply(_ci).multiply(C.home[i]);
      b.updateMatrixWorld(true);
    }
  }
}

// ============================================================================================
// THE FEMALE ALIEN -- a body to watch the chains on
// ============================================================================================
let she = null;
function buildShe(g) {
  const model = g.scene;
  // scale MEASURED off the geometry, never typed
  let lo = Infinity, hi = -Infinity;
  model.traverse(o => {
    if (!o.isSkinnedMesh || !o.geometry) return;
    o.geometry.computeBoundingBox();
    lo = Math.min(lo, o.geometry.boundingBox.min.y); hi = Math.max(hi, o.geometry.boundingBox.max.y);
  });
  const authored = hi - lo, scale = authored > .01 ? SHE.h / authored : 1;

  model.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) {
      if (!m.isMeshStandardMaterial) continue;
      // **THE EXPORT IS FINE AND THE `alphaTest` WAS MINE.** Read straight out of the file:
      // metallic 0, roughness 0.9, one base colour texture, NO normal map, a grey
      // `KHR_materials_specular` -- there is nothing wrong in there. What `alphaTest .5` does
      // to a texture whose alpha is NOT a cutout mask is punch holes through her, and what you
      // see through a hole is the inside of her far surface. That is *"like I'm seeing the back
      // of the normals"* exactly, and it survived m29 because m29 only took back the sidedness.
      // **A FIX THAT IS NOT JUSTIFIED BY A MEASUREMENT IS A SECOND BUG**, and this is the third
      // time in two builds I have changed two things about her material at once.
      // What DOES stay: `BLEND` is the exporter default whenever a texture carries an alpha
      // channel at all, and a transparent skin sorts against ITSELF -- her far side drawing
      // over her near side. With the alpha opaque that flag buys nothing and risks that, so it
      // comes off. Nothing else about the material is touched.
      if (m.transparent) { m.transparent = false; m.depthWrite = true; }
      m.alphaTest = SHE.alphaTest;                 // 0. Raise it only if she needs cut-out hair.
      if (SHE.side === 'front') m.side = THREE.FrontSide;
      else if (SHE.side === 'double') m.side = THREE.DoubleSide;
      if (m.map) { m.emissiveMap = m.map; m.emissive = new THREE.Color(0xffffff); }
      m.emissiveIntensity = RIG.emissive;
    }
  });
  model.scale.setScalar(scale);
  const root = new THREE.Group();
  root.add(model);
  // ON THE GROUND SHE IS ACTUALLY ON (m127). Zero is right on a white floor and is a woman
  // buried in a kerb anywhere else; `stepShe` tracks the slope from wherever she starts.
  root.position.set(SHE.path[0][0], groundAt(SHE.path[0][0], SHE.path[0][1], 0, MOVE.step), SHE.path[0][1]);
  scene.add(root);
  model.updateMatrixWorld(true);

  const pb = {}; model.traverse(o => { if (o.isBone) pb[o.name] = o; });
  const faceOff = -measureFacing(pb);
  let clips = normaliseClips(g.animations || []).filter(c => !SHE.drop.test(c.name));

  she = { root, model, mixer: new THREE.AnimationMixer(model), actions: {}, clips: {}, cw: {},
          faceOff, h: 0, wp: 1, speed: 0, tall: SHE.h, chains: null, hulls: [], chainT: 0 };
  // FIND THE CHAINS BEFORE THE TRACKS ARE STRIPPED -- "no clip moves it" is the test, so the
  // clips have to still have the tracks when it is asked.
  chainInit(she, clips);
  const own = new Set();
  for (const C of she.chains) for (const b of C.bones) own.add(b.name);
  // **AND NOW STRIP THEM.** They are keyed at their rest value, so the mixer would write that
  // rest pose onto every chain bone every frame and fight the solver for the same bones -- two
  // writers, which this file has paid for twice. It also takes 405 of her 579 channels out of
  // the mixer, which is most of her per-frame cost for bones that hold still.
  let cut = 0;
  clips = clips.map(c => {
    const keep = c.tracks.filter(t => !own.has(t.name.slice(0, t.name.lastIndexOf('.'))));
    cut += c.tracks.length - keep.length;
    return keep.length === c.tracks.length ? c : new THREE.AnimationClip(c.name, c.duration, keep);
  });

  for (const c of clips) {
    she.clips[c.name] = c;
    const a = she.mixer.clipAction(c);
    a.enabled = true; a.setEffectiveWeight(0); a.play();
    she.actions[c.name] = a;
  }
  console.log('[melee] she: ' + authored.toFixed(4) + ' m authored -> x' + scale.toFixed(3) +
              ', ' + clips.length + ' clips, ' + cut + ' chain channels stripped');
}

// THE CIRCUIT. Straight lines show nothing -- it is the TURNS that throw the hair, so the path
// is a loop with real corners in it and the long sides are run.
function stepShe(dt) {
  if (!she) return;
  const w = SHE.path[she.wp], p = she.root.position;
  const dx = w[0] - p.x, dz = w[1] - p.z, d = Math.hypot(dx, dz);
  if (d < SHE.at) { she.wp = (she.wp + 1) % SHE.path.length; }
  const tgt = Math.atan2(dx, dz);
  she.h += clamp(wrapAngle(tgt - she.h), -SHE.turn * dt, SHE.turn * dt);
  // she slows through a corner, which is what makes the corner read as one
  const off = Math.abs(wrapAngle(tgt - she.h));
  const want = (w[2] === 'run' ? SHE.runRef : SHE.walkRef) * (1 - .55 * smooth(.25, 1.4, off)) * (she.go === 0 ? 0 : 1);
  she.speed = damp(she.speed, want, .22, dt);
  p.x += Math.sin(she.h) * she.speed * dt;
  p.z += Math.cos(she.h) * she.speed * dt;
  p.y = groundAt(p.x, p.z, p.y, MOVE.step);
  she.root.rotation.y = she.h + she.faceOff;
  if (she.spin) she.root.rotation.y = (she.h += she.spin * dt) + she.faceOff;

  // the gait: her own two measured references, so the feet never slide
  const sp = she.speed, t = {};
  const A = smooth(0, SHE.walkRef * .5, sp), B = smooth(SHE.walkRef * 1.45, SHE.runRef * .95, sp);
  t[SHE.clips.idle] = 1 - A;
  t[SHE.clips.walk] = A * (1 - B);
  t[SHE.clips.run] = A * B;
  const sc = (nm, ref) => { const a = she.actions[nm]; if (a) a.setEffectiveTimeScale(clamp(sp / ref, .55, 1.7)); };
  sc(SHE.clips.walk, SHE.walkRef); sc(SHE.clips.run, SHE.runRef);
  skinWeights(she, t, dt, null, SHE.clips.idle);
  she.mixer.update(dt);
  // AFTER the mixer, because the solver OWNS those bones and the mixer must not be the last
  // writer on them -- and because the pin reads where the skeleton actually ended up.
  chainStep(she, dt);
}
