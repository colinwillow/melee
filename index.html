<!-- =====================================================================
     THE CRASH TRAP IS THE FIRST THING IN THE HEAD, BEFORE THE IMPORT MAP AND
     BEFORE THE MODULE. A phone has no console, so an exception is a blank
     screen and six builds of "it's stuck on the loading screen" that nobody
     can tell apart. Registered with CAPTURE, because a subresource that 404s
     fires `error` at its own element and never bubbles -- that includes a
     module that fails to PARSE and an import that never resolves, which are
     exactly the failures a trap installed later cannot see.
     ===================================================================== -->
<script>
(function () {
  var box = null;
  function show(msg) {
    try {
      if (!box) {
        box = document.createElement('div');
        box.id = 'crash';
        document.documentElement.appendChild(box);
      }
      box.style.display = 'block';
      box.textContent = (box.textContent ? box.textContent + '\n\n' : '') + msg;
    } catch (e) {}
  }
  window.__crash = show;
  addEventListener('error', function (e) {
    if (e && e.target && e.target !== window && e.target.src !== undefined) {
      show('FAILED TO LOAD\n' + (e.target.src || e.target.href || e.target.tagName));
      return;
    }
    show((e.message || 'error') + '\n@ ' + (e.filename || '?') + ':' + (e.lineno || '?') + ':' + (e.colno || '?'));
  }, true);
  addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    show('UNHANDLED REJECTION\n' + ((r && (r.stack || r.message)) || String(r)));
  });
})();
</script>

<!-- =====================================================================
     NO ZOOMING -- AND `touch-action` IS NOT THE FIX FOR DOUBLE TAP.
     iOS Safari has ignored `user-scalable=no` since iOS 10 and decides the
     double-tap gesture off the touch stream itself, so the touch stream is
     where it has to be refused. Pinch is a separate, non-standard event
     family that `touch-action` does not cover at all, dispatched AT the
     element -- so those three are listened for with CAPTURE, on document as
     well as window, or a listener that only sees them bubbling can be
     stopped before it ever runs.
     Its own script, NOT the module: a guard that installs when the game has
     finished loading is absent for the whole of the loading screen, and
     absent entirely if the module throws -- which is precisely when somebody
     starts jabbing at a page that is not responding.
     ===================================================================== -->
<script>
(function () {
  var lastT = 0, lastX = 0, lastY = 0;
  var interactive = /^(BUTTON|A|INPUT|SELECT|TEXTAREA|LABEL)$/;
  addEventListener('touchend', function (e) {
    var t = e.changedTouches && e.changedTouches[0]; if (!t) return;
    var now = e.timeStamp || Date.now();
    var el = e.target;
    // A REAL CONTROL IS LET THROUGH. `preventDefault` here would cancel its synthesised
    // click, and Safari does not zoom on a target it already treats as interactive -- so a
    // button loses its second press by being guarded and loses nothing by being exempt.
    var ok = true;
    for (var n = el; n && n !== document; n = n.parentNode) {
      if (n.tagName && interactive.test(n.tagName)) { ok = false; break; }
    }
    // WITHIN 400 ms *AND* WITHIN 40 px. Two deliberate taps in different places are two
    // taps, and a game gets those constantly.
    if (ok && now - lastT < 400 && Math.abs(t.clientX - lastX) < 40 && Math.abs(t.clientY - lastY) < 40) {
      e.preventDefault();
    }
    lastT = now; lastX = t.clientX; lastY = t.clientY;
  }, { passive: false });
  var kill = function (e) { e.preventDefault(); };
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    addEventListener(t, kill, { passive: false, capture: true });
    document.addEventListener(t, kill, { passive: false, capture: true });
  });
  addEventListener('dblclick', kill, { passive: false });
})();
</script>

<style>
/* THE PAGE IS PINNED, not merely `overflow:hidden`. On iOS that alone still lets a drag
   rubber-band the document and leaves the canvas off-centre, and a page that cannot be
   scrolled is a page with less for a stray gesture to act on. */
:root {
  --hot: #ff4d6d; --sun: #ffc247; --sky: #46e0ff; --ink: #0b0d12;
  --ui: 'Barlow Condensed', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --disp: 'Bungee', var(--ui);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  position: fixed; inset: 0; margin: 0; padding: 0; overflow: hidden;
  background: var(--ink); color: #fff; font-family: var(--ui);
  touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

/* ---- the crash overlay: above everything, monospaced and SELECTABLE so it can be
        copied or read out. A message that cannot be read is a message that does not exist. ---- */
#crash {
  display: none; position: fixed; inset: 0; z-index: 999; overflow: auto;
  padding: 18px 14px; margin: 0; background: rgba(8, 4, 10, .94);
  color: #ff8fa3; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
  white-space: pre-wrap; word-break: break-word;
  -webkit-user-select: text; user-select: text;
}

/* ---- boot card ---- */
#boot {
  position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  background: radial-gradient(120% 90% at 50% 30%, #1b2233 0%, #0b0d12 70%);
  transition: opacity .5s ease; padding: 24px;
}
#boot.gone { opacity: 0; pointer-events: none; }
#boot h1 { font-family: var(--disp); font-size: 30px; letter-spacing: .02em; margin: 0; color: var(--sky); }
#boot .msg { font-size: 15px; letter-spacing: .09em; text-transform: uppercase; opacity: .78; min-height: 20px; text-align: center; }
#boot .bar { width: min(76vw, 320px); height: 5px; border-radius: 3px; background: #ffffff1c; overflow: hidden; }
#boot .bar i { display: block; height: 100%; width: 0; background: var(--sky); transition: width .25s ease; }
#boot .bld { font-family: var(--disp); font-size: 13px; color: var(--sun); letter-spacing: .06em; }

/* ---- HUD ---- */
.chip {
  position: fixed; z-index: 4; font-size: 13px; letter-spacing: .05em;
  color: #cfe8ff; text-shadow: 0 1px 0 #000a; pointer-events: none;
}
#build { top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
  max-width: calc(100vw - 140px); }
#build b { font-family: var(--disp); font-size: 26px; color: var(--sky); display: block; line-height: 1; }
#build i { font-style: normal; opacity: .8; font-size: 12px; }
#wep { top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
  font-family: var(--disp); font-size: 15px; color: var(--sun); text-align: right; }
#wep small { display: block; font-family: var(--ui); font-size: 11px; color: #cfe8ff; opacity: .7; letter-spacing: .08em; }

/* ---- the pads ---- */
.pad {
  position: fixed; z-index: 5; width: 132px; height: 132px; border-radius: 50%;
  border: 2px solid #ffffff24; background: #ffffff0c; touch-action: none;
  bottom: calc(26px + env(safe-area-inset-bottom));
}
.pad.act { background: #ffffff16; border-color: #ffffff40; }
#padL { left: calc(20px + env(safe-area-inset-left)); }
#padR { right: calc(20px + env(safe-area-inset-right)); }
.knob {
  position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
  border-radius: 50%; background: #ffffff2e; border: 2px solid #ffffff4a;
  will-change: transform;
}
#padR .knob { background: #46e0ff2e; border-color: #46e0ff66; }
/* the aim ring: dim whenever the weapon is out, bright while the trigger is armed. A pad
   that looks identical armed and unarmed is a control nobody finds. */
#padR::after {
  content: ''; position: absolute; inset: -9px; border-radius: 50%;
  border: 2px solid var(--sun); opacity: 0; transition: opacity .16s ease;
}
#padR.arm::after { opacity: .9; }
#padR.ready::after { opacity: .28; }
/* ---- the reticle: a geometric portal ----
   IT WAS BIG AND THICK AND THE COLOURS WERE A GUESS. Size, stroke weight and both hues are
   custom properties now, so `mel.retic({...})` moves all of it live on the phone -- how a mark
   should look is a look-at-it decision and those do not belong in a commit. */
#retic {
  position: fixed; z-index: 3; left: 0; top: 0;
  --size: 74px;                /* 210 -> 146 -> 74. A mark is a POINTER: at 146 it covered a
                                  man at twenty metres, which is the one thing it must not do. */
  --w: 1;                      /* stroke weight multiplier */
  --h: 196;                    /* the hue it rests at -- azure */
  --lh: 34;                    /* and the one it locks at -- amber */
  width: var(--size); height: var(--size);
  margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2);
  pointer-events: none; opacity: 0; transition: opacity .14s ease;
  --c: 0;                      /* charge, 0..1 -- the only thing the frame loop writes */
  --gl: hsl(var(--h) 100% 60%);
  --r1: hsl(var(--h) 80% 74%); --r2: hsl(var(--h) 92% 68%); --r3: hsl(var(--h) 100% 62%);
  --r4: hsl(var(--h) 100% 80%); --r5: hsl(var(--h) 100% 92%);
  /* the neon is two drop-shadows, which is what makes a stroke read as a lit tube rather than
     as a drawn line. One small element, so it costs nothing and it runs on the compositor. */
  filter: drop-shadow(0 0 3px var(--gl)) drop-shadow(0 0 9px var(--gl));
}
#retic.on { opacity: 1; }
/* LOCKED IS A DIFFERENT MARK, NOT A BRIGHTER ONE -- the whole thing changes hue and the rings
   pull in, so "the gun has something" is a glance rather than a comparison against a memory. */
#retic.lock { --h: var(--lh); }
#retic .lay, #retic .spin { position: absolute; inset: 0; }
#retic svg { width: 100%; height: 100%; display: block; overflow: visible; }
#retic circle { fill: none; stroke-linecap: butt; }
/* THE CONVERGENCE. Each ring rests wide and closes onto its drawn radius as the charge fills,
   so a loaded shot IS the portal shut. The scale is on the outer div and the spin on the inner
   one, because two animations cannot share `transform`. */
#retic .a { transform: scale(calc(1 + .95 * (1 - var(--c)))); opacity: calc(.26 + .74 * var(--c)); }
#retic .b { transform: scale(calc(1 + .68 * (1 - var(--c)))); opacity: calc(.30 + .70 * var(--c)); }
#retic .c { transform: scale(calc(1 + .44 * (1 - var(--c)))); opacity: calc(.36 + .64 * var(--c)); }
#retic .d { transform: scale(calc(1 + .26 * (1 - var(--c)))); opacity: calc(.42 + .58 * var(--c)); }
#retic .e { transform: scale(calc(1 + .11 * (1 - var(--c)))); opacity: calc(.18 + .82 * var(--c)); }
#retic .a circle { stroke: var(--r1); stroke-width: calc(1.4 * var(--w)); stroke-dasharray: 22 11.333; }
#retic .b circle { stroke: var(--r2); stroke-width: calc(1.8 * var(--w)); stroke-dasharray: 9 7.667; }
#retic .c circle { stroke: var(--r3); stroke-width: calc(2.6 * var(--w)); stroke-dasharray: 40 10; }
#retic .d circle { stroke: var(--r4); stroke-width: calc(1.1 * var(--w)); stroke-dasharray: 2.5 5.833; }
#retic .e circle { stroke: var(--r5); stroke-width: calc(3.0 * var(--w)); stroke-dasharray: 17 8; }
#retic .a .spin { animation: spin 9s  linear infinite; }
#retic .b .spin { animation: spin 6s  linear infinite reverse; }
#retic .c .spin { animation: spin 4s  linear infinite; }
#retic .d .spin { animation: spin 14s linear infinite reverse; }
#retic .e .spin { animation: spin 7s  linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
#retic .core {
  position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
  border-radius: 50%; background: var(--r5);
  transform: scale(calc(.15 + 1.0 * var(--c)));
  opacity: calc(.25 + .75 * var(--c));
}

/* ---- the melee mark ---- */
#mmark {
  position: fixed; z-index: 3; left: 0; top: 0; width: 96px; height: 96px;
  margin: -48px 0 0 -48px; pointer-events: none; opacity: 0;
  transition: opacity .12s ease; --c: 0; --mc: #ff9b2f;
  filter: drop-shadow(0 0 4px var(--mc));
}
#mmark.on { opacity: 1; }
#mmark i { position: absolute; left: 50%; top: 50%; display: block; }
/* the diamond CLOSES as it winds up -- one shape doing what the blaster's five rings do */
#mmark .dia {
  width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border: 2px solid var(--mc); border-radius: 3px;
  transform: rotate(45deg) scale(calc(1.5 - .75 * var(--c)));
  opacity: calc(.35 + .65 * var(--c));
}
#mmark .dot {
  width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
  border-radius: 50%; background: var(--mc);
  transform: scale(calc(.3 + .9 * var(--c)));
}

.pad .hint {
  position: absolute; left: 50%; bottom: -19px; transform: translateX(-50%);
  font-size: 10px; letter-spacing: .12em; opacity: .42; white-space: nowrap; text-transform: uppercase;
}
</style>

<body>

<div id="boot">
  <h1>MELEE</h1>
  <div class="msg" id="bootMsg">loading</div>
  <div class="bar"><i id="bootBar"></i></div>
  <div class="bld">BUILD <span id="bootBuild">m20</span></div>
</div>

<div class="chip" id="build"><b id="buildN">m20</b><i id="buildI"></i></div>
<div class="chip" id="wep"><span id="wepName">UNARMED</span><small id="wepHint">tap left pad</small></div>

<div class="pad" id="padL"><div class="knob"></div><div class="hint">move &middot; flick = roll</div></div>
<div class="pad" id="padR"><div class="knob"></div><div class="hint">look &middot; tap = jump</div></div>

<!-- THE RETICLE -- CONCENTRIC BROKEN RINGS, NOT ARCS IN ONE SVG.
     The first version put every layer in one <svg> and spun each <g> with
     `transform-box: view-box`. Safari does not honour that on an SVG group: each arc rotated
     about ITS OWN tight bounding box, so the pieces flew apart round the screen instead of
     turning together. **Every spinning thing is a DIV now**, all the same size and all stacked
     on the same centre, so `transform-origin: 50% 50%` means the reticle's middle by
     construction and there is nothing left to get wrong.
     Each ring is ONE <circle> broken into segments with `stroke-dasharray`, on
     `pathLength="100"` so the dash numbers are percentages of the circumference and a ring can
     be re-radiused without recomputing them. -->
<div id="retic" aria-hidden="true">
  <div class="lay a"><div class="spin"><svg viewBox="-60 -60 120 120"><circle r="52" pathLength="100"/></svg></div></div>
  <div class="lay b"><div class="spin"><svg viewBox="-60 -60 120 120"><circle r="44" pathLength="100"/></svg></div></div>
  <div class="lay c"><div class="spin"><svg viewBox="-60 -60 120 120"><circle r="36" pathLength="100"/></svg></div></div>
  <div class="lay d"><div class="spin"><svg viewBox="-60 -60 120 120"><circle r="28" pathLength="100"/></svg></div></div>
  <div class="lay e"><div class="spin"><svg viewBox="-60 -60 120 120"><circle r="20" pathLength="100"/></svg></div></div>
  <div class="core"></div>
</div>

<!-- THE MELEE MARK. Deliberately NOT the blaster's reticle: a hammer does not have a firing
     solution, it has a thing it is about to arrive at. A diamond that closes onto a dot as the
     swing winds up, no spin, no layers -- and it only exists while the wind-up is held. -->
<div id="mmark" aria-hidden="true"><i class="dia"></i><i class="dot"></i></div>

<canvas id="gl"></canvas>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { DRACOLoader } from './vendor/DRACOLoader.js';
import { clone as skeletonClone } from './vendor/SkeletonUtils.js';

const BUILD = 'm20';
/* ASSETS:START */
const ASSETS = {"models/characters/alien_antenna_game.glb":"f3ccf328","models/characters/dummy_officer.glb":"724965ac","models/weapons/alien_antenna_blaster_game.glb":"54083b44","models/weapons/alien_antenna_hammer_game.glb":"707b8a27","audio/blaster_sound_01.mp3":"40d99583","audio/blaster_sound_02.mp3":"4bd7bb7c","audio/box_break_01.mp3":"e4127980","audio/electricity_beam_01.mp3":"986db8c9","audio/explosion_small.mp3":"f154a537","audio/metal_clang_01.mp3":"a333bd27","audio/metal_clang_02.mp3":"1e3ebbd6","audio/metal_clang_03.mp3":"afe44812","audio/metal_ping_01.mp3":"8ffca1a0","audio/plasma_canon.mp3":"e32c324d","audio/swoosh_01.mp3":"193db185","audio/swoosh_02.mp3":"19145e70","audio/swoosh_03.mp3":"544fdffb","audio/swoosh_04.mp3":"843bee5d"};
/* ASSETS:END */
// Every runtime asset URL goes through A(). `npm run bump` writes the sha1 of each file's
// CONTENTS into ASSETS above, so a file replaced IN PLACE -- same folder, same name, new bytes
// -- gets a new URL and actually arrives, while a file that did not change keeps its URL and
// stays cached. Hand-bumped version constants work only when somebody remembers, and
// "somebody remembered" is not a mechanism.
const A = p => (ASSETS[p] ? p + '?v=' + ASSETS[p] : p);

// ============================================================================================
// TUNING. One object per system; everything is on `window.melee` for the console.
// ============================================================================================

const RIG = {
  // METRES. The SCALE is measured off the geometry at load and never typed, so a re-export at
  // any size lands right with no edit here. 1.75 m against an authored 0.9087 m is x1.926.
  height: 1.75,
  file: 'models/characters/alien_antenna_game.glb',
  // WHICH WAY THE EXPORT FACES IS MEASURED, NOT ASSUMED (see `measureFacing`). This rig reads
  // +Z -- toes and shoulders agree to 1.0000 -- but that is a fact about today's file.
  spin: 0,          // a manual extra yaw, in radians, if a future export needs one
  // HE WAS TOO DARK. Two separate lifts, and they do different jobs:
  // `emissive` feeds his own BASE MAP back as emission, which lifts his shadow side by his own
  // colours rather than washing him toward grey -- it lands after the lighting, so it brightens
  // without making him shiny. `hue` is the accent band, measured off his map at load the same
  // way the gun's is, so whatever colour he is trimmed in reads as lit rather than painted.
  emissive: .18,   // .30 read a shade washed on the device -- he said so, and this is the dial
  hue: .52, hueW: .10, hueGlow: .55,
  showHue: 1,       // put the measured hues on the chip -- there is no console on a phone
};

const MOVE = {
  // TOP SPEED IS THE FASTEST CLIP'S OWN SPEED, so `run_fwd_fast` plays at 1.0x at full tilt
  // and the feet never slide at the top of the range. `npm run gait` measures it: 2.362 m/s
  // authored, x1.926 for RIG.height = 4.55. Raising this past it is allowed and costs foot
  // slip in proportion -- GAIT.tsHi is the ceiling on how far the clip will be pushed.
  // FASTER THAN THE FASTEST CLIP, ON PURPOSE (m7). It was pinned to `run_fwd_fast`'s own
  // measured 4.55 m/s so nothing could ever slide -- honest, and too slow. At 7.2 the sprint
  // clip is pushed to 1.58x, which is inside `GAIT.tsHi` and reads as running hard rather than
  // as a scramble. **There is no sprint clip beyond this one, and that is the real fix**: the
  // cap is deliberately short of keeping up rather than absurdly past it, and the CAMERA sells
  // the rest (`CAM.rush` widens the lens with speed).
  max: 7.2,
  acc: 22, accFall: .86, drag: 40,
  // THE GATHER: how much of his acceleration he HAS, climbing from `push0` to full over
  // `pushT` seconds of asking. This is what stops a standing start being a snap to speed,
  // and it belongs here rather than in the target speed or in a momentum term.
  push0: .34, pushT: .30,
  airAcc: 9, airDrag: 1.0,
  // steering is rate-limited SEPARATELY from acceleration
  turn: 14, airTurn: 6,
  // `heading` is the thumb, taken instantly. `faceH` is the BODY, coming round at face0 on
  // the spot and face1 at a run. He is DRAWN at faceH. Without the split the model snaps.
  face0: 11, face1: 5.2,
  // AND `plant` IS THE THIRD IDEA, the one whose absence IS the moonwalk: at a walk the legs
  // push where the thumb says, at a run they push along `faceH`. Without it the velocity
  // keeps answering the stick while the body has already turned.
  plantAt: 1.5, plantFull: 4.5,   // moved with `max`, or the plant saturates mid-range
  turnBrake: .40,     // a hard turn costs speed, which is what plants the feet
  // apex = jump^2 / 2g: 10.6 gives 2.81 m and 1.06 s of air, against 1.76 m before.
  jump: 10.6, g: 20, dead: .12, curve: 1.4, step: .5, coyote: .12,
  // ONE NUMBER PER LANDING, AND THE CLIP IS COMPRESSED TO EXACTLY IT. The state used to last
  // `land` seconds while the clip was scaled to play over `land * 1.9` -- so the hard landing's
  // state ended at 0.62 s with 1.18 s of clip still to run, and the gait took over halfway
  // through the roll. Worse, the cancel window was `land * .45`, which is a QUARTER of the clip:
  // one nudge of the stick and you never saw it at all. **A state whose length disagrees with
  // the clip it is playing can only ever cut that clip off.**
  landSoft: .62,     // landing_soft is 1.083 s -> x1.75, snappy
  landHard: 1.15,    // landing_hard is 1.500 s -> x1.30, so the roll actually reads
  landFree: .70,     // and only past this much of it can the stick run him out of the tail
  hardLand: 8.0,      // impact speed (m/s) above which the landing is the HARD one
  tapT: .30,          // longer than this on a pad is a HOLD, and a hold is not a tap
};

// THE GAIT IS A WEIGHTED BLEND OF CLIPS BY MEASURED SPEED -- never a run FLAG. Each clip's
// clock is tied to the ground speed too, so the feet do not skate.
// EVERY REFERENCE SPEED HERE IS MEASURED (`npm run gait`), not eyeballed. They are the speed
// the PLANTED FOOT slides backwards at in the body frame, which is exactly the speed the clip
// is walking at, and they are already multiplied by RIG's scale.
const GAIT = {
  walkRef: .84, runRef: 3.09, sprintRef: 4.55,
  backRef: 2.23, strafeRef: 2.00, aimRunRef: 3.36,
  // WHERE EACH CLIP TAKES OVER, SPREAD ACROSS THE WHOLE RANGE. The old bands put the sprint's
  // handover at 3.90 against a top speed of 4.55, so `run_fwd_fast` only ever appeared in the
  // top 14% of the stick and was effectively never seen. Each clip now DOMINATES around its own
  // measured reference speed, which is what makes the blend read as one gait rather than three:
  //   walk   ~0.8 m/s (ref 0.84)      run  ~3.5 m/s (ref 3.09)      sprint 5.0+ (ref 4.55)
  walkAt: .30, runAt: 2.40, sprintAt: 5.00,
  tsLo: .55, tsHi: 1.9,                        // how far a clip may be pushed before it reads as a scramble
  // `run_fwd_fast`'s two feet disagree by 34% (L 2.77, R 1.96) -- a real asymmetry in the clip,
  // reported by the tool rather than hidden by it. If the sprint ever reads limpy, that is why.
};

const CAM = {
  dist: 5.0, distV: .10, el: .22, look: 1.05, yawRate: 2.6, half: .07,
  fov: 58, fovRush: 7, rush0: 2.6, rushSpan: 3.2,
  // IT COMES IN WHEN SOMETHING IS IN THE WAY RATHER THAN CLIMBING OVER IT. Shortening the boom

  probe: .5, pad: .3, min: 1.5, outHL: .5,

  rise: 1.4,         // and the most it may ever sit above the look point

// A FLICK IS A FAST MOVE *AND THEN A RELEASE*, AND BOTH HALVES ARE THE GATE.
// Judged on `pointerup` alone it is dead on a pad that is already being held -- the time since
// pointerdown is always past any window, so the gesture can never once fire. Judged on the
// pad's own travel alone it fires MID-HOLD: every fast correction of a steering thumb reads as
// a trick, and a press-and-hold cannot be told from a swipe at all.
// So the TRAVEL arms it and the LIFT fires it, if the lift comes inside `let` OF THE TRAVEL --
// never of the pointerdown. A thumb four seconds into a hold still flicks; a thumb that sweeps
// and then stays down never does, however fast the sweep was.
const FLICK = { at: .70, within: .28, let: .26, gap: .10 };

// THE MELEE CHAIN. Each link is a fixed BEAT and the clip is compressed to it: the authored
// clips run 1.0 to 1.75 s, so a three-hit chain played at 1x is over four seconds of watching,
// which reads as lag rather than as a combo. Escalating, so the finisher has the most weight.
const MELEE = {
  // FAST ENOUGH TO PLAY ALL THE WAY THROUGH. The rule is that a strike is never interrupted,
  // which is only bearable if each one is over quickly -- so the beats come down and the clips
  // are compressed harder to match. A chain is 1.56 s of three landed blows rather than 2.3 s
  // of two and a half.
  beat: [.44, .50, .62],
  // WHERE IN THE CLIP THE BLOW LANDS, per strike. Firing on the INPUT frame puts the
  // consequence a third of a second before the hand gets there, and a swing and its effect
  // arriving as two events is what "you cannot actually hit things" looks like from outside.
  at: [.34, .40, .32], finishAt: .38,
  reach: 2.5,
  // A FLICK IN THE GENERAL DIRECTION OF SOMEBODY IS A FLICK AT HIM. Aiming at him is not
  // enough on its own: a punch thrown at exactly the right bearing from four metres still hits
  // air. So the lock also SOLVES the launch for the gap, which is what makes it land.
  aimCone: .95,        // ~54 degrees either side of the flick
  aimNear: .35,        // what a metre of distance is worth against a metre of miss
  maxV: 21,            // the fastest a lunge may be solved to
  arrive: 1.05,        // the gap he is solved to leave -- arm's length, not his centre. It has
                       // to be inside what the swept fist can REACH now that the sweep decides:
                       // the hand is about .75 m off his centre at full extension and carries
                       // `STRIKE.r`, against a body surface at `arrive - DUMMY.r`.
  // `lockAt` IS DEAD AND KEPT AS A NOTE. It fired the blow on a timer when the lunge had not
  // arrived, which is the *"cop has been hit"* half of the range-check complaint. A swing that
  // does not reach him now simply misses -- see `STRIKE`.
  lockAt: .58,
  carryAvg: .725,      // the `carry` profile's average speed: carry + (1 - carry) / 2
  finishRange: 19,     // the charged swing reaches about double what a strike does
  // and what each one is worth. The finisher and the charged swing put him down outright.
  power: [.45, .52, 1.0],
  window: 1.05,      // how long after a strike the next flick continues the chain
  // `hold` IS DEAD AND KEPT AS A NOTE. It was the fraction of a strike after which the stick
  // could cancel the recovery -- and cancelling a strike is exactly what must not happen now.
  hold: .55,
  // A STRIKE HAS TO TRAVEL. At 2.4 / 2.0 / 2.6 the three-hit chain covered about a metre in
  // total, which reads as swinging on the spot. Distance is `v * beat * .725` (the `carry`
  // profile's average), so these give 1.9 / 2.1 / 3.4 m -- a chain that crosses seven metres
  // and a finisher that genuinely closes.
  // HE RUNS AT THE GUY AND LAUNCHES. These are the FLOOR -- the lock solves upward from here
  // for the real gap, so what they set is how far an unlocked swing carries.
  lunge: [7.0, 6.5, 9.0],
  carry: .45,        // full speed for this fraction of the strike, then linear to zero
  rollDur: .92, rollV: 6.2, rollFree: .45,
  charge: 1.0,       // seconds to a full hammer charge
  chargeBeat: .55, finishBeat: .80,
  // THE RELEASE IS A LEAP, NOT A STEP. It was 3 m/s flat, which is slower than a walk and
  // reads as a man swinging at the air in front of him. Both scale with how full the charge
  // was, so the hold buys the distance -- and the UP term takes him off the ground, which is
  // what makes it land as a blow rather than arrive as a shuffle.
  finishV: 18.0, finishUp: 4.6, finishMin: .45,
};

// ============================================================================================
// A BLOW IS THE LIMB ARRIVING, NOT A RANGE CHECK

// range? did you melee? yes, OK, cop has been hit. It's not really actually having a velocity

//   1. `dummyHit` tested a CIRCLE about the player's centre and used `dirH` only to decide
//      which way to throw him -- so there was no direction test at all and a man standing
//      BEHIND him was hit by a punch thrown forwards.
//   2. and once the melee assist had a target, the contact fired the moment he was within
//      reach, which on a nine-metre lunge is well before the arm has started moving.
//

//

  from: .55,         // the window opens at this fraction of the clip's authored contact frame
  to: 1.0,           // and runs to the end of the strike
  swing: 2.4,        // m/s IN HIS OWN FRAME. Under this a limb is being carried, not swung.
};

  aimFrom: 'shoot',
  range: 60,         // how far the aim is walked to find what he is pointing at
  boltV: 44,         // m/s. Slow enough to SEE, which is the whole point of a charged ball
  boltLife: 2.4, boltR: .17,

  glow: 2.6,         // how hard the gun's accent lifts at a full charge

  hue: .52, hueW: .09,
};

const LOCK = {

  cone: .30, coneTight: .12,

const CLIPS = {

  aimIdle: 'idle_rifle', aimRun: 'rifle_run', aimRunShoot: 'rifle_run_shoot', shoot: 'shoot',
  aimPose: 'rifle_aim',              // DERIVED at load -- see `deriveClips`. Not in the file.
  strafeL: 'strafe_left', strafeR: 'strafe_right',
  fist: ['melee_01', 'melee_03', 'Standing_Melee_Attack_360_High'],

// thing. `strafe_left` is a full-body clip with his arms swinging; laying a rifle pose ON TOP
// of it gives the arms the strafe's swing PLUS the pose, so they flip about, and the spine gets
// twisted twice. **Averaging two clips that both key an arm does not give one arm doing both
// things; it gives a shrug.**
// So nothing is allowed to FIGHT over a track. Two clone families, and between them every bone
// is claimed exactly once:
//     `__up`    spine-up ONLY -- spine, neck, head, both arms, both hands, the weapon markers
//     `__legs`  every spine-up track REMOVED -- root, hips, both legs, both feet
// Played together at full weight they compose into one body: he strafes with his legs and holds
// the gun with his arms, and neither half knows the other is there.
// **THE HIPS IS SPLIT DOWN THE MIDDLE, AND THAT IS THE WHOLE REASON THE SPLIT WORKS AT ALL.**
// MEASURED, off the real clips: every one of these stances is a BLADED body, and the turn that
// blades it lives in the HIPS, not in the spine --
//     shoot                hips yawed -61.7 deg,  barrel -18.3 off his nose
//     rifle_run            hips        -34.6,     barrel  +0.7  -- dead straight
//     weapon_melee_charge  hips        -74.5      (the sideways wind-up, and it reads RIGHT)
//     strafe_left / right  hips        -13.6 / +3.4

// gun with it -- comes out **48 degrees round**, and the melee charge 61. That is the "he is
// facing ninety degrees the wrong way" and the "blaster aiming is still just very wrong", and
// it is one fact: an override split is only valid if both halves share a frame.
// So the hips ROTATION is the STANCE and goes UP with the pose that was built on it; the hips
// TRANSLATION is the body's height off the ground and the stride's bounce, and stays with the
// LEGS -- handing that to the pose nails him to one height. The legs are children of the hips,
// so they come round with the blade, which is what a bladed stance strafing actually looks like.
const UPPER = /Spine|Neck|Head|Shoulder|Arm|Hand|weapon_/;
const isUpper = name => {
  const i = name.lastIndexOf('.'), bone = i < 0 ? name : name.slice(0, i), prop = i < 0 ? '' : name.slice(i + 1);
  if (/Hips$/.test(bone)) return prop === 'quaternion';

const UP = '__up', LEGS = '__legs';
const SPLIT = {
  up: ['aimPose', 'shoot', 'chargeUp', 'chargeGo'],
  legs: ['idle', 'walk', 'run', 'sprint', 'back', 'aimRun', 'aimRunShoot', 'strafeL', 'strafeR'],

// helpers
// ============================================================================================
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

// frame rate and a 120 Hz phone plays a different game from a 30 Hz one.
const damp = (cur, tgt, half, dt) => lerp(cur, tgt, 1 - Math.pow(0.5, dt / half));
const wrapAngle = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a || 1), 0, 1); return t * t * (3 - 2 * t); };

const bootBar = document.getElementById('bootBar');

const buildI = document.getElementById('buildI');

// THE CARD SPEAKS WHEN A LOAD *STARTS*, not from the progress callback. `e.total` is the
// Content-Length: a response served without one -- chunked, which is what a CDN does to a big
// file often enough -- produces NO progress call at all for that whole file, so the card keeps
// whatever text it had. For the first load that is the text it was BORN with, which is pixel
// for pixel what `init()` never running looks like. The two failures worth telling apart were
// rendering as the same screen.
const PROG = { done: 0, total: 4, label: '' };
function setBoot(label, frac) {
  PROG.label = label;

const MISSING = [];
const note = m => { if (!MISSING.includes(m)) MISSING.push(m); console.warn('[melee] ' + m); };

// ============================================================================================
// SOUND. Borrowed whole from Plutopia, Shredworld and Robits -- the same swooshes, clangs and
// blaster shots those games already use. Two ideas here are load-bearing:
//
// 1. TWO-STAGE LOAD. A browser will not build an AudioContext outside a gesture, but it will
//    happily FETCH -- so the bytes come down at page load and only the decode waits for the
//    first touch. The first swing then HAS a sound instead of being the thing that starts the
//    download.
// 2. EDGE TRIMMING. An exported effect is usually a short noise sitting inside a longer file:
//    silence, the event, then a tail of nothing. Played from zero that is a sound with a delay
//    bolted onto the front, and nothing on the trigger side can fix it.
//    AND THE ONSET IS FOUND RELATIVE TO THE FILE'S OWN PEAK, not against an absolute floor --
//    an absolute floor opens on room tone, which on a real recording is a tenth of a second of
//    nothing in front of the hit.
// `play` returns TRUE when it REFUSES a sound (voice cap or per-key gap), because a caller
// reading false would fall back to something else and put the pile-up back.
// ============================================================================================
const SFX = {
  on: 1, vol: .85, ctx: null, bus: null, ready: 0,
  gap: .045,        // the least time between two of the same key
  voices: 0, max: 14,
  hit: .25,         // the onset is the first sample over this much of the file's own peak
  pre: .03,         // with this much run-up kept, so the attack survives
  files: {
    swoosh: ['audio/swoosh_01.mp3', 'audio/swoosh_02.mp3', 'audio/swoosh_03.mp3', 'audio/swoosh_04.mp3'],
    clang: ['audio/metal_clang_01.mp3', 'audio/metal_clang_02.mp3', 'audio/metal_clang_03.mp3'],
    thud: ['audio/box_break_01.mp3'],
    zap: ['audio/electricity_beam_01.mp3'],
    shot: ['audio/blaster_sound_01.mp3', 'audio/blaster_sound_02.mp3'],
    big: ['audio/plasma_canon.mp3'],
    boom: ['audio/explosion_small.mp3'],
    lock: ['audio/metal_ping_01.mp3'],
  },
  raw: {}, buf: {}, edge: {}, last: {},
};
// stage one: the bytes, at page load, with no context anywhere
(function sfxFetch() {
  for (const k in SFX.files) {
    SFX.raw[k] = [];
    SFX.files[k].forEach((u, i) => {
      fetch(A(u)).then(r => r.ok ? r.arrayBuffer() : null).then(b => { if (b) SFX.raw[k][i] = b; })
        .catch(() => {});
    });
  }
})();
// stage two: the context and the decode, on the first touch anywhere
function sfxWake() {
  if (SFX.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { note('NO AUDIO'); return; }
  SFX.ctx = new AC();
  // THIS IS WHAT MAKES A PHONE WITH THE RING SWITCH ON AUDIBLE AT ALL.
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  SFX.bus = SFX.ctx.createGain();
  SFX.bus.gain.value = SFX.vol;
  SFX.bus.connect(SFX.ctx.destination);
  for (const k in SFX.raw) {
    SFX.buf[k] = []; SFX.edge[k] = [];
    SFX.raw[k].forEach((ab, i) => {
      if (!ab) return;
      SFX.ctx.decodeAudioData(ab.slice(0)).then(b => {
        SFX.buf[k][i] = b;
        SFX.edge[k][i] = sfxEdge(b);
        SFX.ready = 1;
      }).catch(() => {});
    });
  }
}
addEventListener('pointerdown', sfxWake, { capture: true, once: false });
function sfxEdge(b) {
  const d = b.getChannelData(0), n = d.length, sr = b.sampleRate;
  let peak = 0;
  for (let i = 0; i < n; i += 7) { const v = Math.abs(d[i]); if (v > peak) peak = v; }
  if (peak < 1e-4) return { a: 0, b: b.duration };
  const gate = peak * SFX.hit;
  let a = 0;
  for (let i = 0; i < n; i++) if (Math.abs(d[i]) > gate) { a = i; break; }
  let z = n - 1;
  const tail = peak * .012;
  for (let i = n - 1; i > a; i--) if (Math.abs(d[i]) > tail) { z = i; break; }
  return { a: Math.max(0, a / sr - SFX.pre), b: Math.min(b.duration, z / sr + .04) };
}
// ============================================================================================
// THE CHARGE IS A SYNTH, NOT A SAMPLE -- and it has to be.
// `powerup_01.mp3` was the first try and it is the wrong SHAPE even though it is the right
// idea: it is the one-shot rise you play when somebody picks up a new gun. A charge is not a
// `play()`. It is ON for exactly as long as the thumb is up, it RISES with how full the shot
// actually is, and it stops the instant the shot leaves -- and no one-shot can do any of that.
// It ends early on a long hold and runs past a short one.
//
// TWO DETUNED SAWS UNDER A LOWPASS THAT OPENS. **The DETUNE is what makes it read as
// ELECTRICAL rather than as a note** -- two saws a few cents apart beat against each other,
// which is the sound of something building charge rather than of something playing a pitch.
// The filter opening is the "filling up" read and the pitch rise is the confirmation.
//
// And the real ELECTRIC crack is a sample laid on the front of it (`zap`), because an onset is
// the one part a synth is worse at than a recording.
// ============================================================================================
const CHARGE = {
  f0: 84, f1: 232,        // the note it climbs through
  det: 9,                 // CENTS of detune between the two saws -- the beat IS the electricity
  lp0: 240, lp1: 4600,    // and the filter opening is what "charging" sounds like
  q: 7, g: .17,
  osc: [], gain: null, flt: null,
};
function chargeStart() {
  if (!SFX.ctx || CHARGE.gain) return;
  const c = SFX.ctx;
  const g = c.createGain(); g.gain.value = 0;
  const f = c.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = CHARGE.lp0; f.Q.value = CHARGE.q;
  f.connect(g); g.connect(SFX.bus);
  const os = [];
  for (const d of [-CHARGE.det, CHARGE.det]) {
    const o = c.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = CHARGE.f0; o.detune.value = d;
    o.connect(f); o.start(); os.push(o);
  }
  CHARGE.gain = g; CHARGE.flt = f; CHARGE.osc = os;
}
function chargeStep(k) {
  if (!CHARGE.gain || !SFX.ctx) return;
  const t = SFX.ctx.currentTime;
  // `setTargetAtTime` rather than a bare assignment: a parameter jumped on a frame boundary
  // clicks, and a charge that clicks sixty times a second is a buzz.
  CHARGE.gain.gain.setTargetAtTime(SFX.on ? CHARGE.g * (.22 + .78 * k) : 0, t, .04);
  CHARGE.flt.frequency.setTargetAtTime(lerp(CHARGE.lp0, CHARGE.lp1, k * k), t, .05);
  for (const o of CHARGE.osc) o.frequency.setTargetAtTime(lerp(CHARGE.f0, CHARGE.f1, k), t, .07);
}
function chargeStop() {
  if (!CHARGE.gain || !SFX.ctx) return;
  const t = SFX.ctx.currentTime;
  CHARGE.gain.gain.setTargetAtTime(0, t, .025);
  const g = CHARGE.gain, os = CHARGE.osc;
  // let the fade finish before the nodes go, or the stop IS the click
  setTimeout(() => { for (const o of os) { try { o.stop(); } catch (e) {} } try { g.disconnect(); } catch (e) {} }, 220);
  CHARGE.gain = null; CHARGE.flt = null; CHARGE.osc = [];
}

function snd(key, o) {
  if (!SFX.on || !SFX.ctx || SFX.voices >= SFX.max) return 1;
  const list = SFX.buf[key]; if (!list || !list.length) return 1;
  const t = SFX.ctx.currentTime;
  if (SFX.last[key] != null && t - SFX.last[key] < SFX.gap) return 1;
  const i = (o && o.i != null) ? o.i : (Math.random() * list.length) | 0;
  const b = list[i]; if (!b) return 1;
  SFX.last[key] = t;
  const e = (SFX.edge[key] && SFX.edge[key][i]) || { a: 0, b: b.duration };
  const src = SFX.ctx.createBufferSource(); src.buffer = b;
  src.playbackRate.value = (o && o.r) || 1;
  const g = SFX.ctx.createGain(); g.gain.value = (o && o.g != null) ? o.g : 1;
  src.connect(g); g.connect(SFX.bus);
  SFX.voices++;
  src.onended = () => { SFX.voices--; };
  src.start(0, e.a, Math.max(.02, e.b - e.a));
  return 0;
}

const BOXES = [];
const world = new THREE.Group();

  // a few things at jumpable heights, and a couple far too tall to get on

  put( 9.5, 0, -6, 3, 1.15, 3, 1);
  put( 13, 0,  -9, 3, 1.85, 3, 2);
  put( -7, 0,   4, 4, 2.6, 4, 3);
  put(-12, 0,  -6, 2.2, 5.0, 2.2, 4);
  put(  2, 0,  12, 9, .35, 3, 4);
  put( -4, 0, -11, 3, 1.0, 7, 1);
  put( 16, 0,   6, 2.4, 3.4, 2.4, 0);
  put(  0, 0, -18, 14, 4.2, 1.2, 4);

// The highest box top under (x,z) at or a step above `y`, else the floor at 0.
function groundAt(x, z, y, step) {
  let best = 0;
  for (const b of BOXES) {
    if (x < b.minx || x > b.maxx || z < b.minz || z > b.maxz) continue;
    if (b.maxy > best && b.maxy <= y + step) best = b.maxy;
  }
  return best;
}
// Push a position out of any box it is inside. The axis it is LEAST deep into is the face it
// came in by, which is the cheapest correct answer and the one that does not teleport him
// round a corner.
function resolveBoxes(p, r, hh) {
  let hit = false;
  for (const b of BOXES) {
    if (p.x + r < b.minx || p.x - r > b.maxx) continue;
    if (p.z + r < b.minz || p.z - r > b.maxz) continue;
    // A BOX TOP WITHIN `step` OF HIS FEET IS A FLOOR, NOT A WALL -- which is how a kerb is
    // walked up and how a roof works. Without this the wall test and `groundAt` disagree about
    // what a low box is: `groundAt` puts him on top of it and this pushes him off the side, so
    // he grinds to a halt against a 40 cm kerb he is standing on.
    if (b.maxy <= p.y + MOVE.step) continue;
    if (p.y + hh < b.miny || p.y > b.maxy - .02) continue;
    const dx1 = (b.maxx + r) - p.x, dx2 = p.x - (b.minx - r);
    const dz1 = (b.maxz + r) - p.z, dz2 = p.z - (b.minz - r);
    const m = Math.min(dx1, dx2, dz1, dz2);
    if (m <= 0) continue;
    if (m === dx1) p.x = b.maxx + r; else if (m === dx2) p.x = b.minx - r;
    else if (m === dz1) p.z = b.maxz + r; else p.z = b.minz - r;
    hit = true;
  }
  return hit;
}
function camHit(x, y, z, pad) {
  for (const b of BOXES) {
    if (x > b.minx - pad && x < b.maxx + pad && y > b.miny - pad && y < b.maxy + pad &&
        z > b.minz - pad && z < b.maxz + pad) return true;
  }
  return false;
}

// ============================================================================================
// THE RIG
// ============================================================================================
const rig = {
  ready: false, root: null, model: null, mixer: null,
  actions: {}, clips: {}, cw: {},          // cw: the damped weight of each action
  bones: {}, scale: 1, faceOff: 0, mounts: {},
};

const dl = new DRACOLoader().setDecoderPath('./vendor/draco/');
const gltf = new GLTFLoader().setDRACOLoader(dl);

// A SLOW CONNECTION IS NOT A MISSING FILE, and from the call site the two are
// indistinguishable -- one wants to carry on without the thing, the other wants to ask again.
// So the TRANSPORT retries and only a file that fails every try reaches the caller as missing.
function loadGLB(url, label) {
  return new Promise((resolve, reject) => {
    let tries = 0;
    const go = () => {
      setBoot(label, 0);                      // the label is set when the load STARTS
      gltf.load(A(url),
        g => { PROG.done++; setBoot(label, 0); resolve(g); },
        e => { if (e && e.total) setBoot(label, e.loaded / e.total); },
        err => {
          if (++tries < 3) { setTimeout(go, 400 * tries); return; }
          reject(err);
        });
    };
    go();
  });
}

// --------------------------------------------------------------------------------------------
// normaliseClips -- and the first line of it is the most important line in this file.
//
// A KEYFRAME TRACK'S `times` ARRAY IS SHARED. This export has 4464 samplers referencing just
// THIRTY-THREE distinct time accessors; GLTFLoader resolves each accessor once and caches it,
// and KeyframeTrack keeps the Float32Array BY REFERENCE. So subtracting the start offset from
// "each track" subtracts it from the same array about a hundred and thirty times over: the
// times go deeply negative, `resetDuration()` comes back NEGATIVE, and a track evaluated past
// its last key returns that key -- every clip in the file frozen on its final frame, for ever.
// It reads as "he just holds the pose" and no amount of work on weights or loop modes touches
// it. Clone before you mutate.
//
// Three things are done here and all three were measured first, not assumed:
//   * every clip starts at exactly 1/24 s -- one held frame at the top of every loop, which on
//     a 0.5 s run cycle is 8% of the stride spent standing still. Shifted to zero.
//   * all 62 SCALE tracks in all 23 clips hold their rest value to within 5.4e-7. No-ops.
//   * every POSITION track except the Hips holds its rest value to within 2.3e-5 armature
//     units. Only the Hips genuinely translates -- and that one is the body's HEIGHT off the
//     ground, which every crouch, landing and roll in this set needs, so it stays.
// Stripping the other two is therefore a no-op that removes 2,700 channels of work per frame.
// If a future export animates a finger's position or a bone's scale on purpose, `npm run clips`
// says so and these filters are what to revisit.
// --------------------------------------------------------------------------------------------
function normaliseClips(clips) {
  const out = [];
  for (const clip of clips) {
    if (DROP.has(clip.name)) continue;
    const keep = [];
    for (const t of clip.tracks) {
      const bone = t.name.split('.')[0].replace(/^\s+|\s+$/g, '');
      const path = t.name.slice(t.name.lastIndexOf('.') + 1);
      if (path === 'scale') continue;
      if (path === 'position' && !/Hips$/.test(bone)) continue;
      // CLONE. See above.
      t.times = Float32Array.from(t.times);
      keep.push(t);
    }
    clip.tracks = keep;
    let t0 = Infinity;
    for (const t of clip.tracks) if (t.times.length) t0 = Math.min(t0, t.times[0]);
    if (isFinite(t0) && t0 > 0) for (const t of clip.tracks) for (let i = 0; i < t.times.length; i++) t.times[i] -= t0;
    clip.resetDuration();
    // A NON-POSITIVE DURATION IS THE SIGNATURE of the bug above, so it says so rather than
    // going quiet and freezing every pose in the game.
    if (!(clip.duration > 0)) { note('CLIP ' + clip.name + ' duration ' + clip.duration); continue; }
    out.push(clip);
  }
  return out;
}

// --------------------------------------------------------------------------------------------
// THE AIM POSE IS ONE FRAME, TRIMMED -- there is no sighted standing clip in the export.
// Holding a charge he is BRACED, not at ease: `idle_rifle` is the gun DOWN and him standing
// about, which is exactly right for carrying it and exactly wrong for the moment a shot is
// winding up. The first frame of a clip that already has the gun up IS that pose, for free.
//
// TRIMMED RATHER THAN PAUSED, and that is not a detail: a paused action still has a duration
// the mixer walks, and it can be left somewhere unexpected by anything that touches its time.
// **One keyframe cannot drift.** The duration is .1 rather than 0 because a zero-length clip on
// LoopRepeat divides by its own length.
//
// And the arrays are NEW rather than sliced views -- the whole point of `normaliseClips` is that
// these buffers are shared, so a derived clip that aliased one would put the same landmine back
// one function along.
// --------------------------------------------------------------------------------------------
function deriveClips(clips) {
  const out = clips.slice();
  const src = clips.find(c => c.name === WEAP.aimFrom);
  if (!src) { note('NO CLIP ' + WEAP.aimFrom); return out; }
  const tracks = [];
  for (const t of src.tracks) {
    const n = t.getValueSize();
    if (!t.values || t.values.length < n) continue;
    const vals = new Float32Array(n);
    for (let i = 0; i < n; i++) vals[i] = t.values[i];
    tracks.push(new t.constructor(t.name, new Float32Array([0]), vals));
  }
  if (!tracks.length) { note('NO TRACKS IN ' + WEAP.aimFrom); return out; }
  out.push(new THREE.AnimationClip(CLIPS.aimPose, .1, tracks));
  console.log('[melee] ' + CLIPS.aimPose + ' derived from the first frame of ' + WEAP.aimFrom +
              ' (' + tracks.length + ' tracks)');

  // ---- and the two half-body families ----
  // `KeyframeTrack.clone()` slices its own times AND values, so these are new arrays and the
  // shared-buffer landmine cannot follow them here.
  const half = (clip, wantUpper, suffix) => {
    const keep = clip.tracks.filter(t => isUpper(t.name) === wantUpper);
    if (!keep.length) return null;
    return new THREE.AnimationClip(clip.name + suffix, clip.duration, keep.map(t => t.clone()));
  };
  const byName = {};
  for (const c of out) byName[c.name] = c;
  let made = 0;
  for (const [suffix, wantUpper, keys] of [[UP, true, SPLIT.up], [LEGS, false, SPLIT.legs]]) {
    for (const k of keys) {
      const src = byName[CLIPS[k]];
      if (!src) { note('NO CLIP ' + CLIPS[k]); continue; }
      const c = half(src, wantUpper, suffix);
      if (c) { out.push(c); made++; } else note('NO ' + suffix + ' IN ' + src.name);
    }
  }
  console.log('[melee] ' + made + ' half-body clones (' + SPLIT.up.length + ' upper, ' +
              SPLIT.legs.length + ' lower)');
  return out;
}

// --------------------------------------------------------------------------------------------
// WHICH WAY DOES THE EXPORT FACE? MEASURED, NEVER GUESSED.
// A glTF conventionally points -Z and this rig points +Z, which is the difference between
// running away from the camera and running at it -- and because the camera swings round behind
// him as he moves, getting it wrong reads as INVERTED CONTROLS rather than as a backwards
// model, which is why the stick maths gets blamed for it.
//
// THE TOES ARE THE PRIMARY MEASUREMENT: a foot points forwards, which is a geometric fact
// about a body, and averaging the pair cancels the splay. The shoulder span is the obvious
// alternative and is strictly weaker -- it needs the rig's left/right naming to be honest AND
// the up-cross-forward to come out the right way round, and those two can be wrong at once and
// hide each other. Both are measured here and they cross-check; on this file they agree to
// 1.0000 and the answer is +Z.
// --------------------------------------------------------------------------------------------
function measureFacing(bones) {
  const nx = (a, b) => {
    const x = a.x - b.x, z = a.z - b.z, d = Math.hypot(x, z) || 1;
    return { x: x / d, z: z / d };
  };
  const need = n => bones[n] && bones[n].getWorldPosition(new THREE.Vector3());
  const lf = need('mixamorig_LeftFoot'), lt = need('mixamorig_LeftToe_End');
  const rf = need('mixamorig_RightFoot'), rt = need('mixamorig_RightToe_End');
  let fx = 0, fz = 1, how = 'default';
  if (lf && lt && rf && rt) {
    const a = nx(lt, lf), b = nx(rt, rf);
    const sx = a.x + b.x, sz = a.z + b.z, d = Math.hypot(sx, sz);
    if (d > .2) { fx = sx / d; fz = sz / d; how = 'toes'; }
  }
  // the cross-check: his LEFT is up x forward = (fz, -fx), and the shoulder span should agree
  const ls = need('mixamorig_LeftShoulder'), rs = need('mixamorig_RightShoulder');
  let agree = null;
  if (ls && rs) {
    const s = nx(ls, rs);
    agree = s.x * fz + s.z * -fx;
    if (agree < .4) note('FACING: toes and shoulders DISAGREE (' + agree.toFixed(2) + ')');
  }
  const yaw = Math.atan2(fx, fz);
  console.log('[melee] facing measured from ' + how + ': (' + fx.toFixed(3) + ', ' + fz.toFixed(3) +
              ') = ' + (yaw * 180 / Math.PI).toFixed(1) + ' deg' +
              (agree != null ? '   shoulder cross-check ' + agree.toFixed(4) : ''));
  return yaw;
}

// --------------------------------------------------------------------------------------------
// MEASURE HIM WITH GEOMETRY BOUNDS, NEVER `Box3.setFromObject`. A skinned mesh ignores its node
// transform but setFromObject applies it anyway -- and this armature is scaled 0.01, so the box
// comes back a hundredth of his size. GLTFLoader binds every skin with the IDENTITY matrix, so
// at rest a vertex's geometry position IS its world position and these bounds are already
// metres: 0.9087 m for today's file, which wants x1.926 to stand 1.75 m tall.
// --------------------------------------------------------------------------------------------
function measureHeight(scene) {
  let lo = Infinity, hi = -Infinity;
  scene.traverse(o => {
    if (!o.isSkinnedMesh || !o.geometry) return;
    o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox;
    lo = Math.min(lo, b.min.y); hi = Math.max(hi, b.max.y);
  });
  return isFinite(lo) ? hi - lo : 0;
}

// --------------------------------------------------------------------------------------------
// MOUNTING A WEAPON. Both files are built round `weapon_root_right` with the tip at exactly
// (-14.3102, 0, 0) -- which is the character's own right-hand mount to four decimal places. So
// the answer is to parent with IDENTITY and apply no scale, no offset and no rotation at all.
//
// THE TRAP IS THE ARMATURE SCALE, AND IT IS APPLIED TWICE IF YOU CLONE THE WHOLE SCENE. The
// weapon file is `Armature(0.01) > weapon_root_right > mesh`, and the character's mount is
// ALREADY inside his own Armature(0.01) -- so a naive clone of the file's scene onto the joint
// comes out at a hundredth of its size, which from a phone is indistinguishable from the file
// never having loaded. What is taken is only what sits BELOW the file's own mount: the mesh,
// with its local transform relative to that mount preserved. That carries the authored
// placement and nothing else.
//
// AND THE MOUNT IS FOUND BY NAME ON THE WEARER, so a weapon exported onto the LEFT hand lands
// in the left hand with no code change here.
// --------------------------------------------------------------------------------------------
function mountWeapon(slot, g) {
  const src = g.scene;
  let fileRoot = null;
  src.traverse(o => { if (!fileRoot && /^weapon_root/.test(o.name)) fileRoot = o; });
  if (!fileRoot) { note('NO weapon_root IN ' + slot.key); return null; }
  const host = rig.mounts[fileRoot.name];
  if (!host) { note('NO MOUNT "' + fileRoot.name + '" ON THE RIG for ' + slot.key); return null; }

  src.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(fileRoot.matrixWorld).invert();
  const group = new THREE.Group();
  group.name = 'weapon:' + slot.key;

  const parts = [];
  fileRoot.traverse(o => { if (o.isMesh) parts.push(o); });
  if (!parts.length) { note('NO MESH IN ' + slot.key); return null; }
  for (const m of parts) {
    // the mesh's transform RELATIVE TO THE FILE'S OWN MOUNT -- which is the authored placement
    const rel = new THREE.Matrix4().multiplyMatrices(inv, m.matrixWorld);
    const o = new THREE.Mesh(m.geometry, m.material);
    o.matrixAutoUpdate = false;
    o.matrix.copy(rel);
    o.castShadow = true;
    o.frustumCulled = false;   // it rides a bone; its own bounds say nothing about where it is
    group.add(o);
  }
  host.add(group);
  group.visible = false;

  // WHAT SIZE DID IT ACTUALLY COME OUT? "It doesn't show up" is three bugs wearing one face
  // from a phone -- it never loaded, it loaded at a hundredth scale, or it is the right size in
  // the wrong place -- and only a number tells them apart.
  const bb = new THREE.Box3();
  for (const o of group.children) { o.updateMatrixWorld(true); bb.expandByObject(o); }
  const size = bb.getSize(new THREE.Vector3());
  const cm = Math.max(size.x, size.y, size.z) * 100;
  console.log('[melee] ' + slot.key + ' mounted on ' + fileRoot.name + ' -- ' + cm.toFixed(0) + ' cm');
  if (cm < 5) note(slot.key.toUpperCase() + ' ' + cm.toFixed(0) + 'CM');

  // THE BARREL AXIS COMES OFF THE RIG'S OWN TIP MARKER, which is what that marker is FOR --
  // it says which way the mount points, and nothing about it is typed here.
  let axis = new THREE.Vector3(-1, 0, 0);
  for (const c of host.children) if (/tip/.test(c.name) && c.position.lengthSq() > 1e-9) axis = c.position.clone().normalize();
  const muzzle = measureMuzzle(group, axis);
  console.log('[melee] ' + slot.key + ' muzzle at ' + muzzle.toArray().map(v => v.toFixed(2)).join(', ') +
              ' in mount space, along ' + axis.toArray().map(v => v.toFixed(2)).join(', '));

  if (slot.aim) for (const o of group.children) if (o.material) {
    // MEASURED OFF THIS GUN'S OWN MAP. On a grey body with blue trim the grey has no chroma and
    // does not vote, so the histogram finds the trim -- which is the part that should glow.
    const m = measureHue(o.material.map, 'blaster');
    if (m) { GUNU.hue.value = m.hue; GUNU.rgb.value.setHSL(m.hue, 1, .6); WEAP.hue = m.hue; }
    hueGlow(o.material, GUNU, 'gun');
  }
  return { group, cm, muzzle, host, axis };
}

// ============================================================================================
// THE BLASTER: a charged ball, a reticle that converges, and a gun that lights up
// ============================================================================================

// One soft radial dot, built once. Every glowing thing in here is a stack of these at one
// point -- core, body, haze -- which is what makes a ball read as a ball wrapped in light
// rather than as a flat disc.
const DOT = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(.35, 'rgba(255,255,255,.55)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
// NOT ADDITIVE ON ITS OWN ACCOUNT -- additive IS right for plasma, but it has to be
// tone-mapped off or it saturates to white the moment two of them overlap.
function glowSprite(colour, size) {
  const m = new THREE.SpriteMaterial({ map: DOT, color: colour, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
  const sp = new THREE.Sprite(m);
  sp.scale.setScalar(size);
  return sp;
}
function glowBall(size) {
  const g = new THREE.Group();
  g.add(glowSprite(0x7a3cff, size * 1.9));     // violet haze
  g.add(glowSprite(0x2ec8ff, size * 1.15));    // cyan body
  g.add(glowSprite(0xffffff, size * .52));     // white-hot core
  g.userData.base = size;
  return g;
}
function ballSize(g, k) {
  const b = g.userData.base || 1;
  g.children[0].scale.setScalar(b * 1.9 * k);
  g.children[1].scale.setScalar(b * 1.15 * k);
  g.children[2].scale.setScalar(b * .52 * k);
}

// WHICH HUE SHOULD GLOW? MEASURED OFF THE TEXTURE, NOT PICKED BY EYE.
// "Grab a colour ramp of the blaster and make the blueish colour glow, and see if there's a hue
// or tone on the alien to ramp the emission on as well" -- so the texture is asked rather than
// guessed at. It is a SATURATION-WEIGHTED hue histogram, and the weighting is the part that
// matters: a character map is mostly midtones and skin, so counting every pixel equally reports
// the BACKGROUND rather than the accent. What an artist means by "the colour of this thing" are
// the texels carrying chroma, so those are the ones that get a vote -- which is exactly why
// this finds the blue trim on a grey blaster instead of finding grey.
function measureHue(tex, label) {
  const img = tex && tex.image;
  if (!img) return null;
  const N = 128;
  const cv = document.createElement('canvas'); cv.width = cv.height = N;
  const g = cv.getContext('2d', { willReadFrequently: true });
  let data;
  try { g.drawImage(img, 0, 0, N, N); data = g.getImageData(0, 0, N, N).data; }
  catch (e) { note('HUE READ FAILED ' + label); return null; }
  const BINS = 36, hist = new Float64Array(BINS);
  let satSum = 0, n = 0;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 8) continue;
    const r = data[i] / 255, gr = data[i + 1] / 255, b = data[i + 2] / 255;
    const mx = Math.max(r, gr, b), mn = Math.min(r, gr, b), d = mx - mn;
    if (mx < .06) continue;              // a near-black texel says nothing about hue
    const sat = d / mx;
    if (sat < .12) continue;             // and nor does a grey one
    let h;
    if (mx === r) h = ((gr - b) / d + 6) % 6;
    else if (mx === gr) h = (b - r) / d + 2;
    else h = (r - gr) / d + 4;
    h /= 6;
    hist[Math.min(BINS - 1, Math.floor(h * BINS))] += sat;
    satSum += sat; n++;
  }
  if (!n) { console.log('[melee] ' + label + ': no chromatic texels -- nothing to ramp on'); return null; }

  // THE CENTROID IS TAKEN ON THE CIRCLE, not on the bin index: hue wraps, so a family sitting
  // across the seam at zero would otherwise average to the middle of the wheel -- and red is
  // exactly the family that sits there.
  const peak = (bins, at) => {
    let sx = 0, sy = 0, tot = 0;
    for (let k = -2; k <= 2; k++) {
      const i = (at + k + BINS) % BINS, w = bins[i], a = ((i + .5) / BINS) * Math.PI * 2;
      sx += Math.cos(a) * w; sy += Math.sin(a) * w; tot += w;
    }
    return { hue: ((Math.atan2(sy, sx) / (Math.PI * 2)) % 1 + 1) % 1, w: tot };
  };
  const top = bins => { let b = 0; for (let i = 1; i < BINS; i++) if (bins[i] > bins[b]) b = i; return b; };

  // THE DOMINANT HUE IS THE BODY, AND THE BODY IS NOT WHAT SHOULD GLOW.
  // The first version took the biggest peak and duly reported 20 deg for the alien and 17 for
  // the blaster -- both of them the ORANGE, because orange is most of both maps. That is a
  // correct answer to the wrong question: *"make the blueish colour glow"* is asking for the
  // ACCENT, which is by definition the minority. So the main peak is found, a wedge either
  // side of it is knocked out, and the strongest thing LEFT is the accent -- which is the blue.
  const main = peak(hist, top(hist));
  const away = Math.round(BINS * (60 / 360));        // 60 degrees clear of the body colour
  const rest = Float64Array.from(hist);
  const mainBin = Math.floor(main.hue * BINS);
  for (let k = -away; k <= away; k++) rest[(mainBin + k + BINS) % BINS] = 0;
  const acc = peak(rest, top(rest));
  // it has to be a real family rather than the noise floor, or a map with one colour in it
  // would glow on whatever rounding happened to leave behind
  const good = acc.w > main.w * .06;
  const use = good ? acc : main;
  const col = new THREE.Color().setHSL(use.hue, 1, .6);
  const out = { hue: use.hue, main: main.hue, accent: good ? acc.hue : null,
                share: use.w / (satSum || 1), sat: satSum / n, px: n, hex: '#' + col.getHexString() };
  console.log('[melee] ' + label + ': body ' + (main.hue * 360).toFixed(0) + 'deg, ' +
    (good ? 'ACCENT ' + (acc.hue * 360).toFixed(0) + 'deg ' + out.hex + ' (' +
      (acc.w / main.w * 100).toFixed(0) + '% of the body peak)' : 'no accent found -- using the body colour') +
    '   ' + n + ' chromatic texels, mean sat ' + out.sat.toFixed(2));
  return out;
}

// THE GLOW IS A HUE BAND, AND ONE FUNCTION SERVES BOTH THE GUN AND THE ALIEN.
// Each is one mesh on one material, so there is no "blue part" to pick out by name -- but the
// map knows which texels are blue, so the shader can. Weight is how close a texel's hue is to
// the band's centre, TIMES its saturation, so a grey or a white can never light up however the
// band is set. Two objects, one rule, one place to be wrong.
function hueGlow(mat, u, tag) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uGK = u.k; sh.uniforms.uGH = u.hue; sh.uniforms.uGW = u.wid; sh.uniforms.uGC = u.rgb;
    sh.fragmentShader = sh.fragmentShader
      .replace('void main() {', `
uniform float uGK; uniform float uGH; uniform float uGW; uniform vec3 uGC;
void main() {`)
      // AFTER `emissivemap_fragment`, so this ADDS to whatever the material's own emissive did
      // rather than replacing it -- the alien carries a flat lift from his own map as well.
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        {
          vec3 gc = diffuseColor.rgb;
          float gmx = max(gc.r, max(gc.g, gc.b));
          float gmn = min(gc.r, min(gc.g, gc.b));
          float gd = gmx - gmn;
          float gsat = gmx > 1e-5 ? gd / gmx : 0.0;
          if (gd > 1e-5 && uGK > 0.0) {
            float gh;
            if (gmx == gc.r)      gh = mod((gc.g - gc.b) / gd, 6.0);
            else if (gmx == gc.g) gh = (gc.b - gc.r) / gd + 2.0;
            else                  gh = (gc.r - gc.g) / gd + 4.0;
            gh /= 6.0;
            float gdist = abs(gh - uGH);
            gdist = min(gdist, 1.0 - gdist);          // hue WRAPS
            totalEmissiveRadiance += uGC * smoothstep(uGW, 0.0, gdist) * gsat * uGK;
          }
        }`);
  };
  // three reuses a compiled program across materials whose cache key matches, so a material
  // carrying a custom hook needs its own key or it can be handed somebody else's shader.
  mat.customProgramCacheKey = () => 'hueglow:' + tag;
  mat.needsUpdate = true;
}
// one set of live uniforms per thing that glows
function glowUniforms(hue, width, strength) {
  return { k: { value: strength }, hue: { value: hue }, wid: { value: width },
           rgb: { value: new THREE.Color().setHSL(hue, 1, .6) } };
}
const GUNU = glowUniforms(WEAP.hue, WEAP.hueW, 0);
const ALIENU = glowUniforms(RIG.hue, RIG.hueW, 0);

// WHERE THE SHOT COMES OUT -- MEASURED, BECAUSE `weapon_tip` IS NOT THE MUZZLE. On the blaster
// the mesh runs from +11.7 to -38.2 along the mount's X and the tip marker sits at -14.3, about
// 28% along: the marker pair defines the mount's POSITION and AXIS, which is all it is for. The
// muzzle is the far end of the geometry along that axis, which needs no marker and survives a
// re-model.
function measureMuzzle(group, axis) {
  const bb = new THREE.Box3();
  for (const o of group.children) {
    o.geometry.computeBoundingBox();
    bb.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrix));
  }
  const m = bb.getCenter(new THREE.Vector3());
  const ax = Math.abs(axis.x), ay = Math.abs(axis.y), az = Math.abs(axis.z);
  if (ax >= ay && ax >= az) m.x = axis.x > 0 ? bb.max.x : bb.min.x;
  else if (ay >= az) m.y = axis.y > 0 ? bb.max.y : bb.min.y;
  else m.z = axis.z > 0 ? bb.max.z : bb.min.z;
  return m;
}
const _mz = new THREE.Vector3();
function muzzleWorld() {
  const w = WEAP.worn[slotNow().key];
  if (w && w.muzzle && w.host) return _mz.copy(w.muzzle).applyMatrix4(w.host.matrixWorld);
  return _mz.set(player.pos.x, player.pos.y + RIG.height * .62, player.pos.z);
}

// WHERE IS HE POINTING? The aim is walked from the muzzle along his facing until it meets
// something, which is what the reticle is drawn at and what the bolt is aimed at -- ONE
// bearing, so the mark is a promise the gun keeps by construction rather than by two places
// agreeing. A mark the gun does not keep is worse than no mark at all.
const _ap = new THREE.Vector3();
function aimPoint() {
  const m = muzzleWorld(), h = cam.az;
  const dx = Math.sin(h), dz = Math.cos(h);
  const step = 1.1, R = WEAP.range;
  let d = 0, hit = 0;
  for (; d < R; d += step) {
    const e = Math.min(R, d + step);
    if (camHit(m.x + dx * e, m.y, m.z + dz * e, 0)) { hit = 1; break; }
  }
  if (hit) {
    // BISECT. A quantised probe is fine for a yes/no and wrong the moment something continuous
    // is DRAWN from it: the mark would only ever take values a step apart, and because he is
    // moving, the phase of the walk slides under him and the break lands a step earlier or
    // later from frame to frame -- which is a reticle that jumps a metre along the shot.
    let lo = d, hi = Math.min(R, d + step);
    for (let k = 0; k < 6; k++) {
      const mid = (lo + hi) * .5;
      if (camHit(m.x + dx * mid, m.y, m.z + dz * mid, 0)) hi = mid; else lo = mid;
    }
    d = lo;
  } else d = R;
  _ap.set(m.x + dx * d, m.y, m.z + dz * d);
  return { p: _ap, hit, dist: d };
}

// WHERE THE SHOT IS ACTUALLY GOING. **THE MARK AND THE BOLT ARE ONE ANSWER, AND FOR FIVE
// BUILDS THEY WERE TWO.** `paintRetic` drew the mark on the LOCKED MAN while `fireBolt` called
// `aimPoint`, which walks down `cam.az` and has never heard of the lock -- so the reticle sat on
// him and the round went past him, which is *"even though it was locked on, as soon as you
// release it shoots where the camera is pointing and not where the reticle is"*.
// My own note said this was true BY CONSTRUCTION. It was not: two places were agreeing about
// the unlocked case and disagreeing about the locked one, which is exactly what "by
// construction" is supposed to rule out. **A mark the gun does not keep is worse than no assist
// at all** -- and it is worse than it sounds, because the lock is what makes you stop aiming.
function aimTarget() {
  const L = player.lock;
  if (!L) return aimPoint();
  return { p: _ap.set(L.root.position.x, L.root.position.y + DUMMY.h * LOCK.chest, L.root.position.z),
           hit: 1, lock: 1, dist: Math.hypot(L.root.position.x - player.pos.x, L.root.position.z - player.pos.z) };
}

// ---- the charge ball at the muzzle ----
const chargeFx = glowBall(.22);
chargeFx.visible = false;
scene.add(chargeFx);

// ---- the bolts ----
const BOLTS = [];
function fireBolt(chg) {
  const m = muzzleWorld().clone();
  const a = aimTarget();
  const dir = new THREE.Vector3(a.p.x - m.x, a.p.y - m.y, a.p.z - m.z);
  if (dir.lengthSq() < 1e-6) dir.set(Math.sin(cam.az), 0, Math.cos(cam.az));
  dir.normalize();
  const size = .16 + chg * .40;
  const g = glowBall(size);
  g.position.copy(m);
  scene.add(g);
  BOLTS.push({ g, pos: m, vel: dir.multiplyScalar(WEAP.boltV), t: 0, chg, size });
}
function stepBolts(dt) {
  for (let i = BOLTS.length - 1; i >= 0; i--) {
    const b = BOLTS[i];
    b.t += dt;
    // TWO HALF-STEPS A FRAME. At forty-four metres a second a whole frame is most of a metre,
    // which is wide enough for a bolt to pass clean through a box.
    let dead = b.t > WEAP.boltLife;
    for (let k = 0; k < 2 && !dead; k++) {
      b.pos.addScaledVector(b.vel, dt * .5);
      // A BODY BEFORE A BOX. A bolt that tested the world first would pass through a man
      // standing against a wall, which is exactly where anybody stands.
      if (!dead && dummyHit(b.pos.x, b.pos.z, Math.atan2(b.vel.x, b.vel.z),
                            .45 + b.chg * .75, WEAP.boltR + .45)) dead = true;
      if (!dead && (camHit(b.pos.x, b.pos.y, b.pos.z, WEAP.boltR) || b.pos.y < 0)) dead = true;
    }
    b.g.position.copy(b.pos);
    // it flickers, which at sixty frames a second is what plasma looks like for the cost of
    // writing a scale
    ballSize(b.g, .9 + Math.random() * .22);
    if (dead) {
      snd('boom', { g: .28 + b.chg * .35, r: 1.25 - b.chg * .35 });
      b.g.traverse(o => { if (o.material) o.material.dispose(); });
      scene.remove(b.g); BOLTS.splice(i, 1);
    }
  }
}

// ---- the reticle ----
const reticEl = document.getElementById('retic');
const mmarkEl = document.getElementById('mmark');
const _rv = new THREE.Vector3();
function paintRetic() {
  const p = player;
  // THE HAMMER GETS ITS OWN, SIMPLER MARK, and it exists only while the wind-up is held.
  if (mmarkEl) {
    const show = p.charge > 0 && !p.aim;
    mmarkEl.classList.toggle('on', !!show);
    if (show) {
      const L = p.lock;
      const w = L ? _ap.set(L.root.position.x, L.root.position.y + DUMMY.h * LOCK.chest, L.root.position.z)
                  : _ap.set(p.pos.x + Math.sin(p.faceH) * 3, p.pos.y + RIG.height * .6, p.pos.z + Math.cos(p.faceH) * 3);
      _rv.copy(w).project(camera);
      if (_rv.z <= 1) {
        mmarkEl.style.transform =
          `translate(${((_rv.x * .5 + .5) * innerWidth).toFixed(1)}px,${((-_rv.y * .5 + .5) * innerHeight).toFixed(1)}px)`;
        mmarkEl.style.setProperty('--c', (p.chargeT / MELEE.charge).toFixed(3));
      } else mmarkEl.classList.remove('on');
    }
  }
  if (!p.aim || !reticEl) { if (reticEl) reticEl.classList.remove('on'); return; }
  // LOCKED, THE MARK IS ON HIM -- not on whatever the level walk happened to find. The mark IS
  // the promise, and a mark that sits beside the thing the gun is committed to is worse than
  // no mark at all.
  const a = aimTarget();
  _rv.copy(a.p).project(camera);
  if (_rv.z > 1) { reticEl.classList.remove('on'); return; }
  const x = (_rv.x * .5 + .5) * innerWidth, y = (-_rv.y * .5 + .5) * innerHeight;
  reticEl.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
  reticEl.style.setProperty('--c', p.chg.toFixed(3));
  reticEl.classList.add('on');
  // LOCKED IS A DIFFERENT MARK -- and it means the shot is COMMITTED to a body, not merely
  // that the level walk found a wall, which is what `hit` says and is true almost everywhere.
  reticEl.classList.toggle('lock', !!a.lock);
}

// ============================================================================================
// ANIMATION IS WEIGHTS, NOT CROSSFADES.
// `rigAnim` asks for a set of clip weights each frame and `setWeights` damps toward it. A
// `crossFadeFrom` state machine has to know what it is coming FROM, which breaks the first time
// two transitions overlap -- and they always eventually overlap.
// ============================================================================================
function skinWeights(skin, t, dt, snapHL, fb) {
  const acts = skin.actions, cw = skin.cw || (skin.cw = {});
  if (!acts) return;
  // THE T-POSE ESCAPE HATCH. If nothing in the table names a clip that actually exists, every
  // bone ends the frame at a total weight of zero -- and the mixer blends a zero-weight bone
  // back to its BIND value, which is the T-pose exactly. One missing clip is enough.
  // THE FALLBACK IS AN ARGUMENT because this drives the dummy too, and his idle is not the
  // player's -- falling back to a clip the skin does not have would take the escape hatch and
  // land straight in the T-pose it exists to prevent.
  let tot = 0;
  for (const k in t) if (acts[k]) tot += t[k];
  if (tot < .01) t = { [fb]: 1 };
  for (const nm in acts) {
    const a = acts[nm], want = t[nm] || 0, cur = cw[nm] || 0;
    const w = cw[nm] = damp(cur, want, snapHL || .055, dt);
    if (w > .002) { if (!a.isRunning()) a.play(); a.setEffectiveWeight(w); }
    // NEVER ASK `isRunning()` WHETHER A CLIP STILL MATTERS -- ASK ITS WEIGHT. three ends a
    // LoopOnce clip with `clampWhenFinished ? paused = true : enabled = false`, and
    // `isRunning()` is `enabled && !paused`, so every clip in `ONCE` is *not running* from the
    // instant it finishes. Shutting clips down inside `else if (a.isRunning())` therefore
    // skipped exactly the clips that need it: the finished clip kept the 1.0 it was last given
    // and went on applying its final frame for the rest of the session.
    else if (cur > .002 || a.getEffectiveWeight() > .002 || a.isRunning()) { a.setEffectiveWeight(0); a.stop(); }
  }
}
function setWeights(t, dt, snapHL) { skinWeights(rig, t, dt, snapHL, CLIPS.idle); }
// RE-ENTERING A `ONCE` CLIP HAS TO REWIND IT, AND THE DAMPED WEIGHT CANNOT BE WHAT DECIDES.
// Rewinding only when the weight has decayed below a threshold is right for a clip you have
// left alone and wrong for one you are re-entering immediately: roll, roll again before the
// first has faded, and the action is still PAUSED on its last frame, so it sits there applying
// that frame -- which on a roll is a forward step. The STATE that starts a clip rewinds it.
function skinPlay(skin, name, timeScale) {
  const a = skin.actions && skin.actions[name]; if (!a) return 0;
  a.reset(); a.play();
  a.setEffectiveTimeScale(timeScale || 1);
  return 1;
}
function playOnce(name, timeScale) { return skinPlay(rig, name, timeScale); }
// a clip and its upper-half clone, started together and kept in step
function playPair(name, timeScale) { skinPlay(rig, name, timeScale); skinPlay(rig, name + UP, timeScale); }
function setScale(name, s) { const a = rig.actions[name]; if (a) a.setEffectiveTimeScale(s); }
const clipLen = name => { const c = rig.clips[name]; return c ? c.duration : 0; };
const skinLen = (skin, name) => { const c = skin.clips && skin.clips[name]; return c ? c.duration : 0; };

// ============================================================================================
// THE PLAYER
// ============================================================================================
const player = {
  pos: new THREE.Vector3(0, 0, 4), vel: new THREE.Vector3(),
  heading: 0, faceH: 0, speed: 0, grounded: true, airT: 0, coyote: 0,
  goT: 0,                          // how long he has been asking to move -- the gather
  jump: 0, jumps: 0, fallV: 0,
  land: 0, landT: 0, landHard: 0,  // the landing state
  roll: 0, rollT: 0, rollH: 0,
  melee: 0, meleeIx: 0, meleeT: 0, meleeDur: 0, meleeChain: 0, meleeName: '',
  charge: 0, chargeT: 0, chargeGo: 0, chargeGoT: 0, chargeGoK: 1,
  aim: 0, armT: 0, chg: 0, fireT: 0, lock: null, melFired: 0, melV: 0, melTgt: null, melQ: null,
  comp: 0, compHold: 0, bias: null,   // the aim-pose correction, and the pose offset it is undoing
  slot: 0,
  r: .34, hh: 1.6,
};
const stick = { L: { x: 0, y: 0, down: 0, far: 0 }, R: { x: 0, y: 0, down: 0, far: 0 } };
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = 1; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = 0; });

// The left stick as a WORLD direction, relative to the camera azimuth. Every gesture on either
// pad goes through this same mapping (see `flickH`) so the stick and a flick can never disagree
// about which way is forward.
function stickWorld() {
  let lx = stick.L.x, ly = stick.L.y;
  if (keys.a || keys.arrowleft) lx -= 1; if (keys.d || keys.arrowright) lx += 1;
  if (keys.w || keys.arrowup) ly -= 1; if (keys.s || keys.arrowdown) ly += 1;
  lx = clamp(lx, -1, 1); ly = clamp(ly, -1, 1);
  const mag = Math.min(1, Math.hypot(lx, ly));
  if (mag < MOVE.dead) return { x: 0, z: 0, mag: 0 };
  const sa = Math.sin(cam.az), ca = Math.cos(cam.az);
  const dx = -ly * sa - lx * ca, dz = -ly * ca + lx * sa;
  const d = Math.hypot(dx, dz) || 1;
  return { x: dx / d, z: dz / d, mag: Math.pow(clamp((mag - MOVE.dead) / (1 - MOVE.dead), 0, 1), MOVE.curve) };
}
// A FLICK'S DIRECTION IN WORLD TERMS. The pad is in SCREEN space and the camera can be
// anywhere, so "up and to the right" is a different bearing every time the lens moves. Same
// mapping and same convention as `stickWorld`, in one place, so there is one thing to be wrong.
function flickH(dx, dy) {
  const sa = Math.sin(cam.az), ca = Math.cos(cam.az);
  return Math.atan2(-dy * sa - dx * ca, -dy * ca + dx * sa);
}

// ---- the kit ----------------------------------------------------------------------------
const wepName = document.getElementById('wepName'), wepHint = document.getElementById('wepHint');
