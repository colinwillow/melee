  () => { chargeRelease(); });

// THE HOLD IS READ PER FRAME RATHER THAN ON AN EDGE, because what it means depends on what is
// in his hand and that can change under a thumb that is already down.
function stepKit(dt) {
  const p = player, s = slotNow(), R = stick.R;
  const held = PADS.R ? PADS.R.hold() : 0;
  const up = -R.y, mag = Math.hypot(R.x, R.y);
  const holding = R.down && held > MOVE.tapT;

  // ---- the blaster: PRESS AND HOLD UP to take the firing position and wind a shot up,
  //      RELEASE to fire it. Four gates on the arming, and each rules out a different way of
  //      firing by accident:
  //        fireAt  how far up the pad it arms -- a nudge cannot reach it
  //        keepAt  and how far back DOWN it stands down. The GAP is hysteresis: a thumb
  //                rolling inward as it lifts must not cancel the shot you meant
  //        armT    how long it has to be up there, so a stab at the top is not a shot
  //        arc     how far off straight up it may be -- which is what lets this share a pad
  //                that is already carrying the camera and the jump
  //      It does NOT wait for `tapT` the way a hold does: a push to `fireAt` is already far
  //      past the tap's own `far < .42`, so the jump and the trigger cannot collide.
  if (s.aim) {
    const upish = R.down && up > 0 && Math.abs(Math.atan2(R.x, up)) < WEAP.arc;
    const arming = upish && mag > WEAP.fireAt;
    const keeping = p.aim && upish && mag > WEAP.keepAt;
    if (arming || keeping) {
      p.armT += dt;
      if (p.armT >= WEAP.armT && !p.aim) {
          // **ONE SOUND FOR ONE EVENT.** `chargeStart` already spins up the synth hum -- the
          // rising "waaaa" that IS the charge, for as long as it is held -- and a one-shot zap
          // fired beside it is a second voice describing the same thing. Capping its length at
          // m26 made it shorter and no less redundant. The `zap` sample is still loaded and
          // `mel.snd('zap')` still plays it; nothing in the blaster asks for it.
          p.aim = 1; chargeStart();
        }
    } else {
      // the edge. Everything that ends the hold -- letting go, rolling the thumb back down,
      // sweeping off the arc, backgrounding the app -- comes through here as one release.
      if (p.aim) {
        if (p.chg >= WEAP.minChg) {
          fireBolt(p.chg);
          p.fireT = 1;
          snd(p.chg > .82 ? 'big' : 'shot', { g: .42 + p.chg * .3, r: 1.12 - p.chg * .3 });
          // and it shoves him back along the shot -- the same bearing the bolt left on, so the
          // recoil cannot disagree with where the shot went
          const kh = p.lock ? lockH(p.lock) : cam.az;
          const kv = WEAP.kick + WEAP.kickChg * p.chg;
          p.vel.x -= Math.sin(kh) * kv; p.vel.z -= Math.cos(kh) * kv;
          playPair(CLIPS.shoot, clipLen(CLIPS.shoot) / WEAP.shootBeat);
        }
        p.chg = 0;
      }
      p.aim = 0; p.armT = 0;
    }
    p.chg = p.aim ? Math.min(1, p.chg + dt / WEAP.chargeT) : 0;
    if (p.aim) chargeStep(p.chg); else chargeStop();
  } else { if (p.aim || CHARGE.gain) chargeStop(); p.aim = 0; p.armT = 0; p.chg = 0; }

  // the ball winds up ON the muzzle, and the gun's blue lifts with it
  const showBall = p.chg > .02;
  chargeFx.visible = showBall;
  if (showBall) {
    chargeFx.position.copy(muzzleWorld());
    // the flicker is the same trick the bolt uses: a value thrown somewhere new every frame IS
    // what electricity looks like, for the cost of writing a scale
    ballSize(chargeFx, (.35 + p.chg * 1.5) * (.92 + Math.random() * .16));
  }
  GUNU.k.value = damp(GUNU.k.value, p.chg * WEAP.glow, .06, dt);

  // ---- the hammer: hold to wind up, let go to swing ----
  if (s.charge && holding && p.grounded && !p.melee && !p.roll && !p.chargeGo) {
    // REWOUND ON THE RISING EDGE. `weapon_melee_charge` is a ONCE clip so it holds its last
    // frame -- a man straining rather than winding up over and over -- and a clip that holds
    // has to be rewound BY THE STATE that starts it or the second charge never winds up.
    // BOTH HALVES ARE STARTED. Which one is DRAWN depends on whether he happens to be moving,
    // and that can change mid-clip -- so the one that is not being drawn still has to be at the
    // right place in its own timeline for the moment it is.
    if (!p.charge) { playPair(CLIPS.chargeUp, clipLen(CLIPS.chargeUp) / MELEE.chargeBeat); snd('swoosh', { g: .55, r: .5 }); }
    p.charge = 1; p.chargeT = Math.min(MELEE.charge, p.chargeT + dt);
  } else if (!holding && p.charge) chargeRelease();

  if (p.fireT > 0) p.fireT = Math.max(0, p.fireT - dt / (WEAP.shootBeat + WEAP.shootHold));
  padR.classList.toggle('arm', !!(p.aim || (p.charge && p.chargeT > MELEE.charge * .5)));
}

// ============================================================================================
// LOCOMOTION. Three separate ideas, and the moonwalk comes from missing the third.
//   1. the GATHER lives in `push` -- how much of his acceleration he HAS, climbing from `push0`
//      over `pushT`, with `accFall` thinning it again near the top speed. Not in the target
//      speed and not in a momentum term.
//   2. `heading` is the thumb, taken instantly. `faceH` is the BODY, coming round at `face0` on
//      the spot and `face1` at a run. He is DRAWN at `faceH`.
//   3. `plant`: at a walk the legs push where the thumb says, at a run they push along `faceH`.
//      WITHOUT THIS the velocity keeps answering the stick while the body has already turned,
//      which *is* the moonwalk. `turnBrake` costs him speed through a hard turn, which is what
//      plants the feet rather than just pointing them.
// ============================================================================================
function integrate(dt, wantX, wantZ, wantSp, ctl) {
  const p = player;

  if (ctl) {
    const sp0 = Math.hypot(p.vel.x, p.vel.z);
    // the gather, and `accFall` measures against the speed he is ACTUALLY being asked for.
    // Against a fixed ceiling it pins the acceleration at its floor the moment he passes that
    // ceiling, so a raised target can never be reached and raising it reads as doing nothing.
    const ramp = 1 - MOVE.accFall * smooth(0, 1, sp0 / Math.max(.5, wantSp || MOVE.max));
    const push = lerp(MOVE.push0, 1, clamp(p.goT / MOVE.pushT, 0, 1));
    const acc = (p.grounded ? MOVE.acc : MOVE.airAcc) * push * Math.max(.08, ramp);
    if (wantSp > 0) {
      const tx = wantX * wantSp, tz = wantZ * wantSp;
      const ex = tx - p.vel.x, ez = tz - p.vel.z, e = Math.hypot(ex, ez);
      if (e > 1e-4) {
        // SPEEDING UP IS RAMPED, SLOWING DOWN IS NOT. `accFall` is about how fast he can pick
        // speed UP, and slowing down is not accelerating -- one sign test. Without it a body
        // carrying speed out of a lunge takes twenty seconds to come back to a walk, which
        // reads as ice.
        const along = (ex * p.vel.x + ez * p.vel.z) / (sp0 || 1);
        const rate = (along >= 0 ? acc : MOVE.acc) * dt;
        const k = Math.min(1, rate / e);
        p.vel.x += ex * k; p.vel.z += ez * k;
      }
    } else {
      const k = Math.exp(-(p.grounded ? MOVE.drag : MOVE.airDrag) * dt * .25);
      p.vel.x *= k; p.vel.z *= k;
    }
  }

  p.vel.y -= MOVE.g * dt;
  const px = p.pos.x, pz = p.pos.z;
  p.pos.x += p.vel.x * dt; p.pos.z += p.vel.z * dt; p.pos.y += p.vel.y * dt;

  const solid = resolveBoxes(p.pos, p.r, p.hh) | pushBodies(p.pos, p.r);
  if (solid) {
    // only the component going INTO the surface is removed, so a slide along a wall keeps its
    // speed by itself and needs no extra scrub
    const mx = p.pos.x - px, mz = p.pos.z - pz;
    if (Math.abs(mx) < 1e-6) p.vel.x = 0;
    if (Math.abs(mz) < 1e-6) p.vel.z = 0;
  }

  const gy = groundAt(p.pos.x, p.pos.z, p.pos.y, MOVE.step);
  let landed = 0;
  if (p.grounded) {
    if (p.pos.y - gy > MOVE.step) { p.grounded = false; p.airT = 0; p.coyote = MOVE.coyote; }
    else { p.pos.y = gy; p.vel.y = 0; }
  } else {
    p.airT += dt;
    if (p.coyote > 0) p.coyote -= dt;
    if (p.vel.y <= 0 && p.pos.y <= gy + .04) {
      p.fallV = -p.vel.y;
      p.pos.y = gy; p.vel.y = 0; p.grounded = true; p.jumps = 0; landed = 1;
    }
  }
  p.speed = Math.hypot(p.vel.x, p.vel.z);
  return landed;
}

function stepPlayer(dt) {
  const p = player;
  const hadLock = p.lock;
  p.lock = findLock();
  if (p.lock && p.lock !== hadLock) snd('lock', { g: .3, r: 1.5 });
  const s = p.lock ? stickLocked(p.lock) : stickWorld();

  // ---- the states that OWN the body. Each bleeds its own speed off and still runs gravity
  //      and the ground collider, so the ground hands him straight back to the air code.
  if (p.roll || p.melee || p.chargeGo) {
    const which = p.roll ? 'roll' : p.melee ? 'melee' : 'charge';
    const dur = p.roll ? MELEE.rollDur : p.melee ? p.meleeDur : (p.goDur || MELEE.finishBeat);
    const tRef = p.roll ? (p.rollT += dt) : p.melee ? (p.meleeT += dt) : (p.chargeGoT += dt);
    const u = clamp(tRef / dur, 0, 1);
    // full speed for `carry` of the move, then linear to zero. A flat linear bleed averages
    // half the launch speed, so every metre of travel has to be bought with a speed spike at
    // the front -- which reads as a rocket rather than a lunge.
    const k = u < MELEE.carry ? 1 : 1 - (u - MELEE.carry) / (1 - MELEE.carry);
    // THE BLOW LANDS WHEN THE LIMB REACHES HIM, AND NOT BEFORE. `at` no longer FIRES the hit --
    // it opens the window the sweep is allowed to count in, so a swing that misses misses.
    if (!p.roll) {
      const at = p.melee ? MELEE.at[Math.min(p.meleeIx, MELEE.at.length - 1)] : MELEE.finishAt;
      const pw = p.melee ? MELEE.power[Math.min(p.meleeIx, MELEE.power.length - 1)]
                         : 1.0 * (p.chargeGoK || 1);
      // THE SWEEP RUNS EVERY FRAME even while the window is shut, because the previous
      // positions it measures against have to stay one frame old -- a sweep seeded three
      // frames back is a segment through half the room.
      const dm = p.chargeGo ? FOE.dmg.finish : slotNow().charge ? FOE.dmg.weap : FOE.dmg.fist;
      if (strikeSweep(dt, pw, !p.melFired && u >= at * STRIKE.from && u <= STRIKE.to, dm)) {
        p.melFired = 1;
        // a hammer rings and a fist thuds -- the weapon decides, not the strike
        if (slotNow().charge) snd('clang', { g: .85, r: .9 + Math.random() * .2 });
        else snd('thud', { g: .8, r: 1.05 + Math.random() * .15 });
      }
    }
    const h = p.roll ? p.rollH : p.faceH;
    const v0 = p.roll ? MELEE.rollV : (p.melV || MELEE.finishV * (p.chargeGoK || 1));
    // A LEAP IN THE AIR KEEPS ITS SPEED -- that is what ballistic MEANS, and the whole reason
    // the arc lands where it was solved to. The `carry` bleed is for a grounded lunge, so the
    // charged swing only takes it once his feet are back down and it becomes a skid.
    const kk = (p.chargeGo && !p.grounded) ? 1 : k;
    p.vel.x = Math.sin(h) * v0 * kk; p.vel.z = Math.cos(h) * v0 * kk;
    p.faceH = h; p.heading = h;
    integrate(dt, 0, 0, 0, false);
    // THE TAIL IS CANCELLABLE. Holding the whole clip makes a three-punch chain feel like three
    // seconds of watching; past `hold`, a stick on the pad takes him out of the recovery, which
    // is what makes each link in the chain a decision rather than a wait.
    // A STRIKE IS NEVER CUT SHORT. Only the ROLL can be run out of early -- a roll is a move
    // you spend to go somewhere and its tail is yours; a strike is a blow, and a blow that the
    // next input truncates never reads as having landed. The whole reason the beats came down
    // is that this rule is only bearable when each one is over quickly.
    const out = p.roll ? (u >= 1 || (u > MELEE.rollFree && s.mag > .3)) : u >= 1;
    if (out) {
      if (p.roll) p.roll = 0;
      else if (p.melee) {
        p.melee = 0; p.meleeChain = MELEE.window;
        // and the flick that arrived mid-strike is taken NOW, so a chain thrown as fast as the
        // thumb can move still lands every link
        if (p.melQ != null) { const q = p.melQ; p.melQ = null; meleeGo(q); }
      } else {
        p.chargeGo = 0;
        if (p.melQ != null) { const q = p.melQ; p.melQ = null; meleeGo(q); }
      }
    }
    return;
  }
  if (p.meleeChain > 0) { p.meleeChain -= dt; if (p.meleeChain <= 0) p.melQ = null; }

  // ---- the landing states: he can move out of them, but not instantly ----
  if (p.land) {
    p.landT += dt;
    if (p.landT >= p.land || (p.landT > p.land * MOVE.landFree && s.mag > .3)) p.land = 0;
  }

  // ---- the jump ----
  if (p.jump) {
    p.jump = 0;
    if ((p.grounded || p.coyote > 0) && !p.land) {
      p.vel.y = MOVE.jump; p.grounded = false; p.coyote = 0; p.airT = 0; p.jumps = 1;
      // the same swoosh the strikes use, pitched UP and quiet -- a body leaving the ground is
      // a smaller version of the same event, and a second sample for it would be a second
      // thing to keep in step with the first
      snd('swoosh', { r: 1.45, g: .34 });
    }
  }

  // ---- ordinary locomotion ----
  // AIMED, HE FACES THE SHOT AND TRAVELS WHEREVER THE THUMB SAYS -- which is a STRAFE, and it
  // is why `plant` has to go to zero here. `plant` swings the velocity onto his facing as he
  // speeds up, which is right for running and exactly wrong while aiming, since it would drag
  // every step round to point down the barrel.
  const aiming = committed() || !!p.lock;
  let wantSp = MOVE.max * s.mag;
  if (aiming) wantSp = Math.min(wantSp, GAIT.aimRunRef);
  if (p.land) wantSp *= .35;
  // **A BLOW TAKES THE CONTROLS AWAY FOR A MOMENT, WHICH IS WHAT MAKES IT A BLOW.** Without it
  // a mace landing is a small push you steer straight out of, and getting hit reads as nothing.
  // It is short on purpose -- being unable to move is the least fun state in any game, and the
  // knockback is doing most of the work.
  if (p.hurtT > 0) { p.hurtT = Math.max(0, p.hurtT - dt); wantSp = 0; }
  // AND IT COMES BACK ON ITS OWN, after a pause long enough that a fight is not free. There is
  // no death yet, so what running out of health costs you is nothing -- stated, not hidden.
  if (p.hurtWait > 0) p.hurtWait = Math.max(0, p.hurtWait - dt);
  else if (p.hp < HEALTH.max) p.hp = Math.min(HEALTH.max, p.hp + HEALTH.regen * dt);

  if (s.mag > 0) {
    p.goT += dt;
    const tgt = Math.atan2(s.x, s.z);
    if (!aiming) {
      const rate = (p.grounded ? MOVE.turn : MOVE.airTurn) * dt;
      p.heading += clamp(wrapAngle(tgt - p.heading), -rate, rate);
    }
  } else p.goT = 0;

  // aiming, he faces where the camera looks; otherwise he faces where he is going
  // LOCKED, HE FACES THE TARGET -- not the lens. That is what makes the strafes read.
  const faceTgt = p.lock ? lockH(p.lock) : aiming ? cam.az : p.heading;
  const fRate = (p.lock ? LOCK.face : aiming ? MOVE.face0 : lerp(MOVE.face0, MOVE.face1, clamp(p.speed / MOVE.max, 0, 1))) * dt;
  p.faceH += clamp(wrapAngle(faceTgt - p.faceH), -fRate, fRate);

  // PLANT. At a walk the legs push where the thumb says; at a run, along `faceH`.
  let wx = s.x, wz = s.z;
  if (s.mag > 0 && !aiming) {
    const plant = smooth(MOVE.plantAt, MOVE.plantFull, p.speed);
    const fx = Math.sin(p.faceH), fz = Math.cos(p.faceH);
    wx = lerp(s.x, fx, plant); wz = lerp(s.z, fz, plant);
    const d = Math.hypot(wx, wz) || 1; wx /= d; wz /= d;
    // a hard turn costs him speed -- this is what plants the feet rather than just pointing them
    const off = Math.abs(wrapAngle(Math.atan2(s.x, s.z) - p.faceH));
    wantSp *= 1 - MOVE.turnBrake * smooth(.6, Math.PI, off);
  }

  const landed = integrate(dt, wx, wz, wantSp, true);
  if (landed) {
    // SOFT OR HARD IS THE IMPACT SPEED, not how long he was in the air: a long float onto a
    // box top is a soft landing and a short drop off a ledge at pace is not.
    const hard = p.fallV > MOVE.hardLand;
    p.landHard = hard ? 1 : 0;
    const nm = hard ? CLIPS.landHard : CLIPS.landSoft;
    p.land = hard ? MOVE.landHard : MOVE.landSoft; p.landT = 0;
    // the clip is compressed to the beat the STATE lasts, so the two cannot disagree
    playOnce(nm, clipLen(nm) / p.land);
  }
}

// ============================================================================================
// THE WEIGHT TABLE
// ============================================================================================
function rigAnim(dt) {
  const p = player, sp = p.speed, t = {};

  if (p.roll) { t[CLIPS.roll] = 1; setWeights(t, dt); return; }
  if (p.melee) { t[p.meleeName] = 1; setWeights(t, dt); return; }
  if (p.chargeGo) { t[CLIPS.chargeGo] = 1; setWeights(t, dt); return; }
  if (!p.grounded) {
    // `in_air` is 2.83 s of a subtle float and loops, so it reads at any airtime; a jump here
    // is about 0.84 s, so what is seen is its opening third.
    t[CLIPS.air] = 1; setWeights(t, dt); return;
  }
  if (p.land) {
    // FULL WEIGHT UNTIL `landFree`, THEN IT GIVES WAY. Ramping it down from the first frame
    // put the gait at 0.55 through the whole second half, which dilutes exactly the part of a
    // hard landing worth watching -- he comes out of the roll with a run blended over it.
    const nm = p.landHard ? CLIPS.landHard : CLIPS.landSoft;
    const u = clamp(p.landT / p.land, 0, 1), f = MOVE.landFree;
    t[nm] = u < f ? 1 : 1 - (u - f) / (1 - f);
  }

  const add = (nm, w, ref) => {
    if (w <= 0) return;
    t[nm] = (t[nm] || 0) + w;
    if (ref) setScale(nm, clamp(sp / ref, GAIT.tsLo, GAIT.tsHi));
  };
  const rest = p.land ? 1 - (t[p.landHard ? CLIPS.landHard : CLIPS.landSoft] || 0) : 1;

  // ---- COMMITTED: the legs strafe, the arms hold the weapon, and neither knows about the
  //      other. Every bone is claimed exactly once, so they compose rather than average.
  if (committed()) {
    const up = p.fireT > 0 ? CLIPS.shoot : p.charge ? CLIPS.chargeUp : CLIPS.aimPose;
    const moving = sp > .25;
    // STANDING STILL IS THE WHOLE CLIP, NOT THE HYBRID. The split exists to put a weapon pose
    // on STRAFING legs; standing there are no strafing legs to put it on, and half a running
    // stride held under a pose reads as a man caught mid-step -- which is exactly what it was.
    // The hybrid is for moving left and right and nothing else.
    if (!moving) { add(up, rest, 0); setWeights(t, dt); return; }
    // the UPPER half: what he is doing with the weapon
    add(rig.actions[up + UP] ? up + UP : up, rest, 0);
    // the LOWER half: which way he is travelling RELATIVE TO HIS NOSE, because he is facing
    // the target and "how fast" no longer picks the clip -- "which way" does.
    const L = n => (rig.actions[n + LEGS] ? n + LEGS : n);
    {
      const rel = wrapAngle(Math.atan2(p.vel.x, p.vel.z) - p.faceH);
      const c = Math.cos(rel), sn = Math.sin(rel);
      const fwd = Math.abs(c), lat = Math.abs(sn), tot = fwd + lat || 1;
      if (c >= 0) add(L(CLIPS.aimRun), rest * fwd / tot, GAIT.aimRunRef);
      else add(L(CLIPS.back), rest * fwd / tot, GAIT.backRef);
      // +X IS HIS LEFT. Heading grows from +Z toward +X and his right is (-fz, fx), so a
      // POSITIVE sine is a strafe to the LEFT. Written down because that argument comes out
      // backwards half the time, and the strafe clips are picked by its sign.
      add(L(sn >= 0 ? CLIPS.strafeL : CLIPS.strafeR), rest * lat / tot, GAIT.strafeRef);
    }
    setWeights(t, dt); return;
  }

  // ---- carrying it, but not committed: the ordinary armed gait, whole body ----
  if (gunOut()) {
    // CARRYING IT: the rifle idle standing, the rifle run moving. There is no rifle WALK in
    // the set, so the run takes the whole moving range and `tsLo` holds it down at the bottom.
    const wMove = smooth(0, GAIT.walkAt * 2.2, sp);
    add(CLIPS.aimIdle, rest * (1 - wMove), 0);
    add(p.fireT > 0 ? CLIPS.aimRunShoot : CLIPS.aimRun, rest * wMove, GAIT.aimRunRef);
    setWeights(t, dt); return;
  }

  // ---- the ordinary gait: four clips weighted by MEASURED speed, never a run flag ----
  // A CHAIN, SO THE FOUR ALWAYS SUM TO EXACTLY 1. `idleAt` is its own edge now rather than
  // sharing `walkAt`, which is what lets the walk own a real stretch of the pad while the idle
  // still lets go promptly -- and a table that dips below 1 mid-crossfade bleeds the BIND pose
  // in, which is the T-pose exactly.
  const A = smooth(0, GAIT.idleAt, sp);                 // moving at all
  const B = smooth(GAIT.walkAt, GAIT.runAt, sp);        // walk -> run
  const C = smooth(GAIT.runAt, GAIT.sprintAt, sp);      // run -> sprint
  const wIdle = 1 - A, wWalk = A * (1 - B), wRun = A * B * (1 - C), wSpr = A * B * C;
  add(CLIPS.idle, wIdle * rest, 0);
  add(CLIPS.walk, wWalk * rest, GAIT.walkRef);
  add(CLIPS.run, wRun * rest, GAIT.runRef);
  add(CLIPS.sprint, wSpr * rest, GAIT.sprintRef);
  setWeights(t, dt);
}

// ============================================================================================
// POINTING THE GUN STRAIGHT AHEAD
//
// *"He's supposed to be always pointing straight ahead... when it charges it doesn't need to
// move at all, but when he releases it's supposed to kick up and he's supposed to move back."*
//
// THREE SPINE TWISTS WENT INTO THIS AND ALL THREE MADE IT WORSE, SO THE MECHANISM IS GONE.
// m16 read the parent frame off a SCALED `matrixWorld`, which returns a non-unit quaternion, so
// the conjugation was a shear and it hunched him. m17 fixed that -- and the correction promptly
// wound up to its own clamp and parked there, because `aimUntwist` + `mixer.update` wipe the
// edit before `barrelH` measures again, so the integrator never once saw its own output. m18
// closed that in closed form and it STILL swung, because three's world matrices are a frame
// stale at that point, so the reading carried the previous frame's correction after all --
// which is exactly *"his gun starts out pointing to the right and he moves it across his chest
// all the way to the left"*. Each fix was real and each one uncovered the next: **a per-bone
// edit whose own effect feeds the thing that measures it has no version that is simply right.**
//
// **SO THE BODY TURNS, NOT THE SPINE.** How far the pose holds the weapon off his nose is a
// RIGID property of that pose, so undoing it is a rigid yaw on the ROOT: one number, no
// conjugation, no bone to unravel, nothing to take off again before the mixer writes -- and it
// cannot shear anything, because a root yaw is the same turn every bone was already getting.
//
// AND IT IS MEASURED WITH NO LOOP IN IT. `barrelH` returns a WORLD bearing and the comp is part
// of the root yaw that produced it, so subtracting the yaw THAT FRAME WAS ACTUALLY DRAWN AT
// removes the comp exactly. `bias` is therefore invariant to the comp -- it is the pose's own
// offset and nothing else, which is the one thing an integrator on the spine could never be
// told. `rig.drawnYaw` is stored where it is written rather than recomputed here, because a
// frame-stale reading against a freshly written yaw is the whole bug this note is about.
// ============================================================================================
const POSE = {
  // A CEILING, not a number it lives at. Measured off the real clips, `shoot` holds the weapon
  // 18 deg off his nose and `rifle_run` holds it dead straight, so this can only ever stop
  // something going wrong.
  max: .70,
  // a half-life, not a gain: the target is exact, so all this decides is how fast he gets there
  half: .07,
  on: 1,
};
const _wa = new THREE.Vector3(), _wb = new THREE.Vector3();
// THE BARREL'S OWN WORLD BEARING. The two mount markers are exactly two points on it, so
// nothing about where the gun points is typed here -- and `weapon_tip` being the mount's AXIS
// marker rather than the muzzle is all this needs it to be.
function barrelH() {
  const w = WEAP.worn[slotNow().key];
  const host = w && w.host; if (!host) return null;
  let tip = null;
  for (const c of host.children) if (/tip/.test(c.name)) tip = c;
  if (!tip) return null;
  host.getWorldPosition(_wa); tip.getWorldPosition(_wb);
  const dx = _wb.x - _wa.x, dz = _wb.z - _wa.z;
  if (dx * dx + dz * dz < 1e-8) return null;
  return Math.atan2(dx, dz);
}
// How far the POSE holds the weapon off his nose, in his own frame -- read fresh every frame so
// it tracks the recoil and survives a re-export, and free of the comp by construction.
function poseBias() {
  if (rig.drawnYaw == null) return null;
  const bh = barrelH();
  return bh == null ? null : wrapAngle(bh - rig.drawnYaw);
}
// The rigid yaw that puts the barrel down his nose. RETURNED rather than applied, so there is
// exactly one place in the file the root's rotation is written.
function aimComp(dt) {
  const p = player;
  let tgt = 0;
  // GUN ONLY. `committed()` also covers the hammer being wound, and the melee wind-up is a
  // deliberately BLADED stance -- *"he's kind of in a sideways ninja stance and that's all
  // good"* -- so pointing the hammer down his nose would straighten out the one pose he likes.
  if (POSE.on && gunOut() && committed()) {
    // AND IT HOLDS THROUGH THE RECOIL. The bolt has already left on the bearing it left on, and
    // re-aiming underneath the follow-through swings the gun during the one beat that is meant
    // to be held still.
    if (p.fireT > 0) tgt = p.compHold || 0;
    else {
      const b = poseBias();
      p.bias = b;
      if (b != null) tgt = clamp(-b, -POSE.max, POSE.max);
      p.compHold = tgt;
    }
  } else p.bias = null;
  p.comp = damp(p.comp || 0, tgt, POSE.half, dt);
  return p.comp;
}

// ============================================================================================
// THE CHAIN SOLVER
// ============================================================================================
// FIND THEM. An unbranched run of bones that no clip meaningfully moves. Returns chain roots
// with their bone lists; the CALLER decides what to do with the tracks.
function findChains(root, clips) {
  const move = {};                       // worst rotation any clip puts on each bone, radians
  for (const c of clips) for (const t of c.tracks) {
    if (!/\.quaternion$/.test(t.name)) continue;
    const nm = t.name.slice(0, t.name.lastIndexOf('.')), v = t.values, n = v.length / 4;
    let w = 0;
    for (let i = 1; i < n; i++) {
      let d = 0; for (let k = 0; k < 4; k++) d += v[k] * v[i * 4 + k];
      // **2*acos(|dot|), NOT A COMPONENT DELTA.** q and -q are the same rotation, so a
      // component swinging -1 to +1 reads as a delta of 2 and is a sign flip.
      w = Math.max(w, 2 * Math.acos(Math.min(1, Math.abs(d))));
    }
    move[nm] = Math.max(move[nm] || 0, w);
  }
  const inert = b => (move[b.name] || 0) < CHAIN.inert;
  const out = [];
  root.traverse(b => {
    if (!b.isBone || !inert(b)) return;
    // a chain ROOT is an inert bone whose parent is not an inert single-child bone
    const p = b.parent;
    if (p && p.isBone && inert(p) && p.children.filter(c => c.isBone).length === 1) return;
    const bones = [];
    let c = b;
    while (c && c.isBone && inert(c)) {
      bones.push(c);
      const kids = c.children.filter(k => k.isBone);
      c = kids.length === 1 ? kids[0] : null;
    }
    if (bones.length >= CHAIN.minBones) out.push(bones);
  });
  return out;
}

const _cv = new THREE.Vector3(), _cw = new THREE.Vector3(), _cq = new THREE.Quaternion();
const _cp = new THREE.Quaternion(), _cd = new THREE.Vector3(), _ch = new THREE.Vector3();
const _ci = new THREE.Quaternion(), _cpv = new THREE.Vector3();
// BUILD the particle state. World-space points at each bone's head, plus one virtual TIP so the
// last bone has a direction of its own -- without it the final bone is dead weight.
function chainInit(skin, clips) {
  const model = skin.model;
  model.updateMatrixWorld(true);
  const sets = findChains(model, clips);
  skin.chains = [];
  for (const bones of sets) {
    const kind = CHAIN.kinds.find(k => k.test.test(bones[0].name)) || CHAIN.def;
    const pts = [], prev = [], rest = [];
    for (const b of bones) { const v = new THREE.Vector3(); b.getWorldPosition(v); pts.push(v); prev.push(v.clone()); }
    // the tip: carry the last segment on by its own length
    const n = bones.length;
    const tip = pts[n - 1].clone().add(_cv.copy(pts[n - 1]).sub(pts[n - 2]));
    pts.push(tip); prev.push(tip.clone());
    for (let i = 0; i < n; i++) rest.push(pts[i].distanceTo(pts[i + 1]));
    // each bone's rest direction IN ITS OWN LOCAL SPACE -- where the chain runs before anything
    // touches it, which is what the solve rotates FROM. Never typed, never an assumed axis.
    const axis = [];
    for (let i = 0; i < n; i++) {
      const child = i + 1 < n ? bones[i + 1] : null;
      const v = child ? child.position.clone() : new THREE.Vector3(0, rest[i] / (bones[i].getWorldScale(_cv).x || 1), 0);
      if (v.lengthSq() < 1e-12) v.set(0, 1, 0);
      axis.push(v.normalize());
    }
    skin.chains.push({ bones, pts, prev, rest, axis, kind,
                       // where every particle sat BEFORE the constraint pass, so the velocity a
                       // correction is allowed to create can be metered -- see `CHAIN.snap`
                       pre: pts.map(v => v.clone()),
                       home: bones.map(b => b.quaternion.clone()) });
  }
  // the body hulls, resolved to real bones once
  skin.hulls = [];
  // the radii are FRACTIONS OF HER HEIGHT, so a re-export at any size still fits. `skin.tall`
  // is the world height the caller measured; nothing here is in the file's own units.
  const H = skin.tall || 1.75;
  for (const h of CHAIN.hulls) {
    let b = null; model.traverse(o => { if (!b && o.isBone && h.bone.test(o.name)) b = o; });
    if (b) skin.hulls.push({ b, r: h.r * H, up: h.up * H });
  }
  skin.chainT = 0;
  console.log('[melee] chains: ' + skin.chains.length + ' (' +
              skin.chains.map(c => c.bones[0].name + ':' + c.bones.length).join(' ') + ')');
  return skin.chains.length;
}

// ONE SUBSTEP of Verlet + constraints, then the bones are written from the points.
function chainStep(skin, dt) {
  if (!CHAIN.on || !skin.chains || !skin.chains.length) return;
  // **A FIXED SUBSTEP.** Verlet is unstable under a varying dt, and without this a 120 Hz phone
  // plays different hair from a 30 Hz one.
  const h = 1 / CHAIN.hz;
  skin.chainT = Math.min(skin.chainT + dt, h * CHAIN.maxSub);
  let subs = 0;
  while (skin.chainT >= h && subs < CHAIN.maxSub) { skin.chainT -= h; subs++; }
  if (!subs) { chainWrite(skin); return; }

  // where the hulls are THIS frame
  for (const H of skin.hulls) { H.b.getWorldPosition(_cv); H.x = _cv.x; H.y = _cv.y + H.up; H.z = _cv.z; }

  for (let sub = 0; sub < subs; sub++) {
    for (const C of skin.chains) {
      const { bones, pts, prev, rest, kind, pre } = C, n = bones.length;
      // **PARTICLE 0 IS PINNED TO THE SKELETON**, which is the whole mechanism: it goes exactly
      // where her head goes, and everything behind it arrives late.
      _cpv.copy(pts[0]);
      bones[0].getWorldPosition(pts[0]); prev[0].copy(pts[0]);
      // how far the pin itself moved this substep. The speed cap below is measured against it,
      // so running never clamps a strand and only hair moving fast through HER frame is held.
      _cpv.subVectors(pts[0], _cpv);
      const cap = CHAIN.maxV * h;
      // per SECOND, converted to this substep -- see the note on `CHAIN.kinds`. The drag is
      // `2*sqrt(stiff) * damping`, which is critical damping scaled, so the two can never
      // drift apart when one of them is tuned.
      for (let i = 1; i <= n; i++) {
        const u = (i - 1) / Math.max(1, n - 1);
        const k = lerp(kind.stiff, kind.tipStiff, u);
        // **THE DAMPING IS AGAINST THE SPRING THIS ACTUALLY IS, AND `2*sqrt(k)` WAS NOT IT.**
        // `k` is a per-second RELAXATION RATE for the pull below, not a spring constant in
        // 1/s^2 -- and in Verlet a positional pull of fraction `a` IS an acceleration of
        // `a/h^2`, so the natural frequency is `sqrt(a)/h` and not `sqrt(k)`. At 90 Hz that is
        // 21 rad/s on a hair root rather than 2.2, so every particle was running at about
        // TWELVE PER CENT of critical damping -- a spring that rings for eight cycles, which
        // is the wiggle exactly. `c*h` then cancels the h: `2*sqrt(a)*ratio`.
        const a = 1 - Math.exp(-k * h);
        const damp = Math.exp(-2 * Math.sqrt(a) * kind.damping);
        const p = pts[i], q = prev[i];
        let vx = (p.x - q.x) * damp, vy = (p.y - q.y) * damp, vz = (p.z - q.z) * damp;
        // clamp the part that is NOT the body's own travel
        let rx = vx - _cpv.x, ry = vy - _cpv.y, rz = vz - _cpv.z;
        const rl = Math.sqrt(rx * rx + ry * ry + rz * rz);
        if (rl > cap) { const f = cap / rl; rx *= f; ry *= f; rz *= f; }
        vx = rx + _cpv.x; vy = ry + _cpv.y; vz = rz + _cpv.z;
        q.copy(p);
        p.set(p.x + vx, p.y + vy + kind.g * h * h, p.z + vz);
      }
      // **THE SPRING PULLS TOWARD THE *POSE*, AND THE POSE HAS TO BE RE-DERIVED.** Reading the
      // bones' current world positions would be springing toward the solver's OWN last output,
      // which is a no-op dressed up as stiffness -- the bones are carrying what this function
      // wrote last frame, not the authored rest. So the home chain is walked forward from the
      // pin with the HOME locals: the parent's world rotation, then each bone's rest quaternion
      // and rest length in turn. That is what the chain would look like with no dynamics, and
      // it is the only honest thing to pull back to.
      bones[0].parent.getWorldQuaternion(_cq);
      _ch.copy(pts[0]);
      for (let i = 0; i < n; i++) {
        _cq.multiply(C.home[i]);
        _cd.copy(C.axis[i]).applyQuaternion(_cq).normalize().multiplyScalar(rest[i]);
        _ch.add(_cd);
        const k = lerp(kind.stiff, kind.tipStiff, i / Math.max(1, n - 1));
        // this fraction IS the `a` the drag above derives its frequency from -- same k, same
        // particle, same expression -- so retuning a stiffness moves both halves together
        pts[i + 1].lerp(_ch, 1 - Math.exp(-k * h));
      }
      for (let i = 1; i <= n; i++) pre[i].copy(pts[i]);
      for (let it = 0; it < CHAIN.iters; it++) {
        for (let i = 0; i < n; i++) {
          const a = pts[i], b = pts[i + 1];
          _cd.copy(b).sub(a);
          const d = _cd.length() || 1e-6;
          // the head of each segment is already settled, so the whole correction goes on the
          // tail -- walking root to tip means one pass is nearly enough
          b.addScaledVector(_cd, (rest[i] - d) / d);
        }
        // and out of the body
        for (const H of skin.hulls) {
          for (let i = 1; i <= n; i++) {
            const p = pts[i], dx = p.x - H.x, dy = p.y - H.y, dz = p.z - H.z;
            const l2 = dx * dx + dy * dy + dz * dz;
            if (l2 >= H.r * H.r || l2 < 1e-9) continue;
            const l = Math.sqrt(l2), k = H.r / l;
            p.set(H.x + dx * k, H.y + dy * k, H.z + dz * k);
          }
        }
      }
      // **METER THE CORRECTION.** `prev` is what the next substep reads its velocity from, so
      // moving `prev` with the particle is how a projection is stopped from being banked as
      // speed. At `snap` 1 nothing moves and every correction rings on; at 0 the constraints
      // are pure position and add no energy whatever.
      const keep = 1 - CHAIN.snap;
      if (keep > 0) for (let i = 1; i <= n; i++) {
        const p = pts[i], q = prev[i], b = pre[i];
        q.set(q.x + (p.x - b.x) * keep, q.y + (p.y - b.y) * keep, q.z + (p.z - b.z) * keep);
      }
    }
  }
  chainWrite(skin);
}

// TURN THE POINTS BACK INTO BONE ROTATIONS. Root to tip, updating each matrix as we go, or the
// next bone reads a parent frame that is one bone stale.
function chainWrite(skin) {
  for (const C of skin.chains) {
    const { bones, pts, axis, kind } = C, n = bones.length;
    for (let i = 0; i < n; i++) {
      const b = bones[i];
      // **`getWorldQuaternion`, NEVER `setFromRotationMatrix(matrixWorld)`.** Her armature is
      // scaled, and three's own source says the trace formula assumes an UNSCALED matrix -- fed
      // a scaled one it returns a non-unit quaternion and the result is a shear, which is the
      // m17 bug that hunched the alien over.
      b.parent.getWorldQuaternion(_cp);
      _cd.copy(pts[i + 1]).sub(pts[i]);
      if (_cd.lengthSq() < 1e-10) continue;
      _cd.normalize();
      // the world direction this bone's own axis currently points, from the PARENT's frame and
      // the bone's home rotation -- so the solve is relative to the pose, not to the world
      _cw.copy(axis[i]).applyQuaternion(C.home[i]).applyQuaternion(_cp).normalize();
      _cq.setFromUnitVectors(_cw, _cd);
      // **A CONE, so a chain cannot fold back through itself.** Verlet has no notion of a joint
      // limit and a segment that inverts reads as a broken bone rather than as hair.
      // **AND IT HAS TO BE CANONICALISED FIRST.** q and -q are the same rotation, so on the far
      // side of w = 0 the stored axis is flipped too -- clamping to `-cone` about an already
      // flipped axis negates twice and the joint SNAPS the wrong way. That is the "glitchy"
      // half of his report, and it is the same q/-q trap this file already has a note about one
      // measurement over. Flip all four components, then the angle is always in [0, pi].
      if (_cq.w < 0) { _cq.x = -_cq.x; _cq.y = -_cq.y; _cq.z = -_cq.z; _cq.w = -_cq.w; }
      const ang = 2 * Math.acos(Math.min(1, _cq.w));
      if (ang > kind.cone) {
        _cv.set(_cq.x, _cq.y, _cq.z);
        if (_cv.lengthSq() < 1e-12) _cv.set(0, 1, 0);
        _cq.setFromAxisAngle(_cv.normalize(), kind.cone);
      }
      // q_local = inv(parentWorld) * delta * parentWorld * home.  The bone's world rotation at
      // HOME is `P * home`, `delta` turns its axis onto the solved direction in world space, so
      // the new world rotation is `delta * P * home` and the local is that with P taken off.
      // A SCRATCH, not a clone: 138 bones x 60 Hz is 8,000 quaternions a second to collect.
      _ci.copy(_cp).invert();
      b.quaternion.copy(_cp).premultiply(_cq).premultiply(_ci).multiply(C.home[i]);
      b.updateMatrixWorld(true);
    }
  }
}

// ============================================================================================
// THE FEMALE ALIEN -- a body to watch the chains on
// ============================================================================================
let she = null;
function buildShe(g) {
  const model = g.scene;
  // scale MEASURED off the geometry, never typed
  let lo = Infinity, hi = -Infinity;
  model.traverse(o => {
    if (!o.isSkinnedMesh || !o.geometry) return;
    o.geometry.computeBoundingBox();
    lo = Math.min(lo, o.geometry.boundingBox.min.y); hi = Math.max(hi, o.geometry.boundingBox.max.y);
  });
  const authored = hi - lo, scale = authored > .01 ? SHE.h / authored : 1;

  model.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) {
      if (!m.isMeshStandardMaterial) continue;
      // **THE EXPORT IS FINE AND THE `alphaTest` WAS MINE.** Read straight out of the file:
      // metallic 0, roughness 0.9, one base colour texture, NO normal map, a grey
      // `KHR_materials_specular` -- there is nothing wrong in there. What `alphaTest .5` does
      // to a texture whose alpha is NOT a cutout mask is punch holes through her, and what you
      // see through a hole is the inside of her far surface. That is *"like I'm seeing the back
      // of the normals"* exactly, and it survived m29 because m29 only took back the sidedness.
      // **A FIX THAT IS NOT JUSTIFIED BY A MEASUREMENT IS A SECOND BUG**, and this is the third
      // time in two builds I have changed two things about her material at once.
      // What DOES stay: `BLEND` is the exporter default whenever a texture carries an alpha
      // channel at all, and a transparent skin sorts against ITSELF -- her far side drawing
      // over her near side. With the alpha opaque that flag buys nothing and risks that, so it
      // comes off. Nothing else about the material is touched.
      if (m.transparent) { m.transparent = false; m.depthWrite = true; }
      m.alphaTest = SHE.alphaTest;                 // 0. Raise it only if she needs cut-out hair.
      if (SHE.side === 'front') m.side = THREE.FrontSide;
      else if (SHE.side === 'double') m.side = THREE.DoubleSide;
      if (m.map) { m.emissiveMap = m.map; m.emissive = new THREE.Color(0xffffff); }
      m.emissiveIntensity = RIG.emissive;
    }
  });
  model.scale.setScalar(scale);
  const root = new THREE.Group();
  root.add(model);
  root.position.set(SHE.path[0][0], 0, SHE.path[0][1]);
  scene.add(root);
  model.updateMatrixWorld(true);

  const pb = {}; model.traverse(o => { if (o.isBone) pb[o.name] = o; });
  const faceOff = -measureFacing(pb);
  let clips = normaliseClips(g.animations || []).filter(c => !SHE.drop.test(c.name));

  she = { root, model, mixer: new THREE.AnimationMixer(model), actions: {}, clips: {}, cw: {},
          faceOff, h: 0, wp: 1, speed: 0, tall: SHE.h, chains: null, hulls: [], chainT: 0 };
  // FIND THE CHAINS BEFORE THE TRACKS ARE STRIPPED -- "no clip moves it" is the test, so the
  // clips have to still have the tracks when it is asked.
  chainInit(she, clips);
  const own = new Set();
  for (const C of she.chains) for (const b of C.bones) own.add(b.name);
  // **AND NOW STRIP THEM.** They are keyed at their rest value, so the mixer would write that
  // rest pose onto every chain bone every frame and fight the solver for the same bones -- two
  // writers, which this file has paid for twice. It also takes 405 of her 579 channels out of
  // the mixer, which is most of her per-frame cost for bones that hold still.
  let cut = 0;
  clips = clips.map(c => {
    const keep = c.tracks.filter(t => !own.has(t.name.slice(0, t.name.lastIndexOf('.'))));
    cut += c.tracks.length - keep.length;
    return keep.length === c.tracks.length ? c : new THREE.AnimationClip(c.name, c.duration, keep);
  });

  for (const c of clips) {
    she.clips[c.name] = c;
    const a = she.mixer.clipAction(c);
    a.enabled = true; a.setEffectiveWeight(0); a.play();
    she.actions[c.name] = a;
  }
  console.log('[melee] she: ' + authored.toFixed(4) + ' m authored -> x' + scale.toFixed(3) +
              ', ' + clips.length + ' clips, ' + cut + ' chain channels stripped');
}

// THE CIRCUIT. Straight lines show nothing -- it is the TURNS that throw the hair, so the path
// is a loop with real corners in it and the long sides are run.
function stepShe(dt) {
  if (!she) return;
  const w = SHE.path[she.wp], p = she.root.position;
  const dx = w[0] - p.x, dz = w[1] - p.z, d = Math.hypot(dx, dz);
  if (d < SHE.at) { she.wp = (she.wp + 1) % SHE.path.length; }
  const tgt = Math.atan2(dx, dz);
  she.h += clamp(wrapAngle(tgt - she.h), -SHE.turn * dt, SHE.turn * dt);
  // she slows through a corner, which is what makes the corner read as one
  const off = Math.abs(wrapAngle(tgt - she.h));
  const want = (w[2] === 'run' ? SHE.runRef : SHE.walkRef) * (1 - .55 * smooth(.25, 1.4, off)) * (she.go === 0 ? 0 : 1);
  she.speed = damp(she.speed, want, .22, dt);
  p.x += Math.sin(she.h) * she.speed * dt;
  p.z += Math.cos(she.h) * she.speed * dt;
  p.y = groundAt(p.x, p.z, p.y, MOVE.step);
  she.root.rotation.y = she.h + she.faceOff;
  if (she.spin) she.root.rotation.y = (she.h += she.spin * dt) + she.faceOff;

  // the gait: her own two measured references, so the feet never slide
  const sp = she.speed, t = {};
  const A = smooth(0, SHE.walkRef * .5, sp), B = smooth(SHE.walkRef * 1.45, SHE.runRef * .95, sp);
  t[SHE.clips.idle] = 1 - A;
  t[SHE.clips.walk] = A * (1 - B);
  t[SHE.clips.run] = A * B;
  const sc = (nm, ref) => { const a = she.actions[nm]; if (a) a.setEffectiveTimeScale(clamp(sp / ref, .55, 1.7)); };
  sc(SHE.clips.walk, SHE.walkRef); sc(SHE.clips.run, SHE.runRef);
  skinWeights(she, t, dt, null, SHE.clips.idle);
  she.mixer.update(dt);
  // AFTER the mixer, because the solver OWNS those bones and the mixer must not be the last
  // writer on them -- and because the pin reads where the skeleton actually ended up.
  chainStep(she, dt);
}

// ============================================================================================
// THE DUMMY -- something to hit
// ============================================================================================
const DUMMIES = [];
// RASTERISE A SOLID MESH INTO COLUMNS. Two things about this are load-bearing and Shredworld
// paid for both:
//   1. **A TRIANGLE'S BOUNDING BOX IS NOT ITS SHAPE.** A big sloped quad running from the foot
//      of a wall to the top of a canopy has a box covering the whole span, so using the box's
//      height would tell every cell under the canopy that the wall reaches the ground. The box
//      picks the CELLS; the height over each one comes from the triangle's PLANE, clamped back
//      inside that triangle's own y range. A vertical face has no useful plane in y and keeps
//      its full span, which is correct.
//   2. **A CELL MUST AGREE WITH THE RUN IT JOINS, not merely fail to enlarge it.** Asking
//      whether adding a cell GROWS the run lets a short canopy cell (3.5..6.2) be swallowed by
//      a full-height wall run (0..6.2), because it grows it by nothing -- and then the whole
//      canopy comes out as one box reaching the ground. The test is on BOTH ends.
// COLS:START
function solidColumns(mesh, cfg, out) {
  const geo = mesh.geometry, pos = geo.attributes.position, idx = geo.index;
  if (!pos) return 0;
  const n = idx ? idx.count : pos.count;
  const m = mesh.matrixWorld;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  geo.computeBoundingBox();
  const wb = geo.boundingBox.clone().applyMatrix4(m);
  const W = wb.max.x - wb.min.x, D = wb.max.z - wb.min.z;
  // THE CELL GROWS TO FIT rather than the mesh being skipped -- a stadium gets coarse columns
  // and a bollard fine ones, and neither falls out of the collider for being the wrong size.
  let cell = cfg.cell;
  while ((Math.ceil(W / cell) + 1) * (Math.ceil(D / cell) + 1) > cfg.maxCells) cell *= 1.5;
  const nx = Math.max(1, Math.ceil(W / cell)), nz = Math.max(1, Math.ceil(D / cell));
  const hits = new Array(nx * nz);

  // EVERY HEIGHT AT WHICH A VERTICAL RAY THROUGH THE CELL CENTRE CROSSES THE SURFACE.
  // A vertical face has no XZ area and a vertical ray cannot cross one, which is correct and is
  // why the crossings all come from floors, roofs and slopes.
  for (let i = 0; i < n; i += 3) {
    const a = idx ? idx.getX(i) : i, b = idx ? idx.getX(i + 1) : i + 1, c = idx ? idx.getX(i + 2) : i + 2;
    A.fromBufferAttribute(pos, a).applyMatrix4(m);
    B.fromBufferAttribute(pos, b).applyMatrix4(m);
    C.fromBufferAttribute(pos, c).applyMatrix4(m);
    const ax = A.x, az = A.z, ex = B.x - ax, ez = B.z - az, fx = C.x - ax, fz = C.z - az;
    const det = ex * fz - fx * ez;
    if (Math.abs(det) < 1e-12) continue;
    const x0 = Math.min(A.x, B.x, C.x), x1 = Math.max(A.x, B.x, C.x);
    const z0 = Math.min(A.z, B.z, C.z), z1 = Math.max(A.z, B.z, C.z);
    const ci0 = Math.max(0, Math.floor((x0 - wb.min.x) / cell));
    const ci1 = Math.min(nx - 1, Math.floor((x1 - wb.min.x) / cell));
    const ck0 = Math.max(0, Math.floor((z0 - wb.min.z) / cell));
    const ck1 = Math.min(nz - 1, Math.floor((z1 - wb.min.z) / cell));
    const ey = B.y - A.y, fy = C.y - A.y;
    for (let ci = ci0; ci <= ci1; ci++) {
      const px = wb.min.x + (ci + .5) * cell - ax;
      for (let ck = ck0; ck <= ck1; ck++) {
        const pz = wb.min.z + (ck + .5) * cell - az;
        // **THE BOUNDING BOX PICKS THE CELLS; THE TRIANGLE DECIDES.** Marking every cell in the
        // bbox is the same "a triangle's bounding box is not its shape" error this file already
        // has a note about, in XZ this time.
        const u = (px * fz - fx * pz) / det, v = (ex * pz - px * ez) / det;
        if (u < -1e-6 || v < -1e-6 || u + v > 1 + 1e-6) continue;
        const k = ci * nz + ck;
        (hits[k] || (hits[k] = [])).push(A.y + u * ey + v * fy);
      }
    }
  }

  // PAIR THE CROSSINGS: in, out, in, out. That is what "inside the solid" MEANS, and it is what
  // the old lowest-and-highest-triangle reading could not express.
  // **AN ODD COUNT MEANS THE SHELL IS OPEN UNDERNEATH**, which is what a generated building
  // usually is -- a skin with no floor. One crossing on the way up is a roof with nothing below
  // it, and reading that as lowest-to-highest gives a ZERO-HEIGHT box floating at roof level.
  // Closing it at the model's own floor is the honest repair: the solid runs from the ground to
  // the surface, which is what a building standing on the ground is.
  const H = wb.max.y - wb.min.y;
  const spans = new Array(nx * nz);
  let used = 0, boxy = 0;
  for (let k = 0; k < hits.length; k++) {
    const h = hits[k];
    if (!h || !h.length) continue;
    h.sort((p, q) => p - q);
    if (h.length & 1) h.unshift(wb.min.y);
    const sp = [];
    for (let i = 0; i + 1 < h.length; i += 2) if (h[i + 1] - h[i] > 1e-4) sp.push(h[i], h[i + 1]);
    if (!sp.length) continue;
    spans[k] = sp; used++;
    if (sp.length === 2 && sp[1] - sp[0] >= H * cfg.full) boxy++;
  }
  if (!used) return 0;

  // IS IT JUST A BOX? Most buildings are, and collapsing costs nothing and saves every frame.
  if (boxy / used >= cfg.full) {
    out.push({ minx: wb.min.x, maxx: wb.max.x, miny: wb.min.y, maxy: wb.max.y,
               minz: wb.min.z, maxz: wb.max.z });
    return 1;
  }

  // merge along X into runs of AGREEING spans. A cell may hold SEVERAL -- an overhang is a
  // second span with air under it -- so the open runs are a small list rather than one.
  let made = 0;
  const push = r => { out.push({ minx: wb.min.x + r.i0 * cell, maxx: wb.min.x + (r.i1 + 1) * cell,
                                 miny: r.lo, maxy: r.hi,
                                 minz: wb.min.z + r.ck * cell, maxz: wb.min.z + (r.ck + 1) * cell });
                      made++; };
  for (let ck = 0; ck < nz; ck++) {
    let open = [];
    for (let ci = 0; ci < nx; ci++) {
      const sp = spans[ci * nz + ck], next = [];
      if (sp) for (let i = 0; i < sp.length; i += 2) {
        const lo = sp[i], hi = sp[i + 1];
        let r = null;
        for (let j = 0; j < open.length; j++) {
          const o = open[j];
          if (o && Math.abs(o.lo - lo) < cfg.tol && Math.abs(o.hi - hi) < cfg.tol) { r = o; open[j] = null; break; }
        }
        if (r) { r.i1 = ci; r.lo = Math.min(r.lo, lo); r.hi = Math.max(r.hi, hi); }
        else r = { i0: ci, i1: ci, lo, hi, ck };
        next.push(r);
      }
      for (const o of open) if (o) push(o);
      open = next;
    }
    for (const o of open) if (o) push(o);
  }
  return made;
}
// COLS:END

const BUILDINGS = [];
function buildBuildings(g) {
  const proto = g.scene;
  // MEASURED off the geometry, in the file's own space. Every node here is at identity, but
  // asking the geometry rather than `Box3.setFromObject` is the habit that survives an export
  // that is not -- a mesh's node transform and its geometry bounds are different questions.
  const bb = new THREE.Box3();
  proto.updateMatrixWorld(true);
  proto.traverse(o => {
    if (!o.isMesh || !o.geometry) return;
    o.geometry.computeBoundingBox();
    bb.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  if (!isFinite(bb.min.y) || bb.max.y - bb.min.y < 1e-4) { note('BAD BUILDING GLB'); return; }
  const k = BLD.height / (bb.max.y - bb.min.y);
  const w = (bb.max.x - bb.min.x) * k, d = (bb.max.z - bb.min.z) * k;

  proto.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (!m) continue;
      // ONE SIDE. See the note on BLD -- fill rate is the scarce thing on a phone and a closed
      // shell has no use for its own inside.
      m.side = THREE.FrontSide;
      // and the far side of a 10 m wall is looked at edge-on all day, which is exactly where a
      // texture without anisotropy turns to mush
      if (m.map) { m.map.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); m.map.needsUpdate = true; }
    }
  });

  // PLACED ON ITS OWN MEASURED MIDDLE AND ITS OWN MEASURED FLOOR, so a model authored anywhere
  // relative to its origin still lands centred on (x, z) with its feet at zero -- where the
  // origin happens to sit is not this code's business. The centre offset is TURNED with the
  // building rather than reasoned about, or a quarter turn slides it off its own footprint.
  const mid = new THREE.Vector3((bb.min.x + bb.max.x) * .5 * k, 0, (bb.min.z + bb.max.z) * .5 * k);
  const UPY = new THREE.Vector3(0, 1, 0), c = new THREE.Vector3();
  for (const [x, z, q] of BLD.at) {
    const o = proto.clone(true);
    o.scale.setScalar(k);
    o.rotation.y = (q || 0) * Math.PI / 2;
    c.copy(mid).applyAxisAngle(UPY, o.rotation.y);
    o.position.set(x - c.x, -bb.min.y * k, z - c.z);
    world.add(o);
    // **`bx` IS DECLARED BEFORE ANYTHING READS IT, AND FOR TWO BUILDS IT WAS NOT (m32).**
    // `const b0 = { o, bx, ... }` sat ABOVE `const bx = {...}`, which is a ReferenceError in
    // its temporal dead zone -- thrown on the FIRST placement, after `world.add(o)` had already
    // run. So the building was in the scene and not one box ever reached `BOXES`: *"I'm still
    // just walking through this building."* This file's oldest landmine, and neither gate can
    // see it -- `check:syntax` parses and `check:boot` never gets a GLB, because headless every
    // `loadGLB` rejects and `buildBuildings` is never entered at all.
    // a quarter turn swaps the footprint; anything else would need an ORIENTED box, and the
    // AABB of a rotated one is forty per cent too big along both axes -- the phantom hit
    const ww = (q % 2) ? d : w, dd = (q % 2) ? w : d;
    const bx = { minx: x - ww / 2, maxx: x + ww / 2, miny: 0, maxy: BLD.height,
                 minz: z - dd / 2, maxz: z + dd / 2 };
    // everything `mel.bld()` needs to re-size this WITHOUT re-reading the file, kept on the
    // object so the picture and the boxes it pushed can never be re-sized apart
    const b0 = { o, bx, x, z, q, unit: k / BLD.height, w: w / BLD.height, d: d / BLD.height,
                 loY: bb.min.y, mid: mid.clone().divideScalar(BLD.height), cols: null };
    // THE REAL SHAPE, NOT ITS BOUNDING BOX -- and the world matrix has to be current, because
    // the rasteriser reads WORLD triangle positions and the clone was placed a line ago.
    bldCols(b0);
    BUILDINGS.push(b0);
  }
  console.log('[melee] building x' + k.toFixed(3) + ' -> ' + w.toFixed(1) + ' x ' +
              BLD.height.toFixed(1) + ' x ' + d.toFixed(1) + ' m, ' + BLD.at.length + ' placed, ' +
              BUILDINGS.reduce((a, b) => a + (b.cols ? b.cols.length : 1), 0) + ' collider boxes');
}
// WHAT THIS BUILDING CONTRIBUTES TO THE COLLIDER -- columns if they are any good, its bounding
// box if they are not. ONE function, called at build time AND after a re-size, because the
// columns are WORLD boxes and cannot be scaled in place: leaving the old ones behind is a
// building you walk into at its previous size, and two copies of the decision is two places for
// the fallback below to be missing from.
function bldCols(b) {
  // take out whatever it contributes now, whichever of the two that is
  const drop = c => { const i = BOXES.indexOf(c); if (i >= 0) BOXES.splice(i, 1); };
  if (b.cols) b.cols.forEach(drop); else drop(b.bx);
  b.cols = null;
  let got = [];
  if (BLD.cols) {
    b.o.updateMatrixWorld(true);
    b.o.traverse(t => { if (t.isMesh) solidColumns(t, BLD, got); });
    // **A COLLIDER NOTHING CAN REACH IS NOT A COLLIDER, AND THAT IS WHAT SHIPPED (m34).** Every
    // column came out floating at roof height, the rasteriser therefore reported success, the
    // bounding-box fallback never fired, and `resolveBoxes` skipped every one of them on
    // `p.y + hh < b.miny` -- *"there is no collider on the building whatsoever"*, exactly. The
    // rasteriser is fixed above and this is the net under it: walking through a building is
    // strictly worse than a boxy collider, so the two must not be one silent coin toss.
    if (!got.some(c => c.miny <= MOVE.step && c.maxy > MOVE.step)) { got = []; note('BLD FLAT'); }
  }
  if (got.length) { got.forEach(c => BOXES.push(c)); b.cols = got; }
  else BOXES.push(b.bx);
  return b.cols ? b.cols.length : 1;
}

// ONE DESCRIPTION OF A BODY, whatever kind it is. Two builders used to share twenty lines of
// this by copy, which is two places for a measurement to drift.
function bodyProto(g, K) {
  const proto = g.scene;
  // scale MEASURED off the geometry, never typed -- and off EVERY skinned mesh, because the
  // officer's file has two and the first one is his EYES: read alone it reports an authored
  // height of 2.9 cm and asks for a scale of x60.
  let lo = Infinity, hi = -Infinity;
  proto.traverse(o => {
    if (!o.isSkinnedMesh || !o.geometry) return;
    o.geometry.computeBoundingBox();
    lo = Math.min(lo, o.geometry.boundingBox.min.y); hi = Math.max(hi, o.geometry.boundingBox.max.y);
  });
  const authored = hi - lo, scale = authored > .01 ? K.h / authored : 1;
  // the same emissive lift the player gets, so nobody reads as a dark cut-out beside him.
  // `skeletonClone` SHARES materials, so this is done once for every copy.
  proto.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) {
      if (!m.isMeshStandardMaterial) continue;
      if (m.map) { m.emissiveMap = m.map; m.emissive = new THREE.Color(0xffffff); }
      m.emissiveIntensity = RIG.emissive;
    }
  });
  proto.updateMatrixWorld(true);
  const pb = {}; proto.traverse(o => { if (o.isBone) pb[o.name] = o; });
  const faceOff = -measureFacing(pb);
  let clips = normaliseClips(g.animations || []);
  if (K.drop) clips = clips.filter(c => !K.drop.test(c.name));
  console.log('[melee] ' + K.file + ': ' + authored.toFixed(4) + ' m authored -> x' + scale.toFixed(3) +
              ', ' + clips.length + ' clips');
  return { proto, scale, faceOff, clips };
}

function bodySpawn(P, K, x, z) {
  const model = skeletonClone(P.proto);
  model.scale.setScalar(P.scale);
  const root = new THREE.Group();
  root.add(model);
  root.position.set(x, groundAt(x, z, 0, MOVE.step), z);
  scene.add(root);
  const mixer = new THREE.AnimationMixer(model);
  const d = { K, root, model, mixer, actions: {}, clips: {}, cw: {}, faceOff: P.faceOff,
    st: 'idle', t: 0, hp: K.hp, hpMax: K.hp, cool: 0, back: 0, vx: 0, vy: 0, vz: 0, cur: '',
    aggro: 0, think: 0, gap: 0, seen: 0, bar: null, barT: 0,
    // FACING THE SPAWN. They all face +Z as authored and the spawn is behind that -- a rank of
    // men standing with their backs to you is a worse first impression than it sounds.
    h: Math.atan2(player.pos.x - x, player.pos.z - z) };
  for (const c of P.clips) {
    d.clips[c.name] = c;
    const a = mixer.clipAction(c);
    // EVERY REACTION IS A ONE-SHOT. Only the loops loop; a knock-down that repeats is a man
    // falling over on a timer.
    if (!K.loops.has(c.name)) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
    a.enabled = true; a.setEffectiveWeight(0); a.play();
    d.actions[c.name] = a;
  }
  // THE TABLE IS CHECKED AGAINST THE FILE, the player's own rule: a name that is not there
  // leaves a bone at zero total weight and the mixer blends it back to the BIND pose, which is
  // the T-pose exactly.
  const want = [];
  for (const k in K.clips) { const v = K.clips[k]; Array.isArray(v) ? want.push(...v) : want.push(v); }
  const gone = want.filter(n => !d.actions[n]);
  if (gone.length) note('NO CLIP ' + gone.join(','));
  DUMMIES.push(d);
  return d;
}

// WHICH NAMES LOOP. Everything else is a one-shot, so this is derived from the table rather
// than listed twice -- adding a swing cannot accidentally make it repeat.
function bodyLoops(K) {
  const L = new Set([K.clips.idle]);
  for (const k of ['walk', 'run', 'block']) if (K.clips[k]) L.add(K.clips[k]);
  return L;
}

function buildDummies(g) {
  DUMMY.loops = bodyLoops(DUMMY);
  const P = bodyProto(g, DUMMY);
  for (const [x, z] of DUMMY.at) bodySpawn(P, DUMMY, x, z);
}

function buildFoes(g) {
  FOE.loops = bodyLoops(FOE);
  FOE.up = 0;
  const P = bodyProto(g, FOE);
  for (const [x, z] of FOE.at) {
    const d = bodySpawn(P, FOE, x, z);
    // THE MACE, ON HIS OWN JOINT, WITH IDENTITY. `npm run rig` reads his `weapon_root -> tip`
    // and the mace file's as the same vector to 8.6e-6, so there is nothing to correct and
    // nothing about the placement is typed -- the export decided it, which is the point.
    if (FOE.mace) {
      let host = null;
      d.model.traverse(o => { if (!host && o.isBone && o.name === FOE.mace.root) host = o; });
      if (!host) note('NO ' + FOE.mace.root + ' ON THE WARRIOR');
      else for (const q of FOE.mace.parts) {
        const o = new THREE.Mesh(q.geometry, q.material);
        o.matrixAutoUpdate = false; o.matrix.copy(q.matrix);
        o.castShadow = true;
        o.frustumCulled = false;   // it rides a bone; its own bounds say nothing about where it is
        host.add(o);
      }
    } else note('NO MACE');
    foeBar(d);
    FOE.up++;
  }
}

// THE MACE FILE, READ ONCE. Kept as geometry + the transform RELATIVE TO ITS OWN `weapon_root`,
// which is the authored placement and the only thing that has to survive the clone.
function buildMace(g) {
  const parts = weaponParts(g.scene);
  if (!parts) { note('NO MACE ROOT'); return; }
  FOE.mace = parts;
  console.log('[melee] mace: ' + parts.parts.length + ' mesh(es) on ' + parts.root);
}

// A BAR OVER HIS HEAD, and it is only there when it says something. *"Maybe he has a health bar
// or something."* Without one a man who has taken five blows and a man who is ignoring you are
// the same picture -- which is the whole reason `hp` being 6 rather than 3 needs it.
// It FACES THE CAMERA each frame and is hidden while he is untouched, so an idle street is not
// a row of floating gauges.
function foeBar(d) {
  const g = new THREE.Group();
  const q = new THREE.PlaneGeometry(1, 1);
  const back = new THREE.Mesh(q, new THREE.MeshBasicMaterial({ color: 0x14181f, transparent: true, depthWrite: false }));
  const fill = new THREE.Mesh(q, new THREE.MeshBasicMaterial({ color: 0xff5470, transparent: true, depthWrite: false }));
  back.scale.set(FOE.bar.w, FOE.bar.h, 1);
  fill.scale.set(FOE.bar.w * .94, FOE.bar.h * .62, 1);
  fill.position.z = .002;
  g.add(back); g.add(fill);
  g.visible = false;
  g.renderOrder = 4;
  scene.add(g);
  d.bar = { g, fill, w: FOE.bar.w * .94 };
}

function foeBarStep(d, dt) {
  const B = d.bar; if (!B) return;
  // it shows while he is hurt or hunting, and fades once he is neither
  const want = (d.hp < d.hpMax || d.aggro || d.st === 'down' || d.st === 'up') ? FOE.bar.fade : 0;
  d.barT = want ? want : Math.max(0, d.barT - dt);
  B.g.visible = d.barT > 0;
  if (!B.g.visible) return;
  const k = clamp(d.hp / d.hpMax, 0, 1);
  B.fill.scale.x = Math.max(.001, B.w * k);
  // grow from the LEFT edge rather than the middle, or a bar at 50% is centred and reads as a
  // different bar rather than as half of this one
  B.fill.position.x = -(B.w - B.fill.scale.x) * .5;
  B.fill.material.color.setHex(k > .6 ? 0x7ef08a : k > .3 ? 0xffc247 : 0xff5470);
  B.g.position.set(d.root.position.x, d.root.position.y + FOE.h * FOE.bar.up, d.root.position.z);
  B.g.quaternion.copy(camera.quaternion);
  const a = Math.min(1, d.barT / .5);
  B.g.children.forEach(c => { c.material.opacity = a * (c === B.fill ? 1 : .55); });
}

// WHICH WAY HE FALLS IS WHICH WAY THE BLOW WAS TRAVELLING. A blow going the same way he faces
// hit his BACK, so he goes over forwards.
// A SWEPT SPHERE AGAINST A STANDING BODY. The body is a vertical cylinder, so the XZ problem
// is a segment against a point and the height is one range test at the parameter it closes at.
function segBody(a, b, cx, cz, rad, hTop) {
  const dx = b.x - a.x, dz = b.z - a.z, L2 = dx * dx + dz * dz;
  let t = L2 > 1e-9 ? ((cx - a.x) * dx + (cz - a.z) * dz) / L2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const ex = a.x + dx * t - cx, ez = a.z + dz * t - cz;
  if (ex * ex + ez * ez > rad * rad) return false;
  const y = a.y + (b.y - a.y) * t;
  return y > -STRIKE.r && y < hTop + STRIKE.r;
}
const _sw = new THREE.Vector3();
// Runs every frame of a strike -- `live` only gates whether a contact COUNTS, because the
// previous positions have to stay fresh whether the window is open or not.
// **DIFFERENT WEAPONS DO DIFFERENT THINGS TO HIM**, which is what a `dmg` per blow is for: a
// fist is the cheapest, the hammer costs more, the charged finisher costs most, and a bolt
// carries its own. A kind with no `dmg` table -- the officer -- spends one hit point whatever
// hit him, exactly as he always has.
function strikeSweep(dt, power, live, dmg) {
  const p = player;
  const prev = p.swPrev || (p.swPrev = {});
  const dpx = p.pos.x - (p.swRootX == null ? p.pos.x : p.swRootX);
  const dpz = p.pos.z - (p.swRootZ == null ? p.pos.z : p.swRootZ);
  p.swRootX = p.pos.x; p.swRootZ = p.pos.z;
  const w = WEAP.worn[slotNow().key];
  let hit = 0;
  for (let i = 0; i <= STRIKE.bones.length; i++) {
    const wep = i === STRIKE.bones.length;
    if (wep) { if (!(w && w.muzzle && w.host)) continue; _sw.copy(muzzleWorld()); }
    else { const b = rig.bones[STRIKE.bones[i]]; if (!b) continue; b.getWorldPosition(_sw); }
    const key = wep ? '#weapon' : STRIKE.bones[i];
    const q = prev[key];
    if (!q) { prev[key] = _sw.clone(); continue; }
    if (live && !hit) {
      // IN HIS OWN FRAME -- the root's travel taken back out, or the lunge does the hitting.
      const lx = (_sw.x - q.x) - dpx, ly = _sw.y - q.y, lz = (_sw.z - q.z) - dpz;
      if (Math.hypot(lx, ly, lz) / Math.max(1e-4, dt) > STRIKE.swing) {
        for (const d of DUMMIES) {
          if (d.cool > 0) continue;
          if (!segBody(q, _sw, d.root.position.x, d.root.position.z, d.K.r + STRIKE.r,
                       d.root.position.y + d.K.h)) continue;
          // the blow travels the way the LIMB was going, which is the direction already stored
          const bh = Math.atan2(_sw.x - q.x, _sw.z - q.z);
          dummyBlow(d, Math.hypot(lx, lz) > .02 ? bh : p.faceH, power, dmg);
          hit = 1; break;
        }
      }
    }
    q.copy(_sw);
  }
  return hit;
}

function dummyHit(x, z, dirH, power, reach, dmg) {
  let hit = 0;
  for (const d of DUMMIES) {
    if (d.cool > 0) continue;
    const rr = reach + d.K.r;
    const dx = d.root.position.x - x, dz = d.root.position.z - z;
    if (dx * dx + dz * dz > rr * rr) continue;
    hit = 1;
    dummyBlow(d, dirH, power, dmg);
  }
  return hit;
}

// WHAT A LANDED BLOW DOES TO ONE MAN. Split out of `dummyHit` because there are two ways to
// reach it now -- a bolt arriving, which IS a proximity test at the bolt's own position, and a
// limb sweeping through him -- and one of them must never grow a second copy of this.
function dummyBlow(d, dirH, power, dmg) {
  const K = d.K;
  d.cool = K.cool;
  d.aggro = 1; d.seen = 0;     // being shot at is how you get noticed
  // A MAN ON THE GROUND IS STILL A BODY. Hitting him while he is down does not stand him up
  // to play a reaction -- it PUNTS him, and restarts the clock on the lie, so kicking him
  // along the floor works for as long as you like and he still eventually gets up.
  if (d.st === 'down') {
    d.vx = Math.sin(dirH) * K.flyV * .35 * power;
    d.vz = Math.cos(dirH) * K.flyV * .35 * power;
    d.vy = K.flyUp * .30 * power;
    d.t = Math.min(d.t, K.downBeat);
    return;
  }
  // **A GUARD IS WORTH SOMETHING OR IT IS AN ANIMATION.** Blocking does not stop a blow, it
  // takes the sting out of it -- and it plays its own react, so from outside "he blocked that"
  // and "he ate that" are two different pictures rather than a number you cannot see.
  const guard = d.st === 'block' && Math.abs(wrapAngle(dirH - Math.PI - d.h)) < (K.hitArc || 1.2);
  // HOW MUCH DAMAGE, and it is per WEAPON rather than per hit: *"different weapons will do
  // different effects to him."* A kind with no `dmg` table is the officer, who has always
  // spent one hit point per blow whatever hit him.
  const cost = K.dmg ? (dmg || K.dmg.fist) * (guard ? K.blockCut : 1) * Math.max(.35, power) : 1;
  d.hp -= cost;
  d.barT = K.bar ? K.bar.fade : 0;
  const down = d.hp <= 0 || power >= K.hard;
  if (!down) {
    if (guard) {
      d.st = 'block'; d.t = 0; d.blockT = K.blockDur;
      d.cur = K.clips.blockHit;
      skinPlay(d, d.cur, skinLen(d, d.cur) / K.hitBeat);
      return;
    }
    d.st = 'hit'; d.t = 0;
    // A BIG BLOW GETS A BIG REACTION. One pool for everything cannot tell a bolt from a jab,
    // which is exactly the thing he asked to be able to see.
    const big = K.clips.big && power >= (K.bigAt || .55);
    const pool = big ? K.clips.big : K.clips.hits;
    d.beat = big ? (K.bigBeat || K.hitBeat) : K.hitBeat;
    const nm = pool[(Math.random() * pool.length) | 0];
    d.cur = nm;
    skinPlay(d, nm, skinLen(d, nm) / d.beat);
    return;
  }
  // OVER HE GOES. Ballistic, and the GROUND ends the flight rather than a timer -- a timer
  // drops him through whatever he was thrown onto and leaves him hanging over a hole.
  d.back = Math.cos(dirH - (d.h || 0)) < 0 ? 1 : 0;   // a blow into his front puts him over backwards
  d.st = 'down'; d.t = 0; d.hp = K.hp;
  const t = clamp((power - K.hard) / Math.max(.01, 1 - K.hard), 0, 1);
  const k = K.fly0 !== undefined ? K.fly0 + (1 - K.fly0) * t * t : .55;
  d.vx = Math.sin(dirH) * K.flyV * k;
  d.vz = Math.cos(dirH) * K.flyV * k;
  d.vy = K.flyUp * k;
  d.cur = d.back ? K.clips.downB : K.clips.downF;
  skinPlay(d, d.cur, skinLen(d, d.cur) / K.downBeat);
}

// ============================================================================================
// THE BRAIN. *"Make him walk around, make it so I can shoot him, make him fight back."*
//
// It is a handful of DISTANCES and one cooldown, and every state it can be in ends on its own
// clock rather than on something the player has to do -- an enemy you can wedge into a state he
// cannot leave is worse than one who gives up too early.
//     far away          idle, and every so often a look-about clip
//     inside `notice`   turn to face, walk or run in
//     inside `reach`    swing, or raise the guard instead
//     past `lose`       he stops caring, and `lose > notice` so the edge cannot flicker
// ============================================================================================
function foeAI(d, dt, t) {
  const K = d.K;
  const px = player.pos.x - d.root.position.x, pz = player.pos.z - d.root.position.z;
  const dd = Math.hypot(px, pz);
  const toP = Math.atan2(px, pz);

  if (!d.aggro && dd < K.notice) d.aggro = 1;
  if (d.aggro && dd > K.lose) d.aggro = 0;
  d.gap = Math.max(0, d.gap - dt);

  // ---- committed states first, because they own the body until they are done
  if (d.st === 'swing') {
    t[d.cur] = 1;
    // THE BLOW LANDS PART-WAY THROUGH, NOT ON THE FRAME HE DECIDED TO SWING -- the slash mark's
    // own rule, which this file has paid for once on the player's side: a swing and its
    // consequence arriving as two events is what "you can't actually hit things" looks like.
    if (!d.swung && d.t >= K.swingDur * K.swingAt) { d.swung = 1; foeStrike(d); }
    if (d.t >= K.swingDur) { d.st = 'idle'; d.t = 0; d.gap = K.swingGap; }
    return;
  }
  if (d.st === 'block') {
    t[d.cur || K.clips.block] = 1;
    d.blockT -= dt;
    if (d.blockT <= 0) { d.st = 'idle'; d.t = 0; d.cur = ''; d.gap = K.swingGap * .5; }
    else if (d.cur !== K.clips.block && d.t >= K.hitBeat) { d.cur = K.clips.block; }
    faceTo(d, toP, dt);
    return;
  }
  if (d.st === 'taunt') {
    t[d.cur] = 1;
    if (d.t >= skinLen(d, d.cur)) { d.st = 'idle'; d.t = 0; }
    faceTo(d, toP, dt);
    return;
  }

  // ---- free
  if (!d.aggro) {
    // IDLE IS NOT ONE CLIP. A rank of men playing the identical loop on the identical frame is
    // what "they all have the same behaviour" looks like, and a look-about every few seconds
    // costs nothing because the clips are already in the file.
    d.think -= dt;
    if (d.think <= 0) {
      d.think = 4 + Math.random() * 6;
      d.look = Math.random() < .5 && K.clips.look
        ? K.clips.look[(Math.random() * K.clips.look.length) | 0] : '';
      if (d.look) skinPlay(d, d.look, 1);
    }
    if (d.look && d.t < skinLen(d, d.look)) t[d.look] = 1; else { d.look = ''; t[K.clips.idle] = 1; }
    return;
  }

  faceTo(d, toP, dt);
  // HOW CLOSE HE WANTS TO BE, with hysteresis: closing to `reach` and backing off at `hold`
  // means he is not stepping in and out on the boundary every frame.
  const want = dd > K.hold ? 1 : 0;
  if (want) {
    const sp = dd > K.notice * .55 ? K.run : K.walk;
    const nm = sp >= K.run ? K.clips.run : K.clips.walk;
    const ref = sp >= K.run ? K.runRef : K.walkRef;
    const step = sp * dt;
    const nx = d.root.position.x + Math.sin(d.h) * step, nz = d.root.position.z + Math.cos(d.h) * step;
    // HE WALKS ON THE PLAYER'S OWN RESOLVER. A foe-shaped second physics path is a second
    // physics path to keep in step with the first, which is the sentence `pushBodies` is
    // written under one body along.
    _fp.set(nx, d.root.position.y, nz);
    resolveBoxes(_fp, K.r, K.h * .9);
    pushBodies(_fp, K.r, d);
    d.root.position.x = _fp.x; d.root.position.z = _fp.z;
    d.root.position.y = groundAt(_fp.x, _fp.z, d.root.position.y, MOVE.step);
    t[nm] = 1;
    // THE CLIP IS SCALED TO THE SPEED HE IS ACTUALLY GOING, capped -- a run played at twice its
    // reference is a scramble, and the honest fix for a slow clip is a faster clip.
    setSkinScale(d, nm, clamp(sp / ref, K.tsLo, K.tsHi));
    return;
  }
  // in reach: swing, or put the guard up instead
  if (d.gap <= 0) {
    if (Math.random() < K.block) {
      d.st = 'block'; d.t = 0; d.blockT = K.blockDur; d.cur = K.clips.block;
      skinPlay(d, d.cur, 1);
    } else {
      const nm = K.clips.swings[(Math.random() * K.clips.swings.length) | 0];
      d.st = 'swing'; d.t = 0; d.swung = 0; d.cur = nm;
      skinPlay(d, nm, skinLen(d, nm) / K.swingDur);
    }
    return;
  }
  t[K.clips.idle] = 1;
}

const _fp = new THREE.Vector3();
function faceTo(d, h, dt) {
  const K = d.K;
  const off = wrapAngle(h - d.h);
  d.h += clamp(off, -K.turn * dt, K.turn * dt);
}
function setSkinScale(skin, name, s) { const a = skin.actions[name]; if (a) a.setEffectiveTimeScale(s); }

// WHAT HIS MACE DOES TO YOU, on the frame it arrives. A cone rather than a circle, because a
// swing thrown forwards must not hit a man standing behind him -- the same fault the player's
// own melee had at m20 and for the same reason.
function foeStrike(d) {
  const K = d.K;
  if (player.roll) return;                      // a dodge roll is the one thing that saves you
  const dx = player.pos.x - d.root.position.x, dz = player.pos.z - d.root.position.z;
  const dd = Math.hypot(dx, dz);
  if (dd > K.hitR + player.r) return;
  const to = Math.atan2(dx, dz);
  if (Math.abs(wrapAngle(to - d.h)) > K.hitArc) return;
  playerHurt(K.hitDmg, to, K.push, K.pushUp, K.stun);
}

// BEING HIT. There is no hit-reaction clip in the player's export and no death yet, so what a
// blow IS here is a knockback, a moment of no steering and a flash -- which is the part that
// reads, and the part `MOVE.landHard` already has the shape of.
function playerHurt(dmg, dirH, push, up, stun) {
  const p = player;
  p.hp = Math.max(0, p.hp - dmg);
  p.hurtT = stun; p.hurtWait = HEALTH.wait;
  p.vel.x += Math.sin(dirH) * push;
  p.vel.z += Math.cos(dirH) * push;
  if (p.grounded) { p.vel.y = up; p.grounded = false; }

}
function stepDummies(dt) {
  for (const d of DUMMIES) {
