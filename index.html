<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Melee</title>
<!-- ADD TO HOME SCREEN. The apple-touch-icon is what iOS uses; the manifest is what everything
     else uses, and iOS reads the manifest too but will not take an icon from it.
     **THE VERSION IS IN THE FILENAME AND NEVER IN A QUERY STRING.** A phone that has seen
     `icons/apple-touch-icon.png` keeps what it has for ever and a home-screen shortcut keeps it
     harder -- so a new icon has to arrive under a NEW URL, and `?v=2`, the obvious way to do
     that, is the one way that cannot work: iOS drops an apple-touch-icon link whose href
     carries a query string ENTIRELY, and the home screen falls back to a screenshot of the
     page. `npm run icons` writes the number into the name; raise `V` there and repoint these.
     `icons/` is therefore deliberately NOT in `bump.mjs`'s `DIRS`, which hashes into a query. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v2.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32-v2.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Melee">

<!-- =====================================================================
     THE CRASH TRAP IS THE FIRST THING IN THE HEAD, BEFORE THE IMPORT MAP AND
     BEFORE THE MODULE. A phone has no console, so an exception is a blank
     screen and six builds of "it's stuck on the loading screen" that nobody
     can tell apart. Registered with CAPTURE, because a subresource that 404s
     fires `error` at its own element and never bubbles -- that includes a
     module that fails to PARSE and an import that never resolves, which are
     exactly the failures a trap installed later cannot see.
     ===================================================================== -->
<script>
(function () {
  var box = null;
  function show(msg) {
    try {
      if (!box) {
        box = document.createElement('div');
        box.id = 'crash';
        document.documentElement.appendChild(box);
      }
      box.style.display = 'block';
      box.textContent = (box.textContent ? box.textContent + '\n\n' : '') + msg;
    } catch (e) {}
  }
  window.__crash = show;
  addEventListener('error', function (e) {
    if (e && e.target && e.target !== window && e.target.src !== undefined) {
      show('FAILED TO LOAD\n' + (e.target.src || e.target.href || e.target.tagName));
      return;
    }
    show((e.message || 'error') + '\n@ ' + (e.filename || '?') + ':' + (e.lineno || '?') + ':' + (e.colno || '?'));
  }, true);
  addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    show('UNHANDLED REJECTION\n' + ((r && (r.stack || r.message)) || String(r)));
  });
})();
</script>

<!-- =====================================================================
     NO ZOOMING -- AND `touch-action` IS NOT THE FIX FOR DOUBLE TAP.
     iOS Safari has ignored `user-scalable=no` since iOS 10 and decides the
     double-tap gesture off the touch stream itself, so the touch stream is
     where it has to be refused. Pinch is a separate, non-standard event
     family that `touch-action` does not cover at all, dispatched AT the
     element -- so those three are listened for with CAPTURE, on document as
     well as window, or a listener that only sees them bubbling can be
     stopped before it ever runs.
     Its own script, NOT the module: a guard that installs when the game has
     finished loading is absent for the whole of the loading screen, and
     absent entirely if the module throws -- which is precisely when somebody
     starts jabbing at a page that is not responding.
     ===================================================================== -->
<script>
(function () {
  var lastT = 0, lastX = 0, lastY = 0;
  var interactive = /^(BUTTON|A|INPUT|SELECT|TEXTAREA|LABEL)$/;
  addEventListener('touchend', function (e) {
    var t = e.changedTouches && e.changedTouches[0]; if (!t) return;
    var now = e.timeStamp || Date.now();
    var el = e.target;
    // A REAL CONTROL IS LET THROUGH. `preventDefault` here would cancel its synthesised
    // click, and Safari does not zoom on a target it already treats as interactive -- so a
    // button loses its second press by being guarded and loses nothing by being exempt.
    var ok = true;
    for (var n = el; n && n !== document; n = n.parentNode) {
      if (n.tagName && interactive.test(n.tagName)) { ok = false; break; }
    }
    // WITHIN 400 ms *AND* WITHIN 40 px. Two deliberate taps in different places are two
    // taps, and a game gets those constantly.
    if (ok && now - lastT < 400 && Math.abs(t.clientX - lastX) < 40 && Math.abs(t.clientY - lastY) < 40) {
      e.preventDefault();
    }
    lastT = now; lastX = t.clientX; lastY = t.clientY;
  }, { passive: false });
  var kill = function (e) { e.preventDefault(); };
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    addEventListener(t, kill, { passive: false, capture: true });
    document.addEventListener(t, kill, { passive: false, capture: true });
  });
  addEventListener('dblclick', kill, { passive: false });
})();
</script>

<style>
/* THE PAGE IS PINNED, not merely `overflow:hidden`. On iOS that alone still lets a drag
   rubber-band the document and leaves the canvas off-centre, and a page that cannot be
   scrolled is a page with less for a stray gesture to act on. */
:root {
  --hot: #ff4d6d; --sun: #ffc247; --sky: #46e0ff; --ink: #0b0d12;
  --ui: 'Barlow Condensed', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --disp: 'Bungee', var(--ui);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  position: fixed; inset: 0; margin: 0; padding: 0; overflow: hidden;
  background: var(--ink); color: #fff; font-family: var(--ui);
  touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

/* ---- the crash overlay: above everything, monospaced and SELECTABLE so it can be
        copied or read out. A message that cannot be read is a message that does not exist. ---- */
#crash {
  display: none; position: fixed; inset: 0; z-index: 999; overflow: auto;
  padding: 18px 14px; margin: 0; background: rgba(8, 4, 10, .94);
  color: #ff8fa3; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
  white-space: pre-wrap; word-break: break-word;
  -webkit-user-select: text; user-select: text;
}

/* ---- boot card ---- */
#boot {
  position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  background: radial-gradient(120% 90% at 50% 30%, #1b2233 0%, #0b0d12 70%);
  transition: opacity .5s ease; padding: 24px;
}
#boot.gone { opacity: 0; pointer-events: none; }
#boot h1 { font-family: var(--disp); font-size: 30px; letter-spacing: .02em; margin: 0; color: var(--sky); }
#boot .msg { font-size: 15px; letter-spacing: .09em; text-transform: uppercase; opacity: .78; min-height: 20px; text-align: center; }
#boot .bar { width: min(76vw, 320px); height: 5px; border-radius: 3px; background: #ffffff1c; overflow: hidden; }
#boot .bar i { display: block; height: 100%; width: 0; background: var(--sky); transition: width .25s ease; }
#boot .bld { font-family: var(--disp); font-size: 13px; color: var(--sun); letter-spacing: .06em; }

/* ---- HUD ---- */
.chip {
  position: fixed; z-index: 4; font-size: 13px; letter-spacing: .05em;
  color: #cfe8ff; text-shadow: 0 1px 0 #000a; pointer-events: none;
}
#build { top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
  max-width: calc(100vw - 140px); }
/* THE BUILD NUMBER IS THE ONE THING ON SCREEN THAT TAKES A TAP (m104). There is no settings
   panel in this game -- every dial is a `mel.` handle and a phone has no console -- and
   *"I want the sticks the option to have dynamic"* is a look-at-it decision, which belongs on
   the phone rather than in a commit. Only the NUMBER is a target, so the state line beside it
   cannot eat a thumb, and it is out of the play area in the corner. */
#build b { font-family: var(--disp); font-size: 26px; color: var(--sky); display: block; line-height: 1;
  pointer-events: auto; cursor: pointer; }
#build i { font-style: normal; opacity: .8; font-size: 12px; }
/* WHICH WORLD, AND THE TAP THAT CHANGES IT (m124). Under the build chip, in the same top-left
   gutter and out of the play area, because a world switch is the badge's own kind of control:
   out of the way, taking one tap, and saying which state it is in by having the name on it.
   `top` is the chip's 12 plus its own two lines. */
#worldKey { position: fixed; z-index: 6;
  top: calc(var(--gut, 56px) + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
  font-family: var(--ui); font-size: 11px; font-weight: 600; letter-spacing: .1em;
  color: #cfe8ff; background: #0b0d12cc; border: 1px solid #ffffff33;
  padding: 4px 9px 5px; border-radius: 3px; pointer-events: auto; cursor: pointer;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#worldKey b, #dbgKey b { font-family: var(--disp); font-size: 12px; color: var(--sky); font-weight: 400; }
#worldKey:active, #dbgKey:active { background: #16202ecc; }
/* THE COLLIDER KEY (m128). *"I can't tell if it's the vehicle or what's going on there."* From
   a screenshot a collider box and a hole in the art are the same picture, and there is no
   settings panel in this game and no console on a phone -- so the view needs a control that
   can be FOUND, which is Shredworld's own lesson after being asked for one three times.
   It shares `#worldKey`'s rule entirely and adds only a position, because two independently
   written chips in one gutter eventually disagree about where the gutter is. Same top-left
   diagnostic corner as the build chip and the world key, so it takes no thumb from the play
   area; `top` is the world key's 56 plus its own line. */
#dbgKey { position: fixed; z-index: 6;
  top: calc(var(--gut2, 88px) + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
  font-family: var(--ui); font-size: 11px; font-weight: 600; letter-spacing: .1em;
  color: #cfe8ff; background: #0b0d12cc; border: 1px solid #ffffff33;
  padding: 4px 9px 5px; border-radius: 3px; pointer-events: auto; cursor: pointer;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#dbgKey.on { border-color: #39ff8899; color: #b6ffd8; }
/* THE FX KEYS (m135). *"I have no idea what this means or how to try it."* Four builds of
   `mel.shafts(0)` and `mel.tint(1)` handed to a man holding a PHONE, which has no console --
   so every one of those A/Bs was a control that does not exist, which is this file's own
   m128 sentence about `mel.boxes()` and I broke it four times running. The switches that
   cost frames belong where his thumb is.
   ONE ROW RATHER THAN FOUR KEYS, because these four are one kind of thing -- an effect on or
   off -- and a row says that where a column of separate keys says four unrelated controls.
   It shares the other two keys' rule and adds only a position and the segments, because two
   independently written chips in one gutter eventually disagree about where the gutter is. */
#fxKey { position: fixed; z-index: 6;
  top: calc(var(--gut3, 120px) + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
  font-family: var(--ui); font-size: 11px; font-weight: 600; letter-spacing: .1em;
  color: #cfe8ff; background: #0b0d12cc; border: 1px solid #ffffff33;
  padding: 3px 5px 4px 8px; border-radius: 3px; pointer-events: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#fxKey b { font-family: var(--disp); font-size: 12px; color: var(--sky); font-weight: 400; }
/* `pointer-events` is on the SEGMENTS and not on the row, so the label and the gaps between
   them are not tap targets -- a thumb that lands between two switches must do nothing rather
   than the nearer thing. */
#fxKey i { font-style: normal; display: inline-block; margin-left: 4px; padding: 2px 6px 3px;
  border: 1px solid #ffffff2b; border-radius: 3px; color: #cfe8ff99;
  pointer-events: auto; cursor: pointer; }
#fxKey i.on { border-color: #39ff8899; color: #b6ffd8; }
#fxKey i:active { background: #16202ecc; }
#fxKey i.hide { display: none; }
#wep { top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
  font-family: var(--disp); font-size: 15px; color: var(--sun); text-align: right; }
#wep small { display: block; font-family: var(--ui); font-size: 11px; color: #cfe8ff; opacity: .7; letter-spacing: .08em; }

/* ---- the pads ----
   THEY WERE WHITE ON A WHITE FLOOR, WHICH IS NOT A FAINT CONTROL BUT NO CONTROL AT ALL.
   *"They're almost impossible to see on the white."* Everything here was #ffffff at 5 to 30
   per cent -- a treatment that only exists against a dark background, and this world is a
   white floor.
   m49 SANDWICHED EVERY RING IN INK AND THAT WAS TOO MUCH (m50). *"You gave the sticks a
   slight drop shadow, I think we should remove that -- and the slight dim. I think the
   colours are enough."* He is right, and the ink was answering the wrong half of the
   question: what a white ring lacked was CHROMA, not weight. A saturated hue against a white
   floor is already high contrast, and the dark fill, the outer glow and the knob's drop
   shadow were all paying a second time for something the colour had already bought -- while
   greying the floor under the thumb and filling the label's counters.
   WHAT STAYS IS THE COLOUR AND ONE CRISP LINE. The rim went 2px to 3px to carry the shape on
   its own, the knob is a SOLID disc with a single dark edge so it reads against both the pad
   and the floor, and nothing here is translucent, blurred or tinted.
   AND THE TWO PADS ARE DIFFERENT HUES, which is not decoration: they are different controls
   (the body and the verb) and on a small phone the thumb that lands on the wrong one has
   nothing to tell it so. `--pc` is the only thing that differs, so a pad cannot end up half
   recoloured, and `mel.pads({ left, right })` moves both live -- a look-at-it decision. */
.pad {
  position: fixed; z-index: 5; width: var(--pad); height: var(--pad); border-radius: 50%;
  touch-action: none; bottom: calc(26px + env(safe-area-inset-bottom));
  --pc: var(--sky);
  background: none;
  border: 3px solid var(--pc);
  transition: border-color .12s ease, opacity .12s ease;
}
#padL { left: calc(20px + env(safe-area-inset-left)); --pc: var(--hot); }
#padR { right: calc(20px + env(safe-area-inset-right)); --pc: var(--sky); }
/* ---- THE PADS FLOAT, OPTIONALLY (m104, `STICK.dyn`) ---------------------------------------
   *"Did we make it so you can have the option of the dynamic stick control, so they move
    around -- so you don't have to be super precise with where you're pressing and swiping."*
   Not until now: m49 and m98 both wrote it down as the real fix for missing a pad and both
   shipped something else. A pad that APPEARS where the thumb lands cannot be missed, which is
   a different thing from making it easier to hit.
   **THE ZONE IS THE TARGET AND THE PAD IS THE PICTURE.** Half the screen each, and the pad is
   moved to the touch on the way down -- so `set()` measures the same rect it always did and
   every gesture below it is unchanged. The zone is NOT an ancestor of anything that takes a
   tap (the arc rows, the chip, the keys), so a press on one of those never reaches it.
   **AND WHEN THEY ARE FIXED THEY ARE BIGGER** -- *"when they're not dynamic I think they should
   be a little bit bigger"* -- which is `--pad`, one number, read by the rows' own geometry and
   by `RAD` so nothing can drift out of step with it. */
body { --pad: 148px; --padr: calc(var(--pad) / 2); }
body.dyn { --pad: 132px; }
body.dyn .pad { opacity: 0; pointer-events: none; }
body.dyn .pad.act { opacity: 1; }
.zone { position: fixed; z-index: 4; display: none; touch-action: none; bottom: 0; height: 74%; }
body.dyn .zone { display: block; }
body.dyn.desk .zone { display: none; }
#zoneL { left: 0; width: 50%; }
#zoneR { right: 0; width: 50%; }
.pad.act { border-color: #fff; }
/* EIGHT TICKS ROUND THE RIM -- the whole of the styling, and deliberately static.
   *"A cool stylized thing kind of similar to how we did the radical, but not as complex."*
   The reticle is five spinning layers because it is a MARK you read; a pad is a place you put
   a thumb, and anything moving under a thumb is something to look at instead of the game. One
   conic gradient masked to an annulus: no extra element, no animation, nothing per frame. */
.pad::before {
  content: ''; position: absolute; inset: 6px; border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(from -2.5deg, var(--pc) 0 5deg, #0000 5deg 45deg);
  -webkit-mask: radial-gradient(closest-side, #0000 0 78%, #000 78%);
          mask: radial-gradient(closest-side, #0000 0 78%, #000 78%);
  opacity: .8;
}
.knob {
  position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
  border-radius: 50%; background: var(--pc); border: 2px solid var(--ink);
  will-change: transform;
}
.knob::after {
  content: ''; position: absolute; inset: 8px; border-radius: 50%;
  border: 2px solid #0b0d1259;
}
/* the aim ring: dim whenever the weapon is out, bright while the trigger is armed. A pad
   that looks identical armed and unarmed is a control nobody finds. AMBER on purpose -- it
   has to be a different hue from whatever `--pc` is, or "armed" is only "slightly brighter". */
#padR::after {
  content: ''; position: absolute; inset: -10px; border-radius: 50%;
  border: 3px solid var(--sun); opacity: 0; transition: opacity .16s ease;
}
#padR.arm::after { opacity: 1; }
#padR.ready::after { opacity: .38; }
/* THE MODE BUTTONS ARE ARC SEGMENTS ROUND THE RIGHT STICK (m53).
   *"Take two rings, one smaller, one larger, and cut pizza slices out of that -- those buttons
    would be like those segments."* So they are annular sectors, not a row of chips: the pad is
   a circle and the controls that belong to it now share its centre, which is what makes them
   read as part of the same object rather than as a HUD element that happens to sit nearby.
   **THE SVG IS CENTRED ON THE PAD'S OWN CENTRE**, derived from the pad's inset plus its radius
   rather than written a second time -- so the annulus can never drift off the pad on a notched
   phone. It is a square of side 2 x `r1` hung off that point, and it deliberately overhangs the
   screen edge: `pointer-events: none` on the root means only the PATHS take touches, so what
   hangs off costs nothing.
   The geometry itself is computed in `MODES` -- see there for the radii and the arc. */
#modeRow {
  position: fixed; z-index: 6; display: none;
  --mr: 106px;                                /* `MODES.r1`; JS sets the real one at load, and
                                                 a default here means an unset var can never
                                                 collapse the whole element to nothing */
  pointer-events: none;                       /* only the segments are targets */
  right: calc(20px + var(--padr) - var(--mr) + env(safe-area-inset-right));
  bottom: calc(26px + var(--padr) - var(--mr) + env(safe-area-inset-bottom));
  width: calc(var(--mr) * 2); height: calc(var(--mr) * 2);
}
#modeRow.on { display: block; }
/* THE SAME ROW ON THE LEFT STICK, MIRRORED (m104). *"In the same way that we have the buttons
   above the right stick, I wanna make the equivalent of those on the left stick."* Same builder,
   same geometry, one bearing mirrored -- so a row is a TABLE and not a second control. */
#palRow {
  position: fixed; z-index: 6; display: none;
  --mr: 106px;
  pointer-events: none;
  left: calc(20px + var(--padr) - var(--mr) + env(safe-area-inset-left));
  bottom: calc(26px + var(--padr) - var(--mr) + env(safe-area-inset-bottom));
  width: calc(var(--mr) * 2); height: calc(var(--mr) * 2);
}
#palRow.on { display: block; }
/* ---- DESKTOP (m79) -------------------------------------------------------------------
   THE PADS ARE THE ONE THING A MOUSE REPLACES, and everything else on screen stays: the
   chip, the mode row and the reticle are all still the right pictures. `body.desk` is set
   by whichever input was used LAST, so a laptop with a touchscreen is never in the wrong
   mode for more than one gesture. */
body.desk #padL, body.desk #padR { display: none; }
/* AND THE HINT IS ONLY UP WHILE THE MOUSE IS FREE. Once the pointer is locked it is a HUD
   element in the middle of the play area saying something you already know -- the `actB`
   lesson one game over -- so it goes the moment the game has the mouse. */
#deskHint {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
  z-index: 7; display: none; pointer-events: none; text-align: center;
  font-family: var(--ui); font-size: 12px; font-weight: 600; letter-spacing: .10em;
  color: var(--sky); background: rgba(11,13,18,.82); border: 2px solid var(--sky);
  border-radius: 6px; padding: 7px 14px; max-width: 92vw; line-height: 1.7;
}
body.desk.free #deskHint { display: block; }
#deskHint b { color: var(--ink); background: var(--sky); border-radius: 3px; padding: 0 4px; }
/* `pointer-events: all` is what gives an UNFILLED path a hit area -- the alternative is a
   translucent fill, and m50's whole finding is that nothing on these pads should be a tint. */
/* AND A ROW WEARS ITS OWN STICK'S HUE, for the reason the pads do (m49): they are different
   controls, and a row in the other pad's colour reads as belonging to the other pad. */
#modeRow { --rc: var(--sky); }
#palRow  { --rc: var(--hot); }
#modeRow path, #palRow path {
  fill: none; stroke: var(--rc); stroke-width: 2;
  pointer-events: all; cursor: pointer;
}
#modeRow path.sel, #palRow path.sel { fill: var(--rc); }
#modeRow text, #palRow text {
  font-family: var(--ui); font-size: 10px; font-weight: 600; letter-spacing: .10em;
  fill: var(--rc); text-anchor: middle; dominant-baseline: central;
  pointer-events: none; user-select: none;
}
#modeRow text.sel, #palRow text.sel { fill: var(--ink); }
/* ---- the reticle: a geometric portal ----
   IT WAS BIG AND THICK AND THE COLOURS WERE A GUESS. Size, stroke weight and both hues are
   custom properties now, so `mel.retic({...})` moves all of it live on the phone -- how a mark
   should look is a look-at-it decision and those do not belong in a commit. */
#retic {
  position: fixed; z-index: 3; left: 0; top: 0;
  --size: 37px;                /* 210 -> 146 -> 74 -> 37. *"Half the size that it was."* A mark
                                  is a POINTER: at 146 it covered a man at twenty metres, which
                                  is the one thing it must not do. */
  --w: 1;                      /* stroke weight multiplier */
  --h: 196;                    /* the hue it rests at -- azure */
  --lh: 34;                    /* and the one it locks at -- amber */
  width: var(--size); height: var(--size);
  margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2);
  pointer-events: none; opacity: 0; transition: opacity .14s ease;
  --c: 0;                      /* charge, 0..1 -- the only thing the frame loop writes */
  --gl: hsl(var(--h) 100% 60%);
  --r1: hsl(var(--h) 80% 74%); --r2: hsl(var(--h) 92% 68%); --r3: hsl(var(--h) 100% 62%);
  --r4: hsl(var(--h) 100% 80%); --r5: hsl(var(--h) 100% 92%);
  /* the neon is two drop-shadows, which is what makes a stroke read as a lit tube rather than
     as a drawn line. One small element, so it costs nothing and it runs on the compositor. */
  filter: drop-shadow(0 0 3px var(--gl)) drop-shadow(0 0 9px var(--gl));
}
#retic.on { opacity: 1; }
/* LOCKED IS A DIFFERENT MARK, NOT A BRIGHTER ONE -- the whole thing changes hue and the rings
   pull in, so "the gun has something" is a glance rather than a comparison against a memory. */
#retic.lock { --h: var(--lh); }
#retic .lay, #retic .spin { position: absolute; inset: 0; }
#retic svg { width: 100%; height: 100%; display: block; overflow: visible; }
#retic circle { fill: none; stroke-linecap: butt; }
/* THE CONVERGENCE. Each ring rests wide and closes onto its drawn radius as the charge fills,

};

// ============================================================================================
// WALL COVER (m89, `WALL`, `wallFind`, `wallGo`, `stepWall`)
//
// *"We have the animation from standing to wall. I only put in one standing-to-wall animation,
// so he'll always land in the equivalent of wall cover right -- wall cover left and right are
// just him with his belly facing away from the wall, so he's flipped 180 back against it. Any
// sort of shimmy left and shimmy right. When you become close to a wall, if you're just pressing
// and holding the locomotion stick toward the wall, he'll naturally go into cover. You can use
// the locomotion stick to go left and go right, and then if you push away from the wall -- we'll
// have a little bit of a grace period for the moving left and right, and you really have to
// press directly away from the wall to get off of it. Or jump, and maybe he'll jump out of it."*
//
// **THE WHOLE THING RESTS ON ONE FACT THIS GAME HAS NEVER ASKED FOR: WHERE IS A WALL AND WHICH
// WAY DOES IT FACE.** `BOXES` is axis-aligned (m24 keeps every placement on a quarter turn for
// exactly this class of reason), so **the closest point on a box's FOOTPRINT gives the distance
// to the face AND its outward normal in one step** -- `clamp` per axis, then the vector from
// that point to him. No per-face tests, right whichever side he comes at, and being INSIDE the
// footprint returns nothing, which is what stops him latching onto the roof he is standing on.
// That is Shredworld's `ledgeGrab` rule, and the ledge build wants the same function.
const WALL = {
  // **THESE FOUR SCALE WITH HIM (m52's rule), BECAUSE THEY ARE FACTS ABOUT HIS BODY.** How tall
  // a thing has to be to hide you, where your chest is, how far your back sits off a wall and
  // how close is close enough to reach it are all his proportions -- and a typed 1.2 m is cover
  // for a 1.75 m man and a wall a 1.25 m man cannot use. `speed` is NOT one of them: m53 is the
  // build where he chose to keep his world speed at a smaller size.
  reach: .55 * SZ,  // how far off the face he may be and still latch, PLUS his own radius
  tall: 1.2 * SZ,   // and the box has to be this tall -- a kerb is cover for nobody
  chest: .95 * SZ,  // measured at his chest rather than his ankles, so a low box is not a wall
  into: .45,        // how hard the stick has to point INTO the face to latch
  off: .62,         // **and how hard AWAY to let go, which is deliberately the harder of the
                    // two** -- *"you really have to press directly away"*. The gap between them
                    // is what lets a diagonal shimmy keep him on the wall.
  grace: .30,       // ...and it has to be held that long, which is the grace period: a shimmy
                    // that overshoots past `off` for one frame must not drop him.
  speed: 1.5,       // how fast he slides along it
  ref: 1.2,         // and the shimmy clip's rate. **A GUESS, NOT A MEASUREMENT** -- the clip
                    // animates IN PLACE (hips XZ 0.000), so there is no authored travel to read
                    // the way `npm run gait` reads a walk. `mel.WALL.ref` is the dial.
  rateHi: 1.6,
  // **AND HE WAS STANDING TOO FAR OFF IT (m102).** *"The leaning on the wall system is fine but
  // he is a little bit far away from the wall."* Measured rather than eyeballed -- this number
  // is his CENTRE's clearance on top of his own radius, so what he is looking at is the gap
  // behind his back:
  //     stand .30 * SZ = .214   centre .457 off the face   ->  **21 cm of air behind him**
  //     stand .09 * SZ = .064   centre .307                ->  **6 cm**, which is a man leaning
  // It cannot go much under that: `p.r` is .243 and the shimmy re-finds the face every frame,
  // so a standoff inside his own radius is a man whose collider is in the brick -- harmless
  // while `stepWall` owns him and a shove on the first frame `resolveBoxes` gets him back.
  stand: .09 * SZ,  // how far his back sits off the face, on top of his own radius
  cool: .35,        // after letting go, before he may latch again -- or the same thumb that
                    // pushed him off latches him straight back on
  jump: .95,        // and how hard a jump out pushes him away from it
  turn: 14,         // how fast he squares up to the wall, rad/s
  inDur: .62,       // the two transitions, and the clips are COMPRESSED to them (m8's rule):
  outDur: .50,      // 1.167 s and 1.417 s authored, so x1.9 and x2.8 -- taking cover is quick
  clips: {
    // ONE ENTRY, WHICH IS WHAT HE EXPORTED -- and its LAST FRAME is the cover idle, for free,
    // because `clampWhenFinished` holds it. There is no separate cover-idle clip and none is
    // needed.
    in: 'idle_to_wall_cover_right',
    out: 'wall_cover_left_to_stand',
    // **AND THERE IS NO UNARMED `wall_cover_move_right`, SO IT IS THE LEFT ONE PLAYED
    // BACKWARDS.** A shimmy is a symmetrical slide, so a negative `timeScale` IS the other
    // direction -- and unlike m-era `aimBack` one repo over this needs no CLONE, because only
    // one direction is ever live at a time and there is nothing to weight against itself.
    // The RIFLE set has both drawn, so it uses them.
    L: 'wall_cover_move_left', R: '',
    aimL: 'wall_cover_move_left_rifle', aimR: 'wall_cover_move_right_rifle',
  },
};

// ============================================================================================
// THE LEDGE (m102) -- *"I do want to build the ledge system, hangs on the ledge and get up, and
// maybe I'll design buildings in a way where they always have levels so you can jump, hang,
// climb up, jump, hang, climb up to get up to higher levels."*
//
// **m88 WROTE THIS DOWN AS THE BUILD IT WOULD TAKE AND m89 BUILT HALF OF IT WITHOUT SAYING SO.**
// *"Both need something this game has never had -- a test for is there a wall/lip near me, and
// which way does it face."* `wallFind` IS that test: the closest point on a box's FOOTPRINT
// gives the distance to the face AND its outward normal in one `clamp` per axis, right
// whichever side he comes at, and returning nothing when he is INSIDE the footprint. m89's own
// note says the ledge build wanted the same function and that is why the wall went first.
// **SO WHAT IS ACTUALLY NEW IS THE HEIGHT TEST AND THE MANTLE.** A ledge is the TOP EDGE of the
// same box -- found, never authored, which is the rails' and the bars' rule one repo over: the
// world is already a few dozen boxes in a list, so every roof, wall top, parapet and setback in
// it is a ledge for free and there is nothing to place by hand. Design a building with levels
// and it is climbable the moment it is in `BOXES`.
//
// **AND EVERY NUMBER FOR WHERE HE HANGS IS MEASURED OFF THE CLIP RATHER THAN TYPED.** Walked
// forward through the real rig in `zap.glb` -- each bone's animated rotation where the clip
// keys one and its rest transform where it does not -- and read at `mixamorig_Left/RightHand`:
//     ledge_hang_idle   2.375 s   hands **1.076 m above the root** and **0.212 m in front of
//                                 it**, hips 0.578, head 0.922, toes 0.415 (he is TUCKED)
//                                 and it holds: the same to a millimetre at t 0.00 and t 1.20
//     ledge_hang_to_get_up_over_ledge   1.208 s, hips XZ **0.000** -- IN PLACE, mantle included
//     ledge_hang_to_jump_away           1.333 s   ledge_hang_hop_left/right  1.54 / 1.71 s
// **SO THE MANTLE AND THE HOP ARE CODE, WHICH IS WHAT `dX 0.00` MEANS**, and the clip is the
// picture over the top of them -- m89's own arrangement one surface up.
// **THE TWO PLACEMENT NUMBERS ARE FRACTIONS OF `RIG.height`, NOT METRES**, so they survive both
// a re-export at any authored size and another change to how tall he is: only a change to the
// POSE moves them, which is the one thing that should. `mel.LEDGE.hang` / `.out` are the dials.
// **AND HIS HANDS ARE AT LOCAL +Z, so the ROOT faces INTO the wall** -- the same facing the wall
// cover has since m99, and checked the same way rather than assumed: a clip carrying its own
// half turn would have put the hands at NEGATIVE z.
const LEDGE = {
  on: 1,
  hang: .861,       // = 1.076 / 1.25. How far BELOW the lip his root hangs
  out:  .170,       // = 0.212 / 1.25. And how far OUT from the face it sits
  // **AND THE CATCH BAND IS CENTRED ON THAT SAME OFFSET**, because the question is not "how
  // high is the wall" but "is the lip where his hands are" -- so the placement number IS the
  // acquire number and the two cannot drift.
  band: .55,        // how far above or below his hands the lip may be and still be caught
  reach: .55 * SZ,  // how far off the face, on top of his own radius
  tall: 1.2 * SZ,   // a kerb is not a ledge -- `WALL.tall`'s own argument one edge up
  clear: .95 * SZ,  // **AND THE HEADROOM IS CHECKED BEFORE THE GRAB, NOT AFTER.** A lip with a
                    // wall on top of it is a lip he would climb INTO, and a mantle that ends
                    // inside a box is worse than a grab that never happened.
  inset: .55 * SZ,  // how far in from the edge the mantle sets him down
  into: .45,        // **THE SAME FOUR NUMBERS THE WALL USES, AND DELIBERATELY THE SAME.** The
  off: .62,         // left pad is the BODY on both surfaces: into it climbs, away lets go, and
  grace: .22,       // sideways hops. A man who has learnt the wall has learnt this.
  grabDur: .22,     // the swing onto the lip -- short, because the CATCH is the event
  upDur: .78,       // the mantle, which the 1.208 s clip is compressed to (x1.55)
  upOut: .55,       // ...and the share of it spent RISING before he moves IN. **UP FIRST, THEN
                    // IN**: lerping straight to the target drags him diagonally THROUGH the
                    // parapet he is climbing over, which is not a mantle, it is a ghost.
  // **THE HOP LASTS AS LONG AS THE HOP CLIP DOES (m106).** `hopDur` .50 was typed with no
  // reference to the export, and the two clips are 1.542 s and 1.708 s -- so one number played
  // them at **x3.08 and x3.42**, which is a blur with no pose in it and two different blurs at
  // that. The duration is the CLIP's own, divided by a rate in the band this file already
  // judges a readable one-shot at (m36/m95: about 1.4 to 2.0), so each side takes its own time
  // and a re-export of either moves with it. `hopDur` survives only as the fallback for a body
  // with no hop clip at all.
  // **1.75 IS `MELEE.rate`, AND THAT IS NOT A COINCIDENCE** -- m95 fitted that number to the
  // band the shipped one-shots are already judged readable at, over clips of exactly this
  // length (1.0 to 1.75 s). Left 1.542 s -> 0.88 s, right 1.708 -> 0.98.
  hopRate: 1.75, hopDur: .50,
  // AND THE DISTANCE GOES UP WITH THE TIME, or matching the clip simply halves how fast he
  // crosses a ledge. .85 -> 1.05 of `SZ` is 0.75 m, about six tenths of his own height -- "a
  // little bit over to the side", and it keeps the traversal near what m102 intended (0.85 m/s
  // against 1.21) while every hop is now a whole animation.
  hop: 1.05 * SZ,               // the shimmy is DISCRETE here, because the clips are HOPS
  awayDur: .55,     // how long the push-off reads for after he is already in the air
  jump: .85,        // and how hard it throws him off the face
  cool: .30,        // before he may catch again -- or the drop re-grabs on the next frame
  clears: .12,      // how far over the lip his apex may still be and have him catch it
                    // anyway -- a jump that only just makes it should not be a coin toss
  turn: 14,
  clips: { hang: 'ledge_hang_idle', up: 'ledge_hang_to_get_up_over_ledge',
           away: 'ledge_hang_to_jump_away',
           L: 'ledge_hang_hop_left', R: 'ledge_hang_hop_right' },
};

// ============================================================================================
// THE SECOND JUMP IS A FLIP, AND THE RIGHT PAD HELD AT REST IS A CHARGED BACKFLIP (m87)
//
// *"We're gonna have a double jump. Second jump is a flip, a front flip. Also, if you're on the
// ground and you press and hold the right stick, he ducks and it charges a backflip, and then
// when you release he backflips and it's high."*
//
// **THE ONLY FREE GESTURE LEFT ON THAT PAD IS A HOLD AT REST, AND THAT IS WHAT THIS IS.** Up is
// the trigger, the wind-up and the square-up (`padUp`); down is the guard; sideways is the
// camera; a tap is the jump and a flick is a strike. What nothing has ever read is a thumb that
// goes down, stays near the middle and stays there -- and `MOVE.tapT`/`tapR` already draw that
// line, because they are exactly what makes something NOT a tap.
// **AND THE DRAG CANNOT BECOME A BACKFLIP, BY CONSTRUCTION.** `out.far` is a HIGH-WATER MARK for
// the whole touch, so one sweep anywhere in the hold kills the charge for the rest of it -- the
// same property that makes it safe to share a pad with the camera. It also means the trigger,
// the wind-up and the guard exclude this without a single line of coordination: all three need
// `mag` past `fireAt`/`blockAt`, which is far past `tapR`.
const AIR = {
  // ---- the second jump ----
  second: .92,        // **SET, NEVER ADDED.** Added to whatever he had, a double off the top of
                      // a jump goes into orbit and one off the bottom of a fall does nothing;
                      // set, it is the same height whenever it is spent, which is what makes it
                      // a save you can rely on.
  // **THE FLIP FILLS THE WHOLE TRIP NOW, AND THE FLOOR OF 1 WAS THE WHOLE BUG (m97).** *"The
  // backflip finishes when he's still in the air, so we need to map the animation to the whole
  // air trip."* m87 wrote the rate as `max(1, ...)` on the argument that stretching a clip to
  // fill a long hang is slow motion -- which is a real concern and is not what was happening:
  //     the clip is 1.125 s from its crouch to its landing
  //     a FULL-charge backflip is 0.333 s of push + **1.649 s** of air = 1.982 s
  //     the ideal rate is 1.125 / 1.649 = **0.682**, and the floor clamped it to 1.00
  //     so the flip was over at 1.458 s and he spent the last **0.52 s** in `in_air`
  // At `fill` 1 and a floor of .62 the rate comes out 0.97 at a bare release, 0.79 at a half
  // charge and 0.68 at a full one -- floaty on the biggest jump, which is what a 2.3 m backflip
  // IS, and nowhere near the slow motion the old floor was guarding against.
  // **IT APPLIES TO THE FRONT FLIP TOO**, because it is the same fault: `front_flip`'s 0.667 s
  // against a double jump's ~1.0 s of air was ending a third of the way early as well. He named
  // the backflip because it is the one that hangs longest.
  // `mel.AIR.rateLo = 1` is the one word back to m87.
  fill: 1,
  rateHi: 1.6, rateLo: .62,

  // **THE PUSH GETS ITS OWN RATE, AND m97 STRETCHED THE ONE PART OF THE CLIP NOBODY WANTED
  // STRETCHED (m100).** *"Once you release the backflip you're just like on the ground for a
  // bit -- the portion from being down released to then jumping is too long. Are we able to
  // speed up just a segment of it?"* m97 fitted ONE rate to the whole clip, so slowing the air
  // to fill a long hang slowed the leg extension with it -- and the bigger the jump, the longer
  // he stood there before it:
  //     charge 0.00   rate 0.965   push 0.333 / 0.965 = **0.345 s** on the floor after the lift
  //     charge 1.00   rate 0.682   push 0.333 / 0.682 = **0.488 s**
  // m97 wrote that up as a feature -- *"a deeper crouch for a bigger jump"* -- and named the
  // second rate as the thing it was avoiding. It is the thing he is asking for, and half a
  // second between a thumb leaving the pad and a body leaving the floor is not a crouch, it is
  // **latency you can feel**, which is the one thing `SLAM.hang` gets to spend and a release
  // does not.
  // **AND IT IS AN ABSOLUTE RATE, NOT A MULTIPLIER ON THE AIR RATE** -- what has to be constant
  // is the DELAY, because that is what the thumb is judging. Every charge now leaves the ground
  // 0.151 s after the release and the AIR rate is untouched at m97's own numbers, so the
  // rotation still fills the trip exactly as it did:
  //     charge 0.00   push **0.151 s** (was 0.345)   air rate 0.965, unchanged
  //     charge 0.50         0.151      (was 0.423)            0.788, unchanged
  //     charge 1.00         0.151      (was 0.488)            0.682, unchanged
  // **IT MAY ONLY EVER SPEED THE PUSH UP** (`max(airRate, pushRate)`): on a short hang the air
  // rate is already over 1 and taking the push to a typed 2.2 would be the fix RE-BREAKING the
  // case it is here for, one sign over.
  // **AND THE SPLIT THAT LOOKS HONEST IS THE ONE m97 REJECTED.** Fitting the air SEGMENT
  // (`air - off`, 0.792 s of clip) to the hang gives 0.792 / 1.649 = **0.48x**, which is the
  // slow motion that note turned down -- so the air keeps reading `M.air / T`, which spans the
  // push as well and is deliberately an approximation. The clip's landing frame therefore
  // arrives a little before he does; the take-off frame, which is the one being complained
  // about, now arrives exactly when he leaves.
  // `mel.AIR.pushRate = 0` is the one word back to m97 (it floors at the air rate).
  pushRate: 2.2,

  // ---- the charged backflip ----
  hold: .85,          // seconds of duck to a full charge
  hi0: 3.4, hi1: 6.8, // **THE APEX IS THE NUMBER CHOSEN AND `vy` IS DERIVED FROM IT** (m21's
                      // rule). An ordinary jump is 2.81 m, so even a bare release is higher.
  duckSp: 1.1,        // he can shuffle while ducked, he cannot run

  // ---- and the three landmarks in a flip clip are MEASURED, never typed ----
  // The hips carry the body's height off the ground, so a standing flip reads as a dip, a peak
  // and a second dip: the CROUCH it winds up through, the APEX, and the LANDING absorb. Taking
  // them off the curve means `backflip`'s wind-up is found rather than trimmed by hand, and a
  // re-export at any length lands right with no edit.
  scan: .45,          // the crouch is the lowest hips inside this much of the clip -- and on a
                      // clip with no wind-up that argmin is t=0, so it needs no threshold
};

// THE GAIT IS A WEIGHTED BLEND OF CLIPS BY MEASURED SPEED -- never a run FLAG. Each clip's
// clock is tied to the ground speed too, so the feet do not skate.
// EVERY REFERENCE SPEED HERE IS MEASURED (`npm run gait`), not eyeballed. They are the speed
// the PLANTED FOOT slides backwards at in the body frame, which is exactly the speed the clip
// is walking at, and they are already multiplied by RIG's scale.
const GAIT = {
  // MEASURED AT `refScale`, and multiplied by the real one at load -- see `buildRig`. A clip
  // walks at its authored speed times however big the model is drawn, so these are only true
  // at the scale they were taken at and a smaller hero whose refs did not follow would have
  // every clip playing 21% too slow under him. It is applied ONCE, where the scale is measured.
  refScale: 1.926,
  // **AND WHETHER HIS SPEED GOES WITH THEM IS A DESIGN DECISION, NOT ARITHMETIC (m53).**
  // *"I thought making him smaller would make the locomotion seem a little quicker despite him
  //  technically moving at the same rate -- because he has these big giant chunky feet, and when
  //  he runs his stride is just so funny. He's moving these giant big feet but they're not going
  //  that far."*
  // m52 scaled `MOVE.max` and the bands along with the refs, which is the PROPORTIONAL answer:
  // the stride stays identical relative to his body and he covers 17% fewer metres, so from the
  // camera the locomotion is exactly what it was, only smaller. **That is precisely the thing he
  // was trying to get away from** -- the whole complaint is that the stride is short for the
  // feet, and keeping everything in proportion preserves it perfectly.
  //     scaleSpeed 1   proportional. Same picture, smaller. Feet never slide.
  //     scaleSpeed 0   he keeps his world speed at four fifths the size, so every locomotion
  //                    clip plays **1.21x faster** for the same metres and the stride covers
  //                    more ground per step. That IS "quicker", and it is what he asked for.
  // **THE COST IS AT THE VERY TOP AND NOWHERE ELSE.** `MOVE.max` 7.2 against a scaled
  // `sprintRef` of 3.77 asks the sprint clip for **1.91x against a `tsHi` of 1.6**, so it clamps
  // and the feet slide about 16% at full deflection. Every band below it is inside the cap and
  // simply reads faster. `mel.GAIT.tsHi` is the dial, and **the honest fix is a faster sprint
  // clip** -- which this file already has written down as an open item.
  scaleSpeed: 0,
  walkRef: .84, runRef: 3.09, sprintRef: 4.55,
  backRef: 2.23, strafeRef: 2.00, aimRunRef: 3.36,
  // **THE BANDS ARE READ AGAINST THE STICK, NOT AGAINST THE SPEED RANGE (m27).** *"I was trying
  // to go really slow to make him do his walk and he was basically doing a slow run -- half
  // stride. And I don't think I ever see the fast run."* Both are this table, and the arithmetic
  // says it outright. `MOVE.max` is 7.2 and the pad curve is `mag^1.4`, so the stick deflection
  // that asks for a given speed is `.12 + (sp/7.2)^(1/1.4) * .88`:
  //     walkAt .30  ->  21% of the stick -- INSIDE the noise of a thumb, so the walk was
  //                     unreachable and everything holdable landed in the crossfade
  //     at 36% he got walk .64 / run .36, with the walk pushed to 1.37x and the run CLAMPED at
  //                     tsLo .55 -- a fast walk averaged with a slow-motion run. That is the
  //                     "half stride" exactly, and no amount of blending fixes two clips both
  //                     playing at the wrong rate.
  //     sprintAt 5.00 -> 85% of the stick before `run_fwd_fast` is ever pure
  // Re-cut so each clip OWNS a stretch of the pad and the crossfades are short:
  //     idle   0 - 25%      walk 25 - 38%      run ~55%      sprint 76%+
  // A blend of walk and run can never look right in the middle -- their refs are 0.84 and 3.09,
  // **3.7x apart, with nothing authored between them** -- so the only real fix is to spend as
  // little of the stick in there as possible. A jog clip is what would close it properly.
  idleAt: .45,                                 // he is MOVING at all past this
  walkAt: 1.30, runAt: 2.60, sprintAt: 4.60,
  // AND THE CEILING CAME DOWN. At 1.9 the walk clip is a cartoon scramble for the whole of the
  // crossfade; 1.6 is the most a cycle here takes before it stops reading as the gait it is.
  tsLo: .62, tsHi: 1.6,
  // TURNING ON THE SPOT. `turnAt`/`turnFull` are rad/s of body rotation -- under the first it
  // is a correction and not a turn, and `MOVE.face0` is 11, so `turnFull` 2.2 is reached by any
  // deliberate swing. `turnUpTo` is the speed it is GONE by, because once he is walking the
  // gait is already showing his feet move and a turn clip on top of it is two strides at once.
  // `turnMax` leaves a little of the idle underneath, so he still breathes while he pivots.
  turnAt: .55, turnFull: 2.2, turnUpTo: 1.1, turnMax: .9,
  // `run_fwd_fast`'s two feet disagree by 34% (L 2.77, R 1.96) -- a real asymmetry in the clip,
  // reported by the tool rather than hidden by it. If the sprint ever reads limpy, that is why.
};

const CAM = {
  // `look` is a point ON HIM and scales with him; `dist` is the BOOM and deliberately does
  // not -- keeping the lens where it was is what makes a smaller hero read as a bigger world
  // rather than as the same picture at a different zoom.
  dist: 5.0, distV: .10, el: .22, look: 1.05 * SZ, yawRate: 2.6, half: .07,
  // how far off centre the right thumb has to be before it turns the camera. `deadAim` is
  // the one that matters: a thumb held UP to aim is never vertical, and the aim and the
  // camera are the same bearing, so its residual x wanders the reticle. Both SUBTRACT
  // rather than gate -- see `stepCam`.
  // **.34 WAS TOO MUCH (m50).** *"The dead zone now is like too strong, it's kinda hard to aim
  // left and right."* A third of the pad spent on nothing is not a dead zone, it is a
  // deliberate lean that does nothing -- and m48's own table said so and I did not read it
  // that way: it reported **0.0 deg/s at 32% off centre** as a clean pass, when 32% of a pad
  // is plainly a turn being asked for. A dead zone is sized to the WOBBLE a held thumb
  // carries (.1 to .3) and not to the whole range it has: .20 kills the bottom of that and
  // leaves the top of it turning, which is where the line actually is.
  // **AND .20 IS STILL TOO MUCH (m51).** *"I really just wanted it to be like a subtle grace
  // right in the middle."* Which is exactly the right way to put it, and it says what the
  // number is FOR: the zone is not a REGION the camera is held in, it is the SLACK at dead
  // centre. And because it SUBTRACTS rather than gates, a wide one is not just a wide middle
  // -- the rescale goes on costing sensitivity all the way out, so it makes the stick heavy
  // everywhere. .12.
  dead: .06, deadAim: .12,
  // **AND A MELEE TURNS THE LENS (m81, `melEase`).** *"I want to try making it so that the
  // camera centers based on my melees -- so if I melee toward the camera, the camera will ease
  // to my new forward, and for every direction."* How fast it comes round; 4.0 arrives in about
  // half a second, which is decisive without being a cut. `mel.CAM.melEase = 0` turns it off.
  melEase: 4.0,
  fov: 58, fovRush: 7, rush0: 2.6, rushSpan: 3.2,
  // IT COMES IN WHEN SOMETHING IS IN THE WAY RATHER THAN CLIMBING OVER IT. Shortening the boom
  // keeps the SHOT -- a level three-quarter view -- while lifting the lens changes it into a
  // top-down one, which is a different and much worse shot.
  probe: .5, pad: .3, min: 1.5, outHL: .5,
  clear: .45,        // how far the lens stays off whatever is under it
  rise: 1.4,         // and the most it may ever sit above the look point
  // **AND THE LENS GETS KNOCKED (m99, `camShake`).** *"We needs to make the ground feels it
  // ... or shake."* Nothing in this file has ever shaken the camera, so this is new machinery
  // rather than a number, and two things about it are deliberate.
  // **IT IS A DECAYING SINE, NOT PER-FRAME NOISE.** A random offset every frame is a BUZZ and
  // it changes character with the frame rate; two out-of-phase sinusoids on a half-life read as
  // one thump and are identical at 30 Hz and at 120. `Math.exp(-k*dt)`'s own argument, applied
  // to a picture rather than to a velocity.
  // **AND IT MOVES THE LENS, NEVER `cam.pos`.** `cam.pos` is a DAMPED state and writing a
  // wobble into it feeds the wobble back through the damper for the rest of the session -- the
  // same class as a Verlet constraint banking its correction as velocity. The offset lands on
  // `camera.position` on the way past, and the look point is untouched, so the subject stays
  // centred and the WORLD swings, which is what a knock looks like.
  shake: { hz: 11.5, hl: .115, side: .55, max: .55 },
};

// A FLICK IS A FAST MOVE *AND THEN A RELEASE*, AND BOTH HALVES ARE THE GATE.
// Judged on `pointerup` alone it is dead on a pad that is already being held -- the time since
// pointerdown is always past any window, so the gesture can never once fire. Judged on the
// pad's own travel alone it fires MID-HOLD: every fast correction of a steering thumb reads as
// a trick, and a press-and-hold cannot be told from a swipe at all.
// So the TRAVEL arms it and the LIFT fires it, if the lift comes inside `let` OF THE TRAVEL --
// never of the pointerdown. A thumb four seconds into a hold still flicks; a thumb that sweeps
// and then stays down never does, however fast the sweep was.
// **AND A THUMB LIFTING OFF IS NOT A SWIPE (m104).** *"I'll press and hold in one direction and
// then when I release it thinks I've done a swipe gesture -- he keeps rolling out of the way when
// I'm not meaning to. It needs to be both the press forward AND the release within a certain
// timing to make sure that it's a swipe."*
// **THE ARM-THEN-LIFT SHAPE IS RIGHT AND THE NUMBERS WERE NOT.** A thumb coming off the glass
// drags its contact centroid as the patch shrinks -- twenty to forty pixels of it, routinely --
// and on a 52 px radius that is up to **.77 of the pad, arriving fast and followed immediately by
// the up**, which is geometrically the same event as a flick. No window can separate those two,
// because the wobble IS a fast move and then a lift: **the only honest discriminator left is
// MAGNITUDE**, and `at` .70 (36 px) sat inside what a lift-off produces.
// `at` .95 is 49 px of travel -- a deliberate sweep across most of the pad, which a finger
// leaving the glass does not do -- and the two windows come down with it so the gesture as a
// whole has to be quick, which is what he asked for in those words.
// **A FLICK STILL FIRES OUT OF A HELD POSITION**, which is the thing that must not be lost: the
// delta is measured over a moving window rather than from the pad's centre, so a thumb four
// seconds into a steering hold still flicks. What it now has to do is cross the pad to do it.
const FLICK = { at: .95, within: .16, let: .14, gap: .10 };

// THE MELEE CHAIN. Each link is a fixed BEAT and the clip is compressed to it: the authored
// clips run 1.0 to 1.75 s, so a three-hit chain played at 1x is over four seconds of watching,
// which reads as lag rather than as a combo. Escalating, so the finisher has the most weight.
const MELEE = {
  // FAST ENOUGH TO PLAY ALL THE WAY THROUGH. The rule is that a strike is never interrupted,
  // which is only bearable if each one is over quickly -- so the beats come down and the clips
  // are compressed harder to match. A chain is 1.56 s of three landed blows rather than 2.3 s
  // of two and a half.
  // **SLOWER AGAIN (m36).** *"The animations look really bad -- they're really fast and you
  // can't even tell what he's doing."* A 1.0-1.75 s clip squeezed into .44 s is 3x, and at 3x a
  // swing is a blur with no pose in it. These are the compromise while the clips are what they
  // are: readable, and still short enough that a chain is not a film. **The real fix is the
  // clips** -- see the note under `STRIKE` about the dash-and-pose set he is drawing.
  beat: [.62, .68, .82],
  // **A CHAIN IS A LENGTH AND THE CLIPS ARE DEALT OUT OF THE POOL (m95).** *"way more melees"* --
  // and the obvious move, letting the chain BE the pool, is wrong twice over. Six links at a
  // readable rate is about five seconds of watching, which is m36's "a chain is not a film"; and
  // `power` is graded across the chain, so a six-link chain means a man only goes over on every
  // SIXTH blow where today it is every third. **The tempo and the strength belong to the chain;
  // the clips belong to the pool.** Three links, dealt in order and advanced by a whole chain
  // each time, so no clip comes round again until every one has been used -- six unarmed clips
  // are exactly two chains, and four armed ones walk round every time.
  links: 3,
  // **AND THE BEAT COMES OFF THE CLIP'S OWN LENGTH (m95).** m94 wrote the sentence and typed one
  // entry: a beat belongs to the clip, not to a chain position. With ten melee clips now, typing
  // ten is a constant somebody has to remember, which is not a mechanism -- so the beat is the
  // clip's duration at a fixed compression, and `MELEE.clip` stays as the override for anything
  // that wants its own.
  // **AND `rate` IS FITTED TO THE BAND THE SHIPPED CLIPS ARE ALREADY PLAYED AT, NOT PICKED.**
  // Today `melee_extra` runs at x1.55 and `melee_03` at x2.02, m36 rejected 3x as "a blur with
  // no pose in it", and m94 chose x1.37 for the 360 because x2.13 was "slow that one down". So
  // the honest window is about 1.4 to 2.0 and this sits in the middle of it.
  // **A CHAIN'S LENGTH IN SECONDS IS THE THING TO WATCH, and it is why 1.5 was wrong.** At 1.5
  // a three-punch chain came to **3.24 s** -- longer than the 2.3 s m36 threw out as watching
  // rather than playing, because his new clips are long (2.208 s and 1.917 s against the old
  // pool's 0.958). At 1.75 it is 2.93 s and 2.29 s for the two hands.
  //     melee_01 2.208s -> 1.26   melee_02 1.542 -> 0.88   melee_03 1.375 -> 0.79
  //     melee_04 1.917  -> 1.10   melee_05 1.125 -> 0.64   melee_extra 0.958 -> 0.55 (the floor)
  //     weapon_melee_01 1.333 -> 0.76   _02 1.167 -> 0.67   _03 1.708 -> 0.98   _04 overridden
  // **`melee_01` IS TWICE THE LENGTH OF ANYTHING ELSE IN THE POOL** and whether it reads as an
  // OPENER is a device question -- nothing here can pose a skin. Moving it down the pool is one
  // edit if it turns out to be the heavy one.
  rate: 1.75, beatMin: .55, beatMax: 1.30,
  // WHERE IN THE CLIP THE BLOW LANDS, per strike. Firing on the INPUT frame puts the
  // consequence a third of a second before the hand gets there, and a swing and its effect
  // arriving as two events is what "you cannot actually hit things" looks like from outside.
  at: [.34, .40, .32], finishAt: .38,
  reach: 2.5,
  // A FLICK IN THE GENERAL DIRECTION OF SOMEBODY IS A FLICK AT HIM. Aiming at him is not
  // enough on its own: a punch thrown at exactly the right bearing from four metres still hits
  // air. So the lock also SOLVES the launch for the gap, which is what makes it land.
  // **AND IT WIDENED AGAIN AT m51.** *"You can kind of button-smash with the stick -- swipe,
  // swipe, swipe -- and he hits him, goes back, goes across to them. It's because of the aim
  // assist on the melee, so he always kind of targets them if you're at least flicking in
  // their general direction, and for a mobile game that's pretty good because you're pretty
  // limited."* **"GENERAL DIRECTION" IS A WIDER CONE THAN "AIMED AT"**, and this one is safe
  // to widen where the blaster's was not: a lock that only ever pulls a LUNGE is a physical
  // assist with nothing drawn and nothing taken off the thumb -- the half he has now asked to
  // keep three times -- and its own reach caps how far it can drag him. 24 deg -> 34.
  aimCone: .60,        // ~34 degrees either side of the flick. It was .95 -- FIFTY-FOUR, which
                       // is most of the screen, and the same complaint as `LOCK.cone`.
  aimNear: .55,        // what a metre of distance is worth against a metre of miss. Raised with
                       // the cone: swinging at two men, the NEAR one is what you meant.
  maxV: 28,            // the fastest a lunge may be solved to. *"When you charge it full he
                       // really launches -- he launches pretty far and pretty fast."*
  // **AND HOW FAR A STRIKE MAY CARRY HIM, IN METRES (m72).** *"When I melee he launches forward
  // quite a bit -- sometimes I wanna cap that distance, sometimes it's ridiculous. He can go
  // forward, but it should be more capped."* The lock solves `melV` for the gap, so where the
  // MAN is was the only thing deciding the distance and the ceiling fell out of `maxV` times
  // whichever beat was playing -- **11.8 m on a jab and 15.9 m on the finisher**, which on a
  // 1.25 m body is ten to thirteen of his own heights. A launch, and he has not drawn one yet.
  // **IT IS METRES RATHER THAN A LOWER `maxV`, because a speed cap is three different distances
  // here** -- the beats are .62 / .68 / .82, so one velocity ceiling means the finisher always
  // travels 32% further than a jab however it is tuned. Distance is what he asked to cap.
  // **AND IT CAPS BOTH PATHS, SO THEY CANNOT DISAGREE.** An unlocked finisher covered 5.35 m
  // off `lunge[2]`, so a cap on the solve alone would leave a swing at NOBODY travelling
  // further than a swing at a man -- a lock that makes him move less is worse than no lock.
  lungeMax: 4.6,       // METRES of travel. `mel.MELEE.lungeMax` is the dial.
                       // Raise it, or give the dash its own, the day there IS a flying-kick
                       // clip -- *"unless I'll make an animation for an actual launch, like a
                       // slide tackle or flying kick"*. The charged dash is NOT this and keeps
                       // its own `flatFar`; it is the move that is supposed to cross ground.
  arrive: 1.05 * SZ,   // the gap he is solved to leave -- ARM'S LENGTH, so it is his and it
                       // scales with him. Not his centre. It has
                       // to be inside what the swept fist can REACH now that the sweep decides:
                       // the hand is about .75 m off his centre at full extension and carries
                       // `STRIKE.r`, against a body surface at `arrive - DUMMY.r`.
  // `lockAt` IS DEAD AND KEPT AS A NOTE. It fired the blow on a timer when the lunge had not
  // arrived, which is the *"cop has been hit"* half of the range-check complaint. A swing that
  // does not reach him now simply misses -- see `STRIKE`.
  lockAt: .58,
  carryAvg: .725,      // the `carry` profile's average speed: carry + (1 - carry) / 2

  // **THE TWO NEW OPENERS (m88), AND NEITHER NEEDED A STATE.** *"That slide tackle can now be
  // if you're running and you melee -- it becomes the first link in the melee sequence. Flying
  // kick is if you jumped in the air and you melee."* A strike here is already just a clip, a
  // beat and a solved velocity driven through `p.melee`, so both are those three fields with
  // different values: the lunge, the bleed, the swept limb, the lock and the camera all come
  // with them, and there is nothing new to keep in step.
  slide: 'slide_kick', slideDur: .95, slideV: 9.0, slideMax: 7.5,
  // **AND A TACKLE'S DISTANCE IS ITS OWN, NOT THE MAN'S (m93).** *"If you're far away from an
  // enemy he does a nice long slide tackle, but when I'm closer to them it seems to cut it
  // short."* Exactly that, and it is m51's solve doing precisely what m51 built it to do: the
  // lock inverts `v * dur * carryAvg` so the swing lands ON him, which is why a man at arm's
  // length gets a JAB thrown on the spot. Measured through the shipped line:
  //     nobody in front   melV 9.00   travel 6.20 m   <- the "nice long" one
  //     a man at 3 m      melV 3.27   travel **2.25 m**
  //     a man at 2 m      melV 1.81   travel **1.25 m**
  // A jab thrown on the spot is right; a SLIDE thrown on the spot is not a slide. So the solve
  // may only ever LENGTHEN this one -- it reaches a man further out and never shortens to one
  // close in, and sliding THROUGH somebody is what a slide tackle IS. `hitAll` and the swept
  // limb already catch everybody he passes, which is m43's own argument one move over.
  slideFree: 1,        // `mel.MELEE.slideFree = 0` is the one word back to the m88 solve
  // HOW FAR PAST HIM A TACKLE CARRIES, and the shortest one that still reads as a slide.
  // See the note in `meleeGo`: without these the tackle ignored where the man was entirely.
  slideThru: 2.2, slideMin: 3.6,
  // **AND IT TRIPS THEM.** *"I'm thinking I'm gonna maybe have it trip them and have them fall
  // over -- at very least it should deliver some damage."* It took `power[0]` .45, which is
  // under every kind's `fling` (.70 on the warrior, .55 on the rest), so it could only ever
  // stagger. .78 clears all of them and `dummyBlow` then grades the launch from `fly0` across
  // `fling..1` SQUARED -- so on a warrior it is k .489, **11.7 m/s out and 4.2 up**: a man
  // tripped and going over, and nowhere near the finisher's 24 / 8.5.
  // **THE DAMAGE STAYS MODEST, WHICH IS HIS OWN SENTENCE.** *"Maybe a disarmed melee is just
  // not that strong, which it probably shouldn't be."* 1.1 against a fist's .8 and the
  // finisher's 3.2 -- it costs more than a punch because you had to run at him for it.
  slidePow: .78, slideDmg: 1.1,
  // **AND IT IS A FEW STEPS IN, NOT A DIRECTION HELD.** *"I want it to only trigger if you've
  // actually got a little bit of like a few steps in. It's not just like if you're holding a
  // direction."* `p.goT` is how long he has been ASKING to move, which is exactly the thing he
  // ruled out; `p.runT` is how long he has actually BEEN above a run, which is the sentence.
  // At 4.2 m/s a stride is about 1.3 m, so .45 s is three of them.
  slideAt: 4.2, slideT: .45,
  // the flying kick ends when he MEETS the ground -- `slamGo`'s rule, and the opposite of every
  // other strike, which end when he leaves it. One per airtime, or it is a flutter kick.
  air: 'flying_kick', airDur: .85, airV: 9.5,
  // **AND IT AIMS (m93).** *"I wanna be able to do the flying kick too in the air, and I want
  // the flying kick to sort of aim assist -- so even if you're up in the air and you're a
  // little bit above them, if you flick the melee stick more or less towards them I want it to
  // target them and I want to hit them."* `kickGo` set `p.melTgt = null` and never called
  // `meleeLock` at all, so the one move thrown from furthest away was the one with no assist
  // on it. It is the SAME lock the ground strikes use and it needed no vertical term:
  // `aimAt` is purely horizontal, so being above him does not change his bearing.
  airMax: 8.5, airPow: .78, airDmg: 1.1,
  finishRange: 26,     // how far the charged swing may ACQUIRE. A little past `finishReach` on
                       // purpose, and no further: a lock it cannot deliver is worse than none.
  // and what each one is worth. The finisher and the charged swing put him down outright.
  // **AND THE ESCALATION IS A RAMP OVER THE CHAIN, NOT A THREE-SLOT ARRAY (m95).** `power` was
  // read `[Math.min(ix, len - 1)]` like `beat` and `lunge` were before m94, so EVERY link past
  // the third inherited the finisher's 1.0 -- and 1.0 clears every kind's `fling`, so it is a
  // launch. That was already live and nobody had looked: the ARMED pool has been four long since
  // m86, so links 3 AND 4 have both been finishers. With the unarmed pool at six it would have
  // been four of them. **The finisher is the LAST blow, which is a fact about chain POSITION
  // relative to LENGTH** -- so the three entries are read as what they are (open / build /
  // finish) and everything between the first and the last is graded.
  // It is a NO-OP on a three-link chain, which is the check that says it cannot have disturbed
  // what is already tuned: 0 -> .45, 1 -> .52, 2 -> 1.0, exactly the old array.
  //     n = 6   .45  .464  .478  .492  .506  1.00   -- and every real `fling` is .55 or over,
  //                                                    so only the last one puts a man over
  power: [.45, .52, 1.0],
  // **A BEAT, A CONTACT FRAME AND A LUNGE BELONG TO THE CLIP, NOT TO A CHAIN POSITION (m94).**
  // *"There's a spinning melee, and the actual arc of the spin where he's doing the attack --
  // they don't usually even react to it. It's like once he's settled and he kind of spins back,
  // that's when they hit. I think we might need to slow that one down, and also we need to make
  // sure the right part of that animation is connecting."*
  // `beat`, `at`, `lunge` and `power` are read `[Math.min(ix, len - 1)]`, so the FOURTH link of
  // the armed chain silently inherits the third's -- and m86 put `weapon_melee_04` there, which
  // is the renamed `Standing_Melee_Attack_360_High`. A 360 is not a jab with a different index:
  //     beat    it took .82 on a **1.750 s** clip -- **x2.13**, which is his "slow that one down"
  //     lunge   it took the finisher's 9.0, capped by `lungeMax` to **4.6 m of travel** --
  //             a spin thrown ON THE SPOT was crossing four and a half metres mid-arc, which is
  //             a real candidate for the reaction not lining up with the swing: where he IS when
  //             the arc passes is different every time
  //     at      it took .32, a fraction authored for a jab
  // **`at` .55 HERE IS A GUESS AND IS MARKED AS ONE**, the taunt beats' rule (m65): a jab has an
  // obvious contact frame and a full turn does not, and nothing in this container can pose a skin
  // to measure one. **So the chip reports the `u` the blow ACTUALLY fired at** -- `melee4@0.62!`
  // -- which turns "it hits at the wrong time" into a number, and `mel.MELEE.clip` is live.
  clip: {
    weapon_melee_04: { beat: 1.25, at: .55, lunge: 2.2, max: 2.6 },
  },
  limbDir: 0,        // see `strikeSweep`: 1 launches a man along the LIMB's instantaneous
                     // travel, which is what m20 did and is tangential to the swing
  hitAll: 1,         // a swing catches EVERY body it sweeps through, not the first one
  window: 1.05,      // how long after a strike the next flick continues the chain
  // `hold` IS DEAD AND KEPT AS A NOTE. It was the fraction of a strike after which the stick
  // could cancel the recovery -- and cancelling a strike is exactly what must not happen now.
  hold: .55,
  // A STRIKE HAS TO TRAVEL. At 2.4 / 2.0 / 2.6 the three-hit chain covered about a metre in
  // total, which reads as swinging on the spot. Distance is `v * beat * .725` (the `carry`
  // profile's average), so these give 1.9 / 2.1 / 3.4 m -- a chain that crosses seven metres
  // and a finisher that genuinely closes.
  // HE RUNS AT THE GUY AND LAUNCHES. These are the FLOOR -- the lock solves upward from here
  // for the real gap, so what they set is how far an unlocked swing carries.
  lunge: [7.0, 6.5, 9.0],
  carry: .45,        // full speed for this fraction of the strike, then linear to zero
  rollDur: .92, rollV: 6.2, rollFree: .45,
  charge: 1.0,       // seconds to a full hammer charge
  chargeBeat: .55, finishBeat: .80,
  // THE RELEASE IS A LEAP, NOT A STEP. It was 3 m/s flat, which is slower than a walk and
  // reads as a man swinging at the air in front of him.
  // **AND IT IS A SOLVED ARC NOW, NOT A FIXED ONE.** *"If he's much closer he'll jump way
  // higher, and if he's farther away he'll jump way farther -- right now it's always the same
  // distance, so if he's really close and you do the charge attack he just jumps through
  // them."* Exactly what a constant launch does. The gap decides how the leap is SHAPED:
  //     apex   lerp(hiNear, hiFar) by how far away he is -- close goes UP, far goes OUT
  //     vy     sqrt(2 g h), so the apex IS the number being set
  //     T      2 vy / g -- the flight falls out of the arc rather than being typed
  //     vx     gap / T, which lands him ON the man by construction at any distance
  // and the CLIP is compressed to T, because a state whose length disagrees with the clip it
  // is playing can only ever cut that clip off. Everything scales with `chargeGoK`, so a half
  // charge is a smaller hop that reaches less far.
  finishReach: 24,     // the farthest the leap will carry at a full charge. It caps the GAP a
                       // LOCKED dash is solved for, so it has to move with `flatFar` or a man
                       // twenty metres off is acquired and then arrived at less than half way.
  // **AND THE APEX RIDES THE HOLD, WHICH IS WHAT MAKES THE CHARGE WORTH HOLDING.** *"If you
  // just pull it back, lock on and let go, he does a ground slam -- but if you charge it to the
  // full end of the lock he jumps pretty high, maybe double, and slams down."* These were 2.4 /
  // 1.1 scaled only by `chargeGoK`, whose floor is `finishMin` .45 -- so the shortest real
  // swing already leapt 45% as high as the longest and the hold bought almost nothing you could
  // see. Doubled at the top, and `finishHiK0` is the floor at the bottom.
  // **AND IT IS FLAT NOW (m36).** *"Make it so that jump attack doesn't go high up in the air
  // any more -- it's just a straightforward launch, and how far you go depends on how long you
  // hold the charge."* So the arc stops being solved from the GAP and starts being solved from
  // the HOLD: one low hop whatever the distance, and the charge alone decides how far it
  // carries. m21's finding stands and is simply no longer wanted -- a constant launch can only
  // do one distance, and this is still not constant, it is a function of the hold instead.
  // **`flatHi` IS A HOP, NOT AN ARC.** Low enough to read as a lunge rather than a leap, and
  // high enough that the ground does not eat the travel: the flight time still falls out of it
  // (`T = 2 vy / g`), and the clip is still compressed to T.
  // **AND IT DOES NOT LEAVE THE GROUND AT ALL NOW (m37).** *"You don't jump in the air any
  // more -- it's a straight-ahead attack."* `dash` is the switch; `flatHi` and the solved-arc
  // numbers below it are kept so `mel.MELEE.dash = 0` walks back to the m36 hop and
  // `flatHi = 3` from there to the m21 arc. Three behaviours, two switches, nothing deleted.
  dash: 1,
  // **AND A MAN IN FRONT NO LONGER SHORTENS IT (m43, `dashFree`).** *"The charge melee STILL
  // isn't really going very far. I have a feeling you've been implementing something and it's
  // somehow not working, because nothing has changed and I've told you three times."* He was
  // right three times and the tuning was never the problem. m21 solved the launch to land ON
  // the man, on the argument that a leap that overshoots goes THROUGH people -- correct for a
  // leap, and it means the distance is set by whoever happens to be in front rather than by the
  // hold. With eighteen bodies in the street now, a man six metres ahead cut a 24 m dash to
  // **4.95 m**, and three of them about cut it to **2.95** -- so m37, m40 and m42 could not
  // possibly have shown, whatever the numbers were.
  // **THE LOCK KEEPS THE FACING AND LOSES THE DISTANCE.** Aiming him at the man is the half
  // that helps; clamping the travel to the gap is the half that ate the feature. And going
  // through him is not a bug any more -- `hitAll` has meant "a mace does not stop at the first
  // man" since m36, so the swept weapon catches everyone the dash passes and the launch sends
  // them. `mel.MELEE.dashFree = 0` restores m21 exactly.
  // **AND m43 WAS HALF THE ANSWER: THE CHARGE SETS THE REACH, THE TARGET SETS THE DISTANCE
  // (m51).** *"The way I think it will work is you still always launch to the character's
  // position... the distance he travels always ends right at them, so that the full animation
  // and swing finishes right at them -- you'll have to basically gauge the distance. There
  // should still be a distance cap, in that the longer you charge the farther you can actually
  // launch to hit them. It's just, regardless, when you release he still always launches to
  // them within reason, within a cap."* Both of the previous shapes were one half of that:
  //     m21   `far = gap`                 -- the man sets it, and the hold buys NOTHING
  //     m43   `far = wantD`               -- the hold sets it, and he goes straight THROUGH him
  //     m51   `far = min(gap, wantD)`     -- the hold is the CAP, the man is the DISTANCE
  // which is the m43 line restored and read the other way round. m43's finding stands and was
  // never about the `min`: it was that `wantD` had no way to matter, because `finishRange` 26
  // acquired a man in a 24-degree cone from across the street and `gap` was then always the
  // small number. **`acq` is what makes the cap real** -- a target is only taken if the charge
  // can actually deliver him, which is m20's rule (an assist's range is sized for what it
  // DELIVERS, not for what it draws) arriving at the melee three builds late.
  dashFree: 0,
  // **AND HE HAS TO BE STOPPED BY THE TIME THE HAMMER LANDS (m51, `dashLand`).** *"He launches
  // through them and so they go flying before he's even swung his hammer."* Two causes and
  // this is the second: `carry` bleeds him to zero across the WHOLE state, so at the contact
  // frame (`finishAt` .38) he has covered .38/.725 = **52% of the distance** and the other 48%
  // is spent ploughing on past the man he has just hit. The travel is spent by `dashLand`
  // instead and he is stationary from there -- so the swing lands on a body that has arrived,
  // and the rest of the clip is the follow-through it was drawn as.
  // Just past `finishAt`, so he is planted rather than still sliding on the frame it connects.
  dashLand: .42,
  // **AND IT HAS ITS OWN SPEED CAP (m40).** *"The charge on the weapon still is not far enough
  // -- he needs to LAUNCH forward, launch, launch. I want it to be a very exaggerated forward,
  // fast motion."* `maxV` could not carry that: it is also the ceiling on an ordinary lunge AND
  // the radius `meleeGo` is allowed to ACQUIRE inside, so raising it to dash speed would have
  // every jab locking onto a man twenty metres away and rocketing at him. A number meant for one
  // thing must not be shared with another -- `chargeGoH` learnt that at m27, one constant over.
  // **AND IT HAD TO RISE WITH `dashLand` (m51).** The travel is spent over `dashLand` of the
  // state now, so the clock is `goDur * carryAvg * dashLand` = **.158 s**, not .377 -- at 66

                       // first .22 s of the move, which is most of "exaggerated forward".
