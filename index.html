  const dz = (p.block || padUp(p.aim || p.charge || p.center)) ? CAM.deadAim : CAM.dead;
  const ax = Math.abs(rx);
  if (ax > dz) { cam.az -= Math.sign(rx) * ((ax - dz) / (1 - dz)) * CAM.yawRate * dt; p.camWant = null; }
  // **AND THE MOUSE IS THE SAME WRITER, NOT A SECOND ONE (m79).** It is spent HERE rather than
  // in the listener for exactly the reason the line above it exists: `cam.az` has one writer and
  // a second one anywhere else is a loop that never settles. It is a DISPLACEMENT and not a
  // rate, so it is not multiplied by `dt` -- the pixels already happened.
  if (DESK.yaw) { cam.az -= DESK.yaw * DESK.sens; DESK.yaw = 0; p.camWant = null; }

  // AND IT COMES ROUND TO A LOCKED TARGET. This is inside `stepCam` on purpose -- `cam.az` has
  // exactly one writer, and a second one somewhere else is a loop that never settles.
  // **AND A MELEE BRINGS IT ROUND TO HIS NEW FORWARD (m81, `CAM.melEase`).** *"If I melee
  // toward the camera the camera will ease to my new forward, and for every direction."* This
  // is inside `stepCam` for the same reason the lock's come-round is: **`cam.az` has exactly
  // one writer** and a strike is not allowed to be a second one, so `meleeGo` states a WANT and
  // this is the one place that spends it. `faceTgt` reads `cam.az` while aiming, so easing the
  // lens IS easing his forward -- the two are the same bearing and that is what makes this a
  // centring rather than a second thing to keep in step.
  // **AND THE THUMB OUTRANKS IT, WHICH IS WHY THE TWO WRITERS ABOVE CLEAR IT.** An auto-follow
  // that fights a deliberate drag is the loop that never settles; a drag cancels the want
  // outright rather than being averaged with it.
  if (p.camWant != null) {
    const cd = wrapAngle(p.camWant - cam.az);
    if (Math.abs(cd) < .01) p.camWant = null;
    else cam.az += cd * Math.min(1, CAM.melEase * dt);
  }
  if (p.lock) cam.az += wrapAngle(lockH(p.lock) - cam.az) * Math.min(1, LOCK.cam * dt);
  cam.el = CAM.el;
  // **AND THE LOOK POINT IS CHEST HEIGHT ON THE BODY BEING DRAWN (m112).** `CAM.look` is his own
  // chest; worn as a 1.78 m drunk that is the man's waist, so the lens frames him low. It is the
  // one term the morph moves -- the collider and every speed stay his, deliberately.
  cam.tgt.set(p.pos.x, p.pos.y + CAM.look * bodyK(), p.pos.z);
  const ce = Math.cos(cam.el);
  const bx = -Math.sin(cam.az) * ce, by = Math.sin(cam.el), bz = -Math.cos(cam.az) * ce;
  const want = CAM.dist + p.speed * CAM.distV;
  const free = camFree(cam.tgt.x, cam.tgt.y, cam.tgt.z, bx, by, bz, want);
  // SNAP IN, EASE OUT. Easing IN is time spent inside the wall; easing OUT is what stops every
  // doorway and lamp post making the shot lurch.
  cam.dist = free < (cam.dist || want) ? free : damp(cam.dist || want, free, CAM.outHL, dt);
  const wx = cam.tgt.x + bx * cam.dist, wy = cam.tgt.y + by * cam.dist, wz = cam.tgt.z + bz * cam.dist;
  if (cam.pos.lengthSq() === 0) cam.pos.set(wx, wy, wz);
  cam.pos.x = damp(cam.pos.x, wx, CAM.half, dt);
  cam.pos.y = damp(cam.pos.y, wy, CAM.half, dt);
  cam.pos.z = damp(cam.pos.z, wz, CAM.half, dt);
  // the floor under the LENS, capped at how far it may sit above the subject -- that cap is
  // what stops the camera being left standing on the box he has just dropped off
  const floor = groundAt(cam.pos.x, cam.pos.z, cam.pos.y, .6) + CAM.clear;
  cam.pos.y = Math.max(cam.pos.y, Math.min(floor, cam.tgt.y + CAM.rise));
  camera.position.copy(cam.pos);
  // THE KNOCK. `A` is metres at the peak and decays on its own half-life; the vertical is the
  // main axis because the thing that hit is the FLOOR, and the sideways term is out of phase so
  // the two do not trace a line. See `CAM.shake` for why it is a sine and why it lands here.
  if (cam.shakeA > .0005) {
    const S = CAM.shake;
    cam.shakeT += dt;
    cam.shakeA *= Math.pow(.5, dt / S.hl);
    const w = Math.PI * 2 * S.hz * cam.shakeT;
    camera.position.y += Math.sin(w) * cam.shakeA;
    camera.position.x += bz * Math.sin(w * .77 + 1.9) * cam.shakeA * S.side;
    camera.position.z += -bx * Math.sin(w * .77 + 1.9) * cam.shakeA * S.side;
  } else cam.shakeA = 0;
  camera.lookAt(cam.tgt);
  // the lens widens with speed -- the cheapest speed cue there is, and it costs nothing
  const rush = smooth(CAM.rush0, CAM.rush0 + CAM.rushSpan, p.speed);
  const fov = CAM.fov + CAM.fovRush * rush;
  if (Math.abs(camera.fov - fov) > .01) { camera.fov = damp(camera.fov, fov, .25, dt); camera.updateProjectionMatrix(); }
}

// ============================================================================================
// THE COLLIDER VIEW (m128, `BOXV`, `stepBoxView`)
//
// *"There's like these weird collider geometry, visible geometry that I'm just like floating on
// -- I can't tell if it's the vehicle or what's going on there. Do I need to edit that in
// Blender?"* **And the honest answer was that neither of us could tell**, which is what this is
// for. The chip in that screenshot read `LEDGE`, so he was HANGING off a box -- and from a
// photograph a collider box and a hole in the art are the same picture.
//
// Shredworld got one of these after he asked three times (*"I need to see the collider"*), and
// the note it earned is that a debug view which disagrees with the thing it draws is worse than
// none, because it is a second thing to be wrong. So every number here is read off the SAME
// fields the resolver reads -- `b.minx..maxy`, `K.r`, `p.r`/`p.hh` -- and nothing is restated.
//
// **NOT DEPTH TESTED, AND THAT IS THE WHOLE POINT.** The question it exists to answer is *there
// is a collider where there is no picture*, so a view the picture can hide is a view that
// cannot answer it.
// ============================================================================================
const BOXV = {
  on: 0,
  r: 20,        // how far round him the static boxes are drawn. Weirdport has 4,086 and a
                // buffer holding all of them is a buffer nobody can read -- the question is
                // always about the one he is standing on or hanging from.
  max: 700,     // and the ceiling, so a dense block cannot run off the end of the buffer
  seg: 20,      // segments in a body ring
  // Bright and saturated rather than eye-picked: three treats a vertex colour as LINEAR, so a
  // hex chosen by eye comes out a stop and a half light -- and on a wire overlay that is not
  // worth a conversion, it is worth picking values that read.
  grid: [.18, 1, .48],    // a static solid
  held: [1, .72, .12],    // whatever the ledge or the wall has hold of
  body: [1, .26, .46],    // a body -- a CIRCLE, because a circle is what `pushBodies` tests
  me:   [.30, .74, 1],    // and his own
};
let bvMesh = null, bvPos = null, bvCol = null, bvN = 0, bvCap = 0;
const _bvL = [];

function bvBuild() {
  bvCap = BOXV.max * 24 + 120 * BOXV.seg * 2 + 256;
  bvPos = new Float32Array(bvCap * 3);
  bvCol = new Float32Array(bvCap * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(bvPos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(bvCol, 3));
  bvMesh = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    vertexColors: true, depthTest: false, depthWrite: false, transparent: true, opacity: .92 }));
  // THE BUFFER HOLDS WORLD POSITIONS, so its origin means nothing and a bounding sphere
  // computed from it would cull the whole view the moment he walked away from wherever it
  // happened to be built.
  bvMesh.frustumCulled = false;
  bvMesh.renderOrder = 999;
  scene.add(bvMesh);
}

function bvSeg(x0, y0, z0, x1, y1, z1, c) {
  if (bvN + 2 > bvCap) return;
  let i = bvN * 3;
  bvPos[i] = x0; bvPos[i + 1] = y0; bvPos[i + 2] = z0;
  bvCol[i] = c[0]; bvCol[i + 1] = c[1]; bvCol[i + 2] = c[2];
  i += 3;
  bvPos[i] = x1; bvPos[i + 1] = y1; bvPos[i + 2] = z1;
  bvCol[i] = c[0]; bvCol[i + 1] = c[1]; bvCol[i + 2] = c[2];
  bvN += 2;
}

// AXIS-ALIGNED, because that is what `BOXES` is (m24 keeps every placement on a quarter turn
// for exactly this reason). A yawed wire box here would be drawing a rule the game has not got.
function bvBox(b, c) {
  const x0 = b.minx, x1 = b.maxx, y0 = b.miny, y1 = b.maxy, z0 = b.minz, z1 = b.maxz;
  for (let k = 0; k < 2; k++) {
    const y = k ? y1 : y0;
    bvSeg(x0, y, z0, x1, y, z0, c); bvSeg(x1, y, z0, x1, y, z1, c);
    bvSeg(x1, y, z1, x0, y, z1, c); bvSeg(x0, y, z1, x0, y, z0, c);
  }
  bvSeg(x0, y0, z0, x0, y1, z0, c); bvSeg(x1, y0, z0, x1, y1, z0, c);
  bvSeg(x1, y0, z1, x1, y1, z1, c); bvSeg(x0, y0, z1, x0, y1, z1, c);
}

function bvRing(x, y, z, r, c) {
  const n = BOXV.seg;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, a2 = (i + 1) / n * Math.PI * 2;
    bvSeg(x + Math.sin(a) * r, y, z + Math.cos(a) * r,
          x + Math.sin(a2) * r, y, z + Math.cos(a2) * r, c);
  }
}

// REBUILT ONLY WHILE IT IS ON, and the geometry is allocated once -- a fresh BufferGeometry
// every frame is garbage on the one frame something is already happening.
let bvLit = -1;
function stepBoxView() {
  // **THE KEY IS REPAINTED WHEN THE STATE MOVES, NOT WHEN THE KEY IS PRESSED.** `BOXV` is on
  // the `mel` handle, so `mel.BOXV.on = 1` from a laptop is a second owner -- and a key saying
  // `off` over a screen full of wire boxes is exactly the disagreement this view must not have.
  // One tracked value, so it is a DOM write when something changes and nothing per frame.
  if (bvLit !== BOXV.on) { bvLit = BOXV.on; setBoxes(BOXV.on); }
  if (!BOXV.on) { if (bvMesh) bvMesh.visible = false; return; }
  if (!bvMesh) bvBuild();
  bvMesh.visible = true;
  bvN = 0;
  const p = player, R = BOXV.r;
  // THROUGH `boxesNear`, THE COLLIDER'S OWN BROAD PHASE, so the view cannot be looking at a
  // different set of boxes than the resolver is.
  let n = 0;
  for (const b of boxesNear(p.pos.x - R, p.pos.x + R, p.pos.z - R, p.pos.z + R, _bvL)) {
    if (n++ >= BOXV.max) break;
    bvBox(b, BOXV.grid);
  }
  // WHATEVER HAS HOLD OF HIM, LAST so it wins the overlap. This is the line the whole view was
  // built for: `LEDGE` in the chip and a man in mid-air is one box, and this is which.
  const held = (p.ledge && p.ledge.b) || (p.wall && p.wall.b) || null;
  if (held) bvBox(held, BOXV.held);
  // A BODY IS A CIRCLE AND NOT A BOX. `pushBodies` tests `r + d.K.r` in PLAN with no height
  // term at all, so what a body actually is to the collider is an infinite vertical cylinder --
  // two rings say that honestly where a box would be a flattering lie.
  for (const d of DUMMIES) {
    const q = d.root.position;
    if (Math.abs(q.x - p.pos.x) > R || Math.abs(q.z - p.pos.z) > R) continue;
    bvRing(q.x, q.y + .02, q.z, d.K.r, BOXV.body);
    bvRing(q.x, q.y + (d.K.h || 1.7), q.z, d.K.r, BOXV.body);
  }
  // AND HIS OWN, so the two can be COMPARED rather than one of them described. `hh` is the full
  // height above his feet -- `resolveBoxes` tests `p.y + hh < b.miny` -- not a half extent.
  bvRing(p.pos.x, p.pos.y + .02, p.pos.z, p.r, BOXV.me);
  bvRing(p.pos.x, p.pos.y + p.hh, p.pos.z, p.r, BOXV.me);
  const g = bvMesh.geometry;
  g.attributes.position.needsUpdate = true;
  g.attributes.color.needsUpdate = true;
  g.setDrawRange(0, bvN);
}


// ============================================================================================
// THE AIR: DUST AND SUN SHAFTS (m130, `DUST`, `SHAFT`)
//
// *"There's like these little dust kind of particle things that kind of glimmer and float
// around"*, and *"the sun makes these like nice rays"*. Two separate switches, because they are
// two separate costs and neither can be judged while the other is moving.
// ============================================================================================

// ---- the dust -------------------------------------------------------------------------------
// **ITS OWN POOL, NOT `SPK`.** That one is 560 and m118's note says the morph already takes
// about 190 of them at once; a field that lives FOR EVER would sit in it permanently and starve
// every impact in the game. One more `Points` is one more draw call and no shared state.
// **AND IT IS A LOCAL FIELD THAT WRAPS, NOT A WORLD FULL OF MOTES.** City's cloud rule: keep a
// box of them round the lens and recycle, so 220 points cover a 280 m city exactly as well as
// they cover a white room, and nothing is allocated as he walks.
const DUST = {
  on: 1,
  // **THE FLOATIES, AND THE COUNT AND THE BOX WERE BOTH WHY HE COULD NOT FIND THEM (m138).**
  // *"I don't wanna do like a render pass because it would be expensive -- but I do think
  // putting in some of the floaties, those like dragonfly looking points, would be nice."*
  // Right on the first half: real volumetric rays or a bloom need this game's FIRST render
  // target, and m130 declined that for a phone already at 27 fps. **Specks need none of it** --
  // they are one `Points` and one draw call, which is why they are the one thing on his
  // Kasumigawa list that ports for nothing.
  // **AND THE DENSITY IS MATCHED TO HIS OWN STUDY RATHER THAN GUESSED.** Its petal field is
  // 1800 motes in a 90 x 30 x 120 m box = **0.0056 per cubic metre**; 520 in a 44 m cube is
  // 0.0061. m130's 220 in a 26 m cube was 0.0125 -- DENSER, and invisible anyway, because the
  // box was only 13 m across and the edge fade starts at .72 of that: **every mote in the game
  // lived within 9.4 m of the lens.** A field you have to stand inside is not an atmosphere.
  n: 520,
  r: 22,                 // the half-width of the box kept round him
  // **A MOTE IS SEEN AGAINST WHATEVER IS BEHIND IT, AND EVERYTHING HERE IS PALE (m137).**
  // 0xfff4de at alpha .16 on a near-white sky and a white floor is invisible by construction,
  // and .020 m at 13 m is **1.2 CSS px** -- under the threshold of being an effect (m99).
  // A warm mid-tone is darker than the sky AND lighter than tarmac, which is the one value
  // that reads in both halves of this world.
  // **AND m137's WARM MID-TONE WAS MY CALL AND HE HAS TURNED IT DOWN (m139).** *"The little
  // floating dust look like little football balls. I thought they would be white. They're
  // like dark, just kind of odd."* Both halves are mine: the colour is m137's headroom
  // argument (a mote DARKER than a bright sky is the one value that reads against both halves
  // of this world) and the size is m138's answer to their being invisible. The argument is
  // still sound and it is not what he wants to look at -- **which settles it, because what a
  // speck should look like is a taste question and those are his.** Near-white with a little
  // warmth in it, and fine: at 13 m, .026 m is about 3 CSS px and .062 is 7 -- specks rather
  // than balls, and still well over m99's threshold of being visible at all.
  size: [.026, .062],    // metres -- `aSize` is world units, see `puffFlush`
  col: 0xe9e2d4,
  drift: [.10, .40],     // m/s sideways
  rise: [-.08, .20],     // and vertically, so they do not all fall or all climb
  glim: [.5, 2.2],       // the glimmer, in cycles a second
  deep: .55,             // how much of the alpha the glimmer actually swings
  // and a pale mote needs LESS of itself present than a dark one, or a field of them is a haze
  alpha: [.16, .50],
  // **AND A MOTE BETWEEN YOU AND THE SUN CATCHES IT.** That back-lit term is what separates a
  // speck from noise in Kasumigawa -- its petals carry `pow(max(dot(V, sun), 0), 4)` -- and it
  // is the whole difference between dust that is there and dust you look at.
  // **IT IS ALPHA AND NOT BRIGHTNESS, WHICH IS m137's CORRECTION HOLDING.** Against a bright
  // sky an additive or whitened mote has no headroom and washes out; a warm mid-tone with MORE
  // of itself present is what reads. So catching the light means being more THERE.
  // **AND IT IS COMPUTED PER MOTE ON THE CPU, NOT IN THE SHADER**, because `puffPool` is shared
  // with the smoke and a back-lit term on a cigarette plume is wrong. 520 dot products a frame
  // against a second material and a second draw call.
  back: 1.6,             // how much alpha a mote dead in front of the sun gains. Lower than
                         // m138's 2.2 because a NEAR-WHITE mote taken to alpha 1 is a glare
                         // rather than a catch -- the same headroom, one colour brighter.
  backPow: 5,            // and how tightly it keys on it. Higher = only very near the sun.
  add: 0,                // 0 alpha-blends, 1 is additive. `mel.dust({add:1})` -- see below.
                         // **AND m130's NOTE HAD THAT POLARITY BACKWARDS**: additive against a
                         // BRIGHT sky has almost no headroom (it clips to white), and what reads
                         // against a bright backdrop is something DARKER. Alpha is the default
                         // for the sky; additive is the one for a dark road.
};
const dust = { P: null, vx: [], vy: [], vz: [], ph: [], rt: [], a0: [] };
function dustBuild() {
  const n = DUST.n;
  dust.P = puffPool(n, DUST.add ? THREE.AdditiveBlending : THREE.NormalBlending);
  const c = new THREE.Color().setHex(DUST.col, THREE.SRGBColorSpace);
  const R = (a, b) => a + Math.random() * (b - a);
  for (let i = 0; i < n; i++) {
    dust.P.pos[i * 3] = R(-DUST.r, DUST.r);
    dust.P.pos[i * 3 + 1] = R(-DUST.r, DUST.r);
    dust.P.pos[i * 3 + 2] = R(-DUST.r, DUST.r);
    dust.P.col[i * 3] = c.r; dust.P.col[i * 3 + 1] = c.g; dust.P.col[i * 3 + 2] = c.b;
    dust.P.siz[i] = R(DUST.size[0], DUST.size[1]);
    const ang = Math.random() * Math.PI * 2, sp = R(DUST.drift[0], DUST.drift[1]);
    dust.vx.push(Math.sin(ang) * sp); dust.vz.push(Math.cos(ang) * sp);
    dust.vy.push(R(DUST.rise[0], DUST.rise[1]));
    dust.ph.push(Math.random() * Math.PI * 2);
    dust.rt.push(R(DUST.glim[0], DUST.glim[1]) * Math.PI * 2);
    dust.a0.push(R(DUST.alpha[0], DUST.alpha[1]));
  }
}
let dustT = 0;
function stepDust(dt) {
  if (!DUST.on) { if (dust.P) dust.P.pts.visible = false; return; }
  if (!dust.P) dustBuild();
  dustT += dt;
  const P = dust.P, n = DUST.n, R = DUST.r, W = R * 2;
  // ROUND THE LENS, NOT ROUND HIM. What you see is what is near the CAMERA, and on a boom
  // several metres behind him those are different boxes.
  const cx = camera.position.x, cy = camera.position.y, cz = camera.position.z;
  // THE SUN, AS A DIRECTION. `_sunOff` is the one answer to where it is -- the same vector the
  // disc, the shafts and the shading read, so a mote cannot catch a sun the sky does not have.
  const sl = Math.hypot(_sunOff.x, _sunOff.y, _sunOff.z) || 1;
  const snx = _sunOff.x / sl, sny = _sunOff.y / sl, snz = _sunOff.z / sl;
  for (let i = 0; i < n; i++) {
    const o = i * 3;
    P.pos[o] += dust.vx[i] * dt; P.pos[o + 1] += dust.vy[i] * dt; P.pos[o + 2] += dust.vz[i] * dt;
    // **WRAPPED, WHICH IS WHY THE FIELD IS INFINITE AND COSTS NOTHING.** A mote that leaves the
    // box comes back in the far side, so walking never runs out of dust and nothing is spawned.
    let dx = P.pos[o] - cx, dy = P.pos[o + 1] - cy, dz = P.pos[o + 2] - cz;
    if (dx > R) { P.pos[o] -= W; dx -= W; } else if (dx < -R) { P.pos[o] += W; dx += W; }
    if (dy > R) { P.pos[o + 1] -= W; dy -= W; } else if (dy < -R) { P.pos[o + 1] += W; dy += W; }
    if (dz > R) { P.pos[o + 2] -= W; dz -= W; } else if (dz < -R) { P.pos[o + 2] += W; dz += W; }
    // AND FADED AT THE EDGE, or the wrap is a mote blinking out of one corner into another.
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz) / R;
    const edge = 1 - smooth(.72, 1, d);
    // THE GLIMMER IS THE WHOLE POINT, so it is its own rate and its own phase per mote -- one
    // shared clock is 220 motes pulsing together, which is a strobe and not dust.
    const g = 1 - DUST.deep * .5 * (1 - Math.sin(dustT * dust.rt[i] + dust.ph[i]));
    // BACK-LIT: how nearly the line from the lens THROUGH this mote points at the sun.
    const dl = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
    const face = (dx * snx + dy * sny + dz * snz) / dl;
    const lit = 1 + DUST.back * Math.pow(Math.max(0, face), DUST.backPow);
    P.alp[i] = Math.min(1, dust.a0[i] * g * edge * lit);
  }
  puffFlush(P, n);
}

// ---- the sun shafts --------------------------------------------------------------------------
// **BILLBOARD CARDS, NOT A POST PASS, AND THAT IS THE WHOLE DECISION.** Real volumetric rays are
// an occlusion buffer plus a radial blur, which means rendering the scene to a texture -- and
// there is NO post chain in this game at all (one `renderer.render`, no `EffectComposer`, no
// render targets). Adding one for this would put a full-screen blur on a phone already at 37 fps,
// which is the fill cost m128 measured as the likely reason it is at 37. A handful of additive
// cards is one draw call and no target.
// **THEY ARE STILL FILL, THOUGH, AND THAT IS STATED RATHER THAN HIDDEN**: long additive quads
// near the lens are overdraw by definition. `SHAFT.n` is the dial and it is deliberately small.
const SHAFT = {
  on: 1,
  n: 9,
  len: 64,           // how long each card is, along the sun's own axis
  w: [1.1, 4.8],     // and how wide
  spread: 11,        // how far off that axis they are scattered
  col: 0xffe9c0,
  // **THE WHITE THING IN THE BACKGROUND IS THESE (m139).** *"I don't know what this white thing
  // we introduced is."* Nine additive cards, and every one of the three things that made them
  // a shape rather than rays only became true at m138:
  //   1. **`gain` HAD NEVER ONCE BEEN SEEN.** m130 typed .26 against a 57 deg sun, where
  //      `pow(camFwd . sunDir, 3.2)` could reach at best .35 and the material drew at **opacity
  //      0.009** -- m135's own measurement. m133 brought the sun to 12 deg and m138 finally let
  //      the light agree with it, so the first build in which this number meant anything is the
  //      build he is looking at. At .19, nine cards deep, the seam adds ~.4 linear on a sky
  //      already near .65 and it clips.
  //   2. **THE SET WAS CENTRED ON HIM AND EACH CARD IS 64 m LONG.** At a high sun that is right
  //      -- the cards stand UP and you look through them. At 12 deg they lie DOWN, so a card
  //      reaches ~32 m *behind* him, which is past a lens only `CAM.dist` back: a card through
  //      the near plane is a full-screen wash, and nine of them converging on the sun's
  //      vanishing point is a bright wedge rising off the horizon. `ahead` pushes the whole set
  //      along the sun axis so the nearest card end clears the camera, which is also what makes
  //      them read as light in the middle distance rather than as an object in your face.
  //   3. **AND `toneMapped: false` MEANT THEY COULD NOT SHARE THE SKY'S HEADROOM.** Everything

addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

  rig.scale = authored > .01 ? RIG.height / authored : 1;
  model.scale.setScalar(rig.scale);
  console.log('[melee] authored height ' + authored.toFixed(4) + ' m -> x' + rig.scale.toFixed(3) +
              ' for RIG.height ' + RIG.height);
  // **AND THE GAIT REFERENCES FOLLOW THE SCALE (m52).** A reference speed is how fast the
  // PLANTED FOOT slides backwards, which is authored travel times the scale the model is drawn
  // at -- so these are only true at `refScale` and every one of them has to be multiplied by
  // however far the real scale is from it. Without this a smaller hero plays every locomotion
  // clip about 21% too slow for the speed he is actually moving at, which is a slide at every
  // point of the range rather than only at the top. Applied ONCE, here, where the scale is
  // known; `mel.GAIT` therefore prints the SCALED numbers, which is the honest thing for it
  // to print. Setting `RIG.height` from the console after load does not re-run it.
  // **AND `MOVE.max` AND THE BANDS GO WITH THEM, WHICH IS THE PART THAT IS EASY TO MISS.**
  // `MOVE.max` IS the sprint clip's own speed -- that is what makes the fastest clip play at
  // 1.0x at full deflection and the feet never slide at the top of the range. Scaling the refs
  // alone leaves it 21% above the sprint it is meant to BE: measured, the clip is then asked
  // for **1.91x against a `tsHi` of 1.6**, so it clamps and he slides for the whole top of the
  // stick. And the BANDS are speeds too, so leaving them would move every crossfade to a
  // different place on the pad -- which is precisely the m27 finding, undone by a height edit.
  // One factor over the whole table keeps every one of those relationships exactly as it was:
  // each clip owns the same stretch of pad and plays at the same rate. A smaller man at the
  // same proportions, in a world that did not shrink.
  // **AND "GRAND" IS THE WORLD, NOT HIS PACE.** The boxes, the building and every other body
  // are unchanged, so he is four fifths the size against all of them and the camera is lower.
  // `mel.MOVE.max` is the dial if he should also be FAST for his size; the cost of raising it
  // is foot slide at the top, and `tsHi` is what caps how much.
  {
    const k = rig.scale / (GAIT.refScale || rig.scale);
    // THE REFS ALWAYS SCALE -- that half is a FACT about the model, not a choice.
    for (const n of ['walkRef', 'runRef', 'sprintRef', 'backRef', 'strafeRef', 'aimRunRef'])
      GAIT[n] *= k;
    // HIS SPEED IS THE CHOICE. See `GAIT.scaleSpeed`. The BANDS go with `MOVE.max` and never
    // apart from it: they are speeds, and where each one lands on the PAD is `band / MOVE.max`
    // -- so moving one without the other is the m27 finding undone, and moving both together
    // leaves every crossfade exactly where it was either way.
    if (GAIT.scaleSpeed) {
      for (const n of ['idleAt', 'walkAt', 'runAt', 'sprintAt']) GAIT[n] *= k;
      MOVE.max *= k;
    }
    console.log('[melee] size x' + k.toFixed(3) + (GAIT.scaleSpeed ? ' (speed scaled)' : ' (speed KEPT)') +
                ' -> max ' + MOVE.max.toFixed(2) +
                '  walk ' + GAIT.walkRef.toFixed(2) + ' run ' + GAIT.runRef.toFixed(2) +
                ' sprint ' + GAIT.sprintRef.toFixed(2) +
                '  sprint clip x' + (MOVE.max / GAIT.sprintRef).toFixed(2) +
                ' (tsHi ' + GAIT.tsHi + ')');
  }
  if (authored <= .01) note('RIG HEIGHT UNMEASURABLE');

  // HIS OWN MAP, FED BACK AS EMISSION. `emissiveMap` is the base texture and `emissive` is
  // white, so what comes back is his own colours at `RIG.emissive` of their value -- which
  // lifts his shadow side without washing him toward grey the way raising ambient alone does.
  // It lands AFTER the lighting, so it brightens him without making him shiny.
  const lit = new Set();
  rig.mats = {};
  model.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) {
      if (!m.isMeshStandardMaterial || lit.has(m)) continue;
      lit.add(m); rig.mats[m.name || ('m' + lit.size)] = m;
      if (m.map) { m.emissiveMap = m.map; m.emissive = new THREE.Color(0xffffff); }
      m.emissiveIntensity = RIG.emissive;
      // and the accent band, on the hue his own texture is mostly made of
      const h = measureHue(m.map, 'alien');
      if (h) { ALIENU.hue.value = h.hue; ALIENU.rgb.value.setHSL(h.hue, 1, .6); RIG.hue = h.hue; }
      ALIENU.k.value = RIG.hueGlow;
      hueGlow(m, ALIENU, 'alien');
    }
    if (o.isBone) {
      rig.bones[o.name] = o;
      if (/^weapon_root/.test(o.name)) rig.mounts[o.name] = o;
    }
  });
  model.updateMatrixWorld(true);
  // measured on the BIND pose, before any clip has been played
  rig.faceOff = -measureFacing(rig.bones);
  // AND SO IS THIS, FOR THE SAME REASON AND AT THE SAME MOMENT (m119). Every retarget in
  // `mphBorrow` is expressed against it, and one frame later the mixer owns these bones.
  rig.bind = bindPose(rig.bones, model);

  // ---- the clips ----
  const clips = deriveClips(normaliseClips(g.animations || []));
  rig.mixer = new THREE.AnimationMixer(model);
  for (const c of clips) {
    rig.clips[c.name] = c;
    const a = rig.mixer.clipAction(c);
    if (ONCE.has(c.name)) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
    a.enabled = true; a.setEffectiveWeight(0); a.play();
    rig.actions[c.name] = a;
  }
  console.log('[melee] ' + clips.length + ' clips: ' + clips.map(c => c.name + ' ' + c.duration.toFixed(2) + 's').join(', '));
  // **THE STRIDE FALLS OUT OF THE CLIP AND THE REF (m64).** `duration * ref` is how far one
  // authored cycle carries him -- the speed cancels, because the clip is time-scaled by it --
  // and `perCycle` footfalls divide it. Done HERE because the refs are already scaled by the
  // model scale a few dozen lines up, and the durations are only known once the clips are in.
  {
    // **THE PAIR, NOT THE ANSWER (m68).** A stride is only a fixed number of metres while the
    // clip plays at `sp / ref`, and `tsHi` clamps that -- so what is measured here is the two
    // facts about the CLIP and the distance is worked out at the speed he is actually going.
    const st = (n, ref) => { const c = rig.clips[n]; return c ? { d: c.duration, r: ref } : null; };
    STEP.clip.walk = st(CLIPS.walk, GAIT.walkRef);
    STEP.clip.run = st(CLIPS.run, GAIT.runRef);
    STEP.clip.sprint = st(CLIPS.sprint, GAIT.sprintRef);
    const sh = (C, sp) => C ? strideOf(sp, C.d, C.r, GAIT.tsLo, GAIT.tsHi).toFixed(2) : '-';
    console.log('[melee] stride walk ' + sh(STEP.clip.walk, 1.5) + ' m @1.5, run ' +
                sh(STEP.clip.run, 3.5) + ' @3.5, sprint ' + sh(STEP.clip.sprint, MOVE.max) +
                ' @' + MOVE.max);
  }
  // THE TABLE IS CHECKED AGAINST THE FILE. A table naming a clip that is not there leaves a
  // bone at zero total weight, and the mixer blends a zero-weight bone back to its BIND value
  // -- which is the T-pose exactly, and looks like a rendering fault rather than a missing clip.
  const want = [];
  for (const k in CLIPS) { const v = CLIPS[k]; Array.isArray(v) ? want.push(...v) : want.push(v); }
  for (const k of SPLIT.up) want.push(CLIPS[k] + UP);
  for (const k of SPLIT.legs) want.push(CLIPS[k] + LEGS);
  // **AN EMPTY NAME IS A HOOK, NOT A MISSING CLIP (m128).** `CLIPS.turnL`/`turnR` are `''` on
  // purpose -- he has no turn clips and m54 wired the hook for the day he draws them -- so the
  // chip has read `NO CLIP ,` ever since, which is the chip crying wolf about a deliberate gap
  // AND a real missing clip hiding behind a false one. m88 put this exact guard on the NPC
  // table check and never on his own; it is the same one word.
  const gone = want.filter(n => n && !rig.actions[n]);
  if (gone.length) note('NO CLIP ' + gone.join(','));

  // ---- the weapons. They are not on the critical path: a missing one costs that weapon and
  //      nothing else, which is why they are each in their own try.
  for (const s of WEAP.slots) {
    if (!s.file) continue;
    try {
      const w = await loadGLB(s.file, 'loading the ' + s.key);
      WEAP.worn[s.key] = mountWeapon(s, w);
    } catch (e) { PROG.done++; note('NO ' + s.key.toUpperCase() + ' GLB'); }
  }
  // SOMETHING TO HIT. Not on the critical path: no dummy is a world with nothing in it, which
  // is still a game you can look at.
  // **"THE FILE IS MISSING" AND "THE BUILDER THREW" ARE DIFFERENT BUGS AND THEY WORE ONE LABEL
  // (m32).** The chip said `NO BUILDING GLB` while the GLB had loaded perfectly and
  // `buildBuildings` had thrown a ReferenceError halfway through -- so the message pointed at
  // the network and the fault was in this file. `side()` splits them and PRINTS THE EXCEPTION,
  // because a `catch` that swallows `e` throws away the only thing that would have said which.
  const side = (fn, label, tag) => loadGLB(fn, label).then(
    g => { try { tag.build(g); } catch (e) { console.error('[melee] ' + tag.name + ' build failed', e); note(tag.name + ' FAILED'); } },
    e => { PROG.done++; console.warn('[melee] ' + tag.name + ' did not load', e); note('NO ' + tag.name + ' GLB'); });
  if (inWP()) {
    // THE RANGE IS WEIRDPORT'S AND THE COLOUR IS THE SKY'S (m129). A 280 m city needs its own
    // fog distances -- that is m125 -- but the COLOUR has to be the horizon's or the far
    // distance is two colours meeting at a seam. `SKY.fog = 0` hands it back.
    if (WP.fog) {
      scene.fog.near = WP.fog.near; scene.fog.far = WP.fog.far;
      if (!SKY.fog) scene.fog.color.setHex(WP.fog.col);
    }
    // **THE COLLISION FIRST, AND IT IS THE ONE THERE IS NO WORLD WITHOUT.** The visual is a
    // picture; the collision is the ground he stands on, so a slice with no picture is a man
    // walking round an invisible city and a slice with no collision is a man falling through a
    // painting. They are both on `side()` all the same -- neither is worth a boot that hangs,
    // and the chip says which one is absent.
    await side(WP.col, 'loading weirdport', { name: 'WPCOL', build: buildWpCollision });
    // THE TRIM SHEET IS FETCHED BESIDE THE PICTURE, not inside the builder, so a 2048 that does
    // not arrive costs the buildings their paint and not the whole city. It is the biggest
    // single asset in the slice -- 5.8 MB on the wire and about 22 MB resident with its mips --
    // and it is the one thing his export left OUT of the GLB, so there is nowhere else for it
    // to come from. `gltf-transform uastc` to KTX2 is what takes that 22 MB to about 5.6 the
    // day the count makes it matter.
    let trim = null;
    try { trim = await new THREE.TextureLoader().loadAsync(A(WP.trim)); }
    catch (e) { console.warn('[melee] weirdport trim sheet did not load', e); }
    await side(WP.vis, 'loading weirdport', { name: 'WPVIS', build: g => buildWpVisual(g, trim) });
    // **AND THE SPAWN MOVES HERE, BECAUSE THE CROWD IS PLACED RELATIVE TO IT.** `wpPopulate`
    // puts Clancy beside you and excludes the spawn's own `near` metres from the pool, and at
    // this point in the old ordering `player.pos` was still (0, 0) -- which in Weirdport is
    // inside `bld_dt_18_col`. The y is still taken further down, after every builder has had
    // its say about what is under him.
    player.pos.x = WP.spawn[0]; player.pos.z = WP.spawn[1];
    // **AND THE CROWD IS PLACED BEFORE ANY BODY IS FETCHED.** Every `at` table in this file is
    // a list of test-site coordinates, and a body spawned inside a tower is m24's lesson --
    // nothing on screen disagrees with anything and the player simply cannot walk there. This
    // rewrites them against the real collider, so the BUILDERS never learn which world they
    // are in: they loop `K.at` exactly as they always did.
    // **AND IT IS IN A TRY, because a crowd is not worth a boot that hangs.** Every other line
    // in this branch is `side()`-wrapped for that reason and `init()` is called bare, so a
    // throw here is `rig.ready` never set and a card stuck for ever on the text it was born
    // with -- the one failure he cannot look at and correct. A city with nobody in it is still
    // a game you can walk round, and the chip says which of the two it is.
    try { wpPopulate(); }
    catch (e) { console.error('[melee] weirdport crowd failed', e); note('WP CROWD FAILED'); }
  } else {
    await side(BLD.file, 'loading a building', { name: 'BUILDING',
               build: g => buildBuildings(g, BLD) });
    await side(TOWER.file, 'loading a tower', { name: 'TOWER',
               build: g => buildBuildings(g, TOWER) });
    // THE BIKE BEFORE THE BIKER, because `buildBikers` seats one of him on it -- and a rider
    // with no bike is the one thing worse than no rider, so `MOTO.up` is what that decision
    // reads. **IT IS TEST-SITE ONLY AND THAT IS A STATED GAP (m127):** `MOTO.ring` was swept
    // clear against ten boxes on a white floor, and a fixed-radius circuit through a real city
    // has to be searched the way the crowd's spots are. With no bike `MOTO.up` is 0 and
    // `buildBikers` correctly leaves its rider on foot, with no case of its own.
    await side(MOTO.file, 'loading a motorcycle', { name: 'MOTO', build: buildMoto });
  }

  // ---- the bodies. BOTH WORLDS, which is the whole of m127: they used to sit inside the test
  //      site's branch, so Weirdport was a city with nobody in it.
  await side(DUMMY.file, 'loading a body to hit', { name: 'DUMMY', build: buildDummies });
  // SHE HAS NO COLLIDER AT ALL -- `stepShe` writes x and z straight and only snaps y -- so she
  // is only loaded where a circuit has been proved clear. In Weirdport that is `wpLoop`'s job
  // and it may come back empty; the count is kept honest so the bar does not run short.
  if (!inWP() || WP.she) await side(SHE.file, 'loading the alien girl', { name: 'SHE', build: buildShe });
  else PROG.done++;
  // THE MACE FIRST, because the warrior mounts it as he is built -- and it is only a weapon he
  // is missing if it does not arrive, not a warrior.
  await side(FOE.weapon, 'loading the mace', { name: 'MACE', build: buildMace });
  await side(FOE.file, 'loading the warrior', { name: 'WARRIOR', build: buildFoes });
  await side(HICK.file, 'loading the locals', { name: 'HICK', build: buildHicks });
  await side(HOBO.file, 'loading the locals', { name: 'HOBO', build: buildHobos });
  await side(SKATER.file, 'loading the locals', { name: 'SKATER', build: buildSkaters });
  await side(BIKER.file, 'loading the locals', { name: 'BIKER', build: buildBikers });
  await side(CLANCY.file, 'loading clancy', { name: 'CLANCY', build: buildClancy });

  paintKit();

  // A WEAPON THAT HAS NEVER BEEN DRAWN HAS NEVER BEEN COMPILED (m98).
  // *"There is sometimes this delay between switching weapons -- it's subtle, but it feels like
  // a slight hang every so often."* `mountWeapon` runs once at LOAD and `paintKit` only flips
  // `group.visible`, so the SWAP itself allocates nothing -- but three compiles and links a
  // shader program the first time a material is actually drawn, and both weapons are mounted
  // hidden. So the first swap TO each one pays a GLSL compile mid-frame, once per weapon per
  // session, which is "sometimes" said exactly. **`compile` traverses with `traverse`, not
  // `traverseVisible`**, so one call warms every material in the scene including the two that
  // are hidden; it is the documented API for this and it is a no-op if they were already up.
  // Stated as a CANDIDATE with a mechanism, not as a diagnosis: nothing in this container has
  // a GPU, so whether a compile is what he is feeling is a device question.
  try { renderer.compile(scene, camera); } catch (err) { console.warn('[melee] warm-up', err); }

  // **HIS OWN BODY, PUT ASIDE (m112).** The DNA gun repoints every field `rig` carries at a
  // borrowed skin, so the set that is his has to be a set too -- captured HERE, after the clips
  // and after `STEP.clip` is measured, because those are the two things it has to carry back.
  rig.base = { model: rig.model, mixer: rig.mixer, actions: rig.actions, clips: rig.clips,
               cw: rig.cw, bones: rig.bones, faceOff: rig.faceOff, mounts: rig.mounts,
               mats: mphMats(rig.model), h: RIG.height, stride: STEP.clip, bind: rig.bind };
  player.mphH = RIG.height;

  // **THE SPAWN'S HEIGHT, AFTER EVERY BUILDER.** Its x and z are set in the world branch above,
  // because the crowd is placed relative to them; the y is taken here, where everything that
  // could be underneath him is already in the collider.
  player.pos.y = groundAt(player.pos.x, player.pos.z, 0, MOVE.step);
  rig.ready = true;
  setBoot('go', 1);
  setTimeout(() => bootCard.classList.add('gone'), 260);
}

// the console handle. Every tuning object is live, so a number can be moved on the phone
// without a rebuild and without a push.
window.melee = window.mel = { RIG, MOVE, GAIT, CAM, FLICK, MELEE, SLAM, CVOX, WEAP, CLIPS, MARK, HCHG, rig, player, cam, stick, BOXES,
  // THE STEPS ARE EXPOSED SO A HARNESS CAN DRIVE THE SHIPPED ONES. A harness with its own copy
  // of a rule measures a game that does not exist -- which is the oldest mistake there is, and
  // the only way not to make it is for `npm run sim` to call exactly these.
  DUMMY, DUMMIES, LOCK, LEDGE, WALL, STRIKE, PADS, DESK, meleeLock, dummyHit, dummyBlow, strikeSweep, stepDummies, findLock, SFX, CHARGE, POSE, snd, PUNCH, PLASMA, HITSND, BODYSND, FLYHIT, STEP,
  stepPlayer, rigAnim, stepKit, stepCam, integrate, stickWorld, flickH, rollGo, meleeGo, slamGo, chargeRelease, groundAt,
  MFX, camShake, palDive,
  // THE WORLD, LIVE (m124). `mel.world('weirdport')` is the key without the key, which is what
  // a desktop wants; `mel.WP` and `mel.TRI` and `mel.BGRID` are the dials.
  WORLD, WP, TRI, BGRID, triGround, boxesNear, wpRoot,
  // THE TINT'S COLOUR SPACE, LIVE (m126). `mel.tint(1)` reads the vertex colours as sRGB and
  // `mel.tint(0)` raw -- a uniform, so it is an A/B on the phone with no rebuild. See `WP.tint`.
  tint: v => { WP.tintLin = v ? 1 : 0; WPTINT.value = WP.tintLin; return WP.tintLin ? 'sRGB' : 'raw'; },
  world: k => { if (!k) return WORLD.now;
    if (!WORLD.list[k]) return 'worlds: ' + Object.keys(WORLD.list).join(', ');
    try { localStorage.setItem(WORLD.store, k); } catch (e) {}
    location.replace(location.pathname); return 'loading ' + k; },
  // THE DNA GUN, LIVE (m112). `mel.dna('hick')` wears the nearest kind whose file matches, with
  // no shot fired -- which is the only way to look at the transform without a fight, and is
  // `mel.slamfx()`'s own argument. `mel.dna()` puts him back.
  MORPH, morphGo, morphOff, mphName,
  dna: q => {
    if (!q) return morphOff() ? 'reverting' : 'he is himself';
    const re = new RegExp(String(q), 'i');
    const d = DUMMIES.find(b => dnaOK(b.K) && re.test(b.K.file));
    if (!d) return 'nobody here matches ' + q;
    return morphGo(d.K) ? mphName(d.K) : 'busy';
  },
  // THE PADS AND THE PACK, LIVE (m104). `mel.dyn(1)` floats the sticks and `mel.dyn(0)` puts
  // them back bigger and fixed -- one switch, the body class, and nothing else to keep in step.
  // `mel.pack(1)` sends the sidekick to your back from the console, which is the same call the
  // left row's segment makes, so the button and the handle cannot disagree.
  STICK, PACK, CLANCY, setDyn, setPal, packWant,
  // THE BIKE, LIVE. `mel.MOTO.ring.r = 6` laps tighter and takes the steering to 15 degrees;
  // under 4.4 m it reaches the 20 he asked for. `mel.MOTO.lean = -.26` flips which way it heels,
  // and `mel.MOTO.on = 0` parks it where it stands with the rider still on it.
  MOTO, BIKER, stepMoto,
  dyn: on => { setDyn(on == null ? !STICK.dyn : on); return STICK.dyn ? 'floating' : 'fixed'; },
  pack: on => { setPal(on == null ? (CLANCY.mode ? 0 : 1) : (on ? 1 : 0)); return CLANCY.modes[CLANCY.mode].key; },
  // A LOOK AT THE SLAM WITHOUT HAVING TO BE IN THE AIR. `mel.slamfx()` fires the ring, the dust,
  // the flash and the knock where he stands; `mel.shake(.5)` is the knock on its own, so the two
  // can be judged apart -- each toggle has to move one variable.
  slamfx: () => { slamFx(player.pos.x, player.pos.y, player.pos.z); return 'boom'; },
  shake: a => { camShake(a == null ? CAM.shake.max : a); return 'knock'; },
  resolveBoxes, camFree, aimPoint, aimRaw, aimTarget, AIM, fireBolt, BOLTS, gunOut,
  BLD, TOWER, BUILDINGS, solidColumns, pushBodies, CHAIN, SHE,
  // THE WARRIOR, LIVE. `mel.FOE.notice = 0` parks them all; `mel.hurt(20)` fakes a blow so the
  // flash and the bar can be looked at without standing in front of a mace.
  FOE, HICK, HOBO, SKATER, SMOKE, BLOCK, HEALTH, HURT, foeAI, foePlan, foeWander, foeRoll, bodySep, bodyFly, boltHome, playerHurt, buildFoes,
  smoke: (x, y, z) => { smokeAt(x, y, z); return 'puff'; },
  hurt: (d, k) => playerHurt(d || 12, player.faceH + Math.PI, FOE.push, FOE.pushUp, FOE.stun, k == null ? 1 : k),
  heal: () => { player.hp = HEALTH.max; return 'full'; },
  // HER, LIVE. `mel.she.spin = 2` turns her on the spot, which is the best look at what the
  // chains are doing; `mel.she.go = 0` parks her; `mel.CHAIN.on = 0` freezes the solver so the
  // authored rest pose can be compared against it.
  get she() { return she; },
  // HOW BIG A BUILDING SHOULD BE IS A LOOK-AT-IT DECISION, so it moves on the phone rather than
  // HOW BIG EACH IS, LIVE -- see `bldSize`. Two handles, one function, and each touches only
  // the buildings built from its own table: `mel.tower(48)` is the triple he floated.
  bld: h => bldSize(BLD, h),
  tower: h => bldSize(TOWER, h),
  // AND THE STREETS REBUILD FROM THE TABLE, so the grid is a thing to move on the phone
  // rather than a thing to push. `mel.streets(0)` takes the whole layout away.
  STREET, streets: on => { if (on !== undefined) STREET.on = on ? 1 : 0; return buildStreets(); },
  kit: () => cycleKit(),
  clips: () => Object.keys(rig.clips).map(n => n + ' ' + rig.clips[n].duration.toFixed(3) + 's').join('\n'),
  where: () => `${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(2)}, ${player.pos.z.toFixed(1)}`,
  // WHAT THE HUE MEASUREMENT FOUND, and the two dials over it. `mel.glow(alien, gun)` is the
  // live A/B -- how much a colour should glow is a look-at-it decision and those belong on the
  // phone rather than in a commit.
  hues: () => ({
    alien: { deg: +(ALIENU.hue.value * 360).toFixed(0), hex: '#' + ALIENU.rgb.value.getHexString(), k: ALIENU.k.value },
    gun: { deg: +(GUNU.hue.value * 360).toFixed(0), hex: '#' + GUNU.rgb.value.getHexString(), peak: WEAP.glow },
  }),
  glow: (a, g) => {
    if (a != null) { RIG.hueGlow = a; ALIENU.k.value = a; }
    if (g != null) WEAP.glow = g;
    return { alien: RIG.hueGlow, gun: WEAP.glow };
  },
  hue: (a, g) => {
    if (a != null) { RIG.hue = a; ALIENU.hue.value = a; ALIENU.rgb.value.setHSL(a, 1, .6); }
    if (g != null) { WEAP.hue = g; GUNU.hue.value = g; GUNU.rgb.value.setHSL(g, 1, .6); }
    return { alien: RIG.hue, gun: WEAP.hue };
  },
  // HOW A MARK SHOULD LOOK IS A LOOK-AT-IT DECISION. `mel.retic({size, w, hue, lock})` --
  // size in px, `w` the stroke multiplier, both hues in degrees. Anything omitted is left alone.
  retic: o => {
    const el = document.getElementById('retic'); if (!el) return null;
    if (o) {
      if (o.size != null) el.style.setProperty('--size', o.size + 'px');
      if (o.w != null) el.style.setProperty('--w', o.w);
      if (o.hue != null) el.style.setProperty('--h', o.hue);
      if (o.lock != null) el.style.setProperty('--lh', o.lock);
    }
    const c = getComputedStyle(el);
    return { size: c.getPropertyValue('--size').trim(), w: c.getPropertyValue('--w').trim(),
             hue: c.getPropertyValue('--h').trim(), lock: c.getPropertyValue('--lh').trim() };
  },
  // AND SO IS A PAD'S COLOUR. `mel.pads({ left, right })` takes any CSS colour -- a hex, a
  // hsl(), or one of the page's own `var(--hot)` / `var(--sun)` / `var(--sky)`. The ink rim,
  // the ticks, the knob and the label all read `--pc`, so one value moves the whole pad and
  // it cannot end up half recoloured.
  pads: o => {
    const L = document.getElementById('padL'), R = document.getElementById('padR');
    if (o) {
      if (o.left != null && L) L.style.setProperty('--pc', o.left);
      if (o.right != null && R) R.style.setProperty('--pc', o.right);
    }
    return { left: L ? getComputedStyle(L).getPropertyValue('--pc').trim() : null,
             right: R ? getComputedStyle(R).getPropertyValue('--pc').trim() : null };
  },
  // the charge whine is a synth, so every part of it is a live number: `f0`/`f1` the note it
  // climbs through, `det` the detune in CENTS (this is the one that decides whether it reads as
  // electrical or as a tune), `lp0`/`lp1` how far the filter opens, `g` the level.
  chg: o => { if (o) Object.assign(CHARGE, o); return { f0: CHARGE.f0, f1: CHARGE.f1, det: CHARGE.det, lp0: CHARGE.lp0, lp1: CHARGE.lp1, q: CHARGE.q, g: CHARGE.g }; },
  mute: v => { SFX.on = v == null ? (SFX.on ? 0 : 1) : (v ? 1 : 0); return SFX.on; },
  // THE COLLIDER VIEW. The KEY is the control -- a phone has no console -- and this is the
  // desktop half plus the dials: `mel.BOXV.r` is how far round him the boxes are drawn.
  BOXV, boxes: v => setBoxes(v == null ? !BOXV.on : v),
  // THE SKY. Every field is live and `mel.sky({...})` re-bakes -- so the gradient, the sun and
  // how much bounce it throws are look-at-it decisions taken on the phone rather than in a
  // commit, which is what a generated sky buys over a file.
  SKY, sky: o => { if (o) Object.assign(SKY, o); skyLoad(); skyBake();
    return { src: SKY.src, img: SKY.src === 'img' ? (skyImg ? 'up x' + SKY.imgK : 'waiting') : '-',
             hor: '#' + SKY.hor.toString(16), zen: '#' + SKY.zen.toString(16),
             gnd: '#' + SKY.gnd.toString(16), bend: SKY.bend, sunK: SKY.sunK,
             env: SKY.env, envInt: SKY.envInt }; },
  // AND WHICH OF THE TWO SKIES IS UP. `mel.hdri(0)` is the gradient, `mel.hdri(1)` his file --
  // the same thing the HDRI key does, for a laptop.
  hdri: v => { SKY.src = (v == null ? (SKY.src === 'img' ? 0 : 1) : (v ? 1 : 0)) ? 'img' : 'gen';
    if (SKY.src === 'img') skyLoad();
    skyBake(); return SKY.src + (SKY.src === 'img' && !skyImg ? ' (waiting)' : ''); },
  // AND THE ONE THAT COSTS FRAMES, ON ITS OWN SWITCH. `env` 0 keeps the backdrop and drops the
  // image-based lighting, which is an env lookup per fragment on every PBR surface in the city.
  ibl: v => { SKY.env = v == null ? (SKY.env ? 0 : 1) : (v ? 1 : 0); skyBake(); return SKY.env; },
  // AND WHERE THE SUN IS, IN DEGREES OF ELEVATION (m133) -- the one number the disc, the shafts
  // and every shadow in the game all read. `mel.sun(57)` is the A/B back to m132 and
  // `mel.sun()` says where it is. The BEARING and the distance are kept, so only the pitch
  // moves; `skyBake` re-runs because `_sunOff` is what it measures the disc's direction from,
  // and without it the sky would go on drawing a sun the shading no longer has.
  sun: d => { if (d != null) sunSet(d);
    return { elev: +sunElev().toFixed(1),
             topOfFrame: +((CAM.fov / 2) - CAM.el * 180 / Math.PI).toFixed(1) }; },
  SHADOW,
  // THE AIR (m130). Two switches, because they are two costs: the dust is a second `Points` and
  // 220 motes, the shafts are additive overdraw near the lens. `mel.dust(0)` / `mel.shafts(0)`.
  DUST, SHAFT,
  dust: o => { if (typeof o === 'object' && o) Object.assign(DUST, o);
    else if (o != null) DUST.on = o ? 1 : 0;
    dustDrop();
    return { on: DUST.on, n: DUST.n, add: DUST.add, r: DUST.r }; },
  shafts: o => { if (typeof o === 'object' && o) Object.assign(SHAFT, o);
    else if (o != null) SHAFT.on = o ? 1 : 0;
    shaftDrop();
    return { on: SHAFT.on, n: SHAFT.n, gain: SHAFT.gain, pow: SHAFT.pow }; },
  emis: v => { for (const m of Object.values(rig.mats || {})) m.emissiveIntensity = v; RIG.emissive = v; return v; },
};

frame();
init();
</script>
</body>
</html>
