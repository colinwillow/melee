// ============================================================================================
// THE PADS
//
// A STUCK STICK IS ALWAYS A MISSING `pointerup`. The thumb has gone and the pad never heard, so
// `down` stays 1, `x/y` keep whatever they last were, and the game goes on steering for ever.

// THE CONTROL MAP. Read this before touching either pad.

//   3. `plant`: at a walk the legs push where the thumb says, at a run they push along `faceH`.

    const ramp = 1 - MOVE.accFall * smooth(0, 1, sp0 / Math.max(.5, wantSp || MOVE.max));
    const push = lerp(MOVE.push0, 1, clamp(p.goT / MOVE.pushT, 0, 1));
    const acc = (p.grounded ? MOVE.acc : MOVE.airAcc) * push * Math.max(.08, ramp);
    if (wantSp > 0) {
      const tx = wantX * wantSp, tz = wantZ * wantSp;
      const ex = tx - p.vel.x, ez = tz - p.vel.z, e = Math.hypot(ex, ez);
      if (e > 1e-4) {
        // SPEEDING UP IS RAMPED, SLOWING DOWN IS NOT. `accFall` is about how fast he can pick
        // speed UP, and slowing down is not accelerating -- one sign test. Without it a body
        // carrying speed out of a lunge takes twenty seconds to come back to a walk, which
        // reads as ice.
        const along = (ex * p.vel.x + ez * p.vel.z) / (sp0 || 1);
        const rate = (along >= 0 ? acc : MOVE.acc) * dt;
        const k = Math.min(1, rate / e);
        p.vel.x += ex * k; p.vel.z += ez * k;
      }
    } else {
      const k = Math.exp(-(p.grounded ? MOVE.drag : MOVE.airDrag) * dt * .25);
      p.vel.x *= k; p.vel.z *= k;
    }
  }

  p.vel.y -= MOVE.g * dt;
  const px = p.pos.x, pz = p.pos.z;
  p.pos.x += p.vel.x * dt; p.pos.z += p.vel.z * dt; p.pos.y += p.vel.y * dt;

  if (resolveBoxes(p.pos, p.r, p.hh)) {
    // only the component going INTO the surface is removed, so a slide along a wall keeps its
    // speed by itself and needs no extra scrub
    const mx = p.pos.x - px, mz = p.pos.z - pz;
    if (Math.abs(mx) < 1e-6) p.vel.x = 0;
    if (Math.abs(mz) < 1e-6) p.vel.z = 0;
  }

  const gy = groundAt(p.pos.x, p.pos.z, p.pos.y, MOVE.step);
  let landed = 0;
  if (p.grounded) {
    if (p.pos.y - gy > MOVE.step) { p.grounded = false; p.airT = 0; p.coyote = MOVE.coyote; }
    else { p.pos.y = gy; p.vel.y = 0; }
  } else {
    p.airT += dt;
    if (p.coyote > 0) p.coyote -= dt;
    if (p.vel.y <= 0 && p.pos.y <= gy + .04) {
      p.fallV = -p.vel.y;
      p.pos.y = gy; p.vel.y = 0; p.grounded = true; p.jumps = 0; landed = 1;
    }
  }
  p.speed = Math.hypot(p.vel.x, p.vel.z);
  return landed;
}

function stepPlayer(dt) {
  const p = player;
  const hadLock = p.lock;
  p.lock = findLock();
  if (p.lock && p.lock !== hadLock) snd('lock', { g: .3, r: 1.5 });
  const s = p.lock ? stickLocked(p.lock) : stickWorld();

  // ---- the states that OWN the body. Each bleeds its own speed off and still runs gravity
  //      and the ground collider, so the ground hands him straight back to the air code.
  if (p.roll || p.melee || p.chargeGo) {
    const which = p.roll ? 'roll' : p.melee ? 'melee' : 'charge';
    const dur = p.roll ? MELEE.rollDur : p.melee ? p.meleeDur : MELEE.finishBeat;
    const tRef = p.roll ? (p.rollT += dt) : p.melee ? (p.meleeT += dt) : (p.chargeGoT += dt);
    const u = clamp(tRef / dur, 0, 1);
    // full speed for `carry` of the move, then linear to zero. A flat linear bleed averages
    // half the launch speed, so every metre of travel has to be bought with a speed spike at
    // the front -- which reads as a rocket rather than a lunge.
    const k = u < MELEE.carry ? 1 : 1 - (u - MELEE.carry) / (1 - MELEE.carry);
    // THE BLOW LANDS WHEN THE LIMB REACHES HIM, AND NOT BEFORE. `at` no longer FIRES the hit --
    // it opens the window the sweep is allowed to count in, so a swing that misses misses.
    if (!p.roll) {
      const at = p.melee ? MELEE.at[Math.min(p.meleeIx, MELEE.at.length - 1)] : MELEE.finishAt;
      const pw = p.melee ? MELEE.power[Math.min(p.meleeIx, MELEE.power.length - 1)]
                         : 1.0 * (p.chargeGoK || 1);
      // THE SWEEP RUNS EVERY FRAME even while the window is shut, because the previous
      // positions it measures against have to stay one frame old -- a sweep seeded three
      // frames back is a segment through half the room.
      if (strikeSweep(dt, pw, !p.melFired && u >= at * STRIKE.from && u <= STRIKE.to)) {
        p.melFired = 1;
        // a hammer rings and a fist thuds -- the weapon decides, not the strike
        if (slotNow().charge) snd('clang', { g: .85, r: .9 + Math.random() * .2 });
        else snd('thud', { g: .8, r: 1.05 + Math.random() * .15 });
      }
    }
    const h = p.roll ? p.rollH : p.faceH;
    const v0 = p.roll ? MELEE.rollV : (p.melV || MELEE.finishV * (p.chargeGoK || 1));
    p.vel.x = Math.sin(h) * v0 * k; p.vel.z = Math.cos(h) * v0 * k;
    p.faceH = h; p.heading = h;
    integrate(dt, 0, 0, 0, false);
    // THE TAIL IS CANCELLABLE. Holding the whole clip makes a three-punch chain feel like three
    // seconds of watching; past `hold`, a stick on the pad takes him out of the recovery, which
    // is what makes each link in the chain a decision rather than a wait.
    // A STRIKE IS NEVER CUT SHORT. Only the ROLL can be run out of early -- a roll is a move
    // you spend to go somewhere and its tail is yours; a strike is a blow, and a blow that the
    // next input truncates never reads as having landed. The whole reason the beats came down
    // is that this rule is only bearable when each one is over quickly.
    const out = p.roll ? (u >= 1 || (u > MELEE.rollFree && s.mag > .3)) : u >= 1;
    if (out) {
      if (p.roll) p.roll = 0;
      else if (p.melee) {
        p.melee = 0; p.meleeChain = MELEE.window;
        // and the flick that arrived mid-strike is taken NOW, so a chain thrown as fast as the
        // thumb can move still lands every link
        if (p.melQ != null) { const q = p.melQ; p.melQ = null; meleeGo(q); }
      } else {
        p.chargeGo = 0;
        if (p.melQ != null) { const q = p.melQ; p.melQ = null; meleeGo(q); }
      }
    }
    return;
  }
  if (p.meleeChain > 0) { p.meleeChain -= dt; if (p.meleeChain <= 0) p.melQ = null; }

  // ---- the landing states: he can move out of them, but not instantly ----
  if (p.land) {
    p.landT += dt;
    if (p.landT >= p.land || (p.landT > p.land * MOVE.landFree && s.mag > .3)) p.land = 0;
  }

  // ---- the jump ----
  if (p.jump) {
    p.jump = 0;
    if ((p.grounded || p.coyote > 0) && !p.land) {
      p.vel.y = MOVE.jump; p.grounded = false; p.coyote = 0; p.airT = 0; p.jumps = 1;
    }
  }

  // ---- ordinary locomotion ----
  // AIMED, HE FACES THE SHOT AND TRAVELS WHEREVER THE THUMB SAYS -- which is a STRAFE, and it
  // is why `plant` has to go to zero here. `plant` swings the velocity onto his facing as he
  // speeds up, which is right for running and exactly wrong while aiming, since it would drag
  // every step round to point down the barrel.
  const aiming = committed() || !!p.lock;
  let wantSp = MOVE.max * s.mag;
  if (aiming) wantSp = Math.min(wantSp, GAIT.aimRunRef);
  if (p.land) wantSp *= .35;

  if (s.mag > 0) {
    p.goT += dt;
    const tgt = Math.atan2(s.x, s.z);
    if (!aiming) {
      const rate = (p.grounded ? MOVE.turn : MOVE.airTurn) * dt;
      p.heading += clamp(wrapAngle(tgt - p.heading), -rate, rate);
    }
  } else p.goT = 0;

  // aiming, he faces where the camera looks; otherwise he faces where he is going
  // LOCKED, HE FACES THE TARGET -- not the lens. That is what makes the strafes read.
  const faceTgt = p.lock ? lockH(p.lock) : aiming ? cam.az : p.heading;
  const fRate = (p.lock ? LOCK.face : aiming ? MOVE.face0 : lerp(MOVE.face0, MOVE.face1, clamp(p.speed / MOVE.max, 0, 1))) * dt;
  p.faceH += clamp(wrapAngle(faceTgt - p.faceH), -fRate, fRate);

  // PLANT. At a walk the legs push where the thumb says; at a run, along `faceH`.
  let wx = s.x, wz = s.z;
  if (s.mag > 0 && !aiming) {
    const plant = smooth(MOVE.plantAt, MOVE.plantFull, p.speed);
    const fx = Math.sin(p.faceH), fz = Math.cos(p.faceH);
    wx = lerp(s.x, fx, plant); wz = lerp(s.z, fz, plant);
    const d = Math.hypot(wx, wz) || 1; wx /= d; wz /= d;
    // a hard turn costs him speed -- this is what plants the feet rather than just pointing them
    const off = Math.abs(wrapAngle(Math.atan2(s.x, s.z) - p.faceH));
    wantSp *= 1 - MOVE.turnBrake * smooth(.6, Math.PI, off);
  }

  const landed = integrate(dt, wx, wz, wantSp, true);
  if (landed) {
    // SOFT OR HARD IS THE IMPACT SPEED, not how long he was in the air: a long float onto a
    // box top is a soft landing and a short drop off a ledge at pace is not.
    const hard = p.fallV > MOVE.hardLand;
    p.landHard = hard ? 1 : 0;
    const nm = hard ? CLIPS.landHard : CLIPS.landSoft;
    p.land = hard ? MOVE.landHard : MOVE.landSoft; p.landT = 0;
    // the clip is compressed to the beat the STATE lasts, so the two cannot disagree
    playOnce(nm, clipLen(nm) / p.land);
  }
}

// ============================================================================================
// THE WEIGHT TABLE
// ============================================================================================
function rigAnim(dt) {
  const p = player, sp = p.speed, t = {};

  if (p.roll) { t[CLIPS.roll] = 1; setWeights(t, dt); return; }
  if (p.melee) { t[p.meleeName] = 1; setWeights(t, dt); return; }
  if (p.chargeGo) { t[CLIPS.chargeGo] = 1; setWeights(t, dt); return; }
  if (!p.grounded) {
    // `in_air` is 2.83 s of a subtle float and loops, so it reads at any airtime; a jump here
    // is about 0.84 s, so what is seen is its opening third.
    t[CLIPS.air] = 1; setWeights(t, dt); return;
  }
  if (p.land) {
    // FULL WEIGHT UNTIL `landFree`, THEN IT GIVES WAY. Ramping it down from the first frame
    // put the gait at 0.55 through the whole second half, which dilutes exactly the part of a
    // hard landing worth watching -- he comes out of the roll with a run blended over it.
    const nm = p.landHard ? CLIPS.landHard : CLIPS.landSoft;
    const u = clamp(p.landT / p.land, 0, 1), f = MOVE.landFree;
    t[nm] = u < f ? 1 : 1 - (u - f) / (1 - f);
  }

  const add = (nm, w, ref) => {
    if (w <= 0) return;
    t[nm] = (t[nm] || 0) + w;
    if (ref) setScale(nm, clamp(sp / ref, GAIT.tsLo, GAIT.tsHi));
  };
  const rest = p.land ? 1 - (t[p.landHard ? CLIPS.landHard : CLIPS.landSoft] || 0) : 1;

  // ---- COMMITTED: the legs strafe, the arms hold the weapon, and neither knows about the
  //      other. Every bone is claimed exactly once, so they compose rather than average.
  if (committed()) {
    const up = p.fireT > 0 ? CLIPS.shoot : p.charge ? CLIPS.chargeUp : CLIPS.aimPose;
    const moving = sp > .25;
    // STANDING STILL IS THE WHOLE CLIP, NOT THE HYBRID. The split exists to put a weapon pose
    // on STRAFING legs; standing there are no strafing legs to put it on, and half a running
    // stride held under a pose reads as a man caught mid-step -- which is exactly what it was.
    // The hybrid is for moving left and right and nothing else.
    if (!moving) { add(up, rest, 0); setWeights(t, dt); return; }
    // the UPPER half: what he is doing with the weapon
    add(rig.actions[up + UP] ? up + UP : up, rest, 0);
    // the LOWER half: which way he is travelling RELATIVE TO HIS NOSE, because he is facing
    // the target and "how fast" no longer picks the clip -- "which way" does.
    const L = n => (rig.actions[n + LEGS] ? n + LEGS : n);
    {
      const rel = wrapAngle(Math.atan2(p.vel.x, p.vel.z) - p.faceH);
      const c = Math.cos(rel), sn = Math.sin(rel);
      const fwd = Math.abs(c), lat = Math.abs(sn), tot = fwd + lat || 1;
      if (c >= 0) add(L(CLIPS.aimRun), rest * fwd / tot, GAIT.aimRunRef);
      else add(L(CLIPS.back), rest * fwd / tot, GAIT.backRef);
      // +X IS HIS LEFT. Heading grows from +Z toward +X and his right is (-fz, fx), so a
      // POSITIVE sine is a strafe to the LEFT. Written down because that argument comes out
      // backwards half the time, and the strafe clips are picked by its sign.
      add(L(sn >= 0 ? CLIPS.strafeL : CLIPS.strafeR), rest * lat / tot, GAIT.strafeRef);
    }
    setWeights(t, dt); return;
  }

  // ---- carrying it, but not committed: the ordinary armed gait, whole body ----
  if (gunOut()) {
    // CARRYING IT: the rifle idle standing, the rifle run moving. There is no rifle WALK in
    // the set, so the run takes the whole moving range and `tsLo` holds it down at the bottom.
    const wMove = smooth(0, GAIT.walkAt * 2.2, sp);
    add(CLIPS.aimIdle, rest * (1 - wMove), 0);
    add(p.fireT > 0 ? CLIPS.aimRunShoot : CLIPS.aimRun, rest * wMove, GAIT.aimRunRef);
    setWeights(t, dt); return;
  }

  // ---- the ordinary gait: four clips weighted by MEASURED speed, never a run flag ----
  const wIdle = 1 - smooth(0, GAIT.walkAt, sp);
  const wWalk = smooth(0, GAIT.walkAt, sp) * (1 - smooth(GAIT.walkAt, GAIT.runAt, sp));
  const wRun = smooth(GAIT.walkAt, GAIT.runAt, sp) * (1 - smooth(GAIT.runAt, GAIT.sprintAt, sp));
  const wSpr = smooth(GAIT.runAt, GAIT.sprintAt, sp);
  add(CLIPS.idle, wIdle * rest, 0);
  add(CLIPS.walk, wWalk * rest, GAIT.walkRef);
  add(CLIPS.run, wRun * rest, GAIT.runRef);
  add(CLIPS.sprint, wSpr * rest, GAIT.sprintRef);
  setWeights(t, dt);
}

// ============================================================================================
// POINTING THE GUN STRAIGHT AHEAD
//
// *"He's supposed to be always pointing straight ahead... when it charges it doesn't need to
// move at all, but when he releases it's supposed to kick up and he's supposed to move back."*
//
// THREE SPINE TWISTS WENT INTO THIS AND ALL THREE MADE IT WORSE, SO THE MECHANISM IS GONE.
// m16 read the parent frame off a SCALED `matrixWorld`, which returns a non-unit quaternion, so
// the conjugation was a shear and it hunched him. m17 fixed that -- and the correction promptly
// wound up to its own clamp and parked there, because `aimUntwist` + `mixer.update` wipe the
// edit before `barrelH` measures again, so the integrator never once saw its own output. m18
// closed that in closed form and it STILL swung, because three's world matrices are a frame
// stale at that point, so the reading carried the previous frame's correction after all --
// which is exactly *"his gun starts out pointing to the right and he moves it across his chest
// all the way to the left"*. Each fix was real and each one uncovered the next: **a per-bone
// edit whose own effect feeds the thing that measures it has no version that is simply right.**
//
// **SO THE BODY TURNS, NOT THE SPINE.** How far the pose holds the weapon off his nose is a
// RIGID property of that pose, so undoing it is a rigid yaw on the ROOT: one number, no
// conjugation, no bone to unravel, nothing to take off again before the mixer writes -- and it
// cannot shear anything, because a root yaw is the same turn every bone was already getting.
//
// AND IT IS MEASURED WITH NO LOOP IN IT. `barrelH` returns a WORLD bearing and the comp is part
// of the root yaw that produced it, so subtracting the yaw THAT FRAME WAS ACTUALLY DRAWN AT
// removes the comp exactly. `bias` is therefore invariant to the comp -- it is the pose's own
// offset and nothing else, which is the one thing an integrator on the spine could never be
// told. `rig.drawnYaw` is stored where it is written rather than recomputed here, because a
// frame-stale reading against a freshly written yaw is the whole bug this note is about.
// ============================================================================================
const POSE = {
  // A CEILING, not a number it lives at. Measured off the real clips, `shoot` holds the weapon
  // 18 deg off his nose and `rifle_run` holds it dead straight, so this can only ever stop
  // something going wrong.
  max: .70,
  // a half-life, not a gain: the target is exact, so all this decides is how fast he gets there
  half: .07,
  on: 1,
};
const _wa = new THREE.Vector3(), _wb = new THREE.Vector3();
// THE BARREL'S OWN WORLD BEARING. The two mount markers are exactly two points on it, so
// nothing about where the gun points is typed here -- and `weapon_tip` being the mount's AXIS
// marker rather than the muzzle is all this needs it to be.
function barrelH() {
  const w = WEAP.worn[slotNow().key];
  const host = w && w.host; if (!host) return null;
  let tip = null;
  for (const c of host.children) if (/tip/.test(c.name)) tip = c;
  if (!tip) return null;
  host.getWorldPosition(_wa); tip.getWorldPosition(_wb);
  const dx = _wb.x - _wa.x, dz = _wb.z - _wa.z;
  if (dx * dx + dz * dz < 1e-8) return null;
  return Math.atan2(dx, dz);
}
// How far the POSE holds the weapon off his nose, in his own frame -- read fresh every frame so
// it tracks the recoil and survives a re-export, and free of the comp by construction.
function poseBias() {
  if (rig.drawnYaw == null) return null;
  const bh = barrelH();
  return bh == null ? null : wrapAngle(bh - rig.drawnYaw);
}
// The rigid yaw that puts the barrel down his nose. RETURNED rather than applied, so there is
// exactly one place in the file the root's rotation is written.
function aimComp(dt) {
  const p = player;
  let tgt = 0;
  // GUN ONLY. `committed()` also covers the hammer being wound, and the melee wind-up is a
  // deliberately BLADED stance -- *"he's kind of in a sideways ninja stance and that's all
  // good"* -- so pointing the hammer down his nose would straighten out the one pose he likes.
  if (POSE.on && gunOut() && committed()) {
    // AND IT HOLDS THROUGH THE RECOIL. The bolt has already left on the bearing it left on, and
    // re-aiming underneath the follow-through swings the gun during the one beat that is meant
    // to be held still.
    if (p.fireT > 0) tgt = p.compHold || 0;
    else {
      const b = poseBias();
      p.bias = b;
      if (b != null) tgt = clamp(-b, -POSE.max, POSE.max);
      p.compHold = tgt;
    }
  } else p.bias = null;
  p.comp = damp(p.comp || 0, tgt, POSE.half, dt);
  return p.comp;
}

// ============================================================================================
// THE DUMMY -- something to hit
// ============================================================================================
const DUMMIES = [];
function buildDummies(g) {
  const proto = g.scene;
  // scale MEASURED off the geometry, never typed -- and off EVERY skinned mesh, because this
  // file has two and the first one is his EYES: read alone it reports an authored height of
  // 2.9 cm and asks for a scale of x60.
  let lo = Infinity, hi = -Infinity;
  proto.traverse(o => {
    if (!o.isSkinnedMesh || !o.geometry) return;
    o.geometry.computeBoundingBox();
    lo = Math.min(lo, o.geometry.boundingBox.min.y); hi = Math.max(hi, o.geometry.boundingBox.max.y);
  });
  const authored = hi - lo, scale = authored > .01 ? DUMMY.h / authored : 1;
  // he gets the same emissive lift the player does, so he does not read as a dark cut-out
  // beside him. `skeletonClone` SHARES materials, so this is done once for all of them.
  proto.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) {
      if (!m.isMeshStandardMaterial) continue;
      if (m.map) { m.emissiveMap = m.map; m.emissive = new THREE.Color(0xffffff); }
      m.emissiveIntensity = RIG.emissive;
    }
  });
  proto.updateMatrixWorld(true);
  const pb = {}; proto.traverse(o => { if (o.isBone) pb[o.name] = o; });
  const faceOff = -measureFacing(pb);
  const clips = normaliseClips(g.animations || []);
  console.log('[melee] dummy: ' + authored.toFixed(4) + ' m authored -> x' + scale.toFixed(3) +
              ', ' + clips.length + ' clips');

  for (const [x, z] of DUMMY.at) {
    const model = skeletonClone(proto);
    model.scale.setScalar(scale);
    const root = new THREE.Group();
    root.add(model);
    root.position.set(x, groundAt(x, z, 0, MOVE.step), z);
    scene.add(root);
    const mixer = new THREE.AnimationMixer(model);
    const d = { root, model, mixer, actions: {}, clips: {}, cw: {}, faceOff,
      st: 'idle', t: 0, hp: DUMMY.hp, cool: 0, back: 0, vx: 0, vy: 0, vz: 0, cur: '',
      // FACING THE SPAWN. They all face +Z as authored, and the spawn is behind that -- three
      // men standing with their backs to you is a worse first impression than it sounds.
      h: Math.atan2(player.pos.x - x, player.pos.z - z) };
    for (const c of clips) {
      d.clips[c.name] = c;
      const a = mixer.clipAction(c);
      // EVERY REACTION IS A ONE-SHOT. Only the idle loops; a knock-down that repeats is a man
      // falling over on a timer.
      if (c.name !== DUMMY.clips.idle) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
      a.enabled = true; a.setEffectiveWeight(0); a.play();
      d.actions[c.name] = a;
    }
    DUMMIES.push(d);
  }
}

// WHICH WAY HE FALLS IS WHICH WAY THE BLOW WAS TRAVELLING. A blow going the same way he faces
// hit his BACK, so he goes over forwards.
// A SWEPT SPHERE AGAINST A STANDING BODY. The body is a vertical cylinder, so the XZ problem
// is a segment against a point and the height is one range test at the parameter it closes at.
function segBody(a, b, cx, cz, rad, hTop) {
  const dx = b.x - a.x, dz = b.z - a.z, L2 = dx * dx + dz * dz;
  let t = L2 > 1e-9 ? ((cx - a.x) * dx + (cz - a.z) * dz) / L2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const ex = a.x + dx * t - cx, ez = a.z + dz * t - cz;
  if (ex * ex + ez * ez > rad * rad) return false;
  const y = a.y + (b.y - a.y) * t;
  return y > -STRIKE.r && y < hTop + STRIKE.r;
}
const _sw = new THREE.Vector3();
// Runs every frame of a strike -- `live` only gates whether a contact COUNTS, because the
// previous positions have to stay fresh whether the window is open or not.
function strikeSweep(dt, power, live) {
  const p = player;
  const prev = p.swPrev || (p.swPrev = {});
  const dpx = p.pos.x - (p.swRootX == null ? p.pos.x : p.swRootX);
  const dpz = p.pos.z - (p.swRootZ == null ? p.pos.z : p.swRootZ);
  p.swRootX = p.pos.x; p.swRootZ = p.pos.z;
  const w = WEAP.worn[slotNow().key];
  let hit = 0;
  for (let i = 0; i <= STRIKE.bones.length; i++) {
    const wep = i === STRIKE.bones.length;
    if (wep) { if (!(w && w.muzzle && w.host)) continue; _sw.copy(muzzleWorld()); }
    else { const b = rig.bones[STRIKE.bones[i]]; if (!b) continue; b.getWorldPosition(_sw); }
    const key = wep ? '#weapon' : STRIKE.bones[i];
    const q = prev[key];
    if (!q) { prev[key] = _sw.clone(); continue; }
    if (live && !hit) {
      // IN HIS OWN FRAME -- the root's travel taken back out, or the lunge does the hitting.
      const lx = (_sw.x - q.x) - dpx, ly = _sw.y - q.y, lz = (_sw.z - q.z) - dpz;
      if (Math.hypot(lx, ly, lz) / Math.max(1e-4, dt) > STRIKE.swing) {
        for (const d of DUMMIES) {
          if (d.cool > 0) continue;
          if (!segBody(q, _sw, d.root.position.x, d.root.position.z, DUMMY.r + STRIKE.r,
                       d.root.position.y + DUMMY.h)) continue;
          // the blow travels the way the LIMB was going, which is the direction already stored
          const bh = Math.atan2(_sw.x - q.x, _sw.z - q.z);
          dummyBlow(d, Math.hypot(lx, lz) > .02 ? bh : p.faceH, power);
          hit = 1; break;
        }
      }
    }
    q.copy(_sw);
  }
  return hit;
}

function dummyHit(x, z, dirH, power, reach) {
  let hit = 0;
  for (const d of DUMMIES) {
    if (d.cool > 0) continue;
    const dx = d.root.position.x - x, dz = d.root.position.z - z;
    if (dx * dx + dz * dz > (reach + DUMMY.r) * (reach + DUMMY.r)) continue;
    hit = 1;
    dummyBlow(d, dirH, power);
  }
  return hit;
}

// WHAT A LANDED BLOW DOES TO ONE MAN. Split out of `dummyHit` because there are two ways to
// reach it now -- a bolt arriving, which IS a proximity test at the bolt's own position, and a
// limb sweeping through him -- and one of them must never grow a second copy of this.
function dummyBlow(d, dirH, power) {
  d.cool = DUMMY.cool;
  // A MAN ON THE GROUND IS STILL A BODY. Hitting him while he is down does not stand him up
  // to play a reaction -- it PUNTS him, and restarts the clock on the lie, so kicking him
  // along the floor works for as long as you like and he still eventually gets up.
  if (d.st === 'down') {
    d.vx = Math.sin(dirH) * DUMMY.flyV * .35 * power;
    d.vz = Math.cos(dirH) * DUMMY.flyV * .35 * power;
    d.vy = DUMMY.flyUp * .30 * power;
    d.t = Math.min(d.t, DUMMY.downBeat);
    return;
  }
  d.hp -= 1;
  const down = d.hp <= 0 || power >= DUMMY.hard;
  if (!down) {
    d.st = 'hit'; d.t = 0;
    const nm = DUMMY.clips.hits[(Math.random() * DUMMY.clips.hits.length) | 0];
    d.cur = nm;
    skinPlay(d, nm, skinLen(d, nm) / DUMMY.hitBeat);
    return;
  }
  // OVER HE GOES. Ballistic, and the GROUND ends the flight rather than a timer -- a timer
  // drops him through whatever he was thrown onto and leaves him hanging over a hole.
  d.back = Math.cos(dirH - (d.h || 0)) < 0 ? 1 : 0;   // a blow into his front puts him over backwards
  d.st = 'down'; d.t = 0; d.hp = DUMMY.hp;
  d.vx = Math.sin(dirH) * DUMMY.flyV * power;
  d.vz = Math.cos(dirH) * DUMMY.flyV * power;
  d.vy = DUMMY.flyUp * power;
  d.cur = d.back ? DUMMY.clips.downB : DUMMY.clips.downF;
  skinPlay(d, d.cur, skinLen(d, d.cur) / DUMMY.downBeat);
}

function stepDummies(dt) {
  for (const d of DUMMIES) {
    d.t += dt;
    if (d.cool > 0) d.cool -= dt;
    const t = {};
    if (d.st === 'hit') {
      t[d.cur] = 1;
      if (d.t >= DUMMY.hitBeat) { d.st = 'idle'; d.t = 0; }
    } else if (d.st === 'down') {
      // integrate while there is anything left to integrate
      const P = d.root.position;
      const gy = groundAt(P.x, P.z, P.y, .5);
      if (P.y > gy + .02 || d.vy > 0) {
        d.vy -= DUMMY.flyG * dt;
        const k = Math.exp(-DUMMY.flyDrag * dt);
        d.vx *= k; d.vz *= k;
        P.x += d.vx * dt; P.z += d.vz * dt; P.y += d.vy * dt;
        const g2 = groundAt(P.x, P.z, P.y, .5);
        if (d.vy <= 0 && P.y <= g2 + .04) { P.y = g2; d.vy = 0; d.vx = 0; d.vz = 0; }
      }
      t[d.cur] = 1;
      if (d.t >= DUMMY.downBeat + DUMMY.out) {
        // ONE OF THE FOUR COMBINATIONS IS AUTHORED THE OTHER WAY ROUND, AND IT WAS MEASURED
        // rather than guessed: on this export `knock_down_front` ENDS 174 degrees from where
        // `get_up_front` starts, while the back pair agrees to 14. So the front pair needs him
        // turned by pi as the get-up begins -- otherwise he does a 180 on the floor between
        // going down and standing up. "One of them is flipped" is four possibilities and three
        // of them make it worse.
        if (!d.back) d.h += Math.PI;
        d.st = 'up'; d.t = 0;
        d.cur = d.back ? DUMMY.clips.upB : DUMMY.clips.upF;
        skinPlay(d, d.cur, skinLen(d, d.cur) / DUMMY.upBeat);
      }
    } else if (d.st === 'up') {
      t[d.cur] = 1;
      if (d.t >= DUMMY.upBeat) { d.st = 'idle'; d.t = 0; d.hp = DUMMY.hp; }
    } else {
      t[DUMMY.clips.idle] = 1;
    }
    skinWeights(d, t, dt, .06, DUMMY.clips.idle);
    d.mixer.update(dt);
    d.root.rotation.y = d.h + d.faceOff;
  }
}

// ============================================================================================
// THE CAMERA
// ONE WRITER ON `cam.az`, ALWAYS. The right pad drags it and nothing else does -- while aiming
// he simply faces wherever the lens is pointed, which is the same number rather than a second
// one to keep in step. Two writers on a camera bearing is a loop that never settles and a
// picture that shakes, and it is the bug that shows up every single time.
// ============================================================================================
function camFree(tx, ty, tz, dx, dy, dz, want) {
  const step = CAM.probe, n = Math.ceil(want / step), pad = CAM.pad;
  for (let i = 1; i <= n; i++) {
    const d = Math.min(want, i * step);
    if (!camHit(tx + dx * d, ty + dy * d, tz + dz * d, pad)) continue;
    // BISECT. Walking in fixed steps and returning the last clear one means the answer only
    // ever takes values `probe` apart, so the boom JUMPS half a metre at a time as the shot
    // sways past a wall. A quantised probe is fine for a yes/no and wrong the moment something
    // continuous is drawn from it.
    let lo = d - step, hi = d;
    for (let k = 0; k < 4; k++) {
      const m = (lo + hi) * .5;
      if (camHit(tx + dx * m, ty + dy * m, tz + dz * m, pad)) hi = m; else lo = m;
    }
    return Math.max(CAM.min, lo);
  }
  return want;
}
function stepCam(dt) {
  const p = player;
  const rx = stick.R.down ? stick.R.x : ((keys.j ? -1 : 0) + (keys.l ? 1 : 0));
  if (Math.abs(rx) > .06) cam.az -= rx * CAM.yawRate * dt;

  // AND IT COMES ROUND TO A LOCKED TARGET. This is inside `stepCam` on purpose -- `cam.az` has
  // exactly one writer, and a second one somewhere else is a loop that never settles.
  if (p.lock) cam.az += wrapAngle(lockH(p.lock) - cam.az) * Math.min(1, LOCK.cam * dt);
  cam.el = CAM.el;
  cam.tgt.set(p.pos.x, p.pos.y + CAM.look, p.pos.z);
  const ce = Math.cos(cam.el);
  const bx = -Math.sin(cam.az) * ce, by = Math.sin(cam.el), bz = -Math.cos(cam.az) * ce;
  const want = CAM.dist + p.speed * CAM.distV;
  const free = camFree(cam.tgt.x, cam.tgt.y, cam.tgt.z, bx, by, bz, want);
  // SNAP IN, EASE OUT. Easing IN is time spent inside the wall; easing OUT is what stops every
  // doorway and lamp post making the shot lurch.
  cam.dist = free < (cam.dist || want) ? free : damp(cam.dist || want, free, CAM.outHL, dt);
  const wx = cam.tgt.x + bx * cam.dist, wy = cam.tgt.y + by * cam.dist, wz = cam.tgt.z + bz * cam.dist;
  if (cam.pos.lengthSq() === 0) cam.pos.set(wx, wy, wz);
  cam.pos.x = damp(cam.pos.x, wx, CAM.half, dt);
  cam.pos.y = damp(cam.pos.y, wy, CAM.half, dt);
  cam.pos.z = damp(cam.pos.z, wz, CAM.half, dt);
  // the floor under the LENS, capped at how far it may sit above the subject -- that cap is
  // what stops the camera being left standing on the box he has just dropped off
  const floor = groundAt(cam.pos.x, cam.pos.z, cam.pos.y, .6) + CAM.clear;
  cam.pos.y = Math.max(cam.pos.y, Math.min(floor, cam.tgt.y + CAM.rise));
  camera.position.copy(cam.pos);
  camera.lookAt(cam.tgt);
  // the lens widens with speed -- the cheapest speed cue there is, and it costs nothing
  const rush = smooth(CAM.rush0, CAM.rush0 + CAM.rushSpan, p.speed);
  const fov = CAM.fov + CAM.fovRush * rush;
  if (Math.abs(camera.fov - fov) > .01) { camera.fov = damp(camera.fov, fov, .25, dt); camera.updateProjectionMatrix(); }
}

// ============================================================================================
// THE FRAME
// ============================================================================================
let last = performance.now(), fps = 0, fpsT = 0, frames = 0;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  // clamped, because a backgrounded tab hands back a delta of several seconds and every
  // integrator in the file would take one enormous step through the world
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;

  if (rig.ready) {
    stepKit(dt);
    stepPlayer(dt);
    stepDummies(dt);
    rigAnim(dt);
    rig.mixer.update(dt);
    // DRAWN AT `faceH`, not at `heading`, plus the rigid yaw that puts the barrel down his nose.
    // `aimComp` reads the barrel off world matrices that are a frame old, which is exactly why
    // it subtracts `rig.drawnYaw` -- the yaw THAT frame was drawn at -- rather than this one.
    rig.root.position.copy(player.pos);
    rig.root.rotation.y = player.faceH + rig.faceOff + RIG.spin + aimComp(dt);
    rig.drawnYaw = rig.root.rotation.y;
  }
  stepCam(dt);
  // AFTER the camera, because the reticle is PROJECTED through it -- drawn from last frame's
  // matrix it would trail the shot by a frame every time the lens moved, which is exactly the
  // thing a mark on a target must not do.
  stepBolts(dt);
  paintRetic();
  sun.position.set(player.pos.x + 7, player.pos.y + 14, player.pos.z + 6);
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();

  renderer.render(scene, camera);

  frames++; fpsT += dt;
  if (fpsT > .5) {
    fps = frames / fpsT; frames = 0; fpsT = 0;
    const p = player;
    // A SWING THAT CONNECTED SAYS SO. "It hit him before the swing" and "it never reached him"
    // are opposite bugs and identical from a phone, and the sweep can now produce either.
    const st = p.roll ? 'roll' : p.melee ? 'melee' + (p.meleeIx + 1) + (p.melFired ? '!' : '')
      : p.chargeGo ? 'swing' + (p.melFired ? '!' : '')
      : p.charge ? 'charge' + (p.chargeT / MELEE.charge).toFixed(1) : !p.grounded ? 'air'
      : p.land ? (p.landHard ? 'land!' : 'land') : p.aim ? 'chg' + p.chg.toFixed(2) : gunOut() ? 'armed' : 'ground';
    // B IS THE POSE'S OWN OFFSET AND C IS WHAT IS BEING TAKEN OFF IT, because "the gun points
    // the wrong way" is two different bugs from a phone: a bias near 0 means the clip is
    // straight and anything crooked is elsewhere, a big one means the clip carries it.
    const dg = r => (r * 180 / Math.PI).toFixed(0);
    const lk = (p.lock ? ' · LOCK' : '') +
      (gunOut() && committed() ? ' · B' + (p.bias == null ? '--' : dg(p.bias)) + '/C' + dg(p.comp || 0) : '');
    const hue = RIG.showHue
      ? ' · H' + (ALIENU.hue.value * 360).toFixed(0) + '/' + (GUNU.hue.value * 360).toFixed(0) : '';
    buildI.textContent = fps.toFixed(0) + ' FPS · ' + renderer.info.render.calls + ' DC · ' +
      p.speed.toFixed(1) + ' m/s · ' + st + lk + hue + (MISSING.length ? ' · ' + MISSING.join(' · ') : '');
  }
}

// ============================================================================================
// BOOT
// ============================================================================================
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

async function init() {
  // ---- the character. There is no game without him, so a failure here is reported on the
  //      card rather than warned to a console that does not exist on a phone.
  let g;
  try { g = await loadGLB(RIG.file, 'loading the alien'); }
  catch (e) {
    setBoot('could not load the character', 1);
    if (window.__crash) window.__crash('CHARACTER FAILED TO LOAD\n' + RIG.file + '\n' + ((e && e.message) || e));
    return;
  }

  const root = new THREE.Group();
  root.name = 'rig';
  const model = g.scene;
  root.add(model);
  scene.add(root);
  rig.root = root; rig.model = model;

  // SCALE IS MEASURED, NEVER TYPED, so a re-export at any size lands right with no edit.
  const authored = measureHeight(model);
  rig.scale = authored > .01 ? RIG.height / authored : 1;
  model.scale.setScalar(rig.scale);
  console.log('[melee] authored height ' + authored.toFixed(4) + ' m -> x' + rig.scale.toFixed(3) +
              ' for RIG.height ' + RIG.height);
  if (authored <= .01) note('RIG HEIGHT UNMEASURABLE');

  // HIS OWN MAP, FED BACK AS EMISSION. `emissiveMap` is the base texture and `emissive` is
  // white, so what comes back is his own colours at `RIG.emissive` of their value -- which
  // lifts his shadow side without washing him toward grey the way raising ambient alone does.
  // It lands AFTER the lighting, so it brightens him without making him shiny.
  const lit = new Set();
  rig.mats = {};
  model.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) {
      if (!m.isMeshStandardMaterial || lit.has(m)) continue;
      lit.add(m); rig.mats[m.name || ('m' + lit.size)] = m;
      if (m.map) { m.emissiveMap = m.map; m.emissive = new THREE.Color(0xffffff); }
      m.emissiveIntensity = RIG.emissive;
      // and the accent band, on the hue his own texture is mostly made of
      const h = measureHue(m.map, 'alien');
      if (h) { ALIENU.hue.value = h.hue; ALIENU.rgb.value.setHSL(h.hue, 1, .6); RIG.hue = h.hue; }
      ALIENU.k.value = RIG.hueGlow;
      hueGlow(m, ALIENU, 'alien');
    }
    if (o.isBone) {
      rig.bones[o.name] = o;
      if (/^weapon_root/.test(o.name)) rig.mounts[o.name] = o;
    }
  });
  model.updateMatrixWorld(true);
  // measured on the BIND pose, before any clip has been played
  rig.faceOff = -measureFacing(rig.bones);

  // ---- the clips ----
  const clips = deriveClips(normaliseClips(g.animations || []));
  rig.mixer = new THREE.AnimationMixer(model);
  for (const c of clips) {
    rig.clips[c.name] = c;
    const a = rig.mixer.clipAction(c);
    if (ONCE.has(c.name)) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
    a.enabled = true; a.setEffectiveWeight(0); a.play();
    rig.actions[c.name] = a;
  }
  console.log('[melee] ' + clips.length + ' clips: ' + clips.map(c => c.name + ' ' + c.duration.toFixed(2) + 's').join(', '));
  // THE TABLE IS CHECKED AGAINST THE FILE. A table naming a clip that is not there leaves a
  // bone at zero total weight, and the mixer blends a zero-weight bone back to its BIND value
  // -- which is the T-pose exactly, and looks like a rendering fault rather than a missing clip.
  const want = [];
  for (const k in CLIPS) { const v = CLIPS[k]; Array.isArray(v) ? want.push(...v) : want.push(v); }
  for (const k of SPLIT.up) want.push(CLIPS[k] + UP);
  for (const k of SPLIT.legs) want.push(CLIPS[k] + LEGS);
  const gone = want.filter(n => !rig.actions[n]);
  if (gone.length) note('NO CLIP ' + gone.join(','));

  // ---- the weapons. They are not on the critical path: a missing one costs that weapon and
  //      nothing else, which is why they are each in their own try.
  for (const s of WEAP.slots) {
    if (!s.file) continue;
    try {
      const w = await loadGLB(s.file, 'loading the ' + s.key);
      WEAP.worn[s.key] = mountWeapon(s, w);
    } catch (e) { PROG.done++; note('NO ' + s.key.toUpperCase() + ' GLB'); }
  }
  // SOMETHING TO HIT. Not on the critical path: no dummy is a world with nothing in it, which
  // is still a game you can look at.
  try { buildDummies(await loadGLB(DUMMY.file, 'loading a body to hit')); }
  catch (e) { PROG.done++; note('NO DUMMY GLB'); }

  paintKit();

  player.pos.y = groundAt(player.pos.x, player.pos.z, 0, MOVE.step);
  rig.ready = true;
  setBoot('go', 1);
  setTimeout(() => bootCard.classList.add('gone'), 260);
}

// the console handle. Every tuning object is live, so a number can be moved on the phone
// without a rebuild and without a push.
window.melee = window.mel = { RIG, MOVE, GAIT, CAM, FLICK, MELEE, WEAP, CLIPS, rig, player, cam, stick, BOXES,
  // THE STEPS ARE EXPOSED SO A HARNESS CAN DRIVE THE SHIPPED ONES. A harness with its own copy
  // of a rule measures a game that does not exist -- which is the oldest mistake there is, and
  // the only way not to make it is for `npm run sim` to call exactly these.
  DUMMY, DUMMIES, LOCK, STRIKE, dummyHit, dummyBlow, strikeSweep, stepDummies, findLock, SFX, CHARGE, POSE, snd,
  stepPlayer, rigAnim, stepKit, stepCam, integrate, stickWorld, flickH, rollGo, meleeGo, chargeRelease, groundAt,
  resolveBoxes, camFree, aimPoint, aimTarget, fireBolt, BOLTS, gunOut,
  kit: () => cycleKit(),
  clips: () => Object.keys(rig.clips).map(n => n + ' ' + rig.clips[n].duration.toFixed(3) + 's').join('\n'),
  where: () => `${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(2)}, ${player.pos.z.toFixed(1)}`,
  // WHAT THE HUE MEASUREMENT FOUND, and the two dials over it. `mel.glow(alien, gun)` is the
  // live A/B -- how much a colour should glow is a look-at-it decision and those belong on the
  // phone rather than in a commit.
  hues: () => ({
    alien: { deg: +(ALIENU.hue.value * 360).toFixed(0), hex: '#' + ALIENU.rgb.value.getHexString(), k: ALIENU.k.value },
    gun: { deg: +(GUNU.hue.value * 360).toFixed(0), hex: '#' + GUNU.rgb.value.getHexString(), peak: WEAP.glow },
  }),
  glow: (a, g) => {
    if (a != null) { RIG.hueGlow = a; ALIENU.k.value = a; }
    if (g != null) WEAP.glow = g;
    return { alien: RIG.hueGlow, gun: WEAP.glow };
  },
  hue: (a, g) => {
    if (a != null) { RIG.hue = a; ALIENU.hue.value = a; ALIENU.rgb.value.setHSL(a, 1, .6); }
    if (g != null) { WEAP.hue = g; GUNU.hue.value = g; GUNU.rgb.value.setHSL(g, 1, .6); }
    return { alien: RIG.hue, gun: WEAP.hue };
  },
  // HOW A MARK SHOULD LOOK IS A LOOK-AT-IT DECISION. `mel.retic({size, w, hue, lock})` --
  // size in px, `w` the stroke multiplier, both hues in degrees. Anything omitted is left alone.
  retic: o => {
    const el = document.getElementById('retic'); if (!el) return null;
    if (o) {
      if (o.size != null) el.style.setProperty('--size', o.size + 'px');
      if (o.w != null) el.style.setProperty('--w', o.w);
      if (o.hue != null) el.style.setProperty('--h', o.hue);
      if (o.lock != null) el.style.setProperty('--lh', o.lock);
    }
    const c = getComputedStyle(el);
    return { size: c.getPropertyValue('--size').trim(), w: c.getPropertyValue('--w').trim(),
             hue: c.getPropertyValue('--h').trim(), lock: c.getPropertyValue('--lh').trim() };
  },
  // the charge whine is a synth, so every part of it is a live number: `f0`/`f1` the note it
  // climbs through, `det` the detune in CENTS (this is the one that decides whether it reads as
  // electrical or as a tune), `lp0`/`lp1` how far the filter opens, `g` the level.
  chg: o => { if (o) Object.assign(CHARGE, o); return { f0: CHARGE.f0, f1: CHARGE.f1, det: CHARGE.det, lp0: CHARGE.lp0, lp1: CHARGE.lp1, q: CHARGE.q, g: CHARGE.g }; },
  mute: v => { SFX.on = v == null ? (SFX.on ? 0 : 1) : (v ? 1 : 0); return SFX.on; },
  emis: v => { for (const m of Object.values(rig.mats || {})) m.emissiveIntensity = v; RIG.emissive = v; return v; },
};

frame();
init();
</script>
</body>
