function bodyLaunch(d, dirH, vxz, vy) {
  const K = d.K;
  d.back = Math.cos(dirH - (d.h || 0)) < 0 ? 1 : 0;   // a blow into his front puts him over backwards
  d.st = 'down'; d.t = 0; d.hp = K.hp;
  d.vx = Math.sin(dirH) * vxz;
  d.vz = Math.cos(dirH) * vxz;
  d.vy = vy;
  // a TUMBLE, sign random, and the bottom of the range is zero on purpose: a man who simply goes
  // over backwards is one of the ways this should read.
  d.spinW = rnd(FLAIL.spin) * (Math.random() < .5 ? -1 : 1);
  bodyWhoosh(d);
  d.cur = d.back ? K.clips.downB : K.clips.downF;
  // **AND THE BEAT IS READ BY BOTH THE CLIP AND THE STATE**, or the state cuts its own clip off
  // part-way -- the m8 landmine, which is exactly what a per-body beat walks into.
  d.downB = K.downBeat * rnd(K.downVary || FLAIL.downVary);
  skinPlay(d, d.cur, skinLen(d, d.cur) / d.downB);
  d.lie = K.out * rnd(K.outVary || [.62, 1.55]);
  d.upB = K.upBeat * rnd(K.upVary || [.88, 1.18]);
}

function swapGo(to) {
  const p = player, nm = CLIPS.swap;
  if (!nm || !rig.actions[nm]) { applySlot(to); return 0; }
  const rev = !(WEAP.slots[to] && WEAP.slots[to].file);
  p.swap = 1; p.swapTo = to; p.swapT = 0; p.swapDone = 0; p.swapHid = 0;
  // REVERSED, THE CLIP RUNS BACKWARDS, SO BOTH CROSSINGS MIRROR **AND SWAP ROLES** -- the hand
  // enters the bag at `1 - show` and leaves it at `1 - hide`. Mirroring one of them and not the
  // other, or mirroring them without exchanging them, puts the hide after the show.
  p.swapHideAt = rev ? 1 - SWAP.show : SWAP.hide;
  p.swapAt     = rev ? 1 - SWAP.hide : SWAP.show;
  triggerStop();
  const r = (clipLen(nm) / SWAP.dur) * (rev ? -1 : 1);
  playOnce(nm, r); playOnce(nm + UP, r);       // the clone is a separate action and needs starting
  snd('foot', { g: .12, r: 1.25 });
  return 1;
}
// AND ANYTHING THAT OWNS THE BODY CANCELS IT, taking the weapon with it: a punch thrown mid-reach
// is the arms doing two things, and a swap you have to wait out is a swap nobody uses in a fight.
function swapStop() {
  const p = player;
  if (!p.swap) return;
  // **CLEARED BEFORE `applySlot`, OR A CANCELLED SWAP LEAVES HIM EMPTY-HANDED FOR EVER.** The
  // hide is the one piece of state here that is not a clock, so it is the one a cancel can strand
  // -- and `paintKit` reads it, so the repaint has to happen after it is down.
  p.swapHid = 0;
  if (!p.swapDone) applySlot(p.swapTo); else paintKit();
  p.swap = 0; p.swapDone = 1;
}
function cycleKit() {
  const p = player;
  if (p.swap || p.knock || p.wall || p.ledge) return;                        // one at a time, not out of a
                                              // knock-down, and not with his hands full
  // **AND IT CYCLES WHILE HE IS SOMEBODY ELSE, WHICH IS WHAT IT WAS ALWAYS FOR (m122).** m112
  // spent this tap on the revert; m121 took that back and left it INERT, on the argument that
  // cycling into a slot `stepKit` refuses to fire would put a weapon in his hand that does
  // nothing. That argument died with the hand mount -- the kit fires on a disguise now, so the
  // tap means exactly one thing in every state, which is the whole point of a control map.
  // REVERT keeps its own button on the left wheel (`paintPalRow`), so there is no conflict left.
  // A swap mid-transform is still refused, by `mphBare()` one line down in `stepKit` and by the
  // knock-down test above -- the body is not his to reach into while the blob has it.
  if (player.mphSt) return;
  swapGo((p.slot + 1) % WEAP.slots.length);
}

// ---- melee ---------------------------------------------------------------------------------
function meleeChain() { return CLIPS[slotNow().melee] || CLIPS.fist; }
// ONE PLACE ASKS WHETHER A CLIP HAS ITS OWN NUMBERS, so the beat, the contact frame and the
// travel cannot end up reading two different tables. Absent means the chain index decides, which
// is every clip but the 360 today.
const clipOf = nm => (MELEE.clip && MELEE.clip[nm]) || null;
// THE BEAT A CLIP WANTS: its own length at `MELEE.rate`, or its override, or -- if the clip is
// not loaded at all -- the chain position it is standing at. The last of those is only ever
// reached headless, where there is no rig to ask.
function melBeat(nm, ix) {
  const CL = clipOf(nm); if (CL && CL.beat) return CL.beat;
  const c = rig.clips && rig.clips[nm];
  return c && c.duration > 0 ? clamp(c.duration / MELEE.rate, MELEE.beatMin, MELEE.beatMax)
                             : MELEE.beat[Math.min(ix, MELEE.beat.length - 1)];
}
// OPEN, BUILD, FINISH -- and the finisher is the LAST link whatever the chain is long. See the
// note on `MELEE.power`: reading it by index made every link past the third a launch.
function melPower(ix, n) {
  const P = MELEE.power, fin = P[P.length - 1];
  if (n <= 1 || ix >= n - 1) return fin;
  const open = P[0], build = P[Math.min(1, P.length - 1)];
  return n <= 2 ? open : open + (build - open) * (ix / (n - 2));
}
const aimAt = d => {
  const dx = d.root.position.x - player.pos.x, dz = d.root.position.z - player.pos.z;
  return { d, dist: Math.hypot(dx, dz), h: Math.atan2(dx, dz) };
};
// ONE SHOT, TAKEN ON THE FRAME OF THE FLICK AND NEVER REVISITED. There is nothing here for it
// to flicker between, which is why this can be a hard lock where the gun's is an assist.
// AND THE ACQUIRE RANGE IS WHAT THE MOVE CAN COVER, NOT A TYPED NUMBER. A flat range locks a
// JAB onto a man six metres off and then cannot get him there -- and a lock that turns him
// toward somebody he cannot reach is worse than no lock at all.
function meleeLock(h, reachMax) {
  let best = null, bestS = Infinity;
  for (const d of DUMMIES) {
    const a = aimAt(d);
    if (a.dist > reachMax || a.dist < .3) continue;
    const off = Math.abs(wrapAngle(a.h - h));
    if (off > MELEE.aimCone) continue;
    // HOW FAR OFF THE LINE OF THE FLICK HE IS, IN METRES. `dot - dist * k` reads as
    // "straightest wins, nearest breaks the tie" and is not: the two terms are in different
    // units and one drowns the other. `dist * sin(off)` is the miss distance, and `aimNear`
    // then says what a metre of range is worth against a metre of miss -- same units, both.
    const sc = a.dist * Math.sin(off) + MELEE.aimNear * a.dist;
    if (sc < bestS) { bestS = sc; best = a; }
  }
  return best;
}
// THE FLYING KICK. It is an ordinary strike with a different clip, beat and speed -- the lunge,
// the bleed, the swept limb and the camera want all come from `p.melee` -- so the only thing it
// adds is that it ENDS ON THE GROUND rather than in the air, which is `slamGo`'s own rule.
// **IT DOES NOT TOUCH `vel.y`**: he is already ballistic, and driving the vertical would make it
// a second slam rather than a kick thrown across the air he already has.
function kickGo(h) {
  const p = player, nm = MELEE.air;
  if (h == null) h = p.faceH;
  p.airKick = 1; p.meleeAir = 1; p.flip = ''; p.bkHang = 0;   // the kick owns the body
  p.melee = 1; p.meleeIx = 0; p.meleeT = 0; p.meleeName = nm; p.meleeDur = MELEE.airDur;
  p.meleeChain = 0; p.melFired = 0; p.melU = 0; p.swPrev = null; p.swRootX = null; p.swRootZ = null;
  p.meleeBody = 1;                    // the blow is him arriving -- see `STRIKE.bodyAt`
  // **IT AIMS NOW (m93).** The SAME lock the ground strikes use, on the same reach-is-what-it-
  // delivers rule: the acquire radius is what this move can actually cover, so a man past it is
  // refused rather than aimed at and fallen short of. And it needs no vertical term -- `aimAt`
  // is horizontal, so being above him does not change his bearing; what was missing up there is
  // the sweep's own height margin, which `STRIKE.bodyR` widens.
  const spend = p.meleeDur * MELEE.carryAvg;
  const vCap = Math.min(MELEE.maxV, MELEE.airMax / spend);
  const L = meleeLock(h, MELEE.airMax + MELEE.arrive);
  if (L) h = L.h;
  p.melTgt = L ? L.d : null;
  // the floor is its own speed, the lock may only reach FURTHER -- `MELEE.slideFree`'s rule,
  // and doubly so here: a kick that shortens itself lands him on the floor beside the man.
  p.melV = Math.max(L ? clamp((L.dist - MELEE.arrive) / spend, 0, vCap) : 0,
                    Math.min(MELEE.airV, vCap));
  p.melGap = p.melV * spend;
  p.heading = h; p.faceH = h; p.camWant = h; p.melH = h;
  playOnce(nm, clipLen(nm) / p.meleeDur);
  snd('swoosh', { r: .92, g: .86 });
  p.vel.x = Math.sin(h) * p.melV; p.vel.z = Math.cos(h) * p.melV;
}

function meleeGo(h) {
  const p = player;
  if (p.knock) return;                  // out of a knock-down: the get-up is not his to cancel
  if (mphBare()) return;                // no strike on a skin with no pool to throw one (m119)
  swapStop();
  // **A FLICK IN THE AIR IS THE FLYING KICK (m88).** *"Flying kick is if you jumped in the air
  // and you melee."* Until now `meleeGo` simply returned when airborne, so a flick up there did
  // nothing at all unless it went DOWN, where m81's slam took it. ONE PER AIRTIME (`p.airKick`,
  // cleared beside `p.jumps` on landing), or it is a flutter kick across the street.
  if (!p.grounded) {
    if (p.melee || p.roll || p.slam || p.airKick) return;
    if (MELEE.air && rig.actions[MELEE.air]) kickGo(h);
    return;
  }
  // BUFFERED, NEVER INTERRUPTING. A flick thrown while a strike is still playing is remembered
  // and taken the moment it finishes, so the chain answers the thumb without any link being
  // cut off halfway. Dropping the input instead would make a fast chain feel unresponsive;
  // taking it immediately would make every strike a jump cut.
  if (p.melee || p.roll || p.chargeGo) { p.melQ = (h != null ? h : p.faceH); return; }
  const pool = meleeChain();
  const links = Math.max(1, Math.min(MELEE.links, pool.length));
  // A CHAIN, NOT A BUTTON. Inside the window (or during a strike, which buffers) the next
  // flick takes the NEXT link; let it lapse and the next flick opens at the first again. Past
  // the finisher it comes back round rather than sticking on the last one for ever.
  const cont = p.melee || p.meleeChain > 0;
  // **AND A FRESH CHAIN DEALS THE NEXT HAND OUT OF THE POOL (m95).** Advanced by a WHOLE chain
  // rather than by one, so consecutive chains share no clip and nothing comes round again until
  // the pool is exhausted -- six unarmed clips are exactly two chains. Advancing by one would
  // make the second and third blows of a chain the first and second of the next, which reads as
  // repetition rather than as variety.
  if (!cont) p.meleeRoll = (p.meleeRoll + links) % pool.length;
  const ix = cont ? (p.meleeIx + 1) % links : 0;
  // **AND THE OPENING LINK IS THE TACKLE IF HE HAS ACTUALLY BEEN RUNNING (m88).** It is an
  // OPENING rather than a fourth strike: running at somebody and hitting melee is one move, not
  // two decisions. `p.meleeIx` stays 0, so the next flick takes link two and the chain reads on
  // from it exactly as it would have.
  const tackle = !cont && MELEE.slide && rig.actions[MELEE.slide] && p.runT >= MELEE.slideT;
  const j = ((p.meleeRoll + ix) % pool.length + pool.length) % pool.length;
  const name = tackle ? MELEE.slide : pool[j];
  if (!rig.actions[name]) { note('NO CLIP ' + name); return; }
  p.melee = 1; p.meleeIx = ix; p.meleeLinks = links; p.meleeT = 0; p.meleeName = name; p.meleeAir = 0;
  p.meleeBody = tackle ? 1 : 0;   // see `STRIKE.bodyAt` -- the blow is him arriving
  const CL = clipOf(name);
  p.meleeDur = tackle ? MELEE.slideDur : melBeat(name, ix);
  p.meleeChain = 0; p.melFired = 0; p.melU = 0; p.swPrev = null; p.swRootX = null; p.swRootZ = null;
  const base = tackle ? MELEE.slideV
             : (CL && CL.lunge) || MELEE.lunge[Math.min(ix, MELEE.lunge.length - 1)];
  // **WHAT IT CAN REACH IS WHAT IT MAY ACQUIRE INSIDE, AND THE CAP IS NOW WHAT DECIDES THAT
  // (m72).** A target further off than the lunge can deliver has to be refused, or he is aimed
  // at a man he then falls short of and swings at the air -- m20's rule (an assist's range is
  // sized for what it DELIVERS) and `chargeAim`'s `acq` one move over. Reading `maxV` here was
  // also that number doing two jobs: it is a SPEED ceiling, and it was silently setting the
  // acquire radius as well.
  const maxD = tackle ? MELEE.slideMax : (CL && CL.max) || MELEE.lungeMax;
  // **AND A TACKLE'S REACH IS `maxD` ITSELF, NOT `maxD + arrive` (m97).** An ordinary strike
  // stops `arrive` SHORT of the man, so it can acquire one that much further off; a tackle
  // goes THROUGH him, so the furthest it can deliver is exactly `slideMax`. Half a metre,
  // and it is m20's rule -- an assist's range is sized for what it DELIVERS -- which the new
  // aim-through shape quietly moved.
  const reachMax = Math.min(MELEE.maxV * p.meleeDur * MELEE.carryAvg,
                            maxD + (tackle ? 0 : MELEE.arrive));
  const L = h != null ? meleeLock(h, reachMax) : null;
  if (L) h = L.h;
  p.melTgt = L ? L.d : null;
  // SOLVE THE LAUNCH FOR THE GAP. A move covers `v * dur * carryAvg`, and that inverts.
  // **AND THE FLOOR IS WHAT PUT HIM PAST THEM (m51).** *"When you're swiping generally towards
  // them it more or less moves directly to them, or to right in front of them, so that his
  // melee animation really actually nails them perfectly."* It did solve for the gap and then
  // clamped the answer UP to `base` -- a typed lunge speed that has nothing to do with where
  // the man is. A man 1.5 m off solves to 1.0 m/s, gets floored at 7.0, and he covers 3.1 m:
  // **1.6 m PAST him**, every time, which is the whole of "he goes through them". `base` is
  // the FREE lunge, for a flick at nobody; a solved one is solved, and the only floor it needs
  // is zero. A man already at arm's length now gets a swing thrown on the spot.
  // and `lungeMax` is a DISTANCE, so it becomes a speed through the same `dur * carryAvg` the
  // solve inverts -- applied to the free lunge too, which is what keeps one number governing
  // how far a strike carries whether or not it found anybody.
  const spend = p.meleeDur * MELEE.carryAvg;
  const vCap = Math.min(MELEE.maxV, maxD / spend);
  const solved = L ? clamp((L.dist - MELEE.arrive) / spend, 0, vCap) : Math.min(base, vCap);
  // **AND A TACKLE AIMS THROUGH HIM RATHER THAN IGNORING HIM (m97).** *"He's hitting the guys
  // and then all of a sudden he zips past them by a long distance and I can't figure out why."*
  // It is the TACKLE, and it is m93 over-corrected. His m93 complaint was that the solve CUT IT
  // SHORT (6.20 m free, 1.25 m against a man at 2 m) and `slideFree` answered it by making the
  // solve a floor-only raise -- so the distance stopped answering to where anybody was at all,
  // and every tackle became the full 6.20 m whether the man was six metres away or under his
  // nose. **Nothing else in the file does that**: every ordinary strike is capped at
  // `lungeMax` 4.6 m and solves DOWN to the man.
  // **AND IT FIRES MID-FIGHT, WHICH IS WHY IT READS AS A GLITCH.** `tackle` needs only `!cont`
  // and `runT >= slideT` -- so a chain that lapses (`window` 1.05 s) while he is moving turns
  // the very next flick into a slide, and he leaves the fight he was in.
  // **THE ANSWER IS A TARGET, NOT A FLOOR: he slides THROUGH him and out the other side.**
  //     nobody            `slideV`'s own 6.20 m, unchanged -- the "nice long slide tackle"
  //     a man at 1.0 m    3.60 m  (the floor -- a slide has to be a slide)
  //     a man at 2.0 m    4.20 m  = 2.0 + `slideThru`
  //     a man at 3.5 m    5.70 m
  //     a man at 6.0 m    7.50 m  (`slideMax`)
  // `hitAll` and the swept limb still catch everyone he passes, which is what m93 was right
  // about and is untouched. `mel.MELEE.slideThru = 99` is the one word back to m93.
  const thru = L ? Math.max(L.dist + MELEE.slideThru, MELEE.slideMin) : base * spend;
  p.melV = tackle && MELEE.slideFree ? clamp(thru / spend, 0, vCap) : solved;
  p.melGap = p.melV * spend;          // how far this strike will actually carry him, for the chip
  // **AND THE LENS COMES ROUND WITH HIM (m81).** `h` here is the direction he ACTUALLY strikes
  // -- after `meleeLock` has had its say -- so a locked swing turns the camera onto the man
  // rather than onto the thumb, which is the same "one answer" rule the mark and the shot live
  // under. It is a WANT rather than a write: `cam.az` has exactly one writer and this is not it.
  if (h != null) { p.heading = h; p.faceH = h; p.camWant = h; }
  // AND IT IS WHAT THE BLOW LAUNCHES ALONG (m97) -- see `strikeSweep`. Stored where it is
  // DECIDED, so the camera, the facing and the launch are one answer rather than three.
  p.melH = h != null ? h : p.faceH;
  // THE CLIP IS COMPRESSED TO THE BEAT, not the beat stretched to the clip. `melee_03` is
  // 1.417 s and the finisher 1.75 -- a three-hit chain at 1x is over four seconds of watching,
  // which reads as lag rather than as a combo.
  playOnce(name, clipLen(name) / p.meleeDur);
  snd('swoosh', { r: .95 + ix * .1, g: .8 });
  // and he covers ground: full speed for `carry` of the strike, then linear to zero, which
  // averages .725 rather than .5 and is what a lunge actually looks like
  p.vel.x = Math.sin(p.faceH) * p.melV; p.vel.z = Math.cos(p.faceH) * p.melV;
}
// **A FLICK DOWN IN THE AIR IS A SLAM (m81).** Returns truthy when it took the gesture, so the
// pad's one flick handler reads as a sentence and the ground strike is what is left.
// **THE DIRECTION TEST IS THE PAD'S RAW TRAVEL, NOT `flickH`.** `flickH` maps a flick into WORLD
// space through `cam.az`, which is exactly right for a strike thrown somewhere and meaningless
// here: down-the-screen is down-the-screen whatever the camera is doing, and a slam has no
// bearing to throw it along. The pad's +Y is DOWN (`flickH(0, -1)` is the desktop punch, and
// that is straight UP), so `dy > 0` is the gesture and the dominance test is what keeps a
// sideways flick a strike.
// TAKING COVER. The entry clip animates IN PLACE, so the STEP to the wall is code: he is lerped
// from where he stood onto the pinned standoff across `inDur`, which is what makes the clip read
// as an approach rather than as a snap plus an animation.
function wallGo(W) {
  if (mphBare()) return 0;             // no cover clips without zap's pool on him (m119)
  const p = player, nm = WALL.clips.in;
  swapStop();
  p.wall = W; p.wallSt = 'in'; p.wallT = 0; p.wallOff = 0; p.wallSide = 0;
  p.wx0 = p.pos.x; p.wz0 = p.pos.z;
  p.vel.x = p.vel.z = 0; p.vel.y = Math.min(0, p.vel.y);
  triggerStop();
  if (rig.actions[nm]) playOnce(nm, clipLen(nm) / WALL.inDur);
  snd('foot', { g: .10, r: .9 });
  return 1;
}
// LETTING GO. `jumped` skips the stand-up clip entirely, because he is in the air and `in_air`
// is the pose -- playing a get-off-the-wall transition while airborne is two things at once.
function wallDrop(jumped) {
  const p = player, nm = WALL.clips.out;
  p.wallCool = WALL.cool;
  if (jumped) { p.wall = null; p.wallSt = ''; return; }
  p.wallSt = 'out'; p.wallT = 0;
  if (rig.actions[nm]) playOnce(nm, clipLen(nm) / WALL.outDur);
}
// WHICH SHIMMY CLIP, AND WHICH WAY ROUND. `+side` is his RIGHT: he faces along the normal, and
// his right is `(-fz, fx)`, which with `f = (nx, nz)` is `(-nz, nx)` -- the same tangent the
// move is taken along, so the sign cannot disagree with the motion.
function wallShimmy(side) {
  const aim = slotNow().aim;
  const L = (aim && WALL.clips.aimL) || WALL.clips.L;
  const R = (aim && WALL.clips.aimR) || WALL.clips.R;
  if (side > 0 && R && rig.actions[R]) return { nm: R, rev: 0 };
  if (!L || !rig.actions[L]) return null;
  return { nm: L, rev: side > 0 ? 1 : 0 };
}

function stepWall(dt) {
  const p = player, W = p.wall;
  p.wallT += dt;
  // **THE CLIP ALREADY CONTAINS THE HALF TURN, SO THE ROOT MUST NOT (m99).** *"The animations
  // has the face away from wall built in, but you rotated him so now he faces the wall."* Exactly
  // that: m89 pointed the root along +normal AND the clip turns him 180 on top of it, so the two
  // composed into a man with his nose in the brick. The root faces INTO the wall and the clip's
  // own turn is what puts his belly out -- one half turn, not two.
  // **AND THE SHIMMY'S SIGN COMES RIGHT WITH IT, which is worth writing down rather than
  // re-deriving:** `side` is measured along `(-nz, nx)`, and that tangent is the DRAWN body's
  // right once he is facing +normal -- so `wallShimmy`'s `side > 0 -> R` is now true of the body
  // you can see. Under m89's facing it was the drawn body's LEFT, so that was wrong too.
  const face = Math.atan2(-W.nx, -W.nz);         // the ROOT faces the wall; the clip turns him out
  const d = wrapAngle(face - p.faceH);
  p.faceH += d * Math.min(1, WALL.turn * dt); p.heading = p.faceH;

  // ---- the stand-up: he is free to steer out of it, so it is short and it is not cancellable
  if (p.wallSt === 'out') {
    p.vel.x *= Math.exp(-6 * dt); p.vel.z *= Math.exp(-6 * dt);
    integrate(dt, 0, 0, 0, false);
    if (p.wallT >= WALL.outDur) { p.wall = null; p.wallSt = ''; p.goT = 0; }
    return;
  }

  const px = W.cx + W.nx * (p.r + WALL.stand), pz = W.cz + W.nz * (p.r + WALL.stand);

  // ---- the step to the wall
  if (p.wallSt === 'in') {
    const u = clamp(p.wallT / WALL.inDur, 0, 1), e = u * u * (3 - 2 * u);
    p.pos.x = lerp(p.wx0, px, e); p.pos.z = lerp(p.wz0, pz, e);
    p.pos.y = groundAt(p.pos.x, p.pos.z, p.pos.y, MOVE.step);
    p.vel.set(0, 0, 0); p.speed = 0; p.grounded = true;
    if (u >= 1) { p.wallSt = 'hold'; p.wallT = 0; }
    return;
  }

  // ---- in cover
  const st = stickWorld();
  // JUMPING OUT COMES FIRST, because it is the one exit that must never be eaten by the grace
  // period -- a thumb held away from the wall AND a tap is a man jumping off it, not a man
  // walking off it.
  if (p.jump) {
    p.jump = 0;
    p.vel.y = MOVE.jump; p.vel.x = W.nx * WALL.jump; p.vel.z = W.nz * WALL.jump;
    p.grounded = false; p.coyote = 0; p.airT = 0; p.jumps = 1;
    snd('swoosh', { r: 1.45, g: .34 });
    wallDrop(1);
    return;
  }
  // AND LETTING GO IS A HOLD, NOT A FRAME. *"You really have to press directly away."* `off` is
  // harder than `into` on purpose, and the grace clock is what lets a diagonal shimmy overshoot
  // it for a moment without dropping him.
  const away = st.mag > .3 ? st.x * W.nx + st.z * W.nz : 0;
  if (away > WALL.off) p.wallOff += dt; else p.wallOff = 0;
  if (p.wallOff >= WALL.grace) { wallDrop(0); return; }

  // ---- the shimmy. The stick's component ALONG the face, and nothing else: pushing into the
  //      wall does nothing, which is right, and a diagonal is simply its sideways part.
  const tx = -W.nz, tz = W.nx;
  const side = clamp(st.mag > .18 ? st.x * tx + st.z * tz : 0, -1, 1);
  p.wallSide = Math.abs(side) > .14 ? side : 0;
  p.speed = Math.abs(p.wallSide) * WALL.speed;
  if (p.wallSide) {
    const nx = p.pos.x + tx * p.wallSide * WALL.speed * dt;
    const nz = p.pos.z + tz * p.wallSide * WALL.speed * dt;
    // **RE-FOUND EVERY FRAME RATHER THAN CLAMPED TO THE LATCHED BOX**, because a building's wall
    // is a RUN of merged column boxes -- shimmying has to carry across them. And a face whose
    // normal disagrees with the one he latched is a different wall: at the end of a run there is
    // nothing to find and he simply stops, which IS the end of the cover.
    const W2 = wallFind(nx, p.pos.y, nz, p.r + WALL.reach);
    if (W2 && W2.nx * W.nx + W2.nz * W.nz > .7) p.wall = W2;
    else p.wallSide = 0;
  }
  const V = p.wall;
  p.pos.x = V.cx + V.nx * (p.r + WALL.stand);
  p.pos.z = V.cz + V.nz * (p.r + WALL.stand);
  p.pos.y = groundAt(p.pos.x, p.pos.z, p.pos.y, MOVE.step);
  p.vel.set(0, 0, 0); p.grounded = true; p.airT = 0; p.jumps = 0;
}

// ---- THE LEDGE (m102) ---------------------------------------------------------------------
// CATCHING ONE. He is in the air, his hands are level with a lip, and he takes it -- no button
// and no second gesture, which is `wallGo`'s own rule one surface up. **AND CATCHING ONE WHILE
// RISING IS DELIBERATE**, not an oversight: jumping at a fire escape and being caught by it on
// the way up is the move, and a test for `vel.y < 0` would take it away.
function ledgeGo(L) {
  if (mphBare()) return 0;             // no hang clips without zap's pool on him (m119)
  const p = player;
  swapStop(); triggerStop();
  p.ledge = L; p.ledgeSt = 'in'; p.ledgeT = 0; p.ledgeOff = 0; p.ledgeSide = 0;
  p.lx0 = p.pos.x; p.ly0 = p.pos.y; p.lz0 = p.pos.z;
  p.vel.set(0, 0, 0);
  p.melee = 0; p.roll = 0; p.slam = 0; p.flip = ''; p.block = 0; p.center = 0;
  snd('foot', { g: .14, r: .85 });
  return 1;
}
// WHERE HIS ROOT GOES, FROM THE TWO MEASURED NUMBERS AND NOTHING ELSE. His hands sit on the lip
// at the face; the root is `out` back along the normal and `hang` below it.
function ledgeAt(L, o) {
  // **SCALED BY THE DRAWN BODY (m122).** *"All of the characters do the ledge hang too high,
  // like from their hips it seems."* Exactly that, and it is arithmetic: these two numbers are
  // fractions of `RIG.height` measured off ZAP's hang clip, and `MORPH.tall` draws a disguise
  // at the kind's own height. On the skater (1.68 against his 1.25, x1.344) her hands sit
  // 1.446 m above her root while the root was placed 1.076 m under the lip -- so her hands
  // ended **0.37 m over it** and the lip crossed her at 64% of her height, which is her hips.
  // His word for it was the measurement.
  const k = RIG.height * bodyK();
  o.x = L.cx + L.nx * (k * LEDGE.out);
  o.z = L.cz + L.nz * (k * LEDGE.out);
  o.y = L.y - k * LEDGE.hang;
  return o;
}
const _lp = { x: 0, y: 0, z: 0 };
// LETTING GO. The drop is simply the air code taking over, which is right: `in_air` IS the pose
// for a man who has let go of something, and a get-off-the-ledge transition played while
// falling would be two things at once -- `wallDrop`'s own argument.
function ledgeDrop(away) {
  const p = player;
  p.ledge = null; p.ledgeSt = ''; p.ledgeCool = LEDGE.cool;
  p.grounded = false; p.coyote = 0; p.airT = 0;
  if (away) {
    p.ledgeAway = LEDGE.awayDur;
    const cl = clipLen(LEDGE.clips.away);
    if (cl > .05) playOnce(LEDGE.clips.away, cl / LEDGE.awayDur);
  }
}

function stepLedge(dt) {
  const p = player, L = p.ledge;
  p.ledgeT += dt;
  // THE ROOT FACES THE WALL, and unlike the wall-cover clip this one carries no half turn of
  // its own -- checked rather than assumed: the hands measure to local **+Z**, so they are on
  // his forward side and his belly is already against the brick.
  const face = Math.atan2(-L.nx, -L.nz);
  p.faceH += wrapAngle(face - p.faceH) * Math.min(1, LEDGE.turn * dt);
  p.heading = p.faceH;
  p.vel.set(0, 0, 0); p.speed = 0; p.grounded = false; p.airT = 0; p.jumps = 1;
  const H = ledgeAt(L, _lp);

  // ---- the swing onto the lip
  if (p.ledgeSt === 'in') {
    const u = clamp(p.ledgeT / LEDGE.grabDur, 0, 1), e = u * u * (3 - 2 * u);
    p.pos.x = lerp(p.lx0, H.x, e); p.pos.y = lerp(p.ly0, H.y, e); p.pos.z = lerp(p.lz0, H.z, e);
    if (u >= 1) { p.ledgeSt = 'hold'; p.ledgeT = 0; }
    return;
  }

  // ---- the mantle. **UP FIRST, THEN IN.** Lerping straight to the target drags him diagonally
  //      THROUGH the parapet; over the top and then across is what a mantle IS.
  if (p.ledgeSt === 'up') {
    const u = clamp(p.ledgeT / LEDGE.upDur, 0, 1);
    const tx = L.cx - L.nx * LEDGE.inset, tz = L.cz - L.nz * LEDGE.inset;
    // **AND THE HEIGHT IS THE ROOF'S, NOT THE LIP'S.** A box top and the thing he ends up
    // standing on are the same here and need not be for ever (a mantle onto a stack of boxes
    // lands on whichever is highest), so it is asked rather than assumed.
    const ty = groundAt(tx, tz, L.y + .05, MOVE.step);
    if (u < LEDGE.upOut) {
      const v = u / LEDGE.upOut, e = v * v * (3 - 2 * v);
      p.pos.x = H.x; p.pos.z = H.z;
      p.pos.y = lerp(H.y, ty, e);
    } else {
      const v = (u - LEDGE.upOut) / (1 - LEDGE.upOut), e = v * v * (3 - 2 * v);
      p.pos.x = lerp(H.x, tx, e); p.pos.z = lerp(H.z, tz, e); p.pos.y = ty;
    }
    if (u >= 1) {
      p.ledge = null; p.ledgeSt = ''; p.ledgeCool = LEDGE.cool;
      p.pos.x = tx; p.pos.z = tz; p.pos.y = ty;
      p.grounded = true; p.jumps = 0; p.goT = 0;
      snd('foot', { g: .16, r: 1.0 });
    }
    return;
  }

  // ---- the hop. DISCRETE, because the clips are hops rather than a slide -- which is the one
  //      place this deliberately does NOT copy the wall.
  if (p.ledgeSt === 'hop') {
    const u = clamp(p.ledgeT / (p.ledgeDur || LEDGE.hopDur), 0, 1), e = u * u * (3 - 2 * u);
    const tx = -L.nz, tz = L.nx;
    const nx = p.lx0 + tx * p.ledgeSide * LEDGE.hop * e;
    const nz = p.lz0 + tz * p.ledgeSide * LEDGE.hop * e;
    p.pos.x = nx; p.pos.z = nz; p.pos.y = p.ly0;
    if (u >= 1) {
      // RE-FOUND AT THE END rather than clamped to the box he left, because a building's wall
      // is a RUN of boxes -- and a face whose normal disagrees is a DIFFERENT ledge, so running
      // out of edge is simply nothing to find, which IS the end of it.
      const L2 = ledgeFind(nx, p.pos.y, nz, p.r + LEDGE.reach);
      if (L2 && L2.nx * L.nx + L2.nz * L.nz > .7) { p.ledge = L2; p.ledgeSt = 'hold'; p.ledgeT = 0; }
      else ledgeDrop(0);
    }
    return;
  }

  // ---- hanging
  p.pos.x = H.x; p.pos.y = H.y; p.pos.z = H.z;
  // JUMPING OFF COMES FIRST, the one exit the grace period must never eat.
  if (p.jump) {
    p.jump = 0;
    p.vel.y = MOVE.jump; p.vel.x = L.nx * LEDGE.jump; p.vel.z = L.nz * LEDGE.jump;
    snd('swoosh', { r: 1.40, g: .36 });
    ledgeDrop(1);
    return;
  }
  const st = stickWorld();
  const into = st.mag > .3 ? -(st.x * L.nx + st.z * L.nz) : 0;
  // **INTO THE WALL IS THE CLIMB, WHICH IS THE WHOLE LOOP HE DESCRIBED** -- jump, hang, climb
  // up, jump. One thumb held at the wall carries him all the way through it, because the same
  // push that latched him is the one that mantles him.
  // **AND THE MANTLE IS COMPRESSED TO ITS STATE, WHICH m102 WROTE DOWN AND NEVER DID (m106).**
  // That note says "the 1.208 s clip is compressed to (x1.55)" and nothing set a rate, so it
  // played at 1.0 over a 0.78 s state and **the last 0.43 s of the climb was never shown** --
  // the m8 landmine, live. Same for the push-off in `ledgeDrop`.
  if (into > LEDGE.into) {
    p.ledgeSt = 'up'; p.ledgeT = 0; p.ledgeSide = 0;
    const cl = clipLen(LEDGE.clips.up);
    if (cl > .05) playOnce(LEDGE.clips.up, cl / LEDGE.upDur);
    return;
  }
  // AND LETTING GO IS A HOLD, NOT A FRAME -- `off` harder than `into`, and the grace clock is
  // what lets a diagonal hop overshoot it for a moment without dropping him.
  if (into < -LEDGE.off) p.ledgeOff += dt; else p.ledgeOff = 0;
  if (p.ledgeOff >= LEDGE.grace) { ledgeDrop(0); return; }
  const tx = -L.nz, tz = L.nx;
  const side = st.mag > .35 ? st.x * tx + st.z * tz : 0;
  if (Math.abs(side) > .55) {
    p.ledgeSide = Math.sign(side);
    p.ledgeSt = 'hop'; p.ledgeT = 0;
    p.lx0 = p.pos.x; p.ly0 = p.pos.y; p.lz0 = p.pos.z;
    // **AND THE STATE THAT STARTS A `ONCE` CLIP IS WHAT REWINDS IT (m106).** Both hops are in
    // `ONCE` and NOTHING ever called `playOnce` for them -- the weight table merely named one,
    // and `skinWeights` only rewinds an action once its damped weight has decayed. So the first
    // hop played and the second, fired the moment the first ended with the thumb still held,
    // found it PAUSED on its last frame and simply held that pose for the whole slide. **That
    // is this file's oldest landmine, in the one state that entered a one-shot without the
    // function written for it** -- `wallGo` does it correctly one surface down.
    const hn = p.ledgeSide > 0 ? LEDGE.clips.L : LEDGE.clips.R;
    const cl = clipLen(hn);
    p.ledgeDur = cl > .05 ? cl / LEDGE.hopRate : LEDGE.hopDur;
    if (cl > .05) playOnce(hn, LEDGE.hopRate);
    snd('foot', { g: .10, r: 1.15 });
  }
}

// THE FLIP ITSELF. Started from two places -- the second jump and the backflip release -- so
// it is a function: two copies is two things to keep in step, and the clip scaling is the part
// that would drift. **IT IS STRETCHED TO THE AIR HE HAS LEFT**, because a clip played at 1x is
// right at exactly one jump height: `front_flip` is 0.67 s of air and a charged backflip hangs
// for over a second and a half, so at 1x one finishes a third of the way up and the other could
// never be landed. The rate is clamped, because a clip played at half speed is slow motion
// whatever the ballistics say.
// **THE TAKE-OFF FRAME IS WHERE THE RATE DROPS (m100).** `timeScale` is read by the mixer every
// update, so writing it here moves the clock from this frame on and leaves the clip exactly
// where the push left it. **NEVER `reset()` or `playOnce` again** -- either rewinds the action to
// the crouch, and playing the wind-up a second time in mid-air is the fault m92 removed.
function flipAirRate() {
  const p = player;
  if (p.flip && p.flipRate > 0) setScale(p.flip, p.flipRate);
}

function flipGo(nm, T) {
  const p = player, M = FLIP[nm];
  p.flip = ''; p.flipT = 0; p.flipRate = 0; p.flipPush = 0;
  if (!rig.actions[nm] || !M) return 0;
  // **THE CLIP IS FITTED TO THE TRIP IN BOTH DIRECTIONS NOW (m97).** See `AIR.rateLo`: the old
  // floor of 1 meant a big backflip was over with half a second of air still to run. `M.air` is
  // the clip's own crouch-to-landing time and `T` is the hang, so `M.air / T` is the rate that
  // lands the two together -- and `rateLo` is what stops a re-export or a retune turning that
  // into slow motion.
  const rate = clamp(M.air / Math.max(.2, T * AIR.fill), AIR.rateLo, AIR.rateHi);
  // **AND THE PUSH PLAYS AT ITS OWN RATE (m100).** See `AIR.pushRate`: one rate for the whole
  // clip meant a long hang slowed the leg extension too, so the bigger the jump the longer he
  // stood on the floor after the release. It may only ever go FASTER than the air rate -- on a
  // short hang that rate is already over 1, and a typed 2.2 there would be slowing the one
  // segment this exists to shorten. A clip with no wind-up (`front_flip`, `off` 0.000) has no
  // push to speed up and keeps one rate end to end, with no case of its own.
  const push = M.off > .02 ? Math.max(rate, AIR.pushRate) : rate;
  // **THE FLIP CLOCK COVERS THE PUSH AS WELL AS THE AIR (m92)**, because the clip runs through
  // both -- started at the launch, the push half plays under a table not asking for it. Each
  // half is now measured at the rate it is actually played at.
  p.flip = nm; p.flipRate = rate; p.flipPush = M.off / push;
  p.flipDur = p.flipPush + M.air / rate;
  playOnce(nm, push);
  // AND IT STARTS AT THE CROUCH, NOT AT FRAME ZERO. The wind-up is the pose he has been HOLDING;
  // playing it again is half a second of ducking after he has already left the ground. `from` is
  // 0 on a clip with no wind-up, so the front flip needs no case of its own.
  const a = rig.actions[nm]; if (a) a.time = M.from;
  return 1;
}

// THE CHARGED BACKFLIP. The hold is spent here and nowhere else, so the duck, the release and
// the height cannot disagree about how wound it was.
function backGo(far, fired) {
  const p = player, k = clamp(p.bkT / AIR.hold, 0, 1), on = p.bkOn;
  p.bkT = 0; p.bkOn = 0;
  // a flick or a tap already answered this thumb, and one gesture may only mean one thing
  if (!on || fired || far >= MOVE.tapR || !p.grounded || p.land || mphBare()) return 0;
  const hi = AIR.hi0 + (AIR.hi1 - AIR.hi0) * k, vy = Math.sqrt(2 * MOVE.g * hi);
  // **IT SPENDS THE DOUBLE.** A front flip started out of a backflip is two rotations fighting
  // over one body, and this is already the higher jump of the two -- so the backflip IS the
  // flip for that airtime.
  p.jumps = 2;
  flipGo(CLIPS.flipBack, 2 * vy / MOVE.g);
  // **AND HE LEAVES THE GROUND WHEN THE CLIP SAYS HE DOES, NOT ON THE FRAME OF THE RELEASE
  // (m92).** *"The upward velocity starts way before the backflip animation gets to its jump
  // point."* Exactly that: `backflip` spends **0.333 s PUSHING on the floor** after the crouch,
  // so m87 had him rising through a third of a second of leg extension -- 28% of the smallest
  // flip's whole airtime. He is held down for it instead, and the clip and the physics then
  // agree BY CONSTRUCTION rather than by two numbers being tuned toward each other.
  // **IT IS NOT LATENCY, IT IS THE PUSH** -- `SLAM.hang`'s own argument, and unlike that one it
  // is MEASURED off the clip, so a re-export moves it and a clip with no wind-up (`front_flip`,
  // 0.000) skips it with no case of its own.
  // **AND THE PUSH IS `flipGo`'s OWN ANSWER NOW, NOT ONE RE-DERIVED FROM `flipDur` (m100).**
  // With two rates in the clip there is nothing to invert: the function that chose how fast the
  // wind-up plays is the function that knows how long it takes, and a second derivation here is
  // a second place for the clip and the physics to start disagreeing.
  const hang = p.flipPush;
  if (hang > .02) { p.bkHang = hang; p.bkVy = vy; p.vel.x = p.vel.z = 0; p.vel.y = 0; }
  else { flipAirRate(); p.vel.y = vy; p.grounded = false; p.coyote = 0; p.airT = 0; }
  snd('swoosh', { r: 1.05 + k * .12, g: .40 + k * .16 });
  return 1;
}

function slamGo(dx, dy) {
  const p = player;
  if (p.grounded || p.knock || p.slam || p.slamUsed || p.roll || mphBare()) return 0;
  swapStop();
  if (!(dy > 0 && Math.abs(dy) > Math.abs(dx))) return 0;
  const nm = CLIPS.chargeGo;
  if (!rig.actions[nm]) { note('NO CLIP ' + nm); return 0; }
  // ONE PER AIRTIME. Without it a held thumb flicking repeatedly is a man hammering the floor
  // on the way down, which is the flutter-kick shape `p.airKick` refuses one repo over.
  p.slam = 1; p.slamUsed = 1; p.slamT = 0; p.flip = ''; p.bkHang = 0;
  p.melFired = 0; p.melU = 0; p.swPrev = null; p.swRootX = null; p.swRootZ = null;
  triggerStop();                      // the same thumb, and a wound shot has nowhere to go
  p.vel.x *= SLAM.keep; p.vel.z *= SLAM.keep; p.vel.y = 0;
  // SOLVE THE ARRIVAL. h = down*t + g t^2/2, so t = (sqrt(down^2 + 2 g h) - down)/g -- and the
  // hang is on the front of it because the clip has to cover the wind-up as well as the drop.
  const h = Math.max(.05, p.pos.y - groundAt(p.pos.x, p.pos.z, p.pos.y, MOVE.step));
  const tf = (Math.sqrt(SLAM.down * SLAM.down + 2 * MOVE.g * h) - SLAM.down) / MOVE.g;
  p.slamDur = SLAM.hang + tf;
  playOnce(nm, Math.min(SLAM.rateMax, clipLen(nm) / p.slamDur));
  snd('swoosh', { r: .70, g: .95 });
  return 1;
}
// **AND A SLAM GOES IN EVERY DIRECTION, SO IT IS A RADIUS AND NOT A CONE.** Every other blow in
// this game is a cone because it is thrown somewhere; this one is thrown at the floor, and the
// man it catches is thrown OUTWARD from where it landed -- which is one bearing per body rather
// than one for the lot, so it is a loop over `dummyBlow` rather than a `dummyHit` call.
// **A FRIEND IS HARDER TO CATCH, THROUGH `WEAP.palBlast`** -- the same number m76 gave the
// blaster's splash, so "how much a friend is spared" is one dial and not two to keep in step.
// THE GROUND FEELS IT (m99). See `MFX.slam` for why this is a RING and not a `spkBurst`: a
// shockwave goes outward and low, and a sphere is the shape of a fist arriving at a chest.
// **THE RING IS SIZED OFF `SLAM.r`**, the radius the blow actually catches, so the debris says
// how far it reached rather than being a number nobody can check against anything.
function slamFx(x, y, z) {
  const M = MFX.slam;
  const ring = (n, v, up, size, life, col, r0) => {
    for (let i = 0; i < n; i++) {
      // an EVEN fan, jittered -- a purely random set of bearings clumps and reads as a spray,
      // and an exactly even one reads as a cog
      const a = (i + Math.random() * .8) / n * Math.PI * 2;
      const sx = Math.sin(a), sz = Math.cos(a);
      const k = .55 + Math.random() * .75;
      spk(x + sx * r0, y + .06, z + sz * r0,
          sx * v * k, up * (.35 + Math.random()), sz * v * k,
          size * (.6 + Math.random() * .8), life * (.7 + Math.random() * .6), col);
    }
  };
  const r0 = SLAM.r * .18;
  ring(M.grit, M.gritV * (SLAM.r / 3.4), M.gritUp, M.gritSize, M.gritLife, M.gritCol, r0);
  ring(M.dust, M.dustV * (SLAM.r / 3.4), M.dustUp, M.dustSize, M.dustLife, M.dustCol, r0 * 1.6);
  // the white core at his feet, through the SAME record every other flash here uses -- a second
  // producer with its own stack is m94's own fault one table down
  if (MFX.on) {
    const fx = new THREE.Group();
    fx.add(glowSprite(0xffffff, M.flash));
    fx.add(glowSprite(0xffd9a0, M.flash * 1.6));
    fx.position.set(x, y + .12, z);
    scene.add(fx);
    FLASH.push({ g: fx, t: 0, life: M.flashLife, base: M.flash, mul: [1, 1.6] });
  }
  camShake(CAM.shake.max);
}
function slamLand() {
  const p = player;
  p.slam = 0;
  for (const d of DUMMIES) {
    if (d.cool > 0) continue;
    const dx = d.root.position.x - p.pos.x, dz = d.root.position.z - p.pos.z;
    const q = Math.hypot(dx, dz);
    const rr = SLAM.r * (d.K.pal ? WEAP.palBlast : 1) + d.K.r;
    if (q > rr) continue;
    dummyBlow(d, q > 1e-3 ? Math.atan2(dx, dz) : p.faceH, SLAM.power, SLAM.dmg);
    hitRing(d.K, 1, d.root.position.x, d.root.position.z);
    // the chip's `!` -- "it never fired", "it fired and reached nobody" and "it landed" are
    // three bugs with one picture on a phone, and the sweep cannot answer it here (it is not
    // `live`), so the radial blow is what sets it.
    p.melFired = 1;
  }
  snd('hit', { g: 1.0, r: .78, x: p.pos.x, z: p.pos.z });
  slamFx(p.pos.x, p.pos.y, p.pos.z);
  // **AND IT HANDS TO THE HARD LANDING, BECAUSE THE CLIP IS CUT AT THE IMPACT.** `rateMax`
  // means a slam from a low jump plays only part of the swing, and ending there would snap him
  // from mid-arc into the idle -- a jump cut, which nothing in this file is allowed to be.
  // `landing_hard` is a man hitting the ground and pushing back up off it, which IS the
  // follow-through, so this needed the state that already exists rather than a new one.
  // **ONLY IF HIS FEET ARE ACTUALLY DOWN.** `SLAM.max` can end the state in mid-air -- slammed
  // off a roof over a drop, the prediction runs out before the ground arrives -- and a landing
  // state entered while airborne is a man lying on nothing. The ordinary fall takes him from
  // there and lands him normally, which is the right answer and needed no case of its own.
  if (!p.grounded) return;
  p.landHard = 1;
  p.land = MOVE.landHard; p.landT = 0;
  playOnce(CLIPS.landHard, clipLen(CLIPS.landHard) / p.land);
}

// **EVERYTHING THAT ENDS A HOLD COMES THROUGH ONE PLACE (m68).** The guard already spelt these
// five assignments out inline; a roll and a knock-down want exactly the same thing, and three
// copies of it is three places for the aim, the charge and the hum to start disagreeing about
// whether the trigger is up. `chargeStop` is what silences the rising synth, and forgetting it
// is a hum that plays for the rest of the session.
function triggerStop() {
  const p = player;
  if (!p.aim && !p.charge) return;
  p.aim = 0; p.armT = 0; p.chg = 0; p.charge = 0; p.chargeT = 0; chargeStop();
}
function rollGo(h) {
  const p = player;
  swapStop();
  if (!p.grounded || p.knock || p.roll || p.melee || p.chargeGo || mphBare()) return;
  p.roll = 1; p.rollT = 0; p.rollH = (h != null ? h : p.faceH);
  p.heading = p.rollH; p.melee = 0; p.meleeChain = 0;
  // **A ROLL STOPS THE SHOT (m68).** *"When I'm shooting and then I roll, he needs to stop
  // shooting -- right now he just continues shooting while he rolls, it looks weird."* It did:
  // nothing in the trigger block had a `busy` gate at all, where the guard and the square-up
  // both do, so a wound shot went on winding and a rapid-fire hold went on firing ROUNDS out
  // of a man rolling along the floor. A roll costs you the charge, which is the trade.
  triggerStop();
  playOnce(CLIPS.roll, clipLen(CLIPS.roll) / MELEE.rollDur);
  snd('swoosh', { r: 1.35, g: .45 });
  p.vel.x = Math.sin(p.rollH) * MELEE.rollV; p.vel.z = Math.cos(p.rollH) * MELEE.rollV;

// WHO THE CHARGE IS AIMED AT, AND HOW FAR IT CAN CARRY HIM -- ONE ANSWER (m51).
