const DUMMIES = [];
// RASTERISE A SOLID MESH INTO COLUMNS. Two things about this are load-bearing and Shredworld
// paid for both:
//   1. **A TRIANGLE'S BOUNDING BOX IS NOT ITS SHAPE.** A big sloped quad running from the foot
//      of a wall to the top of a canopy has a box covering the whole span, so using the box's
//      height would tell every cell under the canopy that the wall reaches the ground. The box
//      picks the CELLS; the height over each one comes from the triangle's PLANE, clamped back
//      inside that triangle's own y range. A vertical face has no useful plane in y and keeps
//      its full span, which is correct.
//   2. **A CELL MUST AGREE WITH THE RUN IT JOINS, not merely fail to enlarge it.** Asking
//      whether adding a cell GROWS the run lets a short canopy cell (3.5..6.2) be swallowed by
//      a full-height wall run (0..6.2), because it grows it by nothing -- and then the whole
//      canopy comes out as one box reaching the ground. The test is on BOTH ends.
// COLS:START
// **A 12-TRIANGLE MESH IS ONLY ITS BOUNDING BOX IF IT IS AXIS-ALIGNED (m131).** That shortcut
// has been in since m124 and its claim -- "a box and its AABB is exact" -- is true of 347 of
// this city's 349 twelve-triangle solids and FALSE of the two that are turned 45 degrees:
// `prop_plaza_ledge_iron_a/b_col` are 14.51 x 0.06 m rails whose axis-aligned bounds are
// 10.30 x 10.30, so each one was a **106 m2 invisible slab** across a plaza -- x121.86 its own
// area. Measured through this very function against the real collision file, which is plain
// glTF and therefore readable offline.
//
// **THE TEST IS THE AREA RATIO, AND THE OBVIOUS TEST IS WRONG.** My first version asked whether
// every vertex sits on one of the two extremes in X and in Z, which is exact for a box and
// **true of these rails**: a 6 cm bar running corner to corner has all eight of its vertices
// bunched at two OPPOSITE corners of its own bounding box, so it passes. It diverted them
// offline only by accident of a 2 cm tolerance and diverted NOTHING at the 45 cm one it
// shipped with -- caught by re-running the measurement with the shipped function rather than
// with the copy I had tested. A tolerance in METRES cannot separate a 6 cm bar from a 10 m box
// anyway; what matters is how much the AABB over-claims, which is scale-free.
// So: sweep the footprint for the tightest rectangle and compare areas. One degree of
// resolution costs under 2% of area, well inside `skew`, and a box's own min-area rectangle is
// itself -- so an axis-aligned one returns 1.000 exactly and needs no tolerance at all.
function boxSkew(o) {
  const a = o.geometry.getAttribute('position');
  if (!a || !a.count) return 1;
  const n = a.count, px = new Float64Array(n), pz = new Float64Array(n);
  const v = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    v.fromBufferAttribute(a, i).applyMatrix4(o.matrixWorld);
    px[i] = v.x; pz[i] = v.z;
  }
  let best = Infinity, flat = 0;
  for (let d = 0; d < 90; d++) {
    const t = d * Math.PI / 180, c = Math.cos(t), sn = Math.sin(t);
    let u0 = 1e30, u1 = -1e30, w0 = 1e30, w1 = -1e30;
    for (let i = 0; i < n; i++) {
      const u = px[i] * c + pz[i] * sn, w = -px[i] * sn + pz[i] * c;
      if (u < u0) u0 = u; if (u > u1) u1 = u; if (w < w0) w0 = w; if (w > w1) w1 = w;
    }
    const ar = (u1 - u0) * (w1 - w0);
    if (d === 0) flat = ar;
    if (ar < best) best = ar;
  }
  // A DEGENERATE FOOTPRINT (a flat panel seen from above) has no area either way, so it has
  // nothing to over-claim and the shortcut is as good as anything -- 1 says "leave it alone".
  return best > 1e-6 ? flat / best : 1;
}
function solidColumns(mesh, cfg, out) {
  const geo = mesh.geometry, pos = geo.attributes.position, idx = geo.index;
  if (!pos) return 0;
  const n = idx ? idx.count : pos.count;
  const m = mesh.matrixWorld;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  geo.computeBoundingBox();
  const wb = geo.boundingBox.clone().applyMatrix4(m);
  const W = wb.max.x - wb.min.x, D = wb.max.z - wb.min.z;
  // THE CELL GROWS TO FIT rather than the mesh being skipped -- a stadium gets coarse columns
  // and a bollard fine ones, and neither falls out of the collider for being the wrong size.
  let cell = cfg.cell;
  while ((Math.ceil(W / cell) + 1) * (Math.ceil(D / cell) + 1) > cfg.maxCells) cell *= 1.5;
  const nx = Math.max(1, Math.ceil(W / cell)), nz = Math.max(1, Math.ceil(D / cell));
  const hits = new Array(nx * nz);

  // EVERY HEIGHT AT WHICH A VERTICAL RAY THROUGH THE CELL CENTRE CROSSES THE SURFACE.
  // A vertical face has no XZ area and a vertical ray cannot cross one, which is correct and is
  // why the crossings all come from floors, roofs and slopes.
  for (let i = 0; i < n; i += 3) {
    const a = idx ? idx.getX(i) : i, b = idx ? idx.getX(i + 1) : i + 1, c = idx ? idx.getX(i + 2) : i + 2;
    A.fromBufferAttribute(pos, a).applyMatrix4(m);
    B.fromBufferAttribute(pos, b).applyMatrix4(m);
    C.fromBufferAttribute(pos, c).applyMatrix4(m);
    const ax = A.x, az = A.z, ex = B.x - ax, ez = B.z - az, fx = C.x - ax, fz = C.z - az;
    const det = ex * fz - fx * ez;
    if (Math.abs(det) < 1e-12) continue;
    const x0 = Math.min(A.x, B.x, C.x), x1 = Math.max(A.x, B.x, C.x);
    const z0 = Math.min(A.z, B.z, C.z), z1 = Math.max(A.z, B.z, C.z);
    const ci0 = Math.max(0, Math.floor((x0 - wb.min.x) / cell));
    const ci1 = Math.min(nx - 1, Math.floor((x1 - wb.min.x) / cell));
    const ck0 = Math.max(0, Math.floor((z0 - wb.min.z) / cell));
    const ck1 = Math.min(nz - 1, Math.floor((z1 - wb.min.z) / cell));
    const ey = B.y - A.y, fy = C.y - A.y;
    for (let ci = ci0; ci <= ci1; ci++) {
      const px = wb.min.x + (ci + .5) * cell - ax;
      for (let ck = ck0; ck <= ck1; ck++) {
        const pz = wb.min.z + (ck + .5) * cell - az;
        // **THE BOUNDING BOX PICKS THE CELLS; THE TRIANGLE DECIDES.** Marking every cell in the
        // bbox is the same "a triangle's bounding box is not its shape" error this file already
        // has a note about, in XZ this time.
        const u = (px * fz - fx * pz) / det, v = (ex * pz - px * ez) / det;
        if (u < -1e-6 || v < -1e-6 || u + v > 1 + 1e-6) continue;
        const k = ci * nz + ck;
        (hits[k] || (hits[k] = [])).push(A.y + u * ey + v * fy);
      }
    }
  }

  // PAIR THE CROSSINGS: in, out, in, out. That is what "inside the solid" MEANS, and it is what
  // the old lowest-and-highest-triangle reading could not express.
  // **AN ODD COUNT MEANS THE SHELL IS OPEN UNDERNEATH**, which is what a generated building
  // usually is -- a skin with no floor. One crossing on the way up is a roof with nothing below
  // it, and reading that as lowest-to-highest gives a ZERO-HEIGHT box floating at roof level.
  // Closing it at the model's own floor is the honest repair: the solid runs from the ground to
  // the surface, which is what a building standing on the ground is.
  const H = wb.max.y - wb.min.y;
  const spans = new Array(nx * nz);
  let used = 0, boxy = 0;
  for (let k = 0; k < hits.length; k++) {
    const h = hits[k];
    if (!h || !h.length) continue;
    h.sort((p, q) => p - q);
    if (h.length & 1) h.unshift(wb.min.y);
    const sp = [];
    for (let i = 0; i + 1 < h.length; i += 2) if (h[i + 1] - h[i] > 1e-4) sp.push(h[i], h[i + 1]);
    if (!sp.length) continue;
    spans[k] = sp; used++;
    if (sp.length === 2 && sp[1] - sp[0] >= H * cfg.full) boxy++;
  }
  if (!used) return 0;

  // IS IT JUST A BOX? Most buildings are, and collapsing costs nothing and saves every frame.
  // **AND IT HAS TO FILL ITS FOOTPRINT AS WELL AS ITS HEIGHT (m124, `cfg.fill`).** `full` asks
  // whether the OCCUPIED columns are full height and quietly assumes the footprint is occupied
  // -- which is true of every closed building shell this has ever been handed and false of a
  // beam, a row of piers or a fence. `solid_freeway_girder_col` is 276 x 250 m and 1.8 m thick:
  // every column it has is full height, so it collapsed into a SLAB OVER THE WHOLE MAP at
  // 9.2 m, which is an invisible floor a man on a roof or on the hill lands on.
  // **ABSENT IT IS EXACTLY THE OLD RULE** -- `BLD` and `TOWER` name no `fill` and are untouched.
  if (boxy / used >= cfg.full && used >= nx * nz * (cfg.fill || 0)) {
    out.push({ minx: wb.min.x, maxx: wb.max.x, miny: wb.min.y, maxy: wb.max.y,
               minz: wb.min.z, maxz: wb.max.z });
    return 1;
  }

  // merge along X into runs of AGREEING spans. A cell may hold SEVERAL -- an overhang is a
  // second span with air under it -- so the open runs are a small list rather than one.
  let made = 0;
  const push = r => { out.push({ minx: wb.min.x + r.i0 * cell, maxx: wb.min.x + (r.i1 + 1) * cell,
                                 miny: r.lo, maxy: r.hi,
                                 minz: wb.min.z + r.ck * cell, maxz: wb.min.z + (r.ck + 1) * cell });
                      made++; };
  for (let ck = 0; ck < nz; ck++) {
    let open = [];
    for (let ci = 0; ci < nx; ci++) {
      const sp = spans[ci * nz + ck], next = [];
      if (sp) for (let i = 0; i < sp.length; i += 2) {
        const lo = sp[i], hi = sp[i + 1];
        let r = null;
        for (let j = 0; j < open.length; j++) {
          const o = open[j];
          if (o && Math.abs(o.lo - lo) < cfg.tol && Math.abs(o.hi - hi) < cfg.tol) { r = o; open[j] = null; break; }
        }
        if (r) { r.i1 = ci; r.lo = Math.min(r.lo, lo); r.hi = Math.max(r.hi, hi); }
        else r = { i0: ci, i1: ci, lo, hi, ck };
        next.push(r);
      }
      for (const o of open) if (o) push(o);
      open = next;
    }
    for (const o of open) if (o) push(o);
  }
  return made;
}

// WEIRDPORT (m124, `buildWpCollision`, `buildWpVisual`)

// TWO FILES AND TWO JOBS. The collision GLB is uncompressed and its node NAMES are the whole
// classification; the visual is draco and shares nothing with it but the space they are both
// authored in. Neither knows about the other, which is the point: he can re-export either one.
//
// **THE PICTURE AND THE THING YOU WALK INTO ARE NOT THE SAME MESH HERE, AND THAT IS HIS
// DESIGN.** Every other solid in this game pushes its own footprint into `BOXES`, so there is
// one description of the world; this one has two by construction, and the collision file is
// the one that is true. If he ever reports walking into nothing, that is the gap, and it is
// his export to close rather than this code's to paper over.
// **DECLARED ABOVE EVERYTHING THAT READS IT.** A `const` read from a function that runs later
// is fine and a `const` read from module scope above its own declaration is a BLANK PAGE, and
// this file has paid for that eight times. It goes above.
const wpRoot = new THREE.Group();
wpRoot.name = 'weirdport';
world.add(wpRoot);

function buildWpCollision(g) {
  let nGround = 0, nTri = 0, nBox = 0, nRaster = 0, nPlain = 0, nMetal = 0, skipped = 0;
  const t0 = performance.now();
  g.scene.updateMatrixWorld(true);
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  const rails = [];
  g.scene.traverse(o => {
    if (!o.isMesh || !o.geometry) return;

    // rather than being guessed at -- a silent third answer is how a collider grows a wall
    // nobody put there.
    const nm = o.name || '';

    if (!ground && !solid) { skipped++; return; }
    // **A GRIND RAIL IS A MATERIAL, NOT A NAME** -- his ten handrails, ledge irons and coping
    // are `prop_` nodes whose material is `metal`, which is the one thing that separates them
    // from the concrete they are bolted to. Counted and remembered; see the note below.
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    if (mats.some(m => m && m.name === 'metal')) { nMetal++; rails.push(nm); }

    const pos = o.geometry.attributes.position, idx = o.geometry.index;
    if (!pos) { skipped++; return; }

    if (ground) {
      nGround++;
      const n = idx ? idx.count : pos.count;
      for (let i = 0; i < n; i += 3) {
        const ia = idx ? idx.getX(i) : i, ib = idx ? idx.getX(i + 1) : i + 1, ic = idx ? idx.getX(i + 2) : i + 2;
        A.fromBufferAttribute(pos, ia).applyMatrix4(o.matrixWorld);
        B.fromBufferAttribute(pos, ib).applyMatrix4(o.matrixWorld);
        C.fromBufferAttribute(pos, ic).applyMatrix4(o.matrixWorld);
        nTri++; triAdd(A.x, A.y, A.z, B.x, B.y, B.z, C.x, C.y, C.z);
      }
      return;
    }

    // **A 12-TRIANGLE MESH IS A BOX AND ITS AABB IS EXACT, so it skips the rasteriser.** That
    // is a STRUCTURAL test rather than a test on `prop_`: 329 of his 333 props really are
    // boxes (his own note says so -- "props are simple boxes; trees are 0.7 m trunk boxes")
    // and the four that are not go through the rasteriser with the buildings, which is what
    // the name test would have got wrong in both directions.
    const nt = (idx ? idx.count : pos.count) / 3;
    // **AND ONLY IF IT IS ACTUALLY AXIS-ALIGNED (m131).** See `axisBox`: the two diagonal
    // plaza rails were a 106 m2 slab each, and anything else turned in a future export is
    // caught by the same line with nothing named.
    if (nt === 12 && boxSkew(o) < WP.cols.skew) {
      o.geometry.computeBoundingBox();
      const wb = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
      BOXES.push({ minx: wb.min.x, maxx: wb.max.x, miny: wb.min.y, maxy: wb.max.y,
                   minz: wb.min.z, maxz: wb.max.z });

      return;
    }
    // **AND A BOUNDING BOX IS NOT A BUILDING (m26), WHICH HERE IS NOT A MATTER OF DEGREE.**
    // `solid_freeway_piers_col` is ONE node whose bounding box is 155 x 229 m and 9 m tall --
    // a row of separate piers under the I-405. As an AABB that is a solid block over most of
    // the slice from the ground up, and the player could not have moved at all.
    const got = [];
    solidColumns(o, WP.cols, got);
    if (got.length) { for (const c of got) BOXES.push(c); nBox += got.length; nRaster++; }
    else { skipped++; }
  });

  const cells = boxGrid();
  WP.rails = rails;
  console.log('[melee] weirdport collider: ' + n + ' walkable tris of ' + nTri + ' kept from ' +
    nGround + ' ground meshes, ' + nBox + ' boxes (' + nPlain + ' plain, ' + nRaster +
    ' rasterised), ' + nMetal + ' metal nodes, ' + skipped + ' skipped, grid ' + cells +
    ' cells, ' + Math.round(performance.now() - t0) + ' ms');
  if (!n) note('WP NO GROUND');
  if (!nBox) note('WP NO SOLIDS');
}

  return true;

      const im = new THREE.InstancedMesh(list[0].geometry, list[0].material, list.length);
      im.name = 'wpinst_' + (list[0].name || '');
      for (let i = 0; i < list.length; i++) im.setMatrixAt(i, list[i].matrixWorld);
      im.instanceMatrix.needsUpdate = true;
      // **AND THE MATRICES ARE WORLD MATRICES, so it hangs off the world at identity.** Adding
      // it under the gltf root would apply that root's transform a second time.
      // ITS OWN SHADOW FLAGS, because it is a NEW object and the pass above set the ones it
      // replaces. Taking them from the source is what keeps `WP.cast` meaning one thing.
      im.castShadow = list[0].castShadow; im.receiveShadow = list[0].receiveShadow;
      // AND REAL BOUNDS, so it can still be culled: a tree pack spread over the whole slice
      // never leaves the frustum and loses nothing, while twelve garden bushes in one plaza
      // are a tight sphere and are culled from everywhere else in the city.
      im.computeBoundingSphere();
      wpRoot.add(im);
      for (const o of list) o.parent && o.parent.remove(o);
      inst++; instN += list.length;
    }
  }

  // 2. **THE TRIM SHEET GOES IN THE BASE SLOT AND THE TINT MASK COMES OUT OF IT.** His exporter
  //    put the MASK in `baseColorTexture` and left the painted 2048 sheet out of the GLB
  //    entirely -- so loaded as it stands, every building in the city is shaded with a black
  //    and white mask. The mask is exactly what the shader wants, just not where the shader
  //    wants it: it is kept as the mask and `map` becomes the real sheet.
  //    **THE MASK IS THE EMBEDDED ONE, so there is no second fetch and no second failure mode
  //    on the boot path.** `textures/weirdport_trim_tintmask.png` is the lossless 1024 copy if
  //    the JPEG's ringing ever shows at a window frame.
  //    The shader itself is his (`models/portland/three/weirdportCity.js`) -- **except that it
  //    tests `City_Trim_Export` and this export calls the material `City_Trim`**, so on this
  //    file it would have matched nothing at all.
  wpRoot.add(root);
  WP.painted = painted; WP.tinted = tinted;
  console.log('[melee] weirdport visual: ' + mats + ' materials, ' + inst + ' instanced meshes for ' +
    instN + ' nodes, trim ' + trimmed + (trim ? '' : ' (NO SHEET)') + ', beam ' + beam +
    ', stand-in paint on ' + painted + ' of ' + mats +
    (bare.length ? ' (no row for: ' + bare.join(', ') + ')' : '') +
    ', tint set promoted on ' + tinted + ' of ' + geos.size + ' geometries');
  if (!trimmed) note('WP NO TRIM MAT');
  if (!trim) note('WP NO TRIM PNG');
  // "THE BUILDINGS AREN'T TINTED" IS TWO BUGS AND ONE PICTURE FROM A PHONE -- the material
  // never got the mask, or it got it and `vColor` is white. `WP NO TRIM MAT` answers the first
  // and this answers the second, and it is SILENT once a re-export makes it unnecessary.
  if (WP.tint && trimmed && !tinted) note('WP NO TINT');
}

// ============================================================================================
// POPULATING WEIRDPORT (m127, `wpStand`, `wpPool`, `wpSpread`, `wpLoop`, `wpPopulate`)
//
// One seeded stream, one pool of clear standing spots, and a farthest-point spread over it.
// Every kind's `at` table is rewritten from that pool before a single body is loaded, so the
// BUILDERS are untouched -- `buildFoes`, `buildHicks` and the rest still loop `K.at` and know
// nothing about which world they are in, which is `d.K`'s own dividend one table further out.
// ============================================================================================
let _wpSeed = 0;
function wpRand() { _wpSeed = (_wpSeed * 1664525 + 1013904223) >>> 0; return _wpSeed / 4294967296; }

// The highest WALKABLE triangle under the ceiling, or null for "there is no ground here".
// **THE TRIANGLES ONLY, NEVER `groundAt`.** That one takes a box top as ground, which is right
// for a man walking onto a roof and wrong for a spawn: it would stand somebody on a bench.
function wpGround(x, z) {
  if (!TRI.on) return null;
  const y = triGround(x, z, WPSPOT.top, MOVE.step);
  return y < -1e29 ? null : y;
}

const _wpP = { x: 0, y: 0, z: 0 };
// Is this a patch a body can stand on: real ground, level across his own width, and not inside
// anything. Returns the height, or null.
function wpStand(x, z) {
  const y = wpGround(x, z);
  if (y === null) return null;
  const r = WPSPOT.r;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI * .5;
    const h = wpGround(x + Math.sin(a) * r, z + Math.cos(a) * r);
    if (h === null || Math.abs(h - y) > WPSPOT.flat) return null;
  }
  _wpP.x = x; _wpP.y = y; _wpP.z = z;
  if (resolveBoxes(_wpP, r, WPSPOT.hh)) return null;
  return y;
}

// THROW DARTS AT THE SLICE AND KEEP THE ONES THAT LAND. The bounds are the triangle grid's own,
// so this follows the export rather than a typed rectangle.
function wpPool() {
  _wpSeed = WPSPOT.seed >>> 0;
  const out = [];
  if (!TRI.on) return out;
  const x0 = TRI.x0, x1 = TRI.x0 + TRI.nx * TRI.cell;
  const z0 = TRI.z0, z1 = TRI.z0 + TRI.nz * TRI.cell;
  const sx = player.pos.x, sz = player.pos.z;
  for (let i = 0; i < WPSPOT.tries && out.length < WPSPOT.pool; i++) {
    const x = x0 + wpRand() * (x1 - x0), z = z0 + wpRand() * (z1 - z0);
    if (Math.hypot(x - sx, z - sz) < WPSPOT.near) continue;
    const y = wpStand(x, z);
    if (y !== null) out.push({ x, y, z });
  }
  return out;
}

// **FARTHEST-POINT, NOT THE FIRST N (m80's rule).** The darts are random, so the first thirty
// are a random scatter -- which clumps, because a random scatter does. Taking the one furthest
// from everything already taken spreads them across the whole slice by construction, and it is
// what makes three of a kind read as three streets rather than as a queue.
function wpSpread(pool, n, gap) {
  const got = [];
  if (!pool.length) return got;
  // START FURTHEST FROM THE SPAWN, so the seed is a fact about the world and not about which
  // dart happened to land first.
  let bi = 0, bd = -1;
  for (let i = 0; i < pool.length; i++) {
    const d = Math.hypot(pool[i].x - player.pos.x, pool[i].z - player.pos.z);
    if (d > bd) { bd = d; bi = i; }
  }
  got.push(pool[bi]); pool[bi].used = 1;
  while (got.length < n) {
    let best = -1, bestD = -1;
    for (let i = 0; i < pool.length; i++) {
      if (pool[i].used) continue;
      let d = 1e9;
      for (const g of got) { const t = Math.hypot(pool[i].x - g.x, pool[i].z - g.z); if (t < d) d = t; }
      if (d > bestD) { bestD = d; best = i; }
    }
    if (best < 0 || bestD < gap) break;
    pool[best].used = 1; got.push(pool[best]);
  }
  return got;
}

// A SEGMENT IS CLEAR IF EVERY METRE OF IT IS (`wpWalk`). She is the one character here with no
// collider at all -- `stepShe` writes her position straight and never asks `resolveBoxes` --
// so a circuit that is merely made of clear POINTS is a woman walking through a wall. Sampled
// at `WPSPOT.r`, which is her own width and therefore the finest step that can say anything.
function wpWalk(a, b) {
  const d = Math.hypot(b.x - a.x, b.z - a.z), n = Math.max(2, Math.ceil(d / WPSPOT.r));
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (wpStand(a.x + (b.x - a.x) * t, a.z + (b.z - a.z) * t) === null) return 0;
  }
  return 1;
}

// HER CIRCUIT, AND IT IS CLOSED OR IT IS NOTHING. A greedy walk over the pool: each next
// waypoint is the nearest one in a distance band whose segment is clear, and the LAST leg back
// to the first has to be clear too -- a loop with one bad leg is a loop she walks into a
// building once per lap for ever.
function wpLoop(pool, n, lo, hi, maxY) {
  const flat = pool.filter(q => !q.used && Math.abs(q.y) <= maxY);
  // **THE CANDIDATES ARE SORTED AND THE FIRST CLEAR ONE WINS, WHICH IS WHAT KEEPS THIS OFF THE
  // BOOT PATH.** The obvious version asks `wpWalk` about every candidate nearer than the best
  // so far, and `wpWalk` is about seventy `wpStand` calls on a long leg -- five triangle
  // lookups and a `resolveBoxes` each. Sorted, the typical leg costs ONE of them; unsorted and
  // unlucky it costs one per candidate, per leg, per restart, which is millions of grid lookups
  // while the card sits there. `WPSPOT.legs` is the backstop under it, because a bound you can
  // reason about beats a shape you hope is fast: out of budget it gives up, the chip says
  // `WP NO CIRCUIT`, and the cost is her and nothing else.
  let budget = WPSPOT.legs;
  for (let s = 0; s < flat.length && s < 12; s++) {
    const loop = [flat[s]];
    const taken = new Set([flat[s]]);
    while (loop.length < n) {
      const cur = loop[loop.length - 1];
      const band = flat.filter(q => !taken.has(q)).map(q =>
        ({ q, d: Math.hypot(q.x - cur.x, q.z - cur.z) })).filter(o => o.d >= lo && o.d <= hi);
      band.sort((u, v) => u.d - v.d);
      let pick = null;
      for (const o of band) {
        if (budget-- <= 0) return null;
        if (wpWalk(cur, o.q)) { pick = o.q; break; }
      }
      if (!pick) break;
      taken.add(pick); loop.push(pick);
    }
    if (loop.length === n && budget-- > 0 && wpWalk(loop[n - 1], loop[0])) {
      for (const q of loop) q.used = 1;
      return loop;
    }
  }
  return null;
}

// THE ONE PLACE EVERY `at` TABLE IS REWRITTEN. It runs after the collider and before any body
// is fetched, which is the only window in which both halves are true: the ground exists, and
// nothing has been placed on it yet.
function wpPopulate() {
  const KIND = { FOE, HICK, HOBO, SKATER, BIKER, DUMMY };
  const pool = wpPool();
  let want = 0;
  for (const k in WP.crowd) if (KIND[k]) want += WP.crowd[k];
  const spots = wpSpread(pool, want, WPSPOT.gap);
  // **DEALT ROUND-ROBIN, NOT SLICED.** `wpSpread` returns them in the order it found them --
  // furthest-first -- so a slice would hand one kind the far edge of the city and another the
  // middle. Dealing one to each in turn means every kind is spread over the whole slice, which
  // is the half of "randomly" that a spread alone does not buy.
  const keys = Object.keys(WP.crowd).filter(k => KIND[k] && WP.crowd[k] > 0);
  const left = {}; for (const k of keys) { left[k] = WP.crowd[k]; KIND[k].at = []; }
  let i = 0;
  while (i < spots.length) {
    let dealt = 0;
    for (const k of keys) {
      if (!left[k] || i >= spots.length) continue;
      const q = spots[i++]; KIND[k].at.push([q.x, q.z, q.y]); left[k]--; dealt++;
    }
    if (!dealt) break;
  }
  // **THE SIDEKICK IS NOT SCATTERED, WHICH IS WHAT HE IS FOR.** `foeWander`'s leash would walk
  // him back across the city from wherever he was dropped, so he is placed beside you -- the
  // nearest clear spot to the spawn, which is the one question the pool cannot answer because
  // `near` deliberately excludes it.
  CLANCY.at = [[player.pos.x, player.pos.z]];
  for (let rr = 2.5; rr <= 9; rr += .75) {
    let done = 0;
    for (let a = 0; a < 12 && !done; a++) {
      const th = a * Math.PI / 6;
      const x = player.pos.x + Math.sin(th) * rr, z = player.pos.z + Math.cos(th) * rr;
      const y = wpStand(x, z);
      if (y !== null) { CLANCY.at = [[x, z, y]]; done = 1; }
    }
    if (done) break;
  }
  // HER CIRCUIT, or she is left out entirely and the chip says so -- see `wpLoop`.
  const loop = wpLoop(pool, SHE.path.length, 12, 34, WPSPOT.flat * 2);
  WP.she = !!loop;
  if (loop) SHE.path = loop.map((q, n) => [q.x, q.z, n % 2 ? 'walk' : 'run']);
  WP.bodies = spots.length;
  console.log('[melee] weirdport crowd: ' + pool.length + ' clear spots pooled, ' + spots.length +
    ' of ' + want + ' placed, ' + keys.map(k => k + ' ' + KIND[k].at.length).join(' ') +
    ', clancy at ' + CLANCY.at[0][0].toFixed(1) + ',' + CLANCY.at[0][1].toFixed(1) +
    (loop ? ', her circuit ' + loop.map(q => q.x.toFixed(0) + ',' + q.z.toFixed(0)).join(' -> ') : ', NO CIRCUIT'));
  // "THE STREET IS EMPTY" IS THREE BUGS AND ONE PICTURE FROM A PHONE: the sweep found nothing,
  // it found spots and the GLBs did not arrive, or they arrived and are somewhere you have not
  // walked. Only the first has a number, and this is it.
  if (!spots.length) note('WP NO SPOTS');
  else if (spots.length < want) note('WP CROWD' + spots.length + '/' + want);
  if (!loop) note('WP NO CIRCUIT');
}


const BUILDINGS = [];
// **ONE BUILDER, A TABLE PER KIND (m60).** *"I added a towers folder. Towers are just like much
// way taller buildings."* Which is exactly the shape `d.K` already has for bodies: the tower is
// not a second builder, a second collider path or a second thing to keep in step -- it is a
// second TABLE handed to this function, and every number that was `BLD.something` is now the
// table's. `K` rides on each placed object so `bldCols` and `mel.bld`/`mel.tower` read the one
// its own building was built from.
function buildBuildings(g, K) {
  const proto = g.scene;
  // MEASURED off the geometry, in the file's own space. Every node here is at identity, but
  // asking the geometry rather than `Box3.setFromObject` is the habit that survives an export
  // that is not -- a mesh's node transform and its geometry bounds are different questions.
  const bb = new THREE.Box3();
  proto.updateMatrixWorld(true);
  proto.traverse(o => {
    if (!o.isMesh || !o.geometry) return;
    o.geometry.computeBoundingBox();
    bb.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  if (!isFinite(bb.min.y) || bb.max.y - bb.min.y < 1e-4) { note('BAD ' + K.tag + ' GLB'); return; }
  const k = K.height / (bb.max.y - bb.min.y);
  const w = (bb.max.x - bb.min.x) * k, d = (bb.max.z - bb.min.z) * k;

  proto.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (!m) continue;
      // ONE SIDE. See the note on BLD -- fill rate is the scarce thing on a phone and a closed
      // shell has no use for its own inside.
      m.side = THREE.FrontSide;
      // and the far side of a 10 m wall is looked at edge-on all day, which is exactly where a
      // texture without anisotropy turns to mush
      if (m.map) { m.map.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); m.map.needsUpdate = true; }
    }
  });

  // PLACED ON ITS OWN MEASURED MIDDLE AND ITS OWN MEASURED FLOOR, so a model authored anywhere
  // relative to its origin still lands centred on (x, z) with its feet at zero -- where the
  // origin happens to sit is not this code's business. The centre offset is TURNED with the
  // building rather than reasoned about, or a quarter turn slides it off its own footprint.
  const mid = new THREE.Vector3((bb.min.x + bb.max.x) * .5 * k, 0, (bb.min.z + bb.max.z) * .5 * k);
  const UPY = new THREE.Vector3(0, 1, 0), c = new THREE.Vector3();
  for (const [x, z, q] of K.at) {
    const o = proto.clone(true);
    o.scale.setScalar(k);
    o.rotation.y = (q || 0) * Math.PI / 2;
    c.copy(mid).applyAxisAngle(UPY, o.rotation.y);
    o.position.set(x - c.x, -bb.min.y * k, z - c.z);
    world.add(o);
    // **`bx` IS DECLARED BEFORE ANYTHING READS IT, AND FOR TWO BUILDS IT WAS NOT (m32).**
    // `const b0 = { o, bx, ... }` sat ABOVE `const bx = {...}`, which is a ReferenceError in
    // its temporal dead zone -- thrown on the FIRST placement, after `world.add(o)` had already
    // run. So the building was in the scene and not one box ever reached `BOXES`: *"I'm still
    // just walking through this building."* This file's oldest landmine, and neither gate can
    // see it -- `check:syntax` parses and `check:boot` never gets a GLB, because headless every
    // `loadGLB` rejects and `buildBuildings` is never entered at all.
    // a quarter turn swaps the footprint; anything else would need an ORIENTED box, and the
    // AABB of a rotated one is forty per cent too big along both axes -- the phantom hit
    const ww = (q % 2) ? d : w, dd = (q % 2) ? w : d;
    const bx = { minx: x - ww / 2, maxx: x + ww / 2, miny: 0, maxy: K.height,
                 minz: z - dd / 2, maxz: z + dd / 2 };
    // everything `mel.bld()` needs to re-size this WITHOUT re-reading the file, kept on the
    // object so the picture and the boxes it pushed can never be re-sized apart
    const b0 = { o, bx, x, z, q, unit: k / K.height, w: w / K.height, d: d / K.height,
                 loY: bb.min.y, mid: mid.clone().divideScalar(K.height), cols: null, K };
    // THE REAL SHAPE, NOT ITS BOUNDING BOX -- and the world matrix has to be current, because
    // the rasteriser reads WORLD triangle positions and the clone was placed a line ago.
    bldCols(b0);
    BUILDINGS.push(b0);
  }
  console.log('[melee] ' + K.tag.toLowerCase() + ' x' + k.toFixed(3) + ' -> ' + w.toFixed(1) +
              ' x ' + K.height.toFixed(1) + ' x ' + d.toFixed(1) + ' m, ' + K.at.length +
              ' placed, ' + BUILDINGS.filter(b => b.K === K)
                .reduce((a, b) => a + (b.cols ? b.cols.length : 1), 0) + ' collider boxes');
}
// WHAT THIS BUILDING CONTRIBUTES TO THE COLLIDER -- columns if they are any good, its bounding
// box if they are not. ONE function, called at build time AND after a re-size, because the
// columns are WORLD boxes and cannot be scaled in place: leaving the old ones behind is a
// building you walk into at its previous size, and two copies of the decision is two places for
// the fallback below to be missing from.
function bldCols(b) {
  // **ITS OWN TABLE, NEVER THE GLOBAL (m60).** A tower is twice as tall on the same `cell`, so
  // it rasterises to roughly twice the columns -- reading `BLD` here would have given every
  // tower the building's `maxCells` budget and its `tol`, which is two silently wrong answers
  // for one missing letter.
  const K = b.K || BLD;
  // take out whatever it contributes now, whichever of the two that is
  const drop = c => { const i = BOXES.indexOf(c); if (i >= 0) BOXES.splice(i, 1); };
  if (b.cols) b.cols.forEach(drop); else drop(b.bx);
  b.cols = null;
  let got = [];
  if (K.cols) {
    b.o.updateMatrixWorld(true);
    b.o.traverse(t => { if (t.isMesh) solidColumns(t, K, got); });
    // **A COLLIDER NOTHING CAN REACH IS NOT A COLLIDER, AND THAT IS WHAT SHIPPED (m34).** Every
    // column came out floating at roof height, the rasteriser therefore reported success, the
    // bounding-box fallback never fired, and `resolveBoxes` skipped every one of them on
    // `p.y + hh < b.miny` -- *"there is no collider on the building whatsoever"*, exactly. The
    // rasteriser is fixed above and this is the net under it: walking through a building is
    // strictly worse than a boxy collider, so the two must not be one silent coin toss.
    if (!got.some(c => c.miny <= MOVE.step && c.maxy > MOVE.step)) { got = []; note(K.tag + ' FLAT'); }
  }
  if (got.length) { got.forEach(c => BOXES.push(c)); b.cols = got; }
  else BOXES.push(b.bx);
  return b.cols ? b.cols.length : 1;
}

// HOW BIG A BUILDING SHOULD BE IS A LOOK-AT-IT DECISION, so it moves on the phone rather than in
// a commit. It re-scales what is already in the scene AND rewrites the collider boxes, or the
// picture and the thing you walk into would stop agreeing.
// **IT TAKES THE TABLE (m60)**, and touches only the buildings built from it -- `mel.tower(48)`
// must not re-scale the building, and `mel.bld()` must not squash the tower.
function bldSize(K, h) {
  if (h) K.height = h;
  const H = K.height, up = new THREE.Vector3(0, 1, 0), c = new THREE.Vector3();
  const mine = BUILDINGS.filter(b => (b.K || BLD) === K);
  for (const b of mine) {
    const k = b.unit * H, ww = (b.q % 2) ? b.d * H : b.w * H, dd = (b.q % 2) ? b.w * H : b.d * H;
    c.copy(b.mid).multiplyScalar(H).applyAxisAngle(up, b.o.rotation.y);
    b.o.scale.setScalar(k);
    b.o.position.set(b.x - c.x, -b.loY * k, b.z - c.z);
    // AND THE COLLIDER MOVES WITH IT. A picture and the thing you walk into that are re-sized
    // separately is a building you can stand inside, which is the worst kind of bug: nothing on
    // screen disagrees with anything.
    b.bx.minx = b.x - ww / 2; b.bx.maxx = b.x + ww / 2;
    b.bx.minz = b.z - dd / 2; b.bx.maxz = b.z + dd / 2; b.bx.maxy = H;
    bldCols(b);
  }
  return K.tag + ' height = ' + H.toFixed(1) + ' m, footprint ' +
         (mine[0] ? (mine[0].w * H).toFixed(1) + ' x ' + (mine[0].d * H).toFixed(1) : '-') +
         ', ' + mine.length + ' placed, ' + BOXES.length + ' collider boxes in the world';
}

// ONE DESCRIPTION OF A BODY, whatever kind it is. Two builders used to share twenty lines of
// this by copy, which is two places for a measurement to drift.
function bodyProto(g, K) {
  const proto = g.scene;
  // scale MEASURED off the geometry, never typed -- and off EVERY skinned mesh, because the
  // officer's file has two and the first one is his EYES: read alone it reports an authored
  // height of 2.9 cm and asks for a scale of x60.
  let lo = Infinity, hi = -Infinity;
  proto.traverse(o => {
    if (!o.isSkinnedMesh || !o.geometry) return;
    o.geometry.computeBoundingBox();
    lo = Math.min(lo, o.geometry.boundingBox.min.y); hi = Math.max(hi, o.geometry.boundingBox.max.y);
  });
  const authored = hi - lo, scale = authored > .01 ? K.h / authored : 1;
  // the same emissive lift the player gets, so nobody reads as a dark cut-out beside him.
  // `skeletonClone` SHARES materials, so this is done once for every copy.
  proto.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) {
      if (!m.isMeshStandardMaterial) continue;
      if (m.map) { m.emissiveMap = m.map; m.emissive = new THREE.Color(0xffffff); }
      m.emissiveIntensity = RIG.emissive;
    }
  });
  proto.updateMatrixWorld(true);
  const pb = {}; proto.traverse(o => { if (o.isBone) pb[o.name] = o; });
  const faceOff = -measureFacing(pb);
  // **HOW FAR HIS OWN HIPS SIT ABOVE HIS OWN ROOT (m120).** A body's root is at its SOLES (every
  // export here reads 0.000 there), so writing a root to a seat puts his FEET on it and his
  // whole body above -- which is the whole of why Clancy rode a foot over the backpack. Read off
  // the BIND pose, which this proto is provably at (nothing ever animates it), so a re-export at
  // any size lands right with no edit. `buildBoard`'s rule one body over.
  let hipY = 0;
  const _hp = new THREE.Vector3();
  for (const n in pb) if (/Hips$/.test(n)) { hipY = pb[n].getWorldPosition(_hp).y; break; }
  if (!(hipY > 0)) hipY = authored * .30;    // no Hips bone: a plausible fraction, never zero
  let clips = normaliseClips(g.animations || []);
