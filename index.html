    if (d.st === 'hit') {
      t[d.cur] = 1;
      if (d.t >= (d.beat || K.hitBeat)) { d.st = 'idle'; d.t = 0; }
    } else if (d.st === 'down') {
      // integrate while there is anything left to integrate
      const P = d.root.position;
      const gy = groundAt(P.x, P.z, P.y, .5);
      if (P.y > gy + .02 || d.vy > 0) {
        d.vy -= K.flyG * dt;
        const k = Math.exp(-K.flyDrag * dt);
        d.vx *= k; d.vz *= k;
        P.x += d.vx * dt; P.z += d.vz * dt; P.y += d.vy * dt;
        const g2 = groundAt(P.x, P.z, P.y, .5);
        if (d.vy <= 0 && P.y <= g2 + .04) { P.y = g2; d.vy = 0; d.vx = 0; d.vz = 0; }
      }
      t[d.cur] = 1;
      if (d.t >= K.downBeat + K.out) {
        // ONE OF THE FOUR COMBINATIONS CAN BE AUTHORED THE OTHER WAY ROUND, AND IT WAS MEASURED
        // rather than guessed: on the officer's export `knock_down_front` ENDS 174 degrees from
        // where `get_up_front` starts, while the back pair agrees to 14. So the front pair needs
        // him turned by pi as the get-up begins -- otherwise he does a 180 on the floor between
        // going down and standing up. "One of them is flipped" is four possibilities and three
        // of them make it worse. **The warrior has ONE fall and ONE get-up and they agree**, so
        // `flip` is a property of the kind rather than a rule about everybody.
        if (!d.back && K.flip !== 0) d.h += Math.PI;
        d.st = 'up'; d.t = 0;
        d.cur = d.back ? K.clips.upB : K.clips.upF;
        skinPlay(d, d.cur, skinLen(d, d.cur) / K.upBeat);
      }
    } else if (d.st === 'up') {
      t[d.cur] = 1;
      if (d.t >= K.upBeat) {
        d.st = 'idle'; d.t = 0; d.hp = d.hpMax;
        // HE GETS UP ANGRY. A battlecry on the way back in is the one place a taunt clip
        // belongs, and it also puts a beat between standing up and swinging again.
        if (K.ai && d.aggro && K.clips.taunt && Math.random() < K.taunt) {
          d.st = 'taunt'; d.cur = K.clips.taunt[(Math.random() * K.clips.taunt.length) | 0];
          skinPlay(d, d.cur, 1);
        }
      }
    } else if (K.ai) {
      foeAI(d, dt, t);
    } else {
      t[K.clips.idle] = 1;
    }
    skinWeights(d, t, dt, .06, K.clips.idle);
    d.mixer.update(dt);
    d.root.rotation.y = d.h + d.faceOff;
    if (d.bar) foeBarStep(d, dt);
  }
}

// ============================================================================================
// THE CAMERA
// ONE WRITER ON `cam.az`, ALWAYS. The right pad drags it and nothing else does -- while aiming
// he simply faces wherever the lens is pointed, which is the same number rather than a second
// one to keep in step. Two writers on a camera bearing is a loop that never settles and a
// picture that shakes, and it is the bug that shows up every single time.
// ============================================================================================
function camFree(tx, ty, tz, dx, dy, dz, want) {
  const step = CAM.probe, n = Math.ceil(want / step), pad = CAM.pad;
  for (let i = 1; i <= n; i++) {
    const d = Math.min(want, i * step);
    if (!camHit(tx + dx * d, ty + dy * d, tz + dz * d, pad)) continue;
    // BISECT. Walking in fixed steps and returning the last clear one means the answer only
    // ever takes values `probe` apart, so the boom JUMPS half a metre at a time as the shot
    // sways past a wall. A quantised probe is fine for a yes/no and wrong the moment something
    // continuous is drawn from it.
    let lo = d - step, hi = d;
    for (let k = 0; k < 4; k++) {
      const m = (lo + hi) * .5;
      if (camHit(tx + dx * m, ty + dy * m, tz + dz * m, pad)) hi = m; else lo = m;
    }
    return Math.max(CAM.min, lo);
  }
  return want;
}
function stepCam(dt) {
  const p = player;
  const rx = stick.R.down ? stick.R.x : ((keys.j ? -1 : 0) + (keys.l ? 1 : 0));
  if (Math.abs(rx) > .06) cam.az -= rx * CAM.yawRate * dt;

  // AND IT COMES ROUND TO A LOCKED TARGET. This is inside `stepCam` on purpose -- `cam.az` has
  // exactly one writer, and a second one somewhere else is a loop that never settles.
  if (p.lock) cam.az += wrapAngle(lockH(p.lock) - cam.az) * Math.min(1, LOCK.cam * dt);
  cam.el = CAM.el;
  cam.tgt.set(p.pos.x, p.pos.y + CAM.look, p.pos.z);
  const ce = Math.cos(cam.el);
  const bx = -Math.sin(cam.az) * ce, by = Math.sin(cam.el), bz = -Math.cos(cam.az) * ce;
  const want = CAM.dist + p.speed * CAM.distV;
  const free = camFree(cam.tgt.x, cam.tgt.y, cam.tgt.z, bx, by, bz, want);
  // SNAP IN, EASE OUT. Easing IN is time spent inside the wall; easing OUT is what stops every
  // doorway and lamp post making the shot lurch.
  cam.dist = free < (cam.dist || want) ? free : damp(cam.dist || want, free, CAM.outHL, dt);
  const wx = cam.tgt.x + bx * cam.dist, wy = cam.tgt.y + by * cam.dist, wz = cam.tgt.z + bz * cam.dist;
  if (cam.pos.lengthSq() === 0) cam.pos.set(wx, wy, wz);
  cam.pos.x = damp(cam.pos.x, wx, CAM.half, dt);
  cam.pos.y = damp(cam.pos.y, wy, CAM.half, dt);
  cam.pos.z = damp(cam.pos.z, wz, CAM.half, dt);
  // the floor under the LENS, capped at how far it may sit above the subject -- that cap is
  // what stops the camera being left standing on the box he has just dropped off
  const floor = groundAt(cam.pos.x, cam.pos.z, cam.pos.y, .6) + CAM.clear;
  cam.pos.y = Math.max(cam.pos.y, Math.min(floor, cam.tgt.y + CAM.rise));
  camera.position.copy(cam.pos);
  camera.lookAt(cam.tgt);
  // the lens widens with speed -- the cheapest speed cue there is, and it costs nothing
  const rush = smooth(CAM.rush0, CAM.rush0 + CAM.rushSpan, p.speed);
  const fov = CAM.fov + CAM.fovRush * rush;
  if (Math.abs(camera.fov - fov) > .01) { camera.fov = damp(camera.fov, fov, .25, dt); camera.updateProjectionMatrix(); }
}

// ============================================================================================
// THE FRAME
// ============================================================================================
let last = performance.now(), fps = 0, fpsT = 0, frames = 0;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  // clamped, because a backgrounded tab hands back a delta of several seconds and every
  // integrator in the file would take one enormous step through the world
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;

  if (rig.ready) {
    stepAim(dt);          // one eased answer, before anything reads it
    stepKit(dt);
    stepPlayer(dt);
    stepDummies(dt);
    stepShe(dt);
    rigAnim(dt);
    rig.mixer.update(dt);
    // DRAWN AT `faceH`, not at `heading`, plus the rigid yaw that puts the barrel down his nose.
    // `aimComp` reads the barrel off world matrices that are a frame old, which is exactly why
    // it subtracts `rig.drawnYaw` -- the yaw THAT frame was drawn at -- rather than this one.
    rig.root.position.copy(player.pos);
    rig.root.rotation.y = player.faceH + rig.faceOff + RIG.spin + aimComp(dt);
    rig.drawnYaw = rig.root.rotation.y;
  }
  stepCam(dt);
  // AFTER the camera, because the reticle is PROJECTED through it -- drawn from last frame's
  // matrix it would trail the shot by a frame every time the lens moved, which is exactly the
  // thing a mark on a target must not do.
  stepBolts(dt);
  paintRetic();
  sun.position.set(player.pos.x + 7, player.pos.y + 14, player.pos.z + 6);
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();

  renderer.render(scene, camera);

  frames++; fpsT += dt;
  if (fpsT > .5) {
    fps = frames / fpsT; frames = 0; fpsT = 0;
    const p = player;
    // A SWING THAT CONNECTED SAYS SO. "It hit him before the swing" and "it never reached him"
    // are opposite bugs and identical from a phone, and the sweep can now produce either.
    const st = p.roll ? 'roll' : p.melee ? 'melee' + (p.meleeIx + 1) + (p.melFired ? '!' : '')
      // THE SOLVED ARC, ON SCREEN. How far it leapt and how high is the whole of what he is
      // judging -- "it jumps through them" and "it falls short" are one word apart otherwise.
      : p.chargeGo ? 'swing' + (p.goGap || 0).toFixed(1) + '/' + (p.goHi || 0).toFixed(1) + (p.melFired ? '!' : '')
      : p.charge ? 'charge' + (p.chargeT / MELEE.charge).toFixed(1) : !p.grounded ? 'air'
      : p.land ? (p.landHard ? 'land!' : 'land') : p.aim ? 'chg' + p.chg.toFixed(2) : gunOut() ? 'armed' : 'ground';
    // B IS THE POSE'S OWN OFFSET AND C IS WHAT IS BEING TAKEN OFF IT, because "the gun points
    // the wrong way" is two different bugs from a phone: a bias near 0 means the clip is
    // straight and anything crooked is elsewhere, a big one means the clip carries it.
    const dg = r => (r * 180 / Math.PI).toFixed(0);
    const lk = (p.lock ? ' · LOCK' : '') +
      (gunOut() && committed() ? ' · B' + (p.bias == null ? '--' : dg(p.bias)) + '/C' + dg(p.comp || 0) : '');
    const hue = RIG.showHue
      ? ' · H' + (ALIENU.hue.value * 360).toFixed(0) + '/' + (GUNU.hue.value * 360).toFixed(0) : '';
    // **HOW MANY BOXES THE BUILDINGS PUT IN THE COLLIDER.** Three builds were spent on *"I walk
    // through this building"* with nothing on screen able to tell a builder that threw from a
    // rasteriser that produced boxes nobody can reach -- and there is no console on a phone.
    // `BX0` is the fault, any number at all is not. `gun<n>CM`'s rule, one system over.
    const bx = BUILDINGS.length
      ? ' · BX' + BUILDINGS.reduce((a, b) => a + (b.cols ? b.cols.length : 1), 0) : '';
    buildI.textContent = fps.toFixed(0) + ' FPS · ' + renderer.info.render.calls + ' DC · ' +
      p.speed.toFixed(1) + ' m/s · ' + st + lk + hue + bx +
      ' · HP' + p.hp.toFixed(0) + (FOE.up ? '/' + FOE.up + ' FOE' : '') +
      (MISSING.length ? ' · ' + MISSING.join(' · ') : '');
  }
}

// ============================================================================================
// BOOT
// ============================================================================================
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

async function init() {
  // ---- the character. There is no game without him, so a failure here is reported on the
  //      card rather than warned to a console that does not exist on a phone.
  let g;
  try { g = await loadGLB(RIG.file, 'loading the alien'); }
  catch (e) {
    setBoot('could not load the character', 1);
    if (window.__crash) window.__crash('CHARACTER FAILED TO LOAD\n' + RIG.file + '\n' + ((e && e.message) || e));
    return;
  }

  const root = new THREE.Group();
  root.name = 'rig';
  const model = g.scene;
  root.add(model);
  scene.add(root);
  rig.root = root; rig.model = model;

  // SCALE IS MEASURED, NEVER TYPED, so a re-export at any size lands right with no edit.
  const authored = measureHeight(model);
  rig.scale = authored > .01 ? RIG.height / authored : 1;
  model.scale.setScalar(rig.scale);
  console.log('[melee] authored height ' + authored.toFixed(4) + ' m -> x' + rig.scale.toFixed(3) +
              ' for RIG.height ' + RIG.height);
  if (authored <= .01) note('RIG HEIGHT UNMEASURABLE');

  // HIS OWN MAP, FED BACK AS EMISSION. `emissiveMap` is the base texture and `emissive` is
  // white, so what comes back is his own colours at `RIG.emissive` of their value -- which
  // lifts his shadow side without washing him toward grey the way raising ambient alone does.
  // It lands AFTER the lighting, so it brightens him without making him shiny.
  const lit = new Set();
  rig.mats = {};
  model.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) {
      if (!m.isMeshStandardMaterial || lit.has(m)) continue;
      lit.add(m); rig.mats[m.name || ('m' + lit.size)] = m;
      if (m.map) { m.emissiveMap = m.map; m.emissive = new THREE.Color(0xffffff); }
      m.emissiveIntensity = RIG.emissive;
      // and the accent band, on the hue his own texture is mostly made of
      const h = measureHue(m.map, 'alien');
      if (h) { ALIENU.hue.value = h.hue; ALIENU.rgb.value.setHSL(h.hue, 1, .6); RIG.hue = h.hue; }
      ALIENU.k.value = RIG.hueGlow;
      hueGlow(m, ALIENU, 'alien');
    }
    if (o.isBone) {
      rig.bones[o.name] = o;
      if (/^weapon_root/.test(o.name)) rig.mounts[o.name] = o;
    }
  });
  model.updateMatrixWorld(true);
  // measured on the BIND pose, before any clip has been played
  rig.faceOff = -measureFacing(rig.bones);

  // ---- the clips ----
  const clips = deriveClips(normaliseClips(g.animations || []));
  rig.mixer = new THREE.AnimationMixer(model);
  for (const c of clips) {
    rig.clips[c.name] = c;
    const a = rig.mixer.clipAction(c);
    if (ONCE.has(c.name)) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
    a.enabled = true; a.setEffectiveWeight(0); a.play();
    rig.actions[c.name] = a;
  }
  console.log('[melee] ' + clips.length + ' clips: ' + clips.map(c => c.name + ' ' + c.duration.toFixed(2) + 's').join(', '));
  // THE TABLE IS CHECKED AGAINST THE FILE. A table naming a clip that is not there leaves a
  // bone at zero total weight, and the mixer blends a zero-weight bone back to its BIND value
  // -- which is the T-pose exactly, and looks like a rendering fault rather than a missing clip.
  const want = [];
  for (const k in CLIPS) { const v = CLIPS[k]; Array.isArray(v) ? want.push(...v) : want.push(v); }
  for (const k of SPLIT.up) want.push(CLIPS[k] + UP);
  for (const k of SPLIT.legs) want.push(CLIPS[k] + LEGS);
  const gone = want.filter(n => !rig.actions[n]);
  if (gone.length) note('NO CLIP ' + gone.join(','));

  // ---- the weapons. They are not on the critical path: a missing one costs that weapon and
  //      nothing else, which is why they are each in their own try.
  for (const s of WEAP.slots) {
    if (!s.file) continue;
    try {
      const w = await loadGLB(s.file, 'loading the ' + s.key);
      WEAP.worn[s.key] = mountWeapon(s, w);
    } catch (e) { PROG.done++; note('NO ' + s.key.toUpperCase() + ' GLB'); }
  }
  // SOMETHING TO HIT. Not on the critical path: no dummy is a world with nothing in it, which
  // is still a game you can look at.
  // **"THE FILE IS MISSING" AND "THE BUILDER THREW" ARE DIFFERENT BUGS AND THEY WORE ONE LABEL
  // (m32).** The chip said `NO BUILDING GLB` while the GLB had loaded perfectly and
  // `buildBuildings` had thrown a ReferenceError halfway through -- so the message pointed at
  // the network and the fault was in this file. `side()` splits them and PRINTS THE EXCEPTION,
  // because a `catch` that swallows `e` throws away the only thing that would have said which.
  const side = (fn, label, tag) => loadGLB(fn, label).then(
    g => { try { tag.build(g); } catch (e) { console.error('[melee] ' + tag.name + ' build failed', e); note(tag.name + ' FAILED'); } },
    e => { PROG.done++; console.warn('[melee] ' + tag.name + ' did not load', e); note('NO ' + tag.name + ' GLB'); });
  await side(DUMMY.file, 'loading a body to hit', { name: 'DUMMY', build: buildDummies });
  await side(BLD.file, 'loading a building', { name: 'BUILDING', build: buildBuildings });
  await side(SHE.file, 'loading the alien girl', { name: 'SHE', build: buildShe });
  // THE MACE FIRST, because the warrior mounts it as he is built -- and it is only a weapon he
  // is missing if it does not arrive, not a warrior.
  await side(FOE.weapon, 'loading the mace', { name: 'MACE', build: buildMace });
  await side(FOE.file, 'loading the warrior', { name: 'WARRIOR', build: buildFoes });

  paintKit();

  player.pos.y = groundAt(player.pos.x, player.pos.z, 0, MOVE.step);
  rig.ready = true;
  setBoot('go', 1);
  setTimeout(() => bootCard.classList.add('gone'), 260);
}

// the console handle. Every tuning object is live, so a number can be moved on the phone
// without a rebuild and without a push.
window.melee = window.mel = { RIG, MOVE, GAIT, CAM, FLICK, MELEE, WEAP, CLIPS, rig, player, cam, stick, BOXES,
  // THE STEPS ARE EXPOSED SO A HARNESS CAN DRIVE THE SHIPPED ONES. A harness with its own copy
  // of a rule measures a game that does not exist -- which is the oldest mistake there is, and
  // the only way not to make it is for `npm run sim` to call exactly these.
  DUMMY, DUMMIES, LOCK, STRIKE, dummyHit, dummyBlow, strikeSweep, stepDummies, findLock, SFX, CHARGE, POSE, snd,
  stepPlayer, rigAnim, stepKit, stepCam, integrate, stickWorld, flickH, rollGo, meleeGo, chargeRelease, groundAt,
  resolveBoxes, camFree, aimPoint, aimRaw, aimTarget, AIM, fireBolt, BOLTS, gunOut,
  BLD, BUILDINGS, solidColumns, pushBodies, CHAIN, SHE,
  // THE WARRIOR, LIVE. `mel.FOE.notice = 0` parks them all; `mel.hurt(20)` fakes a blow so the
  // flash and the bar can be looked at without standing in front of a mace.
  FOE, HEALTH, foeAI, playerHurt, buildFoes,
  hurt: d => playerHurt(d || 12, player.faceH + Math.PI, FOE.push, FOE.pushUp, FOE.stun),
  heal: () => { player.hp = HEALTH.max; return 'full'; },
  // HER, LIVE. `mel.she.spin = 2` turns her on the spot, which is the best look at what the
  // chains are doing; `mel.she.go = 0` parks her; `mel.CHAIN.on = 0` freezes the solver so the
  // authored rest pose can be compared against it.
  get she() { return she; },
  // HOW BIG A BUILDING SHOULD BE IS A LOOK-AT-IT DECISION, so it moves on the phone rather than
  // in a commit. It re-scales what is already in the scene AND rewrites the collider boxes, or
  // the picture and the thing you walk into would stop agreeing.
  bld: h => {
    if (h) BLD.height = h;
    const H = BLD.height, up = new THREE.Vector3(0, 1, 0), c = new THREE.Vector3();
    for (const b of BUILDINGS) {
      const k = b.unit * H, ww = (b.q % 2) ? b.d * H : b.w * H, dd = (b.q % 2) ? b.w * H : b.d * H;
      c.copy(b.mid).multiplyScalar(H).applyAxisAngle(up, b.o.rotation.y);
      b.o.scale.setScalar(k);
      b.o.position.set(b.x - c.x, -b.loY * k, b.z - c.z);
      // AND THE COLLIDER MOVES WITH IT. A picture and the thing you walk into that are re-sized
      // separately is a building you can stand inside, which is the worst kind of bug: nothing
      // on screen disagrees with anything.
      b.bx.minx = b.x - ww / 2; b.bx.maxx = b.x + ww / 2;
      b.bx.minz = b.z - dd / 2; b.bx.maxz = b.z + dd / 2; b.bx.maxy = H;
      bldCols(b);
    }
    return 'BLD.height = ' + H.toFixed(1) + ' m, footprint ' +
           (BUILDINGS[0] ? (BUILDINGS[0].w * H).toFixed(1) + ' x ' + (BUILDINGS[0].d * H).toFixed(1) : '-') +
           ', ' + BOXES.length + ' collider boxes';
  },
  kit: () => cycleKit(),
  clips: () => Object.keys(rig.clips).map(n => n + ' ' + rig.clips[n].duration.toFixed(3) + 's').join('\n'),
  where: () => `${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(2)}, ${player.pos.z.toFixed(1)}`,
  // WHAT THE HUE MEASUREMENT FOUND, and the two dials over it. `mel.glow(alien, gun)` is the
  // live A/B -- how much a colour should glow is a look-at-it decision and those belong on the
  // phone rather than in a commit.
  hues: () => ({
    alien: { deg: +(ALIENU.hue.value * 360).toFixed(0), hex: '#' + ALIENU.rgb.value.getHexString(), k: ALIENU.k.value },
    gun: { deg: +(GUNU.hue.value * 360).toFixed(0), hex: '#' + GUNU.rgb.value.getHexString(), peak: WEAP.glow },
  }),
  glow: (a, g) => {
    if (a != null) { RIG.hueGlow = a; ALIENU.k.value = a; }
    if (g != null) WEAP.glow = g;
    return { alien: RIG.hueGlow, gun: WEAP.glow };
  },
  hue: (a, g) => {
    if (a != null) { RIG.hue = a; ALIENU.hue.value = a; ALIENU.rgb.value.setHSL(a, 1, .6); }
    if (g != null) { WEAP.hue = g; GUNU.hue.value = g; GUNU.rgb.value.setHSL(g, 1, .6); }
    return { alien: RIG.hue, gun: WEAP.hue };
  },
  // HOW A MARK SHOULD LOOK IS A LOOK-AT-IT DECISION. `mel.retic({size, w, hue, lock})` --
  // size in px, `w` the stroke multiplier, both hues in degrees. Anything omitted is left alone.
  retic: o => {
    const el = document.getElementById('retic'); if (!el) return null;
    if (o) {
      if (o.size != null) el.style.setProperty('--size', o.size + 'px');
      if (o.w != null) el.style.setProperty('--w', o.w);
      if (o.hue != null) el.style.setProperty('--h', o.hue);
      if (o.lock != null) el.style.setProperty('--lh', o.lock);
    }
    const c = getComputedStyle(el);
    return { size: c.getPropertyValue('--size').trim(), w: c.getPropertyValue('--w').trim(),
             hue: c.getPropertyValue('--h').trim(), lock: c.getPropertyValue('--lh').trim() };
  },
  // the charge whine is a synth, so every part of it is a live number: `f0`/`f1` the note it
  // climbs through, `det` the detune in CENTS (this is the one that decides whether it reads as
  // electrical or as a tune), `lp0`/`lp1` how far the filter opens, `g` the level.
  chg: o => { if (o) Object.assign(CHARGE, o); return { f0: CHARGE.f0, f1: CHARGE.f1, det: CHARGE.det, lp0: CHARGE.lp0, lp1: CHARGE.lp1, q: CHARGE.q, g: CHARGE.g }; },
  mute: v => { SFX.on = v == null ? (SFX.on ? 0 : 1) : (v ? 1 : 0); return SFX.on; },
  emis: v => { for (const m of Object.values(rig.mats || {})) m.emissiveIntensity = v; RIG.emissive = v; return v; },
};

frame();
init();
</script>
