// ============================================================================================
// A BLOW IS THE LIMB ARRIVING, NOT A RANGE CHECK
//
// *"The cops are getting hit before the swing even happens. It's just sort of: are you within
// range? did you melee? yes, OK, cop has been hit. It's not really actually having a velocity
// collider effect."* Exactly what it was, in two places:
//   1. `dummyHit` tested a CIRCLE about the player's centre and used `dirH` only to decide
//      which way to throw him -- so there was no direction test at all and a man standing
//      BEHIND him was hit by a punch thrown forwards.
//   2. and once the melee assist had a target, the contact fired the moment he was within
//      reach, which on a nine-metre lunge is well before the arm has started moving.
//
// **SO THE FIST, THE BOOT AND THE HAMMER HEAD ARE SWEPT.** Each frame of a strike their world
// positions are read off the rig and the segment from last frame to this one is tested against
// the body as a vertical cylinder. It needs nothing typed per clip and nothing to say which
// strike is a punch and which is a kick: whichever limb actually reaches him is the one that
// lands, which is the whole of what he is asking for.
//
// **AND THE SPEED IS MEASURED IN HIS OWN FRAME.** A fist carried along by a nine-metre lunge
// is not a punch -- without subtracting the root's own travel, every strike connects with
// everything it runs past and we are straight back to a range check wearing a sweep's clothes.
const STRIKE = {
  // both hands, both feet. The weapon's own far end is added when one is out.
  bones: ['mixamorig_RightHand', 'mixamorig_LeftHand', 'mixamorig_RightFoot', 'mixamorig_LeftFoot'],
  r: .26 * SZ,       // the fist/boot, as a sphere swept along its own path -- HIS fist, so it
                     // scales with him
  from: .55,         // the window opens at this fraction of the clip's authored contact frame
  // **AND A DASH OPENS AT ONCE (m45, `MELEE.dashFrom`).** `from` is right for a STANDING swing,
  // where the arm has to get moving before it can hit anything -- and it is exactly wrong for a
  // dash, where the blow IS the body arriving at speed. `finishAt` .38 x `from` .55 puts the
  // window at u 0.21, which on a .30 s dash is 0.063 s, and by then he has travelled about four
  // metres: **a man three metres ahead was passed through before the window ever opened, and
  // took nothing at all.** Measured through the real pad -- 3 m `fired 0, he is idle`, 6 m and
  // 12 m both clean knock-downs. That is half of *"they don't really go flying"*: the ones close
  // enough to matter were never hit.
  // **AND IT GOES BACK TO `from` AT m51.** `dashFrom` 0 was the right fix for the wrong
  // shape: the dash used to plough straight past anybody close, so opening the window at once
  // was the only way to catch them -- and catching them ON THE WAY THROUGH is exactly what he
  // then described as *"they go flying before he's even swung his hammer."* With `dashLand`
  // the travel is spent before the contact frame, so the ordinary wind-up is correct again and
  // the blow is the hammer arriving rather than the body passing. `mel.STRIKE.dashFrom = 0`
  // is the A/B back.
  dashFrom: .55,
  to: 1.0,           // and runs to the end of the strike
  swing: 2.4,        // m/s IN HIS OWN FRAME. Under this a limb is being carried, not swung.

  // **A TACKLE AND A FLYING KICK ARE NOT SWINGS, AND `swing` IS WHY THEY BARELY CONNECTED
  // (m93).** *"It's also not hitting them very well. I've managed to hit them a little bit but
  // most of the time I just slide a short distance to them and it doesn't even hurt them.
  // Maybe we need to put bigger collide on his hands or feet."*
  // `swing` asks **is the limb moving through HIS OWN FRAME** -- the root's travel is taken
  // back out, which is exactly right for a punch and is the whole test for whether an arm is
  // being swung or merely carried. `slide_kick` extends the leg ONCE and then holds it out
  // while the body slides, so for nearly all of the move the boot's own-frame speed is near
  // zero and **the sweep never counted at all.** Same for `flying_kick`, which is a held pose
  // thrown across the air.
  // **SO THE QUESTION BRANCHES RATHER THAN THE THRESHOLD MOVING.** For these two the blow IS
  // the body arriving -- m45's own sentence about the dash, one move over -- so the gate reads
  // the ROOT's speed instead. At a tackle's 9 m/s it is plainly open, and it shuts by itself as
  // the bleed runs out, which is the slide ending.
  bodyAt: 2.2,       // m/s of ROOT travel under which a body move is not arriving at anybody
  // AND THE CONTACT IS HIS WHOLE EXTENDED LEG, NOT HIS FIST. `r` is a knuckle (18.6 cm on a
  // 1.25 m body); a man sliding legs-first presents far more than that, which is the "bigger
  // collide" he asked for -- and because the sweep is a SPHERE of this radius, widening it
  // widens the HEIGHT margin by the same number, which is what lets a kick thrown from above
  // reach a man's head. Same constant, both axes, by construction.
  bodyR: .62 * SZ,
  // and the window is a fraction of the STATE rather than of the authored contact frame,
  // because a body move HAS no single contact frame -- the contact is the travel.
  bodyFrom: .08,
};

//

  // charged bolt hits as hard as anything in the game. **`pow0` IS SOLVED, NOT PICKED**: the
  // crossing has to land at half a charge, so `pow0 + .5(1 - pow0) = hard` gives .24.
  //     chg .25  power .43  stagger        chg .75  power .81  carried, 4.0 m/s
  //     chg .50  power .62  a shove, 2.6   chg 1.0  power 1.00 flying,  8.5
  pow0: .24, pow1: 1.0,
  // IT SHOVES HIM. A shot that moves nothing is a sound and a sprite; a shot that puts him on
  // his back foot for a tenth of a second is a shot. Scaled by the charge, and deliberately
  // brief -- the ground drag has a 0.07 s half-life, so this is a shunt rather than a slide.
  kick: 1.0, kickChg: 1.9,
  glow: 2.6,         // how hard the gun's accent lifts at a full charge
  // MEASURED off the blaster's own map at load and overwritten there; these are only what it
  // starts at, and a cyan default is the honest guess for a sci-fi gun if the read ever fails.
  hue: .52, hueW: .09,
};

// SOMETHING TO HIT. He stands in his idle, takes the blows, goes over, lies there and gets back
// up -- which is the whole loop the gun and the melee need in order to mean anything.
// HE IS THE POLICE OFFICER FROM THE CITY REPO, and he is the right body for this because his
// export already carries the hard part: four hit reactions, two knock-downs and two get-ups.
// Nothing here had to be authored.
// ============================================================================================
// BUILDINGS
//
// `alien_base_01.glb` is Tripo output and it is the GOOD shape for this: **one mesh, one
// material, one texture -- 8,439 triangles in a SINGLE draw call.** Triangles are the last
// thing that costs anything on a phone; draw calls are the first, so a generated shell whose
// detail lives in its albedo is cheap in exactly the way a building assembled from forty
// primitives is not.
//
// **THE SCALE IS MEASURED, NEVER TYPED.** It is authored on a unit cube (1.000 x 0.764 x 0.993),
// which is a normalisation and not a size -- so `height` is the only number here that means
// anything, and a re-export at any scale lands right with no edit. The skateboard's rule, one
// asset class along.
//
// **AND IT IS SINGLE-SIDED.** Tripo writes `doubleSided: true` on everything; on a closed shell
// that is pure wasted fill on the one part of a mobile GPU that is actually scarce, and it
// turns off backface culling for no benefit at all.
//
// The footprint goes into `BOXES` -- ONE description of the world, so the collider, the floor
// test and the camera boom all agree about it without being told separately. Placements are
// yawed in QUARTER TURNS only, because `resolveBoxes` here is axis-aligned: a box carrying an
// arbitrary yaw would have to be tested in its own frame, and the AABB of a rotated one is
// forty per cent too big along both axes, which is the phantom hit.
// ============================================================================================
// TWO WORLDS (m124, `WORLD`, `WP`)
//
// *"There's a folder called Portland. It's a slice of a map I've been creating in Blender...
// let's make a separate mode you can choose like the main mode. This will just be a new test
// mode you can jack into. We want to set up the environment first and get all that right. But
// basically, you can just have my character in there and make him able to walk around."*
//
// **THE CHOICE IS MADE AT BOOT AND REMEMBERED, BECAUSE SWITCHING COSTS A RELOAD ANYWAY.** The
// test site is built at MODULE SCOPE and Weirdport is ten megabytes of GLB, so building both
// every boot would put the whole city on the wire for a mode he may not be in. One key in the
// store, a `?w=` in the URL that writes it, and the tap reloads.
// **AND IT IS A KEY THAT SAYS WHICH WORLD IT IS**, top-left with the build chip and out of the
// play area -- `actB`'s rule, that a prompt drawn ON the control performing it cannot be a mode
// you are in without knowing it. `?w=test` is the way back if a world ever fails to boot, which
// is a link that can be sent rather than a gesture that has to be explained.
const WORLD = {
  now: 'test',
  store: 'mel.world',
  list: { test: 'TEST SITE', weirdport: 'WEIRDPORT' },
};
{
  // **THE STORE IS READ INSIDE A TRY, AT MODULE SCOPE.** A throw up here is `init()` never
  // running and a boot card stuck on the text it was born with, which is the one failure he
  // cannot look at and correct.
  let want = null;
  try { want = new URLSearchParams(location.search).get('w'); } catch (e) {}
  try { if (!want) want = localStorage.getItem(WORLD.store); } catch (e) {}
  if (want && WORLD.list[want]) WORLD.now = want;
  try { localStorage.setItem(WORLD.store, WORLD.now); } catch (e) {}
}
const inWP = () => WORLD.now === 'weirdport';

    Window_Frame_Cream: 0xe8dfc8, Window_Frame_Bronze: 0x6e5738, Storefront_Teal: 0x2f7d7a,

  // of every building. Decoded out of the draco geometry rather than argued:
  //     COLOR_0   1.000, 1.000, 1.000 on **100% of 43,310 vertices** -- ONE distinct value
  //     COLOR_1   33 distinct colours: periwinkle .447/.447/.890 (11.4%), brick .478/.216/.133
  //               (7.2%), dark red (4.2%), near-black (3.3%), mint, teal ... the CITY
  // **AND THE OTHER TWELVE CITY_TRIM GEOMETRIES ARE CORRECTLY FLAT**, which is what says this
  // is one export fault and not a guess: of the 13, **0 have a varying COLOR_0** and exactly

  // geometry at a time, with nothing here to remove and no name to keep in step.

  // LINEAR and his reference shader multiplies it raw, which is what ships; but .447 is 114/255

  crowd: { FOE: 5, HICK: 5, HOBO: 5, SKATER: 4, BIKER: 3, DUMMY: 3 },

  cols: { tag: 'WEIRDPORT', cols: 1, cell: 1.0, maxCells: 4096, tol: .45, full: .92,

          skew: 1.05 },

  hh: 1.7,       // and his height, so the test is head clearance and not only his feet

  gap: 9,        // how near two of them may be placed

  pool: 420,     // candidates kept before the spread picks from them

  legs: 900,     // the ceiling on `wpWalk` calls across her whole circuit search -- see `wpLoop`

const BLD = {
  tag: 'BUILDING',      // what the chip calls it when something about it goes wrong
  file: 'models/buildings/alien_base_01.glb',
  height: 16,           // metres to the roof -- the ONE number. `mel.bld(h)` re-sizes live.
  at: [
    // x, z, quarter turns
    [ 10, 26, 0],
  ],
  // **A BOUNDING BOX IS NOT A BUILDING.** *"I'm just running into invisible walls."* Right: a
  // single AABB is solid everywhere the shape is not -- a doorway, a setback, a tapered wall,
  // the air over a canopy. So the collider is RASTERISED out of the mesh's own triangles into
  // columns: the footprint is gridded, each cell learns the lowest and highest triangle over
  // it, and runs of agreeing cells merge into boxes. Where there is no geometry there is no
  // box, which is the whole fix.

  cell: 1.0,          // metres. Smaller is truer and costs boxes; every box is scanned linearly.

};

// and the scale is measured off the geometry, so 32 m gives x32.03 and a 19.5 x 19.5 m plan --
// slightly NARROWER than the building's 20.9 at half the height, which is what makes it read as
// a tower rather than as a bigger block. `mel.tower(48)` is the triple he floated.
// **AND ITS NODE IS NOT AT IDENTITY, WHICH IS THE FIRST EXPORT HERE THAT IS NOT.** The mesh node
// carries a 90-degree rotation about +X (its art is authored Z-up), so its LOCAL span is
// 0.609 x 0.610 x 0.999 and its WORLD span is 0.609 x **0.999** x 0.610. `buildBuildings`
// already unions `geometry.boundingBox.applyMatrix4(o.matrixWorld)` rather than trusting the
// raw accessor bounds -- **that habit was written down as insurance and this is the file that
// collects on it.** Read the accessor min/max alone and the tower comes out 32 m WIDE and 19.5

  tag: 'TOWER',
  file: 'models/towers/alien_tower_01.glb',

  at: [

  cols: 1,

  maxCells: 8192,
  tol: .45,
  full: .92,

  y: { road: .012, walk: .024, plot: .036, line: .048 },
  col: { road: 0x39414d, walk: 0xbcc5d2, plot: 0xa9b8a6, line: 0xeef1f6 },

// ============================================================================================
// SECONDARY MOTION -- a tail and six tentacles, simulated
//
// **135 DYNAMIC JOINTS AND IT COSTS NOTHING.** A Verlet particle is about twenty flops; at
// `iters` constraint passes that is a few thousand a frame against a mixer that already
// interpolates 193 bones and skins 11,000 vertices. The dynamics are a rounding error on the
// thing that was already happening.
//
// **THE CHAINS ARE FOUND, NOT NAMED.** A chain is an unbranched run of bones that no clip
// meaningfully moves -- measured across every clip in the file. On her that separates cleanly:
// the body reads 8.5 to 86 degrees and every hair and tail bone reads **0.03**, because the
// export keys them at their rest value and nothing else. `minBones` 6 is what excludes the one
// false positive, a three-bone thumb that happens to be inert in these three clips.
//     Hair     x6 off mixamorig_Head   16 / 23 / 19 / 16 / 23 / 19 bones
//     Tail     x1 off mixamorig_Hips   19 bones
// A name test would have worked here and would break on the next export that spells it
// differently; "no clip moves it" is a property of what the thing IS.
//
// **AND THEIR TRACKS ARE STRIPPED.** They are keyed at rest, so the mixer would write the rest
// pose onto every one of them every frame and fight the sim for the same bones -- two writers,
// which this file has paid for twice. Stripping also takes ~70% of her channels out of the
// mixer, since 405 of her 579 are hair and tail holding still.
//
// **THE REACTION TO HER MOTION IS FREE.** The first particle is PINNED to where the skeleton
// puts it; everything downstream lags behind it because that is what a spring does. There is no
// "react to movement" term anywhere in here -- the lag IS the effect.
const CHAIN = {
  on: 1,
  minBones: 6,       // under this it is a finger, not a tentacle
  inert: .018,       // radians (~1 deg) of clip movement, under which a bone is not animated
  // A FIXED SUBSTEP. Verlet with a variable dt is unstable, and without this a 120 Hz phone
  // gets different hair from a 30 Hz one -- the same argument as `exp(-k*dt)` one system over.
  hz: 90, maxSub: 3,
  iters: 3,          // constraint passes. 1 is rubbery, 3 is plenty, more is wasted.
  // **A DISTANCE CONSTRAINT IS AN INFINITELY STIFF SPRING, AND CRITICAL DAMPING CANNOT COVER
  // IT.** `damping` is derived against the pull-to-pose rate; the constraint pass is a
  // PROJECTION with no rate at all, and in Verlet every metre it moves a particle becomes a
  // metre per step of velocity on the next one. That is the ringing left after m32 -- the
  // spring stopped overshooting and the constraints went on feeding it. `snap` is how much of
  // a correction is allowed to become velocity: 1 is the old behaviour, 0 projects the
  // position and adds no energy at all. It is not damping (it costs nothing when nothing is
  // stretched) -- it is refusing to bank the correction as speed.
  snap: .30,
  // AND A HARD CEILING ON SPEED, **MEASURED RELATIVE TO THE PIN**. *"Goes wild when she drops
  // down the curb"*: a drop moves her head further in one substep than a hair segment is long,
  // and a Verlet particle that travels more than a rest length per step is the standard way
  // this solver comes apart -- the constraint that pulls it back overshoots, which is a bigger
  // correction, which is more velocity. Relative to the pin is the load-bearing half: an
  // absolute cap would clamp every strand the moment she RUNS, which is exactly the motion the
  // chains exist to show. m/s through her own frame.
  maxV: 3.2,
  // PER KIND, matched on the chain root's name. Hair is light and whippy; a tail is heavy.
  // **EVERY RATE HERE IS PER SECOND, AND THE FIRST VERSION APPLIED THEM PER SUBSTEP.** That is
  // the whole of *"barely moving, some glitchy static behaviour"*: at `drag` .06 a substep and
  // 90 substeps a second, the velocity retained 0.94^90 = **0.4% per second** -- dead inside a
  // tenth of a second -- and `stiff` .16 a substep glued every particle to the pose in about
  // 45 ms. Small motions were erased entirely and only a big impulse could show at all, which
  // is exactly why *"when she got up on the cube it jiggled really nicely"* and nothing else
  // did. Converted with `exp(-k*h)` per substep, which is this file's own rule about never
  // scrubbing a value with a bare per-frame factor -- it just had never been applied here.
  // **AND THE DAMPING IS DERIVED FROM THE STIFFNESS, NOT TYPED BESIDE IT.** *"Can we add
  // damping -- I had a good amount of it and it was making it nice and smooth and creamy."*
  // What creamy IS, is CRITICAL damping: a spring of rate k stops ringing at exactly
  // `c = 2*sqrt(k)`, and anything under that overshoots and wobbles, which is the wiggle.
  // Typing the two separately means they drift apart the moment either is tuned, so `damping`
  // is a RATIO -- 1.0 is critical, over is creamy, under is springy -- and the drag falls out
  // of whatever stiffness the particle actually has. The tip is softer than the root, so its
  // damping is softer too, by construction and without a second number.
  // **AND `damping` IS A RATIO AGAINST THE FREQUENCY THE SPRING REALLY HAS.** m30 derived it
  // as `2*sqrt(stiff)`, which treats a per-second relaxation rate as though it were a spring
  // constant in 1/s^2. It is not: in Verlet a positional pull of fraction `a` per substep is
  // an acceleration of `a/h^2`, so the natural frequency is `sqrt(a)/h`. Measured at 90 Hz:
  //     hair root  omega 20.9 rad/s (3.3 Hz)   applied c 5.14   ->  zeta 0.12
  //     tail root  omega 18.8     (3.0 Hz)     applied c 5.20   ->  zeta 0.14
  // **Twelve per cent of critical**, everywhere -- a spring that rings for eight cycles, which
  // is *"everything is kind of wiggling around a lot"* told exactly. 1.0 here is now genuinely
  // critical, over is creamy, under is springy.
  kinds: [
    //              gravity  stiff/s  tip/s  damping  cone
    { test: /^Hair/i, g: -7.5, stiff: 5.0, tipStiff: 1.2, damping: 1.05, cone: .70 },
    { test: /^Tail/i, g: -9.5, stiff: 4.0, tipStiff: 1.0, damping: 1.15, cone: .78 },
  ],
  def: { g: -8, stiff: 4.5, tipStiff: 1.0, damping: 1.1, cone: .75 },
  // WHAT THE CHAINS BUMP INTO. Without these the hair goes through her shoulders, which is the
  // one thing that makes this read as broken rather than as hair. A fraction of her height, so
  // a re-export at any size still fits.
  hulls: [
    { bone: /Head$/,   r: .115, up: .04 },
    { bone: /Spine2$/, r: .130, up: .02 },
    { bone: /Hips$/,   r: .115, up: .00 },
  ],
};

  // which is back under the threshold of being an effect, and is the whole of what m71 was
  // about. **A duplicate key in an object literal is silent in every gate there is**; what
  // found it is `npm run sim`, which could not reach the row until today (see below).
  hitKnock: 1,       // **and his mace puts you on the floor** -- a field on the KIND, so a

// ---- RIDING THE BACKPACK (m104, `PACK`, `packGo`, `stepPack`) -------------------------------
// *"I want to push a button and he's gonna run and jump onto my backpack and just sit on it."*
//

// leash's own catch-up with the ring's centre moved from "beside you" to "you"; the leap is
// `bodyFly`, the integrator every hop and every knock-down already uses; and the pose is one
// clip name. What is new is where he SITS and the state that holds him there.
//
// **HE RIDES A BONE, NOT A POINT BESIDE THE PLAYER.** `rig.bones` is already a name map (the aim
// pose reads Spine1/Spine2 out of it), so hanging him off the spine means he takes the walk's
// bob, the turn and every crouch for free -- where an offset from `player.pos` would be a small
// man sliding along in the air behind a body that is moving under him. Found by PATTERN, the
// jetpack's rule one repo over, so an export that spells the spine differently still lands.
// **AND HE IS WRITTEN, NEVER PARENTED.** The armature is scaled 0.01 and a child of it comes out
// at a hundredth of its size -- m26's weapon lesson, and this needs no parent anyway because it
// is a position and a facing.
//
// **THE THROW IS DELIBERATELY NOT HERE.** *"And then I'll be able to like throw him -- but for
// now one of them is gonna be roaming and one that's like a backpack."* m99 deleted the whole
// carry because *"the hybrid animations look like trash, the hips rotation has been stripped,
// he's leaning forward and the throw mechanics are bad -- we need to rebuild all that"*, and
// none of that has been redrawn. `hold_item` and `throw_item` are still in the player's export
// and still cost nothing unnamed (m35's rule), so the throw is a build on top of this one.
const PACK = {
  on: 1,
  near: 1.25,       // how close he gets before he leaps -- a bit over his own radius plus yours
  leap: .30,        // and how long the leap takes. `bodyFly` does the arc; this is the clock
  // WHERE HIS HIPS GO, relative to the spine bone, as fractions of `RIG.height` -- so a change
  // to how big the PLAYER is moves the seat with him (m52's rule) and `P.hipY` handles how big
  // the RIDER is. **`up` IS SMALL AND NEGATIVE ON PURPOSE (m120)**: zap's `Spine2` is already
  // at 59% of his height, so a rider's hips belong a touch UNDER it -- which puts Clancy's own
  // head at 0.88 m against zap's at 0.91, a creature on his back rather than one over it.
  seat: { up: -.034, back: .21 },
  // COMING OFF (m116). `offApex` is how far he rises ABOVE the seat before he falls, and
  // `offGap` is how far from you he lands; the flight time is solved between them.
  offApex: .30, offGap: 1.25,
  // **THE EXPORT DECIDES WHERE HE SITS, THE MOMENT IT SAYS SO (m105).** *"I'm wondering if it
  // would be helpful for me to put in a root or a joint where Clancy should go, because he just
  // sort of looks like he's standing floating slightly above the backpack."* It is, and it is
  // the weapon mounts' own rule: name a joint on the player's rig and the seat IS that joint --
  // no offsets, nothing typed here, and a re-export that moves it moves him. `mark` is tried
  // first and `bone` is the fallback, so this needs no code change on the day it lands.
  // **It has to be IN THE SKIN to arrive as a Bone** -- `buildRig` collects `o.isBone`, which is
  // what GLTFLoader makes of a node listed in a skin's joints. That is how `weapon_root` gets
  // here, so exporting it the same way he exported those is the whole of it.
  mark: /pack_?root|pack_?seat|seat|backpack|clancy/i,
  bone: /Spine2$|Spine1$|Spine$/,

  // custom animation for him."* `stand_to_cover` is a STAND-IN and it is the reason he reads as
  // standing: it is a man taking cover, not a man holding on. Drawing one and exporting it under
  // any of the names ahead of it is the whole change -- `CLIPS.block`'s pattern, and the same
  // reason `BAR.mark` is a list one repo over.
  clips: { leap: 'jumping_up', ride: ['pack_ride', 'hold_on', 'ride', 'stand_to_cover'] },
  // AND HE COMES OFF IF YOU ARE PUT ON THE FLOOR. A knock-down is a body going over; a passenger
  // welded to the spine through it is the one thing that would read as a bug rather than a ride.
  offDrop: 1,
};

  // whole of opting in -- the moods, the pitch and the interval all live in `CVOX`, which is
  // Plutopia's `snd.beast` ported rather than re-derived.
  chirp: 1,
  at: [[-3, 4]],                   // one of him, and he spawns beside you
  drop: /^CINEMA_4D/,
  ai: 1, pacifist: 1, pal: 1,
  // **THE LEFT STICK GETS A ROW, AND THE FIRST THING ON IT IS HIM (m104).** *"One of them is
  // gonna be to control Clancy -- I want to push a button and he's gonna run and jump onto my
  // backpack and just sit on it. So one for him roaming and one that's like a backpack."*
  // Two modes, a table, and the arc row builds itself off it exactly as the blaster's does.
  modes: [{ key: 'roam', label: 'ROAM' }, { key: 'pack', label: 'PACK' }],
  mode: 0,
  clips: {
    // **THE TWO MAINS ARE A POOL AND THE FOUR EXTRAS ARE THE FLOURISH.** *"I got some idles
    // titled clancy_idle_01 and clancy_idle_02, those are the main ones -- but I have four more
    // idles you can mix in randomly."* That is exactly the two mechanisms `foeWander` already
    // has: `rest` is what he HOLDS when he stops (picked fresh each stop, so the resting loop is
    // not always the same one) and `look` is the one-shot he plays half the time on arriving.
    idle: 'clancy_idle_01',        // the structural fallback -- one string, read in nine places
    rest: ['clancy_idle_01', 'clancy_idle_02'],
    look: ['idle_00', 'idle_01', 'idle_02_stretch', 'idle_03'],
    // `mutant_walking` and `running` are the two whose FEET AGREE. `walking` reads 157% apart
    // (L 0.51, R 0.06) -- the warrior's own m35 shape, and a number the tool refuses to stand
    // behind is a number not to build on. `mutant_run` agrees too and is only 1.5x the walk,
    // which is not a walk/run split; `running` is 2.7x, which is.
    walk: 'mutant_walking', run: 'running', flee: 'running',
    // **HE DOES HAVE AN AIR POSE, AND HE THINKS HE DOES NOT.** *"I should've put in an air pose
    // because I wanted to be able to be hit by both you and NPCs, kinda launching -- and maybe
    // he'll roll around or something, but I don't have that yet."* It is all in the export:
    // `falling_idle` is a real float, `falling_to_roll` is the roll he described, and
    // `hard_landing` is a body arriving. m67's finding one character over.
    air: 'falling_idle',
    jump: 'jumping_up', dive: 'falling_to_roll',
    swings: ['mutant_punch'],
    hits: ['hard_landing'], big: ['falling_to_roll'],
    downF: 'falling_to_roll', downB: 'falling_to_roll',
    upF: 'cover_to_stand', upB: 'cover_to_stand',
  },
  // MEASURED at his own x0.687 (`npm run gait`), not eyeballed: authored 0.386 and 1.035.
  // `clancy_idle_01` reads 0.024 m/s, which is the control that says the rest can be trusted.
  walkRef: .265, runRef: .711, fleeRef: .711, tsHi: 2.2, tsLo: .7,
  walk: .55, run: 2.6, flee: 2.6,
  // **HE KEEPS CLOSE AND HE KEEPS OUT OF THE LINE (m74, `palArc`).** *"The leash is too long. I
  // do want him to more or less stay near me, checking out what I'm doing, stand off the side of
  // me. He goes in front of me a lot and then I just end up shooting him."* Two separate things:
  // the ring is SMALLER, and it has a hole in it where you are pointing. `player.faceH` IS the
  // firing bearing -- while aiming he faces wherever the lens looks (the one-writer-on-cam.az
  // rule) -- so the arc to keep clear of is a number that already exists.
  palArc: 1.05,
  turn: 5.0,                       // a small thing turns quickly
  vary: { pace: [.85, 1.2], nerve: [1, 1], react: [.3, 1.2], guard: [0, 0] },
  // THE BREATHING IS THE HOBO'S, HARDER. *"I don't want it to be like super super mechanical."*
  // `foeGait`'s surge and stop are what stop a follower being a tractor beam, and a pet that
  // pauses to look at something is most of what reads as a mind.
  gait: { lane: 0, laneT: [1.0, 2.6], surge: .46, stop: .30, stopT: [.5, 1.8] },
  // **THE RING IS ROUND YOU** -- `roam` is how far he is willing to wander off, `leash` is how
  // far before he stops wandering and comes back at a run. The gap between them is hysteresis:
  // without it he would flip between amble and dash on the boundary every frame.
  // **TIGHTER (m76).** *"I kind of want him on a little tighter of a leash -- I like that he can
  // go far away, but I want him to try to get back into a more closer position."* Both halves:
  // the leash and the ring come in, and `pounce.hunt` 9 -- which is the ONLY thing that takes
  // him properly far -- is deliberately untouched, because that is the going-far he likes.
  roam: 1.7, roamWait: [1.2, 3.0], roamAt: .45,
  leash: 3.2, leashIn: 1.1,
  // `laneArc` is the arc he will actively STEP OUT of and `palArc` is where the ring puts him;
  // the gap between them is the hysteresis that stops him clearing the spot he was just sent to.
  laneArc: .70, laneOut: 16,
  // **A HOP IS AN ARC SOMEBODY CHOSE, SO THE APEX IS THE NUMBER (m74, m21's rule).** At `flyG`
  // 20, `up` 4.8 is an apex of **0.576 m** and 0.48 s of air -- which clears the 0.40 box he got
  // stuck on with 18 cm to spare and does NOT clear the 1.15 one, which is correct: that needs a
  // real climb. `fwd` 3.0 x 0.48 s is **1.44 m** of travel (exact, because `leapDrag` is 0), so
  // he lands well in from the edge of a 3 m box.
  // **AND 3.0 IS UNDER `FLYHIT.at` 6 BY CONSTRUCTION**, so a hopping sidekick can never bowl a
  // warrior over -- which needed no case, only a number kept under one that already exists.
  hop: { up: 4.8, fwd: 3.0, at: .55, again: 1.0, beat: .34 },
  // **AND A DIVE IS THE BACKSTOP, NOT THE FIX.** *"If I'm shooting maybe he jumps out of the way
  // -- doesn't mean I can't hit him."* So no i-frames: it MOVES him and nothing else, which is
  // what he asked for and is also the simpler thing. `palArc` is what keeps him out of the line
  // in the first place; this is for when you turn and he is already there.
  // **`falling_to_roll` IS THE DIVE HE THOUGHT HE HAD NOT DRAWN** (*"I don't think I have a dive
  // or a roll animation but if we do"*) -- it is in the export, it is a body going down into a
  // roll, and it is already his knock-down clip. 1.875 s compressed to .60 is x3.1.
  // **AND THE DISTANCE IS SOLVED, NOT TYPED (m81).** *"The instant I shoot or charge he should
  // jump out of the pizza slice of direction of my aim."* A FIXED 3.1 m clears a fixed 3.1 m,
  // and the thing he has to leave is a WEDGE that widens with range -- so past the break-even
  // the dive provably could not work, however well it was timed:
  //     dive covers v .60 = 3.12 m      needs dd x tan(cone) to reach the edge
  //      3 m -> 1.34   5 m -> 2.23      7 m -> 3.13   9 m -> 4.02   11 m -> 4.91
  //     break-even **6.99 m**, against a `range` of 11 -- so over a third of the range this was
  //     defined over was range where it fired, played, and left him in the wedge.
  // `need` is what it takes to reach `cone * clear` at HIS OWN distance less how far off the
  // line he already is, and the speed falls out of it over `dur` -- m21's rule (the number is
  // the thing you chose; the velocity is derived) one move over.
  // **AND THE CAP IS HONEST RATHER THAN HIDDEN.** Clearing an 11 m wedge in one move is 11.6
  // m/s, which is a teleport -- so `vMax` bites and `cool` .25 lets the NEXT dive finish the
  // job from wherever he got to. Two hops of a scramble reads better than one impossible leap,
  // and it stops by itself, because a dive outside the cone never fires.
  //     at 3 / 5 / 7 m   ONE dive, out at .53 to .68 rad
  //     at 9 / 11 / 13   TWO, 1.6 s, out at .57 to .68     (cone .52, clear edge .68)
  // **AND IT IS FASTER AS WELL AS REACHABLE (m99).** *"IMMEDIATELY. No long."* The hoist above
  // `foeAI`'s committed states is the fix; these are the rest of the sentence. `dur` .55 -> .45
  // is how long the move takes, `vMax` 7.5 -> 11.5 is how much of the wedge one of them can
  // cover (5.18 m against 4.13), and `cool` .25 -> .12 is when a second one may start -- 0.57 s
  // after the first rather than 0.80. Measured through the shipped solve, dead on the line:
  //     3 m -> need 2.64, one dive at 5.9 m/s     7 m -> need 6.15, one + a short second
  //     5 m -> need 4.39, one at 9.8             11 m -> need 9.66, two, 1.02 s in total
  // `cone` .52 -> .60 is him answering a shot loosely lined up rather than one already on him,
  // and `clear` comes DOWN to 1.20 with it so the distance demanded does not balloon -- the two
  // multiply, and widening one without the other is a wedge he can no longer leave (m81).
  // **AND `falling_to_roll` IS 1.875 s, SO `dur` .45 IS x4.17** -- the fast end of what a clip
  // can sell, and a dive-roll out of the way is the one move that should be over before you
  // have read it. `mel.CLANCY.dive.dur` is the dial if it reads as a blur.
  dive: { vMin: 2.0, vMax: 11.5, dur: .45, cone: .60, clear: 1.20, range: 13, cool: .12 },
  // **HE PILES ON TO WHATEVER YOU ARE HITTING (m75, `mutant_punch`).** *"Let's make him attack
  // with the mutant punch."* and, from m73, *"probably only attack if you're attacking
  // something."* So there is no aggro of his own: `palFoe` only ever returns a body carrying
  // the mark `dummyBlow` stamps when YOU hit it, which means he never starts a fight, never
  // wanders off after one, and stops when you stop.
  // **AND THE SWING IS THE WARRIOR'S OWN MACHINERY, NOT A SECOND STATE.** `swings`, `swingDur`,
  // `swingAt`, `swingGap`, `hitR` and `hitArc` are the fields `foeSwing`, the `swing` branch and
  // `foeStrike` already read -- so naming them here is the whole attack, and the only new code
  // is one branch in `foeStrike` that swings at a BODY instead of at the player.
  // **`mutant_punch` IS 1.167 s AND PLAYS AT x1.37**, which is m37's rule: a reaction too fast
  // to read is the same reaction every time. `swingGap` .45 x `nerve` 1 puts a punch every
  // ~1.3 s, which is a helper chipping in rather than a second fighter.
  swingDur: .85, swingAt: .42, swingGap: .45, comboGap: .14,
  hitR: 1.5, hitArc: 1.0,
  // **`power` .34 IS UNDER THE WARRIOR'S `fling` .70 AND HIS `hard` 1.01 BY CONSTRUCTION**, so a
  // sidekick's punch STAGGERS and shoves (4.2 x .34 = 1.43 m/s, 0.65 m at `shoveDrag`) and can
  // never knock a man down -- which is right: putting them over is yours. `dmg` 2.0 x the same
  // .34 is 0.70 a punch against 6 hit points, so he is worth about a third of a fight.
  pounce: { hunt: 9, dmg: 2.0, power: .34 },
  give: 1.6,              // trying and not moving for this long -> that point is unreachable
  leapDrag: 0,
  flee0: 0, fleeAdd: 0, fleeMax: 0,   // he does not run away. He is the one who stays.
  hitBeat: 1.4, bigBeat: 1.8, downBeat: 1.8, upBeat: 1.1,
  out: 1.2,
  flyV: 18.0, flyUp: 7.5, flyG: 20, flyDrag: 1.2,
  knock: 5.0, knockUp: .7, knockDrag: 5.5, shoveDrag: 2.2,
  hard: 1.01, fling: .45,           // he is light: less of a blow sends him
  fly0: .55,
  dmg: { bolt: 2.0, fist: 1.2, weap: 1.8, finish: 3.0 },
  cool: .18,
  sep: .55,
  // NO HEALTH BAR. A gauge over your own pet reads as a thing to manage; he has hit points so a
  // stray bolt still sends him, and `foeBar` is simply not called.
};

// ============================================================================================
// THE FAT BIKER, AND THE ONE CLIP IN HIS EXPORT THAT IS AUTHORED THE WRONG WAY ROUND (m107)
//
// *"I added a guy called fat biker 02 and his motorcycle. He has basic animations -- walk, run,
// idle, take damage, in air, and fall down get up. He also has 3 driving animations, one idle
// and turn right turn left."*
//
// MEASURED BEFORE A LINE WAS WRITTEN, which is m35/m80's standing exception: a reference speed
// is a number the table cannot be written without, and eyeballing one put Shredworld's rifle run
// 36% too fast and its walk 37% too slow in a single build, in opposite directions.
//     1 mesh, 65 joints, draco + EXT_texture_webp + specular
//     authored height 0.8638 m, soles at EXACTLY 0   -> x2.026 to stand 1.75 m
//        (byte for byte the HICK's authored height -- the same base rig, one body over)
//     toes (0.0000, 1.0000), shoulders cross-check 1.0000   -> +Z, like everyone else here
//     NO weapon mounts, which is right -- an NPC, not a wearer
//     16 clips, `CINEMA_4D_Main` the usual one-frame residue
//     idle      reads 0.042 m/s  <- THE CONTROL. A gait measurement with no case that must come
//                                   back zero is a gait measurement nobody can trust.
//     walk_fwd  0.741 authored, feet AGREE, travel +3 deg   -> walkRef 1.50 at his scale
//
// **AND I CLAIMED HIS `run_fwd` WAS AUTHORED BACKWARDS. IT IS NOT (m108).** *"What are you
// talking about, I just checked the file, it looks normal."* It does, and the measurement I
// leaned on cannot answer the question I asked it.
// `npm run gait`'s `travel` column derives its direction by SUMMING the raw per-frame
// displacement over the frames where the toe is in the lower half of its range -- which on a
// run is the stance phase PLUS most of the swing, and the swing travels forward fast. That is
// the identical net-displacement-over-low-frames measure my own first test had already been
// proven worthless by a control on zap's own `run_fwd`; I found the reason and then quoted a
// second tool doing the same thing. **The speed it reports is a MEDIAN and is sound** -- it is
// the only thing that column was ever fit to answer.
// **AND "BOTH FEET AGREED" WAS A MISREADING OF THE FLAG.** `spread` compares `per[0]` against
// `per[1]`, which are the two feet's SPEEDS; the two directions are summed into one bearing and
// never compared to each other at all. There is no direction agreement check in that tool.
// The tell was sitting in the same row: his run has **5 and 6 stance frames of 18** against
// zap's 8/9 and the hick's 8/8 -- the fewest of any run in the repo, so the most float, so the
// least reliable sum. A derived direction with fewer samples behind it than every control is
// not a finding.
const BIKER = {
  file: 'models/characters/fat_biker_02.glb',
  h: 1.75, r: .42, hp: 5, snd: 'soft',
  // CHECKED AS RECTANGLES against all fourteen boxes, both buildings, every one of the seventeen
  // bodies AND the bike's own lane -- m60's rule, because a placement picked off a mental picture
  // is one the player simply cannot walk through. Clearances 2.50 m and 3.87 m.
  at: [[0, -8], [24, 14]],
  drop: /^CINEMA_4D/,
  ai: 1, pacifist: 1,
  clips: {
    idle: 'idle',
    // TWO IDLES, so a man standing still is not a statue. `idle_fan_self` is 3 s and 49 moving
    // bones -- a real flourish, which is what `look` is for; `rest` is the pool he SETTLES into.
    look: ['idle_fan_self'],
    walk: 'walk_fwd', run: 'run_fwd', flee: 'run_fwd',
    air: 'in_air',
    // THREE HIT REACTIONS AND THE BIG ONE IS ITS OWN, the hobo's shape exactly.
    hits: ['hit_take_damage_00', 'hit_take_damage_01'],
    big: ['hit_take_dmage_02'],            // HIS spelling, left alone -- a rename here is a
                                           // silent T-pose the next time he re-exports it
    // ONE FALL AND ONE GET-UP, so the pair cannot disagree about which way up he ended.
    downF: 'hit_take_damage_and_fall', downB: 'hit_take_damage_and_fall',
    upF: 'laying_get_up', upB: 'laying_get_up',
    // THE THREE DRIVING CLIPS. Nothing but `stepRide` names these, and a body that never gets on
    // a bike never reaches them.
    ride: 'driving_idle', rideL: 'driving_turn_left', rideR: 'driving_turn_right',
  },
  // AT HIS SCALE (x2.026), measured off the planted foot. He is heavy, so his speeds sit a
  // little UNDER each clip's own reference rather than over it -- ts .73 walking and .82
  // running, both inside the band, so nothing scrambles and nothing slides.
  walkRef: 1.50, runRef: 3.43, fleeRef: 3.43, tsHi: 1.5, tsLo: .7,
  walk: 1.1, run: 2.8, flee: 3.2,
  turn: 2.6,
  vary: { pace: [.8, 1.2], nerve: [1, 1], react: [.4, 1.3], guard: [0, 0] },
  gait: { lane: 0, laneT: [1.2, 3.0], surge: .34, stop: .22, stopT: [.7, 2.4] },
  roam: 8, roamWait: [2.5, 6.5], roamAt: .9,
  flee0: 4.5, fleeAdd: 2.0, fleeMax: 10,
  // NEAR THEIR OWN LENGTHS (m37): these run 1.17 to 3.00 s, and a reaction too fast to read is
  // the same reaction every time.
  hitBeat: 1.3, bigBeat: 1.1, downBeat: 2.2, upBeat: 2.0,
  out: 1.8,
  // HE IS HEAVY, so he goes less far than the skinny ones and lands harder.
  flyV: 19.0, flyUp: 7.4, flyG: 20, flyDrag: 1.35,
  knock: 3.4, knockUp: .5, knockDrag: 5.5, shoveDrag: 2.2,
  hard: 1.01,
  fling: .62,
  fly0: .45,
  dmg: { bolt: 1.5, fist: .8, weap: 1.3, finish: 2.8 },
  cool: .16,
  sep: .95,
  bar: { w: .8, h: .09, up: 1.20, fade: 4.0 },
};

// ============================================================================================
// THE MOTORCYCLE (m107, `MOTO`, `buildMoto`, `motoBones`, `stepMoto`)
//
// *"The motorcycle has its wheels rigged to a bone each and can be driven procedurally, and its
// handlebars rigged to 'turn' I think, and it needs to procedurally have its turn driven to 20
// degrees each direction."*
//
// **HE BUILT THE HARD PART INTO THE EXPORT AND IT IS BETTER THAN HE REMEMBERED.** Read through
// the real file: 8 nodes, one skinned mesh, one skin, and the joints are
//     root
//       steering        t(1.685, 23.087, 34.204)  rest PITCHED -28.5 deg about X
//         front_wheel   t(-1.685, -28.282, 3.199) rest +28.5 about X -- CANCELLING the rake
//       back_wheel      t(0, -0.235, -28.774)
//       mixamorig_hips  t(0, 18.439, 0)           <- A RIDER SEAT MARKER, already in the file
// The steering joint is called `steering`, not `turn`; **found by PATTERN so either spelling
// lands** (`weapFit`'s rule -- a named joint IS the placement and the export stops being
// something this code has an opinion about).
//
// **THE 28.5 DEGREES IS THE FORK RAKE, AND IT IS ALSO THE ANSWER TO HIS C4D QUESTION.** *"When I
// rotate the blue axis it changes R.B, the red axis changes R.P, but the green axis -- the one
// that turns the steering -- changes ALL THREE. It makes no sense."* It makes sense and the rig
// is fine. C4D's HPB is H about Y, then P about X, then B about Z, applied in that order; the
// steering joint's rest carries **P = -28.5**, so its own local Y is tilted 28.5 degrees back
// from the parent's Y. A turn about the fork is therefore NOT a pure H in the parent's frame and
// the solver has to spread it across all three fields. **It is a property of the Euler DISPLAY
// and nothing else: glTF stores quaternions**, so none of it survives the export and the game
// never reads a Euler at all.
//
// **AND THE STEERING AXIS IS MEASURED RATHER THAN TYPED.** `front_wheel` hangs off `steering` at
// local (-1.7, -28.3, +3.2) -- almost entirely **-Y** -- so the fork runs down the joint's own
// local Y and that is the axis to turn about. Nothing about the rake is typed here; the rest
// quaternion is captured at build time and the turn is composed ON TOP of it, which is
// `barPlace`'s rule: read the rest pose, never restate it.
//
// **THE SCALE IS THE BIKER'S OWN, AND A REAL-WORLD FACT IS WHAT SAYS SO.** Both exports came out
// of the same scene: the bike is 1.088 m long as authored and the seat marker sits 0.322 m above
// its lowest geometry, so at the biker's x2.026 that is **a 2.20 m bike with a 0.65 m seat** --
// and a Harley Fat Boy's seat is 0.66 m, which is the check that says the two share units. The
// scale is still DERIVED from the geometry (`MOTO.len` over the measured Z span, which comes out
// at x2.021 against the biker's own x2.026), so a re-export
// at any size lands right with no edit -- the skateboard's rule, one vehicle over.
//
// **THE STEER ANGLE FALLS OUT OF THE WHEELBASE, WHICH IS ALSO MEASURED.** A single-track vehicle
// turning at yaw rate w while doing v has a turn radius v/w, and `delta = atan(L * w / v)` with L
// the distance between the two wheel bones. So the handlebars answer the corner rather than a
// mapping somebody invented, and `lock` is what he asked for: a CLAMP at 20 degrees, reached on a
// tight enough turn and never exceeded.
//
// **AND THE WHEEL SPIN IS DISTANCE OVER THE MEASURED RADIUS**, about each wheel bone's own local
// X -- the axle, because the mesh is 1.09 long in Z against 0.65 in X, so Z is the length and X
// is the width. Both wheel bones' local frames are `root`'s (the front one's +28.5 cancels the
// fork's -28.5 exactly), so one axis serves both.
//
// **THE CIRCUIT IS THE ONE THAT FITS, AND THAT WAS SWEPT RATHER THAN CHOSEN.** A circuit through
// the test site has to clear fourteen boxes, two buildings and seventeen bodies: the largest
// clear ring within reach of the spawn is **14 m at (-29, -3)**, worst clearance 2.02 m, nearest
// point 15 m from where he stands. A bigger oval exists and is 64 m across with its nearest point
// 37 m away, which is a motorcycle you cannot see. **The path is PARAMETERISED by angle rather
// than integrated**, so it cannot drift into anything however long it runs.
// Measured through the shipped arithmetic on the real file: wheelbase 1.602 m, wheel radius
// 0.275 m (a Fat Boy's front tyre is 0.28), seat 0.652 m.
//     at MOTO.speed 6 m/s: 0.43 rad/s, a 14.7 s lap, the wheels at 21.8 rad/s and the
//                          steering holding 6.5 degrees
//     `mel.MOTO.ring.r = 6` laps tighter and takes it to 15.0; at 4.4 m it reaches the 20
const MOTO = {
  tag: 'MOTO',
  file: 'models/vehicles/motorcycle_fatboy.glb',
  len: 2.20,            // metres nose to tail. The ONE typed number; the scale is derived.
  // FOUND BY PATTERN, so a re-export that renames `steering` to `turn` -- which is what he
  // thought he had called it -- lands with no code change.
  mark: { steer: /steer|turn|fork|handle/i, front: /front.*wheel|wheel.*front/i,
          back: /back.*wheel|rear.*wheel|wheel.*back/i, seat: /hips|seat|rider|driver/i },
  lock: 20 * Math.PI / 180,     // *"20 degree each direction"*, as a clamp
  ring: { cx: -29, cz: -3, r: 14 },
  speed: 6.0,
  lean: .26,            // how far it heels into the corner, radians at full lock
  // A HALF-LIFE, NOT A RATE -- `damp(cur, tgt, half, dt)` takes the time to close half the gap,
  // and reading it as a rate is a three-second steering response that reads as a broken joint.
  ease: .12,            // how fast the steering and the lean follow the corner
  lift: .02,            // it sits this far off the ground, so the tyres are not buried in it
  // **A RIDERLESS MOTORCYCLE RIDES A LITTLE AND THEN FALLS OVER (m109).** *"The motorcycle
  // drives without him even when I shoot him off."* It did -- `stepMoto` drove the ring on its
  // own clock and had never heard of the rider. It coasts now and topples, and **it coasts ALONG
  // THE RING rather than off down the tangent**, which is not a detail: that ring is the only
  // path here swept clear of fourteen boxes, two buildings and every body, so a bike that leaves
  // it is a bike that can come to rest inside something.
  //     ride -> coast -> fall -> down -> rise -> ride, and the ONE fact it turns on is read
  //     off the MAN (`rider.st === 'ride'`) rather than kept as a flag here: `dummyBlow`
  //     already takes him out of that state when he is shot, so a bike with nobody on it
  //     needs nothing told to it.
  coastDrag: .55,       // 6 m/s down to the topple speed in about 3.3 s
  fallV: 1.0,           // under this there is no gyroscope left and it goes over
  fallDur: .55,
  fallAng: 1.35,        // 77 degrees: a bike on its side rests on its bar end and its peg
  // AND HE GOES BACK FOR IT. *"Then he should go try to find it again."*
  seek: 2.8,            // he runs, because it is his bike
  board: 1.8,           // how close he has to be to pick it up
  riseDur: .9,          // **A STAND-IN**: no pick-up clip exists yet, so it rights itself
  on: 1,
};

// HIS HEALTH, WHICH UNTIL NOW DID NOT EXIST. *"Maybe he has like a health bar or something."*
// He asked for one on the warrior; the player needs the other half of it or "fight back" has
// no consequence. There is no death yet and no hit-reaction clip in the antenna alien's export
// -- a blow is a knockback, a stun and a flash, which is honest and is the part that reads.
const HEALTH = { max: 100, regen: 4.0, wait: 5.0 };
// HIS GUARD. *"I know I don't have a block animation yet, but I'll put one in."* -- so `CLIPS`
// carries the hook and `rigAnim` blends it the moment a name is there; until then he holds the
// idle and the only thing that says he is blocking is that the blow costs him a quarter of what
// it would have. **That is a stated gap, not a silent one**: the chip says `BLOCK` while it is
// up, because a defensive state you cannot see is one nobody uses twice.
// **AND IT ACTUALLY BLOCKS NOW, WHICH IS A SECOND ARC AND NOT A BIGGER NUMBER (m101).** *"We
// need to make the block actually block and deflect or parry or whatever... and if they swing
// it blocks, and we have an animation for block react."* The react has played since m95
// (`HURT.hits` is `weapon_block_reaction`, and with `FOE.hitKnock` at 1 a raised guard is the only
// way to reach it) -- what was missing is that a guard cost him a quarter of the blow WHEREVER
// it came from inside 72 degrees, so there was nothing to do well and nothing to do badly.
// **THE PAYOFF IS AN ARC, WHICH IS WHAT MAKES THE LOCK WORTH HAVING.** A blow arriving inside
// `perfect` of his nose is DEFLECTED and costs nothing; wider, inside `arc`, is the partial
// guard it has always been; outside it is not blocked at all.
//     perfect .55   31 degrees either side -- squared up, which is what a guard IS
//     arc    1.25   72 either side -- raised, and turned the wrong way
// **SO THE LOCK DOES NOT MAKE THE BLOCK STRONGER; IT MAKES IT POSSIBLE TO KEEP IT POINTED.**
// `faceTgt` reads `p.lock` and comes round at `LOCK.face` 9, so a locked guard sits at about
// zero off and parries by construction, while an unlocked one is steered by the left stick and
// is luck. That is an assist that pays in the one currency this file trusts -- **a thing you
// were going to do anyway, done reliably** -- rather than in a damage multiplier nobody can see.
// **AND A PARRY HAS TO MAKE A NOISE AND A MARK, or "it blocked" and "it took the hit" are one
// picture.** `blockFx` is a spark off the guard, the `hard` row's own clang (m64's ring layer,
// which is what the blow lands ON and is exactly right here) and a knock on the lens.
const BLOCK = {
  cut: .25, push: .35, stun: .3, arc: 1.25,
  perfect: .55,                              // a deflect is a blow taken on the nose
  cutHard: 0, pushHard: .12, stunHard: .10,  // and it costs nothing, which is what he asked for
  show: .45,                                 // how long the chip says PARRY
  fxOut: .55, fxUp: .55,                     // where the contact is: in front of his chest
  fxN: 16, fxV: 5.5, fxSize: .12, fxLife: .34, fxRing: .85,
  fxHot: [1, .90, .55], fxCool: [.62, .74, .90],
  shake: .22,
  // **A BLOCK HAS ITS OWN VOICE (m105).** *"When we do a block animation it needs to make a
  // different noise than the noise that it makes when you're hit -- like a clang or clink or
  // something, a parry noise."* It was playing `thud` (the box break, which is HIM being hit)
  // plus the ring, so a guard sounded like a blow that landed and the two tiers sounded alike.
  // The thud is gone on any guard and the tiers are two recordings: a dull clang absorbed, and
  // `metal_ping_01` on top of it turned aside. **The ping is played from its own PEAK** (`cut`),
  // which is what makes a bright short file read as an arrival rather than as a swell -- m59's
  // mechanism, and `HCHG.snd`'s own trick one event over.
  ping: { key: 'lock', g: .62, r: 1.16, cut: 1 },
};
// **BEING KNOCKED DOWN (m67).** *"When the orcs hit you, you fly through the air a little bit
// and land on the ground and then get up."* That is three beats and the game already has two of
// them: `in_air` is a real float and `landing_hard` is a real man hitting the ground and pushing
// back up off it. **What there is NO clip for is LYING there**, so there is no lying beat -- the
// arc runs straight into the hard landing, which reads as the whole move and is honest with what
// the export actually holds. `down` and `up` are the hooks for when he draws them.
const HURT = {
  // **THE APEX IS THE NUMBER AND `vy` IS DERIVED FROM IT**, m21's rule: a velocity picked by eye
  // is a height nobody chose. At `MOVE.g` 20 this is 5.59 m/s up and 0.56 s of air.
  // **AND BOTH ENDS WENT UP, BECAUSE A DERIVED RATE IS ONLY HALF OF WHAT HE ASKED FOR.** m67's
  // arc was 0.78 m and 0.56 s, which is a stumble; the rate fix alone would just have played the
  // fall at x2.83 to fit it. At `MOVE.g` 20 an apex of 1.60 is vy 8.0 and **0.80 s** of air, and
  // `back` 12 against `airDrag` (k .25) integrates to `v(1-e^-kT)/k` = **8.7 m**.
  // **FLATTER AND FURTHER (m103).** *"I want when I go flying in the air to go in the direction
  // they hit me, and I wanna go kind of horizontal."* The DIRECTION was already his -- `dirH` is
  // the way the blow travels and the launch is built on it -- so what was missing is the SHAPE:
  // 1.60 m of apex against 8.7 m of travel is 5:1, which is a lob. **And it cannot be bought by
  // lowering the apex alone**, because the hang time is what the fall clip's rate is solved
  // against: at an apex of 1.0 the flight is 0.63 s and the rate wants x2.51 at k 1 and x2.95 at
  // the bottom of `vary`, which runs off the end of `rateMax` and puts the pose back where m96
  // found it. So the apex comes down a little and `back` does the work:
  //     k .85   vy 6.25   apex 0.98 m   air 0.62 s    9.0 m   clip x2.54
  //     k 1.0   vy 7.35   apex 1.35     air 0.74     12.1 m   clip x2.16
  //     k 1.20  vy 8.82   apex 1.94     air 0.88     17.1 m   clip x1.80
  // -- nine to one rather than five, every rate still inside the band, and the hang untouched.
  hi: 1.35,
  // **ONE ROLL DRIVES BOTH, WHICH IS WHAT MAKES A HARDER BLOW READ AS A HARDER BLOW.** *"Sometimes
  // they hit you and you go farther and sometimes shorter."* Two independent rolls would give a
  // high, short launch and a low, long one, which is nobody's idea of a harder hit. And because
  // the hang comes out of the same number, the CLIP follows it for free:
  //     k .85   vy 6.8   apex 1.16 m   air 0.68 s   6.4 m   clip x2.33
  //     k 1.0   vy 8.0   apex 1.60     air 0.80     8.7 m   clip x1.98
  //     k 1.20  vy 9.6   apex 2.30     air 0.96    12.3 m   clip x1.65
  vary: [.85, 1.20],
  back: 18,       // along the blow. Against `airDrag` that integrates to about twelve metres
  // (`land` is GONE at m90: a knock-down no longer enters a landing state at all, and a
  //  constant nobody reads is indistinguishable from one that is broken.)
  again: 1.1,     // he cannot be re-launched inside this -- see below

  // **AND THE THREE EMPTY HOOKS ARE FULL NOW (m88).** *"I want them to hit me and me to play
  // the take damage animation... and when I get sent through the air I don't land on my feet,
  // I always land on my back laying down and then I get up."* m67 wrote `down`/`up` as `''`
  // because the poses were not drawn and the STATES ran regardless -- he flew, landed and got
  // up with `landing_hard` standing in for all of it. This is what that hook was for, and it
  // needed no new state: naming the clips is the change.
  // **AND IT IS THE REAL BLOCK REACT NOW (m95).** *"I put in a block and block react."* m91
  // pointed this at `take_damage_head`/`_body` as the stand-in, and said so: with `FOE.hitKnock` at
  // 1 every unblocked blow launches him, so `hits` is ONLY ever reached through a raised guard --
  // which means a guard react is literally what this field is. The two `take_damage_*` clips stay
  // in the file and are one word from coming back.
  hits: ['weapon_block_reaction'],
  stagger: .95,   // how long a reaction READS for. m37's lesson: a blow too fast to see is the
                  // same blow every time -- and the clip is 1.333 s, so this is x1.40 rather than
                  // the x1.67 the old .80 would have compressed it to.

  // **THE KNOCK-DOWN IS ONE CLIP FROM THE BLOW TO THE GET-UP, WHICH IS WHAT THE WARRIORS HAVE
  // ALWAYS DONE (m90).** *"The warrior aliens fly through the air and land perfectly on the
  // ground, and they're playing one of the same animations I have on Zap -- I named it something
  // like take damage and fall down. The problem with our hero is when he's hit through the air
  // and then eventually lands, the momentum already stops and he's not laying down, and then he
  // blends to a lay position and it looks horrible."*
  // **HE IS DESCRIBING A STRUCTURAL DIFFERENCE AND IT IS ONE LINE OF `bodyAnim` (7654):**
  //     t[air && K.clips.air ? K.clips.air : d.cur] = 1;
  // `FOE.clips` HAS NO `air`, so a warrior plays his FALL clip for the whole flight AND the
  // landing -- one continuous animation started at the moment of the blow, which is the sequence
  // he likes. m88 gave the player the opposite: `in_air` (a FLOAT LOOP, so the body looks static
  // while it travels) and then `laying_down`, which is ONE KEY -- **a held pose is not an
  // arrival**, so the weight table drags him into it and that drag IS "it blends to a lay
  // position". There was never a fall in it at all.
  // **SO `laying_down` IS OUT OF THE SEQUENCE AND `take_damage_and_fall_down` IS IN.** m41's own
  // rule -- one fall and one get-up, so the pair cannot disagree -- and this pair does agree:
  // the fall ENDS lying down and `lay_to_get_up` STARTS lying down. Naming `laying_down` as a
  // held tail is one word if the lie should ever outlast the clip.
  down: 'take_damage_and_fall_down',
  up: 'lay_to_get_up',
  // **THE CLIP HAS TO HAVE HIM ON THE FLOOR BEFORE HE GETS THERE, AND THAT IS ONE MEASUREMENT
  // AND ONE DIVISION (m96).** *"The thing that makes the warrior aliens look so good is that
  // when I blast them, the animation is them laying on the ground BY THE TIME they hit the
  // ground -- that's the key. Mine either doesn't go far enough, doesn't have enough hang time,
  // or the animation plays too slow. We could map the duration of the animation to the amount of
  // hang time I get."* Exactly right, and the arithmetic says how wrong it was:
  //     the clip puts him on the floor at **1.458 s** of its own time (measured, see `fallMark`)
  //     m90 played it at a FIXED x1.51, so the pose arrived at **0.964 s**
  //     and the flight was **0.56 s** -- so he landed 0.40 s before the animation did
  // `beat` is a FALLBACK now and nothing reads it unless the clip has no hips track to measure.
  beat: 1.35,
  gate: .08,      // how near the clip's own lowest hips counts as ARRIVED. .08 reads t 1.458 on
                  // his export; .05 gives 1.500 and .12 gives 1.375, so the landmark is stable
                  // across the whole band rather than balanced on one threshold.
  lead: .92,      // and he is on the floor THIS fraction of the way through the flight, not at
                  // the very end of it -- *"you should be to the point in the animation where
                  // you're on the ground BEFORE you hit the ground"*.
  rateMin: 1.15, rateMax: 2.60,   // the band the clip stays readable in. The warrior's own fall
                  // runs x1.6 to x2.5 (`downBeat` 1.5 on a 3.0 s clip, x `downVary`) and that is
                  // the one he says looks good, so this is fitted to it rather than picked.
  // **QUICKER (m97).** *"We need to make his get up animation quicker."* 2.708 s authored, so
  // 2.20 was x1.23 -- barely compressed, and it is the half of a knock-down you are waiting
  // through rather than watching. x1.75 stands him up in 1.55 s and is still well inside the
  // band m37's rule cares about; the whole knock-down comes to 2.43-2.79 s against m96's
  // 3.08-3.44.
  upBeat: 1.55,
  // **AND A BODY ON THE FLOOR SCRUBS LIKE A BODY (m90).** `MOVE.drag` is a man BRAKING on his
  // feet, and at `1.9 * .25` its time constant is 2.1 s -- so landing at 6.6 m/s he had
  // **13.9 m of slide** still to come, on his back. The warrior has had `knockDrag` 5.5 for
  // this since m37 and the player was simply reading the locomotion number.
  skid: 5.5,
};

// LOCKING ON. Once the trigger is held or the hammer is wound, he is committed to a target --
// he faces it, the lens comes round to it, and the left stick stops meaning "a direction in the
// world" and starts meaning "toward him, away from him, or AROUND him".
const LOCK = {
  // **OFF (m36).** *"We're gonna get rid of the aim assist on the blaster for now... the
  // reticle aimer thing is really annoying to use."* The lock drove three things at once -- the
  // mark, the camera coming round, and the left stick switching into an orbit -- and all three
  // go together, because two of them exist to serve the mark. **Nothing is deleted**: `on = 1`
  // brings the whole loop back exactly as it was, which is what makes this a decision rather
  // than a rewrite. The assist it replaces lives in `WEAP.home` now, on the BOLT.
  // **THE MELEE LUNGE IS NOT THIS AND STAYS.** *"Take the lock off the melee charge -- it's
  // just physically going to assist you."* `meleeLock` solves the launch for the gap so a swing
  // thrown at a man ARRIVES; that is a physical assist with nothing drawn and nothing taken off
  // the thumb, and it is the half he asked to keep.
  on: 0,
  // **THE MARK IS BACK, WITHOUT THE LOCK (m39).** *"The aimer is gone for the blaster. I still
  // want the aimer to be there -- it's just not the lock-on mode."* Which is the right reading
  // of m36: what was annoying was the aim being TAKEN, not the mark being DRAWN. It shows where
  // the shot is going and nothing more; `aimTarget` falls through to `aimPoint`, so it draws
  // the walk down the camera bearing and the bolt leaves on the same answer.
  retic: 1,
  range: 24,        // how far he will take a target
  // THE RETICLE'S SHRINKING RING *IS* THE LOCK WINDOW -- that is what it is drawing. It opens
  // the moment the trigger arms and closes as the charge fills, so holding a target inside it
  // is the thing you are actually doing while the shot winds up.
  // **AN ASSIST, NOT A MAGNET.** These were 1.05 / .30 / 1.45 -- SIXTY degrees either side to
  // acquire and, with `keep`, EIGHTY-SEVEN to hold, which is *"I was aiming almost ninety
  // degrees away from one cop and it kept locking onto one further left"* stated as arithmetic.
  // A number tuned for a mark that only DRAWS is far too wide for one the shot now follows.
  // **NARROWER AGAIN (m27).** *"I had two cops a similar distance apart, I was trying to aim at
  // one and it kept locking the other, and moving it over still wouldn't get off him."* Both
  // halves are `keep`: at 1.25 the man already locked held a cone 25% wider than the one he was
  // being compared against, so a target the thumb was plainly ON could not win. 1.06 is enough
  // hysteresis to stop a flicker between two men shoulder to shoulder and not enough to hold a
  // lock the thumb has left.
  cone: .19, coneTight: .06,
  keep: 1.06,
  near: .5,         // how much nearer beats how much straighter, when two are in the cone
  face: 9,          // how fast he comes round to it
  cam: 2.4,         // and how fast the lens does
  chest: .62,       // where on him the mark sits, as a fraction of his height

  // **AND THE GUARD TAKES IT BACK, WHICH IS THE ONE PLACE IT WAS NEVER WRONG (m101).** *"I
  // think we used to have the lock where once you pushed forward it would lock on them and you
  // would basically be rotating around them. We're gonna use the block as that -- if somebody
  // is within 45 degrees of your 12 o'clock and you press and hold down on the right stick, it
  // sort of locks on them and then you can kind of rotate around them."*
  // **EVERY LINE OF THIS WAS ALREADY BUILT AND SWITCHED OFF.** `findLock`, `stickLocked`'s
  // orbit, `lockH`, the camera coming round at `cam`, `faceTgt` reading `p.lock` and the
  // acquire chirp are all m20's, intact since m36 turned them off -- so this is a SECOND
  // SWITCH rather than a second system, which is exactly what "nothing is deleted" was for.
  // **AND THE REASON IT WAS TURNED OFF DOES NOT REACH IT.** m36: *"a mark that moves where you
  // are POINTING takes the aim off your thumb, so you stop aiming."* A guard has no aim to
  // take: this moves his BODY and the LENS and nothing else -- which is m51's own distinction
  // (*"he has turned down two assists that MOVED HIS AIM and kept the one that only moves his
  // BODY"*), and the melee lunge is the third thing on the keep side of that line.
  // **SO `on` AND `block` ARE TWO SWITCHES AND MUST STAY TWO.** `mel.LOCK.on = 1` is still the
  // blaster's aim lock, still off, and still the thing he turned down twice; `LOCK.block = 0`
  // is the one word back to m100 without disturbing it.
  block: 1,
  blockCone: .79,   // **45 DEGREES OF HIS 12 O'CLOCK**, his sentence as a number -- against the
                    // blaster's 11, because that one is sized for what a BULLET must deliver
                    // (m20) and this one only has to notice who is in front of you
  blockKeep: 1.25,  // and it HOLDS wider than it takes, or two men shoulder to shoulder flicker
  blockRange: 10,   // a mace reaches 2.6 m; past this there is nothing to be guarding against,
                    // and a lock on a man across the street would swing the lens off the fight
};

// THE CLIP TABLE. Every name here is checked against the file at load and anything missing is
// reported in the chip rather than failing silently -- a table naming a clip that does not
// exist leaves a bone at zero total weight, and the mixer blends a zero-weight bone back to
// its BIND value, which is the T-pose exactly.
// ============================================================================================
// THE AIR SLAM (m81) -- *"if I jump and swipe down on the right stick he does a slam down to
// earth, which we can use the same melee as the charge attack (minus the charge) because that
// is actually where that animation fits."*
//
// **THE GESTURE WAS FREE AND THAT IS WHY IT FITS.** `meleeGo` returns on `!p.grounded`, so a
// flick in the air did nothing at all -- the one unspent thing on a pad where the tap is the
// jump, the hold is the trigger and the ground flick is the strike. And DOWN is free
// specifically: down-HELD is the guard (m37) and a flick is a fast move and a release, which
// `padUp`'s own hysteresis argument already separates from a hold.
//
// **`weapon_melee_finish` IS A BIG OVERHEAD AND HE IS RIGHT ABOUT WHERE IT BELONGS.** No new
// clip, no charge, no `chargeGoK` scaling -- the hold is what a charge IS and this has none.
//
// **AND IT ENDS WHEN HE MEETS THE GROUND, WHICH IS THE OPPOSITE TEST FROM EVERY OTHER STRIKE.**
// A lunge, a roll and a dash all end on their own clock; this one ends on contact, so it needs
// its own branch rather than a clause on that one -- a shared condition would have it cancel
// itself on the frame it began. `max` is the failsafe under it, because a state whose end
// depends on the world needs an end that does not.
const SLAM = {
  // **THE HANG IS WHAT MAKES IT READ.** Dropped straight from the flick it is over in a tenth
  // of a second and looks like a fall; stopped dead for a beat first, it is a wind-up and then
  // a drive, which is the shape of the thing he is asking for.
  hang: .16,
  down: 12,            // and then he is DRIVEN at the ground rather than dropped
  keep: .25,           // how much of his horizontal survives -- a slam comes nearly straight down
  r: 3.4,              // how wide the landing catches
  power: .95,          // just under the charged finisher's 1.0, which stays the biggest blow
  dmg: 3.0,            // the finisher's own
  // **THE CLIP IS COMPRESSED TO THE PREDICTED ARRIVAL**, which is knowable: the fall height is
  // `groundAt` under him and the drive is `down`, so `t` solves out of `h = down*t + g*t^2/2`.
  // m8's rule -- a state whose length disagrees with the clip can only cut that clip off.
  // **AND THE RATE CEILING IS NOT A TASTE NUMBER**: the charged dash already plays this same
  // clip over `dashDur + finishTail` = .52 s, so this is the rate he is looking at on it today.
  rateMax: 3.5,
  max: 1.2,            // the failsafe, in case the ground moves out from under the prediction
};

// ============================================================================================
// THE DNA GUN, AND THE TRANSFORM IS A CHEAT ON PURPOSE (m112, `MORPH`)
//
// *"The alien has some sort of DNA gun -- you shoot one of the NPCs and the character transforms
// into them. We don't have all of the animations for the player that we do for the NPCs, so if
// you transform into them you could only do basic locomotion, you wouldn't be holding a gun any
// more -- but since those characters have walk and idle and run we could just try it. My original
// thought was sculpting a single base mesh around every character so it's a literal mesh
// transform, but we could just cheat it: the character mesh glows and turns white, then you blend
// them, and it turns from white to the new character's colour. Just as a test, and then we'll
// have a little button to transform back."*
//
// **THE WHOLE THING IS A MODEL SWAP INSIDE `rig.root`, WHICH IS WHY IT COST SO LITTLE.** `rig`
// is the player's DRAWN BODY -- a model, a mixer, an action table, a bone map and a facing
// offset -- and every one of those is a field. So wearing somebody else is repointing them at a
// clone of his proto and putting the old set aside in `rig.base`; the position, the heading, the
// collider, the camera, the footsteps and the whole of `stepPlayer` never learn it happened.
// That is `d.K`'s dividend one body over: the kinds already carry a measured proto, and
// `bodyProto` stashing it on `K.P` is the one line that makes it reachable.
//
// **HE IS DRAWN AT THE KIND'S OWN HEIGHT, AND THAT IS A MEASUREMENT RATHER THAN TASTE.** A
// disguise that stands a head shorter than the men it is a disguise for is not one -- and the
// gait references are the real argument: `K.walkRef`/`K.runRef` are how fast the planted foot
// slides AT THAT KIND'S OWN SCALE (m52), so drawing him at `K.h` is what lets the clips be
// played at their own numbers with nothing re-derived. **The collider does not move with it**:
// `p.r`, `p.hh`, `MOVE.step` and every speed stay his, because changing a body's size mid-game
// is m52's whole build and this is a test. What DOES follow is the camera's look point, which
// is chest height on the body being DRAWN -- one term, or the lens frames a 1.78 m man at his
// waist. `MORPH.tall = 0` draws him at his own height for the A/B.
//
// **AND THE GAIT IS THE HONEST LIMIT.** `K.runRef` on a drunk is 1.8 to 2.0 m/s and the player
// sprints at 7.2, so past a run the clip clamps at the kind's own `tsHi` and his feet slide --
// which is *"you could only do like basic locomotion"* said as a number rather than hidden. The
// fix is a faster clip or a slower disguise, and neither is this build.
//
// **THE FLASH IS AN EMISSIVE RAMP, NOT A DISSOLVE**, and it swaps the mesh at the top of it --
// which is exactly the cheat he described. Both halves matter: the body you are TAKING OFF goes
// white, the swap happens while nothing is readable, and the new one comes up out of the white.
// **A 1x1 WHITE TEXTURE RATHER THAN `emissiveMap = null`**: `USE_EMISSIVEMAP` is a #define, so
// swapping a map for NOTHING is a program recompile mid-transform, where texture -> texture is
// not. Every material's own values are stashed on it the first time it is tinted and put back
// exactly, so a body that has been worn is byte-for-byte what it was afterwards.
// **AND THE WORN SKIN'S MATERIALS ARE ITS OWN** (`skeletonClone` shares them), or the flash
// would whiten every copy of that kind standing in the street -- m39's lesson, one body over.
// ============================================================================================
const MORPH = {
  on: 1,
  out: .34,          // the body he is wearing goes white over this
  hold: .22,         // and stays white while the mesh is swapped
  back: .34,         // then the new one comes up out of it
  white: 6.0,        // how hard the emissive drives at full flash
  tall: 1,           // 1 = drawn at the KIND's own height, 0 = at his. See the note.
  // ---- HIS MOVESET, WORN BY SOMEBODY ELSE (m119). See `mphBorrow` for the whole argument.
  borrow: 1,         // 0 is m112..m118 exactly: the kind's own three clips and nothing else
  // **A SPINE, TWO ARMS, TWO LEGS AND A HEAD -- NOT A COUNT (m121).** *"For some reason the
  // animations aren't working on Clancy. I tried the homeless guy, the warrior alien, and they
  // worked on those, but they didn't work on Clancy."* m119 gated the borrow on **30 shared
  // bones** and Clancy has **25** -- because he has **no fingers**. Read out of his file: 27
  // joints, and they are hips, both full legs with toes, all three spine bones, both shoulders,
  // arms, forearms and hands, neck and head. A complete body missing nothing a locomotion clip
  // drives. **A count is a proxy for a structure and it fails on exactly the rig that is lean
  // rather than broken** -- `stripPoses`' own rule (the test is what the thing IS, never a name
  // or a tally) and `dnaOK`'s (a pool carries idle, walk and run or it is not an animation set).
  needs: ['Hips', 'Spine', 'Spine1', 'Spine2', 'Neck', 'Head',
          'LeftShoulder', 'LeftArm', 'LeftForeArm', 'LeftHand',
          'RightShoulder', 'RightArm', 'RightForeArm', 'RightHand',
          'LeftUpLeg', 'LeftLeg', 'LeftFoot', 'RightUpLeg', 'RightLeg', 'RightFoot'],
  restTol: .14,      // rad. A non-Hips bone further off zap's bind than this is a rig this
                     // borrow cannot be trusted on -- measured at load, and it SAYS SO
  // THE WAY BACK, as a control of its own. See `paintPalRow`.
  row: [{ key: 'revert', label: 'REVERT' }],
  // ---- THE PROXY BLOB (m113). See `mphProf` for why a real vertex morph is not available.
  blob: 1,           // 0 is m112 exactly: the flash and the swap, and no proxy mesh
  rings: 30,         // height bands the silhouette is measured into, and rows in the hull

// **BOTH ROWS NAME HIS OWN BANK NOW (m63)** -- *"the first like three, for when the melee
// connects."* No exception was named and these ARE recordings of a melee landing, so the
// armoured/flesh distinction stops being two FILES and becomes weight and pitch on one set:
// harder and brighter on plate, duller and lower on a man in a coat. `metal_clang_01..03` stay
// loaded and unused, so `mel.snd('clang')` is still the A/B.

  ringGap: .30,     // the least time between two rings under rapid fire -- see `hitRing`

  soft: { key: 'hit', g: .92, r: .88,  dur: 0 },                              // flesh
};

// addition to what we're using, for both the blaster and the melee."* m57 made it the armoured
// body's sound and m63 replaced it with his own recordings; ADDITION is the third answer and
// the right one -- the hit bank is the BLOW and the ring is what the blow lands ON, so they are
// two sources and one event, exactly as the grunt is at m62. It rides `HITSND.ring`, so it is
// still a fact about the MAN: plate rings and a drunk in a coat does not, and putting a ring on
// one is a field on his row. It is quieter and higher than the clang ever was on its own,
// because it is no longer carrying the impact by itself.

  // separate events. `now` rather than a dt clock, because this is called from three places
  // and none of them is a step function.
  if (thin) {
