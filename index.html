    R[k] = Math.max(0, r * (1 + w * Math.sin(i * .9 + t * 3.1) * Math.cos(j * .7 - t * 2.3)));
  }
  for (let j = 0; j < seg; j++) { R[j] = 0; R[(rows - 1) * seg + j] = 0; }
  const px = (i, j) => { const k = Math.max(0, Math.min(rows - 1, i)) * seg + ((j % seg) + seg) % seg;
                         const th = (((j % seg) + seg) % seg) / seg * TAU;
                         return [Math.sin(th) * R[k], step * Math.max(0, Math.min(rows - 1, i)),
                                 Math.cos(th) * R[k]]; };
  for (let i = 0; i < rows; i++) for (let j = 0; j < seg; j++) {
    const th = j / seg * TAU, k = (i * seg + j) * 3, r = R[i * seg + j];
    P[k] = Math.sin(th) * r; P[k + 1] = step * i; P[k + 2] = Math.cos(th) * r;
    const a0 = px(i, j - 1), a1 = px(i, j + 1), b0 = px(i - 1, j), b1 = px(i + 1, j);
    const ux = a1[0] - a0[0], uy = a1[1] - a0[1], uz = a1[2] - a0[2];
    const vx = b1[0] - b0[0], vy = b1[1] - b0[1], vz = b1[2] - b0[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const nl = Math.hypot(nx, ny, nz);
    if (nl < 1e-6) { nx = 0; ny = i === 0 ? -1 : 1; nz = 0; }
    else { nx /= nl; ny /= nl; nz /= nl; }
    N[k] = nx; N[k + 1] = ny; N[k + 2] = nz;
  }
  MPH.geo.attributes.position.needsUpdate = true;
  MPH.geo.attributes.normal.needsUpdate = true;
}
// PROF:END

// EMITTED AROUND `rig.root`, NOT AROUND `player.pos`. `spk` stores the offset against the root
// it is handed, and this runs before the root is moved to the player this frame -- so taking
// the centre from the root is what makes the offset exactly the one intended.
//
// **AND THERE ARE THREE OF THEM, BECAUSE ONE IS A DRIFT (m115).** A single population orbiting
// and rising is the same picture for the whole effect; what reads is different things happening
// at different rates. The MOTES hang about him the whole time, the STREAKS rush IN over the
// first half (a thing being gathered), and the EMBERS blow OUT at the swap. All three are the
// same pool and the same draw call -- the only new idea is `rv`, a rate on the follow radius.
function mphMote() {
  const C = rig.root.position, R = MPH._r, hy = Math.random();
  const a = Math.random() * Math.PI * 2;
  const i = Math.min(MPH.rows - 1, Math.round(hy * (MPH.rows - 1)));
  const j = Math.min(MPH.seg - 1, Math.floor(a / (Math.PI * 2) * MPH.seg));
  const rr = (R[i * MPH.seg + j] || .18) * (1.1 + Math.random() * .6) + .06;
  spk(C.x + Math.cos(a) * rr, C.y + hy * MPH.H, C.z + Math.sin(a) * rr,
      0, MORPH.rise * (.5 + Math.random()), 0,
      MORPH.spkSize * (.5 + Math.random() * 1.1), MORPH.spkLife * (.7 + Math.random() * .7),
      Math.random() < .45 ? MORPH.cool : MORPH.hot, rig,
      MORPH.spin * (.75 + Math.random() * .5),
      // **A SIGNED DRIFT, WHICH IS NOT THE SPIN'S RULE (m118).** One sign of SPIN is what makes
      // a swirl rather than a scramble and it stands; mixed signs on the RADIUS are a different
      // axis -- some motes closing while others open is the cloud churning, and one sign there
      // would be a shell breathing in and out together.
      MORPH.spkDrift * (Math.random() * 2 - 1));
}
// A STREAK STARTS WELL OUTSIDE HIM AND CLOSES. Its life is set so it ARRIVES rather than
// expiring on the way in -- a gather whose particles vanish short of the body is a halo.
function mphRush() {
  const C = rig.root.position, R = MPH._r, hy = Math.random();
  const a = Math.random() * Math.PI * 2;
  const i = Math.min(MPH.rows - 1, Math.round(hy * (MPH.rows - 1)));
  const j = Math.min(MPH.seg - 1, Math.floor(a / (Math.PI * 2) * MPH.seg));
  const rr = ((R[i * MPH.seg + j] || .18) + .10) * MORPH.rushR * (.8 + Math.random() * .5);
  spk(C.x + Math.cos(a) * rr, C.y + hy * MPH.H, C.z + Math.sin(a) * rr,
      0, MORPH.rise * .3, 0,
      MORPH.rushSize * (.7 + Math.random() * .7), MORPH.rushLife * (.7 + Math.random() * .6),
      MORPH.hot, rig, MORPH.rushSpin * (.8 + Math.random() * .5), -MORPH.rushV);
}
function mphBlow() {
  const C = rig.root.position, R = MPH._r;
  for (let n = 0; n < MORPH.blowN; n++) {
    const a = Math.random() * Math.PI * 2, hy = Math.random();
    const i = Math.min(MPH.rows - 1, Math.round(hy * (MPH.rows - 1)));
    const j = Math.min(MPH.seg - 1, Math.floor(a / (Math.PI * 2) * MPH.seg));
    const rr = (R[i * MPH.seg + j] || .18) + .05;
    spk(C.x + Math.cos(a) * rr, C.y + hy * MPH.H, C.z + Math.sin(a) * rr,
        0, MORPH.rise * (.2 + Math.random() * .8), 0,
        MORPH.blowSize * (.6 + Math.random() * .9), MORPH.blowLife * (.6 + Math.random() * .8),
        Math.random() < .3 ? MORPH.cool : MORPH.hot, rig,
        MORPH.blowSpin * (Math.random() * 2 - 1), MORPH.blowV * (.6 + Math.random() * .8));
  }
}
// A SHOCKWAVE ON THE FLOOR IS WHAT GIVES AN EVENT A PLACE AND A SIZE. It is its own mesh and
// not `markRing`, which belongs to the guard lock -- one owner per object, which is this file's
// oldest invariant wearing its smallest hat.
function mphRing() {
  if (!MPH.ring) {
    const g = new THREE.RingGeometry(.86, 1.0, 48);
    g.rotateX(-Math.PI / 2);
    MPH.ring = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
      color: new THREE.Color().fromArray(MORPH.hot), transparent: true, opacity: 0,
      depthWrite: false, side: THREE.DoubleSide, toneMapped: false,
      blending: THREE.AdditiveBlending }));
    MPH.ring.renderOrder = 3; MPH.ring.frustumCulled = false; MPH.ring.visible = false;
    scene.add(MPH.ring);
  }
  MPH.ringT = 0;
  MPH.ring.position.set(player.pos.x, player.pos.y + .06, player.pos.z);
  MPH.ring.visible = true;
}
function mphRingStep(dt) {
  if (!MPH.ring || !MPH.ring.visible) return;
  MPH.ringT += dt;
  const u = MPH.ringT / MORPH.ringT;
  if (u >= 1) { MPH.ring.visible = false; return; }
  // IT OPENS FAST AND SETTLES, which is what a wave does, and it fades on the square so the
  // last third of it is not a pale disc sitting on the road.
  const e = 1 - (1 - u) * (1 - u);
  MPH.ring.scale.setScalar(.35 + e * MORPH.ringR);
  MPH.ring.material.opacity = (1 - u) * (1 - u) * .85;
}

function mphBlob(u, dt) {
  const p = player;
  if (!MORPH.blob || !p.mphPA || !p.mphPB) return;
  const M = mphMesh();
  const w = smooth(0, MORPH.fade[0], u) * (1 - smooth(MORPH.fade[1], 1, u));
  MPH.t += dt;
  // **IT INFLATES OVER HIM AND DEFLATES OFF THE NEW ONE (m118).** The weight ramp alone is a
  // thing fading up in FRONT of a body; a shell that also CLOSES is a thing swallowing one --
  // which is the verb he used. It rides `w`, so it cannot disagree with the fade, needs no
  // window of its own, and is symmetric by construction: the far end is the blob shrinking
  // onto the new body and being absorbed rather than switched off.
  const sw = lerp(MORPH.swell0, MORPH.swell, w);
  mphFill(p.mphPA, p.mphPB, p.mphHA, p.mphHB,
          smooth(MORPH.wrap[0], MORPH.wrap[1], u), MORPH.wob * w, MPH.t, sw);
  M.position.copy(p.pos);
  // **AND IT IS TURNED WITH HIM.** The hull is not a body of revolution any more, so an arm is
  // at an ANGLE and the blob has to carry the same yaw the body is drawn at. `faceOff` is
  // already baked into the profile, so it comes back off here -- and `drawnYaw` is last
  // frame's, which on a yaw is a lag nobody can see.
  M.rotation.y = (rig.drawnYaw || 0) - (rig.faceOff || 0);
  M.visible = w > .01;
  const U = MPH.mat.uniforms;
  U.uA.value = w; U.uRim.value = MORPH.rim; U.uH.value = MPH.H;
  U.uBand.value = MORPH.band; U.uLines.value = MORPH.lines || MORPH.rings;
  U.uT.value = MPH.t; U.uFlow.value = MORPH.flow;
  U.uCol.value.fromArray(MORPH.col); U.uHot.value.fromArray(MORPH.hot);
  U.uDeep.value.fromArray(MORPH.deep);
  // ONE PASS UP THE BODY ACROSS THE WHOLE THING, so the beam and the wrap are the same event
  // rather than two. It runs a little past both ends, or the last slice never gets swept.
  U.uScan.value = lerp(MORPH.scan[0] - MORPH.band, MORPH.scan[1] + MORPH.band, u);
  if (rig.model) rig.model.visible = !(u > MORPH.hide[0] && u < MORPH.hide[1]);
  // THE RATE RIDES THE WEIGHT, so the swarm thickens into the wrap and thins out of it -- the
  // jetpack's own rule, that a run of particles coming faster is a machine winding up.
  MPH.e -= dt;
  for (let n = 0; n < 14 && MPH.e <= 0 && w > .04; n++) { mphMote(); MPH.e += MORPH.every / w; }
  if (MPH.e <= 0) MPH.e = MORPH.every;
  // AND THE RUSH IS THE FIRST HALF ONLY. Past the swap there is nothing left to gather, and
  // streaks still closing on a body that has already changed read as the effect running on.
  const g = u < .55 ? 1 - smooth(.30, .58, u) * .75 : 0;
  MPH.re -= dt;
  if (g > .05) { for (let n = 0; n < 14 && MPH.re <= 0; n++) { mphRush(); MPH.re += MORPH.rushEvery / g; } }
  if (MPH.re <= 0) MPH.re = MORPH.rushEvery;
}

// AND IT NEVER LEAVES A BODY HIDDEN. Every way out of the transform goes through here, because
// a skin left invisible is a skin that is invisible the next time it is worn.
function mphBlobOff() {
  if (MPH.blob) { MPH.blob.visible = false; MPH.mat.uniforms.uA.value = 0; }
  if (rig.model) rig.model.visible = true;
  // AND THE SWIRL'S CLOCK GOES BACK TO ZERO. It feeds `sin`/`cos` in a fragment shader, and a
  // counter that only ever grows is a phase in the thousands after an hour -- which is where a
  // float stops resolving one frame from the next and a moving pattern quietly stops moving.
  // A transform is under a second, so per-transform is the whole range it ever needs.
  MPH.t = 0; MPH.e = 0; MPH.re = 0;
}

function stepMorph(dt) {
  const p = player;
  if (!p.mphSt) return;
  p.mphT += dt;
  const cur = p.mphK ? p.mphK.mph : rig.base;
  // ONE PROGRESS ACROSS THE WHOLE THING, so the blob runs continuously THROUGH the swap rather
  // than restarting at it. The phases still own the tint; `u` owns everything that is drawn.
  const tot = Math.max(.06, MORPH.out + MORPH.hold + MORPH.back);
  const u = p.mphU = clamp((p.mphSt === 'out' ? p.mphT : MORPH.out + MORPH.hold + p.mphT) / tot, 0, 1);
  if (p.mphSt === 'out') {
    mphTint(cur.mats, clamp(p.mphT / Math.max(.02, MORPH.out), 0, 1));
    if (p.mphT >= MORPH.out + MORPH.hold) {
      mphTint(cur.mats, 0);                            // the body coming off goes back to itself
      cur.model.visible = true;                        // and is never left hidden for next time
      const to = p.mphNext ? mphSkin(p.mphNext) : null;
      mphWear(to);
      // **AND HE COMES OUT OF IT HOLDING THE GUN, IN A MODE THAT DOES NOT TRANSFORM HIM AGAIN
      // (m123).** *"It puts you into a mode as though you're disarmed and yet it shows it like
      // you're holding the weapon... and rather than putting you in DNA, the tendency would be
      // that you're just gonna shoot somebody right away and then transform into them even
      // though you just transformed into somebody else."*
      // **THE DNA HALF IS THE ONE THAT IS ACTUALLY WRONG**, and it is wrong for the reason he
      // gives: the gun that put you in this body is still the gun in your hand, so the very next
      // release puts you in a different one. The mode a transform ENDS in has to be one you can
      // fire. Only DNA moves -- **AUTO is left exactly where it is**, because rapid fire is a
      // perfectly good thing to be holding and nothing about it undoes the transform.
      // **AND THE SLOT IS FOUND, NOT TYPED** (`s.aim` / `!m.dna && !m.auto`), which is m52's own
      // rule: a fourth weapon or a fourth mode is a row in a table and this line still reads.
      // On every path a player can take it is a NO-OP -- you cannot fire the DNA gun without the
      // blaster already out -- so what it actually covers is `mel.dna('hobo')` from the console
      // and whatever a future sample path does.
      if (p.mphNext) {
        const gs = WEAP.slots.findIndex(q => q.aim);
        if (gs >= 0 && p.slot !== gs) applySlot(gs);
        if (dnaNow()) { const ch = WEAP.modes.findIndex(q => !q.dna && !q.auto); if (ch >= 0) setMode(ch); }
      }
      mphTint((to || rig.base).mats, 1);
      p.mphSt = 'in'; p.mphT = 0;
      // the swap is the EVENT, so it is where the noise and the debris are -- not the release
      // **THE SWAP IS THE ONE BEAT IN HERE, SO IT IS WHERE ALL THE PUNCTUATION GOES (m115).**
      // A continuous ramp with nothing happening in it is what an effect with no moment reads
      // like; four things on one frame is what makes it an event.
      snd('zap', { g: .62, r: p.mphK ? .85 : 1.2, dur: .5 });
      camShake(MORPH.shake);
      mphRing();
      mphBlow();
      spkBurst(p.pos.x, p.pos.y + player.mphH * .5, p.pos.z, 34,
               { col: MORPH.hot, spread: 6.5, up: 3.4, r: .5, size: .15, life: .6 });
    }
  } else {
    const k = 1 - clamp(p.mphT / Math.max(.02, MORPH.back), 0, 1);
    mphTint(cur.mats, k);
    if (k <= 0) {
      mphTint(cur.mats, 0);
      p.mphSt = ''; p.mphNext = null; p.mphU = 0; p.mphPA = null; p.mphPB = null;
      mphBlobOff();
      // **AND THE KIT HUD COMES BACK, WHICH IS THE OTHER HALF OF HIS REPORT (m123).** *"Your gun
      // is out but it thinks you're in disarmed mode, and then you have to take out your gun even
      // though you already have it out."* Exactly that, and it is the m122 blank branch with
      // nobody to close it: `paintKit` is called from `mphWear`, which runs AT THE SWAP while
      // `p.mphSt` is still set -- so it took the transform's own branch, which blanks the label,
      // dims the mode row, drops `ready` and **returns before the visibility loop**. Nothing
      // called it again when the flash ended, so the weapon stayed drawn (its visibility was
      // never touched) while every readout beside it said he was carrying nothing, for the whole
      // disguise, until a tap happened to repaint it. **A branch that returns early needs
      // somebody to call the function again once its condition is false** -- and this is the one
      // place that knows the transform is over.
      paintKit();
      return;
    }
  }
  mphBlob(u, dt);
}
// THE GAIT, AND NOTHING ELSE. It reads the KIND's own clip table and its own reference speeds,
// and `skinWeights`' fallback is the KIND's idle -- the player's own would be a name this skin
// has never heard of, which takes the T-pose escape hatch and lands in the thing it prevents.
function morphAnim(dt) {
  const p = player, K = p.mphK, C = K.clips, sp = p.speed, t = {};
  if (C.air && !p.grounded) t[C.air] = 1;
  else if (p.knock) t[(p.gotUp ? C.upF : C.downF) || C.idle] = 1;
  else {
    const A = smooth(STEP.at * .5, K.walkRef * MORPH.idleTo, sp);
    const B = smooth(K.walkRef * MORPH.runFrom, K.runRef * MORPH.runTo, sp);
    t[C.idle] = 1 - A; t[C.walk] = A * (1 - B); t[C.run] = A * B;
    const ts = (nm, ref) => {
      const a = rig.actions[nm];
      if (a) a.setEffectiveTimeScale(clamp(sp / Math.max(.05, ref), K.tsLo || .7, K.tsHi || 1.5));
    };
    ts(C.walk, K.walkRef); ts(C.run, K.runRef);
  }
  skinWeights(rig, t, dt, .06, C.idle);
}

// WHICH NAMES LOOP. Everything else is a one-shot, so this is derived from the table rather
// than listed twice -- adding a swing cannot accidentally make it repeat.
const rnd = a => a[0] + Math.random() * (a[1] - a[0]);
// HIS OWN NUMBERS, rolled once and never changed. ONE function, so a fabricated body in a
// harness gets the same shape the game builds -- a body without them used to throw inside the
// brain, which is a harness measuring a game that cannot exist.
function foeRoll(K) {
  return K.vary
    ? { pace: rnd(K.vary.pace), nerve: rnd(K.vary.nerve),
        react: rnd(K.vary.react), guard: (K.block || 0) * rnd([.4, 1.5]),
        // WHERE HE STOPS RUNNING AND STARTS WALKING, as a fraction of `notice`. Shared, it is
        // the one moment three men all change gait together; rolled, one of them jogs nearly
        // the whole way in and another is walking from twenty metres out.
        dash: rnd(K.vary.dash || [.28, .78]) }
    : { pace: 1, nerve: 1, react: .3, guard: 0, dash: .45 };
}
// **THREE MEN MARCHING AT ONE SPEED DOWN ONE LINE IS ONE MAN DRAWN THREE TIMES (m50, `foeGait`).**
// *"They just all kind of walk at the exact same speed towards me... I'm wondering if we can
//  change either their gait or their speed. Maybe they don't always go in a straight line
//  towards you -- a little more intelligent path as well as speed. Sometimes it's a little
//  faster, sometimes they stop, sometimes they turn, sometimes it's a little bit slower."*
// m36 already rolled a `pace` per body, and it is not enough for a reason worth writing down:
// a CONSTANT multiplier spreads three men out along one line and they still all move at ONE
// speed each, in a straight line, for ever. What reads as a person is the speed CHANGING and
// the line BENDING, so what varies has to vary over TIME and not once at spawn.
// Three things off one clock, and each one is a different word of his sentence:
//     lane    a bearing he drifts off dead-on -- "they don't go in a straight line", "turns"
//     surge   a multiplier on his own pace    -- "a little faster... a little slower"
//     hold    a hesitation instead of a lane  -- "sometimes they stop"
// **EACH BODY HAS HIS OWN CLOCK AND HIS OWN PHASE**, so three of them can never re-sync -- the
// same reason each smoke plume rolls its own interval rather than sharing a metronome.
// **A RE-ROLL IS A LANE *OR* A HESITATION, NEVER BOTH**, or a man stops and changes direction
// on the same frame, which reads as a glitch rather than as a decision.
// It returns the pace multiplier for this frame, and 0 means he is standing still.
function foeGait(d, K, dt) {
  const G = K.gait;
  if (!G) return 1;
  if (d.holdT > 0) { d.holdT -= dt; if (d.holdT > 0) return 0; }
  d.gaitT = (d.gaitT || 0) - dt;
  if (d.gaitT <= 0) {
    d.surge = 1 + (Math.random() * 2 - 1) * G.surge;
    if (Math.random() < G.stop) { d.holdT = rnd(G.stopT); d.gaitT = d.holdT + rnd(G.laneT); return 0; }
    d.lane = (Math.random() * 2 - 1) * G.lane;
    d.gaitT = rnd(G.laneT);
  }
  return d.surge || 1;
}
// AND THE LANE TAPERS OUT AS HE ARRIVES. Sidling in from thirty degrees off is a man closing
// on you; doing it at arm's length is a man who cannot find you. Far out it is the whole lane,
// inside `hold` it is nothing, and the smoothstep between is what makes the path read as a
// curve rather than as two straight lines with a corner in them.
function foeLane(d, K, dd) {
  return (d.lane || 0) * smooth(K.hold, Math.max(K.hold + 2, K.notice * .5), dd);
}

function bodyLoops(K) {
  const L = new Set([K.clips.idle]);
  for (const k of ['walk', 'run', 'block', 'flee']) if (K.clips[k]) L.add(K.clips[k]);
  // the REST pool is idles and they are held, so they loop like the one in `idle` does. `look`
  // is deliberately not here: it is a one-shot flourish and looping one is a tic.
  for (const n of K.clips.rest || []) L.add(n);
  // AND THE DRIVING SET, which is three HELD poses: a one-shot here clamps on its last frame
  // and the rider freezes half way through a lean (m106's landmine, one table over).
  for (const k of ['ride', 'rideL', 'rideR']) if (K.clips[k]) L.add(K.clips[k]);
  // the circling clips live beside the table rather than in it, and they loop like any gait
  if (K.strafe) L.add(K.strafe);
  if (K.strafeR) L.add(K.strafeR);
  return L;
}

function buildDummies(g) {
  DUMMY.loops = bodyLoops(DUMMY);
  const P = bodyProto(g, DUMMY);
  for (const [x, z, y] of DUMMY.at) bodySpawn(P, DUMMY, x, z, y);
}

// THE HICK. No mace, no mount, no brain to speak of -- so the builder is the shared pair and
// nothing else, which is what `bodyProto`/`bodySpawn` exist for.
function buildHicks(g) {
  HICK.loops = bodyLoops(HICK);
  const P = bodyProto(g, HICK);
  HICK.up = 0;
  for (const [x, z, y] of HICK.at) { const d = bodySpawn(P, HICK, x, z, y); foeBar(d); HICK.up++; }
}

// THE HOBO. Same pair, same brain, a different table -- which is the whole claim m35 made.
function buildHobos(g) {
  HOBO.loops = bodyLoops(HOBO);
  const P = bodyProto(g, HOBO);
  HOBO.up = 0;
  for (const [x, z, y] of HOBO.at) { const d = bodySpawn(P, HOBO, x, z, y); foeBar(d); HOBO.up++; }
}

// THE SKATER. A third pacifist, and the builder is byte-for-byte the other two with a different
// table in it -- which is the whole of m35's claim, collected on for the fifth time.
function buildSkaters(g) {
  SKATER.loops = bodyLoops(SKATER);
  const P = bodyProto(g, SKATER);
  SKATER.up = 0;
  for (const [x, z, y] of SKATER.at) { const d = bodySpawn(P, SKATER, x, z, y); foeBar(d); SKATER.up++; }
}

// THE FAT BIKER. The shared pair and a different table, which is m35's claim collected on for
// the sixth time -- and then ONE of him is put on the motorcycle, which costs a state that
// already exists rather than a second brain.
function buildBikers(g) {
  BIKER.loops = bodyLoops(BIKER);
  const P = bodyProto(g, BIKER);
  BIKER.up = 0;
  for (const [x, z, y] of BIKER.at) { const d = bodySpawn(P, BIKER, x, z, y); foeBar(d); BIKER.up++; }
  // AND THE RIDER, only if there is something to ride. A man sitting on nothing is worse than
  // no rider at all, and `MOTO.up` is the one thing that says whether the bike arrived.
  if (MOTO.up) {
    const d = bodySpawn(P, BIKER, MOTO.ring.cx + MOTO.ring.r, MOTO.ring.cz);
    foeBar(d);
    d.ride = MOTO; d.st = 'ride'; d.t = 0;
    d.cur = BIKER.clips.ride;
    skinPlay(d, d.cur, 1);
    MOTO.rider = d;
    BIKER.up++;
  }
}

// ---- the motorcycle -------------------------------------------------------------------------
const _mv = new THREE.Vector3(), _mv2 = new THREE.Vector3(), _mq = new THREE.Quaternion();
const AX_X = new THREE.Vector3(1, 0, 0), AX_Y = new THREE.Vector3(0, 1, 0), AX_Z = new THREE.Vector3(0, 0, 1);

// FOUND BY PATTERN, NEVER BY INDEX. He thought he had called the steering joint `turn` and it is
// exported as `steering`; both match, and so does whatever the next export calls it.
function motoBones(model) {
  const B = {};
  model.traverse(o => {
    if (!o.isBone) return;
    for (const k in MOTO.mark) if (!B[k] && MOTO.mark[k].test(o.name)) B[k] = o;
  });
  return B;
}

function buildMoto(g) {
  const model = g.scene;
  model.updateMatrixWorld(true);
  // THE SCALE IS MEASURED OFF THE GEOMETRY, the skateboard's rule: a re-export at any size lands
  // right with no edit. GLTFLoader binds every skin with the IDENTITY matrix, so at rest a
  // vertex's geometry position IS its world position and these bounds are already metres.
  let lo = null, hi = null;
  const side = [];
  model.traverse(o => {
    if (!o.isMesh && !o.isSkinnedMesh || !o.geometry) return;
    o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox;
    lo = lo ? lo.min(b.min) : b.min.clone(); hi = hi ? hi.max(b.max) : b.max.clone();
    // ITS SIDE-ON SILHOUETTE, for `motoLow`. A BOUNDING BOX IS NOT A SHAPE: rolled onto its
    // side the box's lowest CORNER is the empty air beside the wheel at bar width, so a bike
    // resting on it hovers a good fifteen centimetres. The convex hull of the real (x, y) is
    // exact at every roll and is a dozen points to test per frame.
    const pa = o.geometry.getAttribute('position');
    if (pa) for (let i = 0; i < pa.count; i++) side.push([pa.getX(i), pa.getY(i)]);
  });
  if (!lo) throw new Error('motorcycle has no geometry');
  const authored = hi.z - lo.z;                       // Z is the LENGTH: 1.088 against 0.65 wide
  const k = authored > .01 ? MOTO.len / authored : 1;
  const B = motoBones(model);
  MOTO.bones = B;
  // the rest pose is READ, never restated -- the turn and the spin ride ON TOP of whatever the
  // file authored, so the 28.5 degrees of fork rake is the export's business and not this code's
  for (const key of ['steer', 'front', 'back']) if (B[key]) B[key].userData.rest = B[key].quaternion.clone();
  // MEASURED IN AUTHORED METRES, BEFORE THE SCALE GOES ON, then taken to world metres. The wheel
  // bones sit at the axle, so the radius is how far that is above the lowest geometry -- which
  // comes out at 0.28 m, and a Fat Boy's front tyre is 0.28 m.
  let wb = .8, rad = .14;
  if (B.front && B.back) {
    const f = B.front.getWorldPosition(new THREE.Vector3()), b2 = B.back.getWorldPosition(new THREE.Vector3());
    wb = f.distanceTo(b2);
    rad = Math.max(.02, f.y - lo.y);
  }
  MOTO.wb = wb * k; MOTO.rad = rad * k;
  // **ITS ORIGIN IS NOT ITS WHEELS, WHICH IS THE WHOLE OF "THE MOTORCYCLE IS IN THE GROUND"
  // (m109).** The root sits at axle height -- 0.138 authored above the lowest geometry, which is
  // **0.275 m** once it is scaled -- so putting the ROOT on the ground buried the wheels a
  // quarter of a metre and took the seat, and therefore the rider, down with them. That is why
  // he read as the right height on a sunken bike: he was correctly seated on a buried seat.
  // `buildShip`'s rule one vehicle over: sit the model on its own bounding-box min, measured.
  MOTO.bx = { x0: lo.x * k, x1: hi.x * k, y0: lo.y * k, y1: hi.y * k };
  MOTO.hull = hull2D(side).map(q => [q[0] * k, q[1] * k]);
  model.scale.setScalar(k);
  model.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) {
      if (!m.isMeshStandardMaterial) continue;
      // Tripo writes doubleSided on everything and on a closed shell that is pure wasted fill
      m.side = THREE.FrontSide;
      if (m.map) { m.emissiveMap = m.map; m.emissive = new THREE.Color(0xffffff); }
      m.emissiveIntensity = RIG.emissive;
    }
  });
  const root = new THREE.Group();
  root.add(model);
  scene.add(root);
  MOTO.root = root; MOTO.model = model; MOTO.scale = k;
  MOTO.a = 0; MOTO.steer = 0; MOTO.spin = 0; MOTO.h = 0; MOTO.lean0 = 0;
  // `undefined -= dt` is NaN and a NaN clock is a bike that can never fall over or get
  // back up -- silent, and invisible to both gates. m63's `d.bumpT` lesson, checked every time.
  MOTO.st = 'ride'; MOTO.stT = 0; MOTO.v = MOTO.speed; MOTO.roll = 0; MOTO.roll0 = 0; MOTO.fallSide = 1;
  MOTO.up = 1;
  console.log('[melee] motorcycle: ' + authored.toFixed(3) + ' m authored -> x' + k.toFixed(3) +
              ', wheelbase ' + MOTO.wb.toFixed(3) + ' m, wheel radius ' + MOTO.rad.toFixed(3) + ' m, bones ' +
              Object.keys(B).join(' '));
  if (!B.steer) note('MOTO NO STEER');
  if (!B.front || !B.back) note('MOTO NO WHEEL');
  if (!B.seat) note('MOTO NO SEAT');
  stepMoto(0);
}

// HOW FAR ITS LOWEST CORNER SITS BELOW THE ROOT AT A GIVEN ROLL. A roll is about the bike's own
// +Z (its length), so `y' = x sin + y cos`, and the lowest of the four footprint corners is what
// has to rest on the ground. **At roll 0 this returns the bounding-box min exactly**, so the
// upright case and the fallen case are ONE formula rather than two numbers to keep in step -- and
// a bike on its side comes to rest on its bars rather than hovering at axle height.
function motoLow(roll) {
  const s = Math.sin(roll), c = Math.cos(roll);
  const H = MOTO.hull;
  if (H && H.length) {
    let m = 1e9;
    for (let i = 0; i < H.length; i++) { const v = H[i][0] * s + H[i][1] * c; if (v < m) m = v; }
    return m;
  }
  const B = MOTO.bx; if (!B) return 0;
  return Math.min(B.x0 * s + B.y0 * c, B.x1 * s + B.y0 * c,
                  B.x0 * s + B.y1 * c, B.x1 * s + B.y1 * c);
}

// MONOTONE CHAIN. One pass at load over a few thousand points; what comes back is the dozen or
// so corners that can ever be the lowest thing, so the per-frame cost is a dozen multiplies.
function hull2D(pts) {
  if (pts.length < 3) return pts;
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], hi = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (hi.length >= 2 && cr(hi[hi.length - 2], hi[hi.length - 1], q) <= 0) hi.pop(); hi.push(q); }
  lo.pop(); hi.pop();
  return lo.concat(hi);
}

// THE PATH IS PARAMETERISED BY ANGLE, NOT INTEGRATED, so it cannot drift into anything however
// long it runs -- which matters, because the ring it drives was swept against every box, both
// buildings and every body and has 2.02 m of clearance at its worst point.
//
// **AND THE WHOLE STATE MACHINE HANGS OFF ONE READ (m109).** *"The motorcycle drives without him
// even when I shoot him off. It should ride a little and then fall over."* It did, because
// `stepMoto` drove the ring on its own clock and had never heard of the rider. `manned` is read
// off the MAN rather than stored here, so being shot off, knocked down, fleeing and coming back
// are all one fact with nothing to keep in step.
function stepMoto(dt) {
  if (!MOTO.up || !MOTO.on) return;
  const R = MOTO.ring, r = Math.max(1, R.r);
  const manned = !!(MOTO.rider && MOTO.rider.st === 'ride' && MOTO.rider.ride === MOTO);
  if ((MOTO.st === 'ride' || MOTO.st === 'rise') && !manned) { MOTO.st = 'coast'; MOTO.stT = 0; }
  // AND A COASTING BIKE WITH SOMEBODY ON IT DRIVES AGAIN, which is not only tidy: `buildMoto`
  // runs before `buildBikers` and calls `stepMoto(0)` to place the bike, so on that one frame
  // there is no rider yet and the coast is entered from a standing start. One clause closes
  // that and the real case -- getting back on a bike still rolling -- at the same time.
  if (MOTO.st === 'coast' && manned) { MOTO.st = 'ride'; MOTO.stT = 0; }
  if (MOTO.st === 'coast') {
    // **IT COASTS ALONG THE RING, NOT OFF DOWN THE TANGENT**, which is not a detail: that circle
    // is the only path here swept clear of fourteen boxes, two buildings and every body, so a
    // bike that leaves it is a bike that can come to rest inside something -- the m24 lesson,
    // where nothing on screen disagrees with anything and the player simply cannot walk there.
    MOTO.v *= Math.exp(-MOTO.coastDrag * dt);
    if (MOTO.v < MOTO.fallV) {
      MOTO.st = 'fall'; MOTO.stT = 0; MOTO.roll0 = MOTO.roll;
      // IT GOES OVER INTO THE CORNER IT WAS ALREADY LEANING INTO, which is what a bike running
      // out of speed mid-turn does. The sign is READ off the lean rather than typed.
      MOTO.fallSide = MOTO.roll <= 0 ? 1 : -1;
    }
  } else if (MOTO.st === 'fall') {
    MOTO.stT += dt;
    MOTO.v *= Math.exp(-4 * dt);
    if (MOTO.stT >= MOTO.fallDur) { MOTO.st = 'down'; MOTO.stT = 0; MOTO.v = 0; }
  } else if (MOTO.st === 'down') {
    MOTO.v = 0;
  } else if (MOTO.st === 'rise') {
    MOTO.stT += dt;
    if (MOTO.stT >= MOTO.riseDur) { MOTO.st = 'ride'; MOTO.stT = 0; }
  }
  if (MOTO.st === 'ride') MOTO.v = damp(MOTO.v, MOTO.speed, .35, dt);
  const v = MOTO.v;
  const w = v / r;                                   // rad/s: a circle of radius r at speed v
  MOTO.a += w * dt;
  const x = R.cx + Math.cos(MOTO.a) * r, z = R.cz + Math.sin(MOTO.a) * r;
  // the tangent, which is the way it is pointing. Forward here is (sin h, cos h), so the heading
  // that matches the tangent (-sin a, cos a) * r ... is read straight off the velocity.
  const vx = -Math.sin(MOTO.a), vz = Math.cos(MOTO.a);
  MOTO.h = Math.atan2(vx, vz);
  // **THE STEER ANGLE FALLS OUT OF THE WHEELBASE.** A single-track vehicle turning at yaw rate w
  // while doing v has a turn radius v/w, so `delta = atan(L*w/v)` -- the handlebars answer the
  // corner rather than a mapping somebody invented. `lock` is his 20 degrees, as a CLAMP.
  const want = clamp(Math.atan2(MOTO.wb * w, Math.max(.1, v)), -MOTO.lock, MOTO.lock);
  MOTO.steer = damp(MOTO.steer, want, MOTO.ease, dt);
  // AND IT LEANS INTO THE CORNER. Derived rather than argued, and stated because this file gets
  // handedness backwards about half the time when it argues: a rotation about the bike's own +Z
  // takes its top toward -X, and +X is LEFT here, so leaning INTO a left turn (a positive steer)
  // is a NEGATIVE roll. `mel.MOTO.lean = -.26` is the one word if it heels the wrong way.
  const lean = -(MOTO.steer / MOTO.lock) * MOTO.lean;
  // THE TOPPLE IS THE SAME NUMBER FURTHER ROUND -- one roll for the lean AND the fall, so the
  // height below cannot disagree with the picture, and an interrupted rise cannot jump.
  let roll = lean;
  if (MOTO.st === 'fall') roll = MOTO.roll0 + (MOTO.fallSide * MOTO.fallAng - MOTO.roll0) * smooth(0, 1, MOTO.stT / MOTO.fallDur);
  else if (MOTO.st === 'down') roll = MOTO.fallSide * MOTO.fallAng;
  else if (MOTO.st === 'rise') roll = MOTO.roll0 + (lean - MOTO.roll0) * smooth(0, 1, MOTO.stT / MOTO.riseDur);
  MOTO.roll = roll;
  // **ITS ORIGIN IS AT AXLE HEIGHT, WHICH IS THE WHOLE OF "THE MOTORCYCLE IS IN THE GROUND".**
  // `motoLow` is how far its lowest corner sits below the root AT THIS ROLL, so upright and on
  // its side are ONE formula -- `buildShip`'s rule: sit a model on its own measured bounds.
  const y = groundAt(x, z, 0, .5) - motoLow(roll) + MOTO.lift;
  MOTO.root.position.set(x, y, z);
  MOTO.root.quaternion.setFromAxisAngle(AX_Y, MOTO.h).multiply(_mq.setFromAxisAngle(AX_Z, roll));
  const B = MOTO.bones;
  // **THE WHEELS SPIN AT DISTANCE OVER THE MEASURED RADIUS, about each bone's own local X** --
  // the axle, because the mesh is 1.09 long in Z against 0.65 wide in X. Both wheel bones share
  // `root`'s frame (the front one's +28.5 cancels the fork's -28.5 exactly), so one axis serves
  // both, and the front wheel inherits the steering for free by being its CHILD in the file.
  MOTO.spin += (v * dt) / Math.max(.02, MOTO.rad);
  for (const key of ['front', 'back']) {
    const b = B[key]; if (!b || !b.userData.rest) continue;
    b.quaternion.copy(b.userData.rest).multiply(_mq.setFromAxisAngle(AX_X, MOTO.spin));
  }
  // **AND THE FORK TURNS ABOUT ITS OWN LOCAL Y.** `rest * Ry(d)` is a rotation about the axis the
  // REST pose puts Y on -- `(rest * Ry * rest^-1) * rest` collapses to exactly that -- which is
  // the fork, because `front_wheel` hangs off this joint at almost pure local -Y.
  if (B.steer && B.steer.userData.rest)
    B.steer.quaternion.copy(B.steer.userData.rest).multiply(_mq.setFromAxisAngle(AX_Y, MOTO.steer));
  MOTO.root.updateMatrixWorld(true);
}

// THE RIDER. It runs ABOVE the brain, `stepPack`'s own rule one vehicle over: a man on a
// motorcycle has no gait, no roam and nothing to be separated from -- and `'ride'` is the state
// `pushBodies` and `bodySep` already skip, so reusing it is what makes that true for free.
function stepRide(d, dt, t) {
  if (d.st !== 'ride' || !d.ride) return 0;
  const M = d.ride, K = d.K;
  if (!M.up || !M.bones.seat) return 0;
  // A NAMED SEAT IS THE PLACEMENT AND TAKES NO OFFSET -- `packSeat`'s rule, and this export
  // answered it: `mixamorig_hips` is in the bike's own skin, 0.65 m over its lowest geometry,
  // which is a Harley Fat Boy's seat height to the centimetre.
  M.bones.seat.getWorldPosition(_mv);
  // **HIS ROOT IS NOT HIS HIPS, AND THAT IS THE OTHER HALF OF "THE MOTORCYCLE IS IN THE GROUND"
  // (m109).** `driving_idle` sits his hips **0.373 m** above his own root against 0.608 standing,
  // so writing the ROOT to the seat stood him in the air over it -- which is exactly why a buried
  // bike read as a rider at *"proper height"*: he was correctly seated on a seat that was 27 cm
  // underground, and the two faults hid each other.
  // **THE OFFSET IS READ OFF THE POSED SKELETON, NEVER TYPED.** It is a property of whichever
  // driving clip is up, so it follows a re-export AND follows the blend between the three -- and
  // reading it a frame late is EXACT, because the offset is a fact about the pose and does not
  // move with the position it is measured against.
  // The bike's own marker is called `mixamorig_hips`: he put a HIPS where the rider's hips go,
  // so hips-to-hips is the export saying what to do rather than this code having an opinion.
  if (d.rideHips === undefined) {
    let hb = null;
    d.model.traverse(o => { if (!hb && o.isBone && /hips/i.test(o.name)) hb = o; });
    d.rideHips = hb;
    if (!hb) note('RIDER NO HIPS');
  }
  let drop = 0;
  if (d.rideHips) { d.rideHips.getWorldPosition(_mv2); drop = _mv2.y - d.root.position.y; }
  d.root.position.set(_mv.x, _mv.y - drop, _mv.z);
  d.h = M.h;
  // THE TURN CLIPS BLEND BY HOW HARD IT IS STEERING, and the three sum to exactly 1 -- a table
  // that dips below 1 bleeds the BIND pose in, which is the T-pose exactly.
  const s = clamp(M.steer / M.lock, -1, 1), a = Math.abs(s);
  const turn = s > 0 ? K.clips.rideL : K.clips.rideR;
  t[K.clips.ride] = 1 - a;
  if (turn && a > 0) t[turn] = a;
  return 1;
}

// AND HE GOES BACK FOR IT (m109, `motoSeek`). *"Then he should go try to find it again. I
// don't have him picking it up animation but I'll make one eventually."*
// **IT RUNS IN THE SAME LINE AS `stepRide`, ABOVE THE BRAIN**, because a man walking back to his
// own bike has no roam, no fight and nothing to be separated from -- and `d.ride` is what makes
// it HIS: it is set at build and survives being shot off, so there is nothing to remember
// anywhere else and no second body can take it.
// **AND `d.fleeT` IS WHY HE DOES NOT TURN ROUND MID-PANIC.** m38's pacifist runs when hit, so a
// biker blasted off his bike flees first and collects it afterwards -- which is the order that
// reads, and it costs one clause rather than a state.
function motoSeek(d, dt, t) {
  const M = d.ride, K = d.K;
  if (!M || !M.up || !M.on || M.st !== 'down' || d.st !== 'idle' || d.fleeT > 0) return 0;
  const dx = M.root.position.x - d.root.position.x, dz = M.root.position.z - d.root.position.z;
  if (Math.hypot(dx, dz) <= M.board) {
    // **THE PICK-UP IS A STAND-IN AND IS MARKED AS ONE.** There is no clip for hauling a bike
    // upright, so it rights itself over `riseDur` with him aboard from the first frame of it.
    // Name one and this is the line it goes on -- `CLIPS.block`'s own pattern.
    d.st = 'ride'; d.t = 0; d.cur = K.clips.ride;
    M.st = 'rise'; M.stT = 0; M.roll0 = M.roll; M.rider = d;
    return stepRide(d, dt, t);      // he is on it THIS frame, not next one
  }
  faceTo(d, Math.atan2(dx, dz), dt);
  const sp = M.seek * (d.v ? d.v.pace : 1), nm = K.clips.run;
  foeMove(d, d.h, sp, dt);
  t[nm] = 1;
  setSkinScale(d, nm, clamp(sp / K.runRef, K.tsLo, K.tsHi));
  return 1;
}

// CLANCY IS m38'S PACIFIST WITH THE RING MOVED, and that is the whole build. `foeWander`
// already ambles round a point, stops, looks about and breathes; a FOLLOWER changes WHICH POINT
// that ring is round and nothing else. No bar -- `foeBar` is simply not called.
function buildClancy(g) {
  CLANCY.loops = bodyLoops(CLANCY);
  const P = bodyProto(g, CLANCY);
  for (const [x, z, y] of CLANCY.at) bodySpawn(P, CLANCY, x, z, y);
  // **AND THE ROW EXISTS ONLY WHERE IT MEANS SOMETHING**, which is `paintKit`'s own rule for
  // the mode row: a control for a sidekick who never loaded is a HUD element in the play area
  // saying nothing. It is built and lit HERE, where the pal is confirmed, rather than at module
  // scope where it would be on screen for a character that may not arrive.
  paintPalRow();
}

function buildFoes(g) {
  FOE.loops = bodyLoops(FOE);
  FOE.up = 0;
  const P = bodyProto(g, FOE);
  for (const [x, z, y] of FOE.at) {
    const d = bodySpawn(P, FOE, x, z, y);
    // THE MACE, ON HIS OWN JOINT, WITH IDENTITY. `npm run rig` reads his `weapon_root -> tip`
    // and the mace file's as the same vector to 8.6e-6, so there is nothing to correct and
    // nothing about the placement is typed -- the export decided it, which is the point.
    if (FOE.mace) {
      let host = null;
      d.model.traverse(o => { if (!host && o.isBone && o.name === FOE.mace.root) host = o; });
      if (!host) note('NO ' + FOE.mace.root + ' ON THE WARRIOR');
      else for (const q of FOE.mace.parts) {
        const o = new THREE.Mesh(q.geometry, q.material);
        o.matrixAutoUpdate = false; o.matrix.copy(q.matrix);
        o.castShadow = true;
        o.frustumCulled = false;   // it rides a bone; its own bounds say nothing about where it is
        host.add(o);
      }
    } else note('NO MACE');
    foeBar(d);
    FOE.up++;
  }
}

// THE MACE FILE, READ ONCE. Kept as geometry + the transform RELATIVE TO ITS OWN `weapon_root`,
// which is the authored placement and the only thing that has to survive the clone.
function buildMace(g) {
  const parts = weaponParts(g.scene);
  if (!parts) { note('NO MACE ROOT'); return; }
  FOE.mace = parts;
  console.log('[melee] mace: ' + parts.parts.length + ' mesh(es) on ' + parts.root);
}

// A BAR OVER HIS HEAD, and it is only there when it says something. *"Maybe he has a health bar
// or something."* Without one a man who has taken five blows and a man who is ignoring you are
// the same picture -- which is the whole reason `hp` being 6 rather than 3 needs it.
// It FACES THE CAMERA each frame and is hidden while he is untouched, so an idle street is not
// a row of floating gauges.
function foeBar(d) {
  // THE BAR IS THE KIND'S, not the warrior's -- a smaller man gets a smaller gauge, and a kind
  // with no `bar` block simply has none.
  const B = d.K.bar; if (!B) return;
  const g = new THREE.Group();
  const q = new THREE.PlaneGeometry(1, 1);
  const back = new THREE.Mesh(q, new THREE.MeshBasicMaterial({ color: 0x14181f, transparent: true, depthWrite: false }));
  const fill = new THREE.Mesh(q, new THREE.MeshBasicMaterial({ color: 0xff5470, transparent: true, depthWrite: false }));
  back.scale.set(B.w, B.h, 1);
  fill.scale.set(B.w * .94, B.h * .62, 1);
  fill.position.z = .002;
  g.add(back); g.add(fill);
  g.visible = false;
  g.renderOrder = 4;
  scene.add(g);
  d.bar = { g, fill, w: B.w * .94 };
}

function foeBarStep(d, dt) {
  const B = d.bar; if (!B) return;
  // it shows while he is hurt or hunting, and fades once he is neither
  const B0 = d.K.bar;
  const want = (d.hp < d.hpMax || d.fleeT > 0 || d.aggro || d.st === 'down' || d.st === 'up') ? B0.fade : 0;
  d.barT = want ? want : Math.max(0, d.barT - dt);
  B.g.visible = d.barT > 0;
  if (!B.g.visible) return;
  const k = clamp(d.hp / d.hpMax, 0, 1);
  B.fill.scale.x = Math.max(.001, B.w * k);
  // grow from the LEFT edge rather than the middle, or a bar at 50% is centred and reads as a
  // different bar rather than as half of this one
  B.fill.position.x = -(B.w - B.fill.scale.x) * .5;
  B.fill.material.color.setHex(k > .6 ? 0x7ef08a : k > .3 ? 0xffc247 : 0xff5470);
  B.g.position.set(d.root.position.x, d.root.position.y + d.K.h * B0.up, d.root.position.z);
  B.g.quaternion.copy(camera.quaternion);
  const a = Math.min(1, d.barT / .5);
  B.g.children.forEach(c => { c.material.opacity = a * (c === B.fill ? 1 : .55); });
}

// WHICH WAY HE FALLS IS WHICH WAY THE BLOW WAS TRAVELLING. A blow going the same way he faces
// hit his BACK, so he goes over forwards.
// A SWEPT SPHERE AGAINST A STANDING BODY. The body is a vertical cylinder, so the XZ problem
// is a segment against a point and the height is one range test at the parameter it closes at.
const _hitP = new THREE.Vector3();
// **AND IT REPORTS WHERE, NOT ONLY WHETHER (m94).** The closest approach along the segment is
// already solved in here, so the contact point is free -- and free is what makes it available to
// every limb and every weapon without one of them being a special case.
function segBody(a, b, cx, cz, rad, hTop, hr) {

// fist is the cheapest, the hammer costs more, the charged finisher costs most, and a bolt
// carries its own. A kind with no `dmg` table -- the officer -- spends one hit point whatever
// hit him, exactly as he always has.
// **AND `body` IS WHETHER THE BLOW IS THE BODY ARRIVING RATHER THAN A LIMB SWINGING (m93).**

  // one doing the striking. Picked across the loop and drawn after it, because "fastest" is not
  // known until every bone has been read.
  let tv = 0, tax = 0, tay = 0, taz = 0, tbx = 0, tby = 0, tbz = 0;
  for (let i = 0; i <= STRIKE.bones.length; i++) {

    else { const b = rig.bones[STRIKE.bones[i]]; if (!b) continue; b.getWorldPosition(_sw); }

    // **READ FOR EVERY BONE NOW, not only inside the window (m94)**: it is what the sweep gates
    // on AND what picks the limb the slash is drawn from, and a trail that only appeared once a

    // twice, so the window can simply stay live for the whole travel.
    if (live && (body || !hit)) {

          // MOVING (m97).** *"The melees send the guys but they don't really get sent in the
          // direction you swing -- it feels like they shoot off at an angle away from his
          // swing."* Exactly right, and the mechanism is precise: this was
          // `atan2(_sw - q)`, the limb's INSTANTANEOUS world delta, and **a fist travels in an
          // ARC**. At the contact frame most of that delta is TANGENTIAL -- across his body --
          // so a punch thrown straight ahead launched the man sideways, and a hook launched him
          // almost perpendicular to the hook. It has been that way since m20 and only became
          // visible once blows started launching people properly (m91, m93, m96).
          // **WHEN A DIRECTION IS ALREADY STORED, DO NOT RECOVER IT FROM GEOMETRY** -- `copFly`'s
          // rule one repo over, and `p.melH` is the bearing the strike was actually thrown at,
          // after `meleeLock` has had its say. It serves the body moves with no second case,
          // because on a tackle or a kick the direction he is travelling IS the direction he

          meleeHit(d, _hitP.x, _hitP.y, _hitP.z, .55 + Math.min(1, power) * .75);

          // **AND IT NAMES THE BODY, NOT JUST THE FACT (m57).** *"When you hit regular
          // characters that are like NPCs... it shouldn't make the clang or the clink, cause
          // that's for people with armour."* A sound cannot be picked from a boolean: the

  if (MFX.on && MFX.trail && tv > MFX.swing) {

}

// THE BRAIN. *"Make him walk around, make it so I can shoot him, make him fight back."*
//
// It is a handful of DISTANCES and one cooldown, and every state it can be in ends on its own
// clock rather than on something the player has to do -- an enemy you can wedge into a state he
// cannot leave is worse than one who gives up too early.
//     far away          idle, and every so often a look-about clip
//     inside `notice`   turn to face, walk or run in
//     inside `reach`    swing, or raise the guard instead
//     past `lose`       he stops caring, and `lose > notice` so the edge cannot flicker

// **WHO HE IS FIGHTING (m77).** The whole brain below is written against ONE pair of numbers --
// `dd` and `toP` -- so swapping what they point at is what makes an orc approach, circle, give
// ground and swing at the sidekick with no second copy of any of it. That is `d.K`'s dividend
// for the seventh time.

// rather than an execution.

  let best = null, bd = 1e9;

    const od = Math.hypot(o.root.position.x - P.x, o.root.position.z - P.z);

    if (od > K.notice || od > pd - K.foePal.near) continue;
    if (od < bd) { bd = od; best = o; }

  // never have made survives until its own clock runs out

  return d.foe;

// **GET OUT OF THE WAY, AND NOTHING OUTRANKS IT (m99, `palDive`).** *"Clancy is still
// constantly in my way. I feel like if I shoot or charge he need to run or dive out of the way
// IMMEDIATELY. No long. Right stick = get the fuck out of the way."*
//
// **THE TRIGGER WAS FINE AND IT COULD NOT BE REACHED.** m76 moved it onto `p.armT` (the frame
// the thumb arrives, which is the earliest thing there is to know) and m81 solved the distance
// off the wedge -- both real, and both were sitting in `foeWander`, which is **below three
// committed-state returns**. A pounce swing is `swingDur` .85 s of a body that cannot dive,
// and the pounce is live precisely while the trigger is (m75: a mark is a body you just hit).
// So the one moment he is nearest the muzzle is the one moment the reflex was switched off.
// **FOURTH TIME IN THESE REPOS: WHEN A FEATURE DOES NOT FIRE, CHECK WHERE IT IS CALLED BEFORE
// WHAT IT DOES.** It is the first thing `foeAI` asks now, so a punch is abandoned mid-arc --
// which is exactly what *"IMMEDIATELY"* means.
//
// **A HOP AND A DIVE ARE THE TWO IT MUST NOT INTERRUPT**, because both hand the body to
// `bodyFly`: cutting a hop in mid-air drops him, and re-diving mid-dive is a stutter rather
// than a scramble. The cooldown is what paces a second one.

  const K = d.K;
  if (!K.dive || !K.pal || d.diveT > 0 || d.st === 'dive' || d.st === 'hop') return 0;
  if (!(player.aim || player.armT > 0)) return 0;
  if (dd >= K.dive.range) return 0;
  const off = wrapAngle(toP + Math.PI - player.faceH);
  if (Math.abs(off) >= K.dive.cone) return 0;
  const side = Math.sign(off) || 1;
  const h = player.faceH + side * Math.PI / 2;
  const need = dd * Math.cos(off) * Math.tan(K.dive.cone * K.dive.clear)
             - dd * Math.sin(Math.abs(off));
  const v = clamp(need / K.dive.dur, K.dive.vMin, K.dive.vMax);
  d.st = 'dive'; d.t = 0; d.h = h; d.diveT = K.dive.cool;
  d.cur = K.clips.dive || K.clips.idle;
  skinPlay(d, d.cur, skinLen(d, d.cur) / K.dive.dur);
  d.vx = Math.sin(h) * v; d.vz = Math.cos(h) * v; d.vy = 0;
  d.stuckT = 0;
  // ABANDONING A SWING HAS TO LEAVE NOTHING BEHIND. `d.swung` is re-armed by `foeSwing` and
  // `d.combo` would otherwise carry an unfinished chain into the next fight.
  d.swung = 1; d.combo = 0; d.sfoe = null;
  // and he says so. `alarm` is the mood the table already has for exactly this, and it re-arms
  // the ambient clock so a two-dive scramble (m81) is one yelp rather than two.
  bodyVox(d, 'alarm');

  // the only thing this branch changes.
  // **THE LEASH IS WHAT KEEPS IT A RADIUS RATHER THAN A DRIFT.** Past `leash` he stops wandering
  // and comes back at a run; he goes back to ambling at `leashIn`, and **the gap between the two
  // is hysteresis** -- one number would have him flipping between amble and dash on the boundary
  // every frame, which is the m36 `hold`/`reach` lesson one body over.
  if (K.pal) {
    const cx = player.pos.x, cz = player.pos.z;
    // **PACK MODE IS THE LEASH WITH THE RING COLLAPSED TO NOTHING (m104).** He comes straight at
    // you at a run and leaps the moment he is close enough -- which needed no new travel code,
    // because "come back at a run" is what the catch-up already is. The lane clear and the ring
    // are deliberately skipped: getting out of your line of fire is a rule about a man standing
    // near you, and this one is on his way to your back.
    if (packOK() && d.st !== 'ride' && d.st !== 'leap' && d.fleeT <= 0) {
      const gap = Math.hypot(cx - d.root.position.x, cz - d.root.position.z);
      faceTo(d, toP, dt);
      if (gap <= PACK.near && d.root.position.y <= groundAt(d.root.position.x, d.root.position.z, d.root.position.y, .5) + .2) {
        packGo(d);
        return;
      }
      const sp = K.run * V.pace;
      foeMove(d, d.h, sp, dt);
      const nm = K.clips.run;
      t[nm] = 1;
      setSkinScale(d, nm, clamp(sp / K.runRef, K.tsLo, K.tsHi));
      return;
    }
    // **OUT OF THE LINE OF FIRE.** The cone is off `player.faceH`, which IS where the shot goes;
    // `p.aim` is true for the charge AND for rapid fire, so one test covers both triggers. He
    // dives PERPENDICULAR -- away from the line rather than away from you, which is the whole
    // difference between getting clear and running down the barrel.
    // **AND IT FIRES ON THE THUMB, NOT ON THE LATCH (m76).** *"If I'm aiming down sight he
    // should basically know to get out of the way, rather than he's kind of delayed."*
    // `p.aim` only goes true after `WEAP.armT` of the thumb being up there, and a dive takes
    // `dur` to deliver -- so the shot was already leaving while he was still mid-roll.
    // `p.armT > 0` is the moment the thumb ARRIVES, which is the earliest thing there is to
    // know, and the cone is what buys the rest: at .42 he is reacting to a shot lined up on him
    // rather than to one already on top of him.
    // **AND HOW FAR HE GOES IS SOLVED FROM THE WEDGE (m81).** `off` is how far off the firing
    // line he is AS SEEN FROM THE PLAYER, so his perpendicular distance from the line is
    // `dd*sin|off|` and the wedge's edge at his own along-distance is `dd*cos(off)*tan(edge)`.
    // What is left is what he has to cover, and the speed is that over `dur`. A typed distance
    // can only ever be right at one range, and this wedge is a different width at every one.
    // **AND THE TRIGGER ITSELF LIVES AT THE TOP OF `foeAI` NOW (m99)** -- see `palDive`. It was
    // here, below three committed-state returns, so a sidekick mid-pounce could not dive at all.
    // **BUT YOUR LINE OF FIRE OUTRANKS THE FIGHT, AND THAT IS THE OTHER HALF OF IT (m81).**
    // m76 wrote this gap down and left it: *"nothing stops him being in the lane while POUNCING
    // -- joining the fight outranks it, which is right, but it means the one time he is
    // deliberately near an enemy you are shooting is the one time the clear is switched off."*
    // That is not a corner case, it is THE case: a marked body is a body you just hit, so the
    // pounce is live precisely while the trigger is. He dived once, the cooldown ran, the
    // pounce `return`ed above the clear, and he walked back into the line -- which is the loop
    // behind *"he still constantly walks in front of my shot"*. The dive is the reflex and the
    // clear is the habit, and the reflex alone was never going to be enough.
    const aimLive = player.aim || player.armT > 0;
    const P = palPost(K, d);
    const clear = P.lane && dd < K.laneOut;
    // **JOINING THE FIGHT OUTRANKS THE LEASH, AND THAT IS DELIBERATE.** `hunt` 9 is further than
    // `leash` 4, so a pounce takes him off the ring -- but the range is measured from YOU, so he
    // can never be more than `hunt` away however long the fight runs, and the leash takes him
    // back the moment it ends.
    if (K.pounce && !(aimLive && clear)) {
      const T = palFoe(d);
      if (T) {
        const h = Math.atan2(T.o.root.position.x - d.root.position.x, T.o.root.position.z - d.root.position.z);
        faceTo(d, h, dt);
        // he stops a little INSIDE his own reach, or he stands at exactly the range where a
        // step of separation from `bodySep` puts the punch out again
        if (T.d > K.hitR + T.o.K.r - .35) {
          const sp = K.run * V.pace;
          foeMove(d, d.h, sp, dt);
          t[K.clips.run] = 1;
          setSkinScale(d, K.clips.run, clamp(sp / K.runRef, K.tsLo, K.tsHi));
        } else if (d.gap <= 0) {
          foeSwing(d, 0);
        } else {
          t[K.clips.idle] = 1;                  // squared up, waiting out the cooldown
        }
        // and when the fight ends he re-rolls a fresh spot through the ONE picker, centred on
        // wherever you have got to in the meantime
        d.roamT = 1e-4; d.hx = cx; d.hz = cz;
        return;
      }
    }
    if (d.catch && dd < K.leashIn) d.catch = 0;
    if (dd > K.leash) d.catch = 1;
    // **STANDING IN THE LANE IS ITS OWN REASON TO MOVE, NOT ONLY A DETAIL OF COMING BACK.** He
    // can wander into it, be shoved into it, or simply have you turn onto him -- so the test is
    // WHERE HE IS rather than what he was doing, and it outranks the ring for the same reason
    // the dive outranks everything: it is the thing that gets him shot. (`P` and `clear` are
    // computed above the pounce now, because the pounce has to be able to stand down on them.)
    d.lane = 0;
    if (d.catch || clear) {
      const gx = P.x - d.root.position.x, gz = P.z - d.root.position.z;
      if (Math.hypot(gx, gz) > .25) faceTo(d, Math.atan2(gx, gz), dt);
      // **AND HE RUNS, BOTH WAYS.** Ambling off the runway is exactly the delay he described
      // on the dive, one system over -- and a catch-up was always a run. Either way in to this
      // branch is a run, so there is no walk case to write.
      const sp = K.run * V.pace, nm = K.clips.run;
      foeMove(d, d.h, sp, dt);
      t[nm] = 1;
      setSkinScale(d, nm, clamp(sp / K.runRef, K.tsLo, K.tsHi));
      d.lane = P.lane ? 1 : 0;
      d.roamT = 1e-4; d.hx = cx; d.hz = cz;   // a fresh spot through the ONE picker on arrival
      return;
    }
    d.hx = cx; d.hz = cz;
  }
  // THE RING IS ROUND WHERE HE SPAWNED, so a street left alone keeps its shape rather than
  // slowly emptying out as four random walks drift apart.
  if (d.roamT > 0) {
    d.roamT -= dt;
    if (d.roamT <= 0) {
      let a = Math.random() * Math.PI * 2;
      // **THE RING HAS A HOLE IN IT WHERE YOU ARE POINTING (m74, `K.palArc`).** *"He goes in
      // front of me a lot and then I just end up shooting him... stand off the side of me."*
      // PUSHED to the nearer edge rather than re-rolled: a rejection loop is unbounded and a
      // push is one line, and it also piles him up along the two edges of the arc, which IS
      // "off the side of me" rather than "anywhere but in front".
      if (K.palArc) {
        const off = wrapAngle(a - player.faceH);
        if (Math.abs(off) < K.palArc) a = player.faceH + (off >= 0 ? K.palArc : -K.palArc);
      }
      const r = Math.sqrt(Math.random()) * K.roam;
      d.rx = d.hx + Math.sin(a) * r; d.rz = d.hz + Math.cos(a) * r;
    }
    t[d.look && d.t < skinLen(d, d.look) ? d.look : d.rest || K.clips.idle] = 1;
    return;
  }
  const gx = d.rx - d.root.position.x, gz = d.rz - d.root.position.z;
  const gd = Math.hypot(gx, gz);
  if (gd < K.roamAt) {
    d.roamT = rnd(K.roamWait);
    // **WHICH IDLE HE HOLDS IS PICKED FRESH ON EACH STOP.** *"clancy_idle_01 and clancy_idle_02
    // are the main ones."* Two clips and one `idle` field is one clip; a pool read HERE, where
    // he actually comes to rest, is the whole of it -- and `K.clips.idle` stays a single string
    // so the nine other places that read it as the structural fallback are untouched.
    const R = K.clips.rest;
    if (R && R.length) d.rest = R[(Math.random() * R.length) | 0];
    d.look = K.clips.look && Math.random() < .5
      ? K.clips.look[(Math.random() * K.clips.look.length) | 0] : '';
    if (d.look) { skinPlay(d, d.look, 1); d.t = 0; }
    t[d.rest || K.clips.idle] = 1;
    return;
  }
  faceTo(d, Math.atan2(gx, gz), dt);
  // THE SAME BREATHING, AND NOT THE LANE. His path is already his own -- the ring gives every
  // body a different point to walk to -- so what a lane would add here is a man failing to
  // arrive at a place nobody can see. What the amble was missing is the SPEED changing and the
  // occasional stop, which is the other two thirds of `foeGait`.
  const surge = foeGait(d, K, dt);
  if (surge <= 0) { t[d.look && d.t < skinLen(d, d.look) ? d.look : d.rest || K.clips.idle] = 1; return; }
  const sp = K.walk * V.pace * surge;
  foeMove(d, d.h, sp, dt);
  t[K.clips.walk] = 1;
  setSkinScale(d, K.clips.walk, clamp(sp / K.walkRef, K.tsLo, K.tsHi));
}

// **GETTING OUT OF THE LANE COMES BEFORE CLOSING (m76, `palPost`).** *"He constantly walks
// down the runway, basically down my line of sight -- if I shoot him once and he's downfield
// then he's just running back to me IN FRONT OF ME while I'm shooting guys."* m74 put a hole in
// the roam RING and left the return leg running `faceTo(d, toP)` -- **straight at the player**,
// which from downfield is the runway by definition. So the one moment he was guaranteed to be
// in the line was the moment he was coming back from having been shot.
// **AND CLOSING FIRST IS WHAT MAKES IT THE RUNWAY.** A point beside you is still reached by
// walking the length of the lane if he starts at the far end of it, so inside the lane the
// target keeps HIS OWN RANGE and only moves him sideways -- he steps off the runway at whatever
// distance he is at, and only once he is clear does the target become a post beside you.
// One continuous steer, no state, and it falls out of the same `off` the ring is pushed by.
function palPost(K, d) {
  const px = player.pos.x, pz = player.pos.z;
  const dx = d.root.position.x - px, dz = d.root.position.z - pz;
  const r = Math.hypot(dx, dz);
  const to = r > 1e-3 ? Math.atan2(dx, dz) : d.h;
  const off = wrapAngle(to - player.faceH);
  // **THE CLEAR ARC IS NARROWER THAN THE RING'S, AND THAT GAP IS HYSTERESIS.** The roam point is
  // PUSHED to `palArc`, so a clear that triggered at `palArc` would fire on the spot he was just
  // sent to, every frame. `laneArc` is the inner one and the margin between them is the margin.
  const lane = Math.abs(off) < K.laneArc;
  const a = lane ? player.faceH + (off >= 0 ? K.laneArc : -K.laneArc) : to;
  const rr = lane ? Math.max(r, K.leashIn) : K.leashIn * .8;
  return { x: px + Math.sin(a) * rr, z: pz + Math.cos(a) * rr, lane };
}

// **WHO A SIDEKICK PILES ON TO.** The nearest MARKED body, and the range is measured from the
// PLAYER rather than from him -- the point is that he joins YOUR fight, so the fight has to be
// where you are or he runs across the street after somebody you shot once and walked away from.
// **A MAN ON THE FLOOR IS FINISHED WITH**, which is what makes him disengage and come back
// rather than stand over a downed warrior punting him for ever.
function palFoe(d) {
  const P = d.K.pounce;
  let best = null, bd = 1e9;
  for (const o of DUMMIES) {
    if (o === d || o.K.pal || o.mark <= 0 || o.st === 'down' || o.st === 'up') continue;
    const px = o.root.position.x - player.pos.x, pz = o.root.position.z - player.pos.z;
    if (px * px + pz * pz > P.hunt * P.hunt) continue;
    const dx = o.root.position.x - d.root.position.x, dz = o.root.position.z - d.root.position.z;
    const dd = Math.hypot(dx, dz);
    if (dd < bd) { bd = dd; best = o; }
  }
  return best ? { o: best, d: bd } : null;
}

// WHAT HE DOES NEXT, once he is in range and off cooldown. One place decides, so the mix can be
// read as a sentence rather than reconstructed from four scattered branches.
function foePlan(d, dd) {
  const K = d.K, V = d.v || (d.v = foeRoll(K)), r = Math.random();
  if (r < V.guard) {                       // a guard
    d.st = 'block'; d.t = 0; d.blockT = K.blockDur; d.cur = K.clips.block;
    skinPlay(d, d.cur, 1);
    return;
  }
  if (r < V.guard + K.circle * (2 - V.nerve) * .5 && dd < K.hold * 2) {   // circle for a moment
    d.circT = K.circleDur[0] + Math.random() * (K.circleDur[1] - K.circleDur[0]);
    d.circSide = Math.random() < .5 ? 1 : -1;
    return;
  }
  if (r > 1 - K.backOff * (2 - V.nerve) * .5 && dd < K.hitR) {            // give ground
    d.backT = K.backDur[0] + Math.random() * (K.backDur[1] - K.backDur[0]);
    return;
  }
  if (dd <= K.hitR + .4) { d.combo = Math.random() < K.combo ? 1 : 0; foeSwing(d, 0); }
  else d.gap = V.react;                    // not close enough yet -- look again shortly
}

// ONE PLACE STARTS A SWING, because two would be two chances to forget the rewind. A `ONCE`
// clip holds its last frame, so re-entering one without resetting it plays nothing at all.
function foeSwing(d, delay) {
  const K = d.K;
  bodyVox(d, 'angry');            // a kind with no voice never reaches the sound
  const nm = K.clips.swings[(Math.random() * K.clips.swings.length) | 0];
  // **THE TARGET IS LATCHED WHERE THE SWING STARTS (m77).** `foeTarget` runs every frame, so
  // reading it again at the contact frame is a blow that can land on somebody other than the man
  // it was thrown at -- the picture and its consequence have to be ONE event, which is this
  // file's own rule about `MELEE.at`.
  d.sfoe = d.foe || null;
  d.st = 'swing'; d.t = -(delay || 0); d.swung = 0; d.cur = nm;
  skinPlay(d, nm, skinLen(d, nm) / K.swingDur);
}

// HE WALKS ON THE PLAYER'S OWN RESOLVER, and is separated from the other bodies by the same
// rule that separates the player from all of them -- one description of a body taking up room.
function foeMove(d, h, sp, dt) {
  const K = d.K, step = sp * dt;
  const x0 = d.root.position.x, z0 = d.root.position.z;
  _fp.set(x0 + Math.sin(h) * step, d.root.position.y, z0 + Math.cos(h) * step);
  resolveBoxes(_fp, K.r, K.h * .9);
  d.root.position.x = _fp.x; d.root.position.z = _fp.z;
  d.root.position.y = groundAt(_fp.x, _fp.z, d.root.position.y, MOVE.step);
  // **ASKED TO MOVE AND NOT MOVING IS THE ONLY HONEST STUCK TEST, AND IT BELONGS HERE (m74).**
  // This is the one place a body is ever told to travel, so it is the one place that knows what
  // was asked AND what was delivered -- and comparing the two needs nothing from the state
  // machine, which is what makes it true of a wall, a kerb, another body or a corner alike.
  // A detector every caller has to remember is not a detector.
  if (step > 1e-4) {
    const got = Math.hypot(d.root.position.x - x0, d.root.position.z - z0);
    // **IT DECAYS FASTER THAN IT BUILDS**, so a body that scrapes past something forgets about
    // it rather than carrying a grudge into the next corner.
    if (got < step * .35) d.stuckT += dt; else d.stuckT = Math.max(0, d.stuckT - dt * 2);
  }
}

// **AND THEY DO NOT STAND INSIDE EACH OTHER (m36).** *"They shouldn't be able to overlap each
// other."* `pushBodies` was only reached from the walking branch, so the moment two of them
// stopped -- which is exactly when they are both standing on you -- nothing kept them apart.
// It runs for EVERY body every frame now, walking or not, and it is symmetric: each pushes out
// by half, so neither shoves the other across the street.
function bodySep(dt) {
  for (let i = 0; i < DUMMIES.length; i++) {
    const a = DUMMIES[i];
    if (a.st === 'down' || a.st === 'ride' || a.st === 'leap') continue;
    for (let j = i + 1; j < DUMMIES.length; j++) {
      const b = DUMMIES[j];
      if (b.st === 'down' || b.st === 'ride' || b.st === 'leap') continue;
      const rr = (a.K.sep || a.K.r) + (b.K.sep || b.K.r);
      let dx = b.root.position.x - a.root.position.x, dz = b.root.position.z - a.root.position.z;
      const l2 = dx * dx + dz * dz;
      if (l2 >= rr * rr) continue;
      // dead centre has no direction to push along, so take one rather than a vector whose
      // sign is rounding -- `copFly`'s rule, one system over
      let l = Math.sqrt(l2);
      if (l < 1e-4) { dx = 1; dz = 0; l = 1; }
      const push = (rr - l) * .5;
      a.root.position.x -= dx / l * push; a.root.position.z -= dz / l * push;
      b.root.position.x += dx / l * push; b.root.position.z += dz / l * push;
    }
  }
}

const _fp = new THREE.Vector3();
function faceTo(d, h, dt) {
  const K = d.K;
  const off = wrapAngle(h - d.h);
  d.h += clamp(off, -K.turn * dt, K.turn * dt);
}
function setSkinScale(skin, name, s) { const a = skin.actions[name]; if (a) a.setEffectiveTimeScale(s); }

// WHAT HIS MACE DOES TO YOU, on the frame it arrives. A cone rather than a circle, because a
// swing thrown forwards must not hit a man standing behind him -- the same fault the player's
// own melee had at m20 and for the same reason.
function foeStrike(d) {
  const K = d.K;
  // **A SIDEKICK SWINGS AT BODIES AND EVERYONE ELSE SWINGS AT YOU (m75).** One branch in the one
  // function that lands a body's blow, which is what lets the whole swing state machine be
  // REUSED rather than copied: `foeSwing`, the beat, `swingAt`'s contact frame, the lean through
  // the blow and the cooldown are all already written and all already read the kind's own table.
  if (K.pounce) {
    for (const o of DUMMIES) {
      if (o === d || o.K.pal || o.cool > 0 || o.st === 'down' || o.st === 'up') continue;
      const ox = o.root.position.x - d.root.position.x, oz = o.root.position.z - d.root.position.z;
      if (Math.hypot(ox, oz) > K.hitR + o.K.r) continue;
      const to = Math.atan2(ox, oz);
      if (Math.abs(wrapAngle(to - d.h)) > K.hitArc) continue;
      // `pal` 1, so his own blow does not re-mark the man and keep him hunting for ever
      dummyBlow(o, to, K.pounce.power, K.pounce.dmg, d);
      break;                                    // one man per punch. He is a little guy.
    }
    return;
  }
  // **THE SAME REACH, THE SAME ARC, A DIFFERENT VICTIM (m77).** A blow on a body goes through
  // `dummyBlow` -- the one function a fist, a mace and a bolt all already reach -- so the grunt,
  // the shove, the reaction clip, the health and the launch are written, and a man knocked far
  // enough is a flyer in his own right, which means the chain into whoever he lands on falls out
  // of `FLYHIT` rather than being coded here.
  const T = d.sfoe && d.sfoe.st !== 'down' && d.sfoe.st !== 'up' ? d.sfoe : null;
  if (!T && player.roll) return;                // a dodge roll is the one thing that saves you
  const TP = T ? T.root.position : player.pos;
  const dx = TP.x - d.root.position.x, dz = TP.z - d.root.position.z;
  const dd = Math.hypot(dx, dz);
  if (dd > K.hitR + (T ? T.K.r : player.r)) return;
  const to = Math.atan2(dx, dz);
  if (Math.abs(wrapAngle(to - d.h)) > K.hitArc) return;
  // **AND HE PASSES HIMSELF AS THE AUTHOR**, so the pal is never MARKED: `d.mark` is YOUR
  // interest in a body and an orc hitting the sidekick is not something you did.
  if (T) { dummyBlow(T, to, K.hitPow, T.K.dmg ? T.K.dmg.weap : 0, d); return; }
  playerHurt(K.hitDmg, to, K.push, K.pushUp, K.stun, K.hitKnock);
}

// **A BLOCK THAT MAKES NO NOISE IS A NUMBER (m101).** "It blocked" and "it took the hit" are
// one picture from a phone otherwise, and the guard is the one state whose whole job is to make
// a blow NOT happen -- so the thing that says it worked has to be the thing you see instead.
// **THE CONTACT IS IN FRONT OF HIS CHEST, BACK DOWN THE BLOW.** `dirH` is the direction the blow
// TRAVELS (it is what the shove is applied along), so whoever threw it is at `dirH + PI` and the
// guard meets it there. Nothing is typed per weapon: a parry is the same event harder.
// **AND THE RING IS m64's LAYER, WHICH IS WHAT MAKES IT THE RIGHT SOUND RATHER THAN A LOUD ONE.**
// That one is what a blow lands ON -- and here it lands on a raised guard, which is the most
// literal reading that layer has ever had. `null` takes `HITSND.hard`, the plate row.
function blockFx(dirH, hard) {
  const p = player, B = BLOCK;
  const bh = dirH + Math.PI;
  const x = p.pos.x + Math.sin(bh) * B.fxOut;
  const z = p.pos.z + Math.cos(bh) * B.fxOut;
  const y = p.pos.y + RIG.height * B.fxUp;
  const k = hard ? 1 : .55;
  spkBurst(x, y, z, Math.max(3, Math.round(B.fxN * k)), {
    col: hard ? B.fxHot : B.fxCool, spread: B.fxV * k, up: 1.4, r: .12,
    size: B.fxSize, life: B.fxLife });
  // THE RING IS THE STEEL, AND THE PING IS THE DEFLECT ON TOP OF IT. Two layers, one event --
  // m64's own argument, and it is what makes a parry audibly a different thing from a guard
  // rather than the same clang slightly louder.
  hitRing(null, B.fxRing * (hard ? 1 : .6), x, z);
  if (hard && B.ping) snd(B.ping.key, { g: B.ping.g, r: B.ping.r * (1 + (Math.random() - .5) * .08), cut: B.ping.cut });
  // **ONLY A DEFLECT KNOCKS THE LENS.** A shake on every guarded blow is a shake on most of a
  // fight, and m99's own note is that this reads as ONE thump -- which it cannot, if it is
  // going off continuously.
  if (hard) camShake(B.shake);
}

// BEING HIT. There is no hit-reaction clip in the player's export and no death yet, so what a
// blow IS here is a knockback, a moment of no steering and a flash -- which is the part that
// reads, and the part `MOVE.landHard` already has the shape of.
function playerHurt(dmg, dirH, push, up, stun, knock) {
  const p = player;
  // **A GUARD IS WORTH SOMETHING OR IT IS AN ANIMATION** -- the same sentence the warrior's own
  // block is written under, pointed at the player. It costs him most of the damage and most of
  // the shove, and it does NOT make him untouchable: a dodge roll is the thing that does that.
  // Facing matters: a blow from behind is not blocked, whatever the thumb is doing.
  // **AND HOW WELL HE IS SQUARED UP IS THE WHOLE OF WHAT A GUARD BUYS (m101).** One arc was a
  // flat quarter of the blow from anywhere inside 72 degrees; two arcs make the guard a thing
  // you can do WELL. See `BLOCK`: a blow taken on the nose is DEFLECTED and costs nothing, and
  // holding it there is what the guard lock is for.
  const off = Math.abs(wrapAngle(dirH - Math.PI - p.faceH));
  const guard = p.block && off < BLOCK.arc;
  const parry = guard && off < BLOCK.perfect;

  // already doing, which is right for a nudge -- but an arc is SOLVED for an apex, and adding it
  // to a sprint lands him somewhere nobody chose. m21 paid for that once on the charged leap.
  // **A GUARD IS WHAT KEEPS HIM ON HIS FEET**, which is the third thing it now buys on top of
  // the damage and the shove; and `again` is what stops three orcs holding him on the floor --
  // being unable to move is the least fun state in any game, and a blow inside the window still
  // hurts and still shoves, it just does not re-launch. `d.cool`'s rule, pointed at the player.
  // **`knock` IS A CHANCE, NOT A FLAG (m88).** *"Maybe like a few swings -- I'm not sure if they
  // have a big swing versus a small swing; if they don't, that's fine, we can just have it be
  // random."* There is one swing pool and no big/small in the export, so the VARIETY is in what
  // the blow does rather than in which clip threw it -- and a man on the floor after every
  // single mace hit is the "being unable to move is the least fun state" note one step further
  // on. `mel.hurt()` passes 1 and still always launches.
  if (knock && Math.random() < knock && !guard && p.knockCool <= 0) {
    // **THE ARC IS ROLLED AND THE CLIP IS FITTED TO IT (m96).** One `k` drives the height AND the
    // distance, so a harder blow is higher and farther rather than one or the other -- and
    // because the hang time falls out of the same number, the fall clip's rate does too.

    p.knock = 1; p.knockCool = HURT.again; p.knockT = 0; p.gotUp = 0;
    // **THE FALL STARTS HERE, NOT ON THE LANDING.** That is the whole of the fix: the clip runs
    // from the blow, through the flight, into the ground, and there is nothing left to blend
    // into when he arrives because he has been going down the entire time.
    // **AND THE RATE IS SOLVED SO THE POSE ARRIVES FIRST.** `HURT.mark` is how long the clip
    // needs to put him on the floor and `2*vy/g` is how long he is in the air, so the rate that
    // lands the two together is `mark / (air * lead)` -- clamped to the band a fall stays
    // readable in, which is the warrior's own x1.6 to x2.5.
    const dur = clipLen(HURT.down);
    const air = 2 * vy / MOVE.g;
    const rate = HURT.mark > 0 ? clamp(HURT.mark / Math.max(.05, air * HURT.lead),
                                       HURT.rateMin, HURT.rateMax)
                               : dur / HURT.beat;
    p.knockDur = rate > 0 ? dur / rate : HURT.beat;
    if (rig.actions[HURT.down]) playOnce(HURT.down, rate);

    p.melFired = 0; p.melQ = null; p.land = 0; p.flip = ''; p.bkT = 0; p.bkOn = 0; p.bkHang = 0; p.hurtNm = ''; p.parryT = 0; p.meleeAir = 0;

    // which the guard's own `busy` reads as airborne, so `p.block` went to 0, `p.lock` went with

}

    // rather than on the state clock -- the ground is what stops a body and a timer drops him
    // through whatever he was thrown onto. The impact SPEED has to be read before it is zeroed.
    bodyBump(d, -d.vy);
    P.y = g2; d.vy = 0;
  }

// **HIS AMBIENT VOICE (m82).** A kind with no `chirp` never reaches the sound, so the two
// drunks, the skater, the officer and the orcs are byte-for-byte what they were -- m38's
// empty-field pattern, which is why this needed no gate naming anybody.
// **AND HE ONLY SPEAKS WHEN THERE IS NOTHING HAPPENING TO HIM.** `hit`, `down` and `up` are the
// three states where he already HAS a noise -- `K.voice` fires in `dummyBlow` -- and a chirp on
// top of a grunt is two voices describing one event, which is m27's duplicate exactly. The

  const dd = Math.hypot(d.root.position.x - player.pos.x, d.root.position.z - player.pos.z);

// ONE PLACE MAKES THE NOISE, so the ambient one and an event one cannot disagree about how loud

// stops a two-dive scramble being two yelps and a chirp landing on top of one.

  if (!K.voice || !K.chirp) return;

  d.chirpT = rnd(CVOX.every);     // an event re-arms the ambient clock, so the two never stack
  snd(K.voice, { g: m[1], r: voxSize(K) * m[0] * rnd(CVOX.jit),

    // without a gate in each of them.

    // for the same reason: a man on a bike has no gait, no roam and nothing to be separated from.

}

// THE CAMERA
// ONE WRITER ON `cam.az`, ALWAYS. The right pad drags it and nothing else does -- while aiming
// he simply faces wherever the lens is pointed, which is the same number rather than a second

    // continuous is drawn from it.
