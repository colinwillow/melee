# Deploys the repo root to GitHub Pages. There is no build step: index.html opens and runs.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PAGES HAS TO BE TURNED ON ONCE, BY HAND, AND NOTHING HERE CAN DO IT.
      # `enablement: true` was tried and the run came back
      #   Create Pages site failed. Error: Resource not accessible by integration
      # -- the default workflow token is not allowed to CREATE a Pages site, only to deploy to
      # one that exists. So: Settings -> Pages -> Source. Either option works and both deploy
      # the same commit:
      #   "GitHub Actions"          -> this workflow runs and deploys the repo root
      #   "Deploy from a branch"    -> main / (root), and this workflow is redundant; delete it
      # Until one of those is set, every push leaves a red X on the Actions tab and the site
      # 404s. That is the whole of it -- there is nothing wrong with the build.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
