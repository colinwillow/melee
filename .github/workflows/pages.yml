# Deploys the repo root to GitHub Pages. There is no build step: index.html opens and runs.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `enablement: true` turns Pages ON for the repo if it is not already, rather than
      # failing with "Get Pages site failed... verify that the repository has Pages enabled",
      # which is what the first run did. It needs `pages: write`, which is granted above.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
